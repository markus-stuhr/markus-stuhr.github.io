<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blocks</title>
<script defer src="/analytics.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0d1117;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#e6edf3; }
  canvas { display:block; touch-action:none; }
  #hud { position:fixed; left:0; right:0; bottom:0; padding:14px 10px 18px;
    display:flex; justify-content:center; gap:8px; pointer-events:none; }
  .slot { pointer-events:auto; width:54px; height:54px; border-radius:8px; cursor:pointer;
    border:2px solid rgba(255,255,255,.25); background:#222; position:relative;
    display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
    image-rendering: pixelated; transition: transform .08s, border-color .08s; }
  .slot canvas { width:100%; height:100%; }
  .slot span { position:absolute; top:2px; left:4px; font-size:10px; opacity:.7;
    text-shadow:0 1px 2px #000; }
  .slot b { position:absolute; bottom:2px; font-size:10px; font-weight:600;
    text-shadow:0 1px 3px #000; letter-spacing:.02em; }
  .slot.active { border-color:#ffd166; transform:translateY(-6px); }
  #info { position:fixed; top:12px; left:12px; font-size:12px; line-height:1.5;
    background:rgba(13,17,23,.6); padding:10px 12px; border-radius:8px;
    backdrop-filter: blur(6px); max-width:260px; }
  #info b { color:#ffd166; }
  #tools { position:fixed; top:12px; right:12px; display:flex; gap:6px; }
  #tools button { pointer-events:auto; font:inherit; font-size:12px; color:#e6edf3;
    background:rgba(13,17,23,.6); border:1px solid rgba(255,255,255,.2);
    padding:7px 10px; border-radius:8px; cursor:pointer; backdrop-filter: blur(6px); }
  #tools button:hover { border-color:#ffd166; }
</style>
</head>
<body>
<div id="info">
  <b>Blocks</b><br>
  Ziehen = drehen · Scrollen = Zoom<br>
  Linksklick = setzen · Rechtsklick = entfernen<br>
  Tasten 1–8 = Material
</div>
<div id="tools">
  <button id="btnReset">Neu</button>
</div>
<div id="hud"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

const SIZE = 20;              // 20 x 20 Grundfläche
const STORAGE_KEY = 'blocks.world.v1';
const VIEW_KEY    = 'blocks.view.v1';

/* ---------------------------------------------------------------
   Prozedurale 16x16-Pixeltexturen — Minecraft-Optik ohne Assets.
   Jede Textur ist eine kleine Rauschfläche um eine Basisfarbe.
--------------------------------------------------------------- */
const texCache = new Map();
function pixelTexture(base, spread, draw) {
  const key = base + ':' + spread + ':' + (draw ? draw.name : '');
  if (texCache.has(key)) return texCache.get(key);
  const N = 16;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  const col = new THREE.Color(base);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const n = 1 + (Math.random() - 0.5) * spread;
      g.fillStyle = '#' + col.clone().multiplyScalar(n).getHexString();
      g.fillRect(x, y, 1, 1);
    }
  }
  if (draw) draw(g, N, col);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  texCache.set(key, t);
  return t;
}

// Grasrand: oberer Teil der Seitenfläche grün überzeichnet
function grassSide(g, N) {
  const green = new THREE.Color('#5a9e3a');
  for (let x = 0; x < N; x++) {
    const h = 3 + (Math.random() * 2 | 0);
    for (let y = 0; y < h; y++) {
      const n = 1 + (Math.random() - 0.5) * 0.25;
      g.fillStyle = '#' + green.clone().multiplyScalar(n).getHexString();
      g.fillRect(x, y, 1, 1);
    }
  }
}
// Holzmaserung: senkrechte dunkle Streifen
function woodGrain(g, N, col) {
  for (let x = 0; x < N; x += 3 + (Math.random() * 2 | 0)) {
    g.fillStyle = '#' + col.clone().multiplyScalar(0.75).getHexString();
    g.fillRect(x, 0, 1, N);
  }
}

/* Materialdefinition: [top, side, bottom] Texturen */
function mats(defs) {
  return defs.map(d => new THREE.MeshLambertMaterial(d));
}
const BLOCKS = {
  grass: { top: '#6aae42', side: '#8b6b4a', name: 'Wiese',  icon: '#6aae42',
    build: () => {
      const top  = pixelTexture('#6aae42', 0.22);
      const side = pixelTexture('#8b6b4a', 0.20, grassSide);
      const bot  = pixelTexture('#8b6b4a', 0.20);
      return mats([{map:side},{map:side},{map:top},{map:bot},{map:side},{map:side}]);
    } },
  dirt: { top: '#8b6b4a', side: '#7d5f42', name: 'Erde', icon: '#8b6b4a',
    build: () => { const t = pixelTexture('#8b6b4a', 0.22); return mats(Array(6).fill({map:t})); } },
  stone: { top: '#8a8a90', side: '#7e7e85', name: 'Stein', icon: '#8a8a90',
    build: () => { const t = pixelTexture('#8a8a90', 0.28); return mats(Array(6).fill({map:t})); } },
  sand: { top: '#ded1a0', side: '#d2c391', name: 'Sand', icon: '#ded1a0',
    build: () => { const t = pixelTexture('#ded1a0', 0.16); return mats(Array(6).fill({map:t})); } },
  water: { top: '#3b7bd4', side: '#3b7bd4', name: 'Wasser', icon: '#3b7bd4', transparent: true,
    build: () => { const t = pixelTexture('#3b7bd4', 0.18);
      return mats(Array(6).fill({map:t, transparent:true, opacity:0.72})); } },
  wood: { top: '#a8804d', side: '#7a5a32', name: 'Holz', icon: '#7a5a32',
    build: () => {
      const top  = pixelTexture('#a8804d', 0.18);
      const side = pixelTexture('#7a5a32', 0.18, woodGrain);
      return mats([{map:side},{map:side},{map:top},{map:top},{map:side},{map:side}]);
    } },
  leaves: { top: '#4a8c36', side: '#3f7a2e', name: 'Laub', icon: '#3f7a2e',
    build: () => { const t = pixelTexture('#3f7a2e', 0.45);
      return mats(Array(6).fill({map:t})); } },
  snow: { top: '#eef4f8', side: '#cfd8de', name: 'Schnee', icon: '#eef4f8',
    build: () => {
      const top  = pixelTexture('#eef4f8', 0.10);
      const side = pixelTexture('#cfd8de', 0.12);
      return mats([{map:side},{map:side},{map:top},{map:side},{map:side},{map:side}]);
    } }
};
const TYPES = Object.keys(BLOCKS);
for (const t of TYPES) BLOCKS[t].materials = BLOCKS[t].build();

/* --------------------------- Szene --------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color('#000000');
scene.fog = new THREE.Fog('#000000', 40, 110);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(24, 20, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(SIZE/2, 2, SIZE/2);
controls.minDistance = 6;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.495;   // nicht unter den Boden
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };
controls.update();

scene.add(new THREE.HemisphereLight('#cfe6ff', '#4b5540', 0.85));
const sun = new THREE.DirectionalLight('#fff4dd', 1.15);
sun.position.set(30, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const S = SIZE * 0.9;
Object.assign(sun.shadow.camera, { left:-S, right:S, top:S, bottom:-S, near:1, far:140 });
sun.shadow.camera.updateProjectionMatrix();
sun.target.position.set(SIZE/2, 0, SIZE/2);
scene.add(sun, sun.target);

// Sockel unter der Bauplatte, damit die Fläche "schwebt" statt abzubrechen
const baseMat = new THREE.MeshLambertMaterial({ map: pixelTexture('#2e3236', 0.16) });
const base = new THREE.Mesh(new THREE.BoxGeometry(SIZE, 4, SIZE), baseMat);
base.position.set(SIZE/2 - 0.5, -2.3, SIZE/2 - 0.5);
base.receiveShadow = true;
scene.add(base);

/* ------------------------- Voxel-Welt ------------------------- */
const geo = new THREE.BoxGeometry(1, 1, 1);
const world = new Map();        // "x,y,z" -> { mesh, type }
const meshes = [];              // Raycast-Ziele

const key = (x,y,z) => x+','+y+','+z;

function addBlock(x, y, z, type, silent) {
  if (world.has(key(x,y,z))) return;
  if (x < 0 || z < 0 || x >= SIZE || z >= SIZE || y < 0 || y > 10) return;
  const mesh = new THREE.Mesh(geo, BLOCKS[type].materials);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { x, y, z, type };
  // Wasser wird nicht als Würfel gezeichnet, sondern als geglättete
  // Oberfläche (siehe rebuildWater). Der Würfel bleibt trotzdem als
  // Raycast-Ziel bestehen — damit funktioniert Setzen/Entfernen exakt
  // wie bei jedem anderen Block, er kommt nur nie in die Szene.
  mesh.updateMatrixWorld();   // Raycast-Ziel, kommt nicht in die Szene
  meshes.push(mesh);
  world.set(key(x,y,z), { mesh, type });
  scheduleWater();
  scheduleTerrain();
  if (!silent) save();
}

function removeBlock(x, y, z) {
  const k = key(x,y,z);
  const b = world.get(k);
  if (!b) return;
  meshes.splice(meshes.indexOf(b.mesh), 1);
  world.delete(k);
  scheduleWater();
  scheduleTerrain();
  save();
}



/* ------------------- Abgerundetes Gelände (SDF) -------------------
   Die Welt bleibt ein Voxelraster — gezeichnet wird sie aber nicht als
   Würfel, sondern als eine einzige Oberfläche. Jeder Block ist darin
   eine abgerundete Box (fast ein Zylinder: flach oben und unten, an den
   Seiten stark gerundet). Die Blöcke werden über ein weiches Minimum
   verschmolzen, also wachsen Nachbarn ohne Lücke zusammen — auch
   diagonal, dort entsteht automatisch eine schräge Verbindung.

   Umgesetzt als Distanzfeld + Marching Cubes.
------------------------------------------------------------------- */
const MC_RES    = 72;     // Feldauflösung je Achse
// Das Feld muss RINGS UM die Welt herum Luft haben: MarchingCubes lässt an
// jeder Feldgrenze eine Zelle unbearbeitet, sonst werden die Randblöcke und
// die unterste Schicht aufgeschnitten.
const MC_SPAN_XZ = 22;    // abgedeckte Weltbreite (20 Blöcke + 1 Rand je Seite)
const MC_SPAN_Y  = 13;    // abgedeckte Welthöhe — enger als die Breite,
                          // damit die Samples vertikal dichter liegen und
                          // die feine Deckelkante überhaupt auflösbar ist
const BOX_ROUND = 0.30;   // Rundungsradius der senkrechten Kanten
const ROUND_Y   = 0.03;   // Rundung der waagerechten Kanten (10% davon)
const BLEND     = 0.32;   // Weichheit der Verschmelzung

const BOX_FLAT   = 0.5 - BOX_ROUND;   // flacher Kern in x/z
const BOX_FLAT_Y = 0.5 - ROUND_Y;     // flacher Kern in y
const Y_SQUEEZE  = BOX_ROUND / ROUND_Y;

const mcCenter = new THREE.Vector3(9.5, 5.0, 9.5);   // deckt y −1.5 … 11.5
const mcScale  = new THREE.Vector3(MC_SPAN_XZ / 2, MC_SPAN_Y / 2, MC_SPAN_XZ / 2);

/* Struktur-Textur: 16x16 Graustufen, die triplanar aus den Weltkoordinaten
   gesampelt wird. Genau ein Block pro Wiederholung, NearestFilter und eine
   harte Achsenwahl statt weicher Überblendung — dadurch bleiben die Pixel
   überall gestochen scharf, auch auf den gerundeten Flanken. */
const grainTex = (() => {
  const N = 16;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      let v = 0.5 + (Math.random() - 0.5) * 0.55;
      if ((x ^ y) % 7 === 0) v -= 0.10;          // etwas gröbere Sprenkel
      if ((x + y * 3) % 11 === 0) v += 0.08;
      g.fillStyle = 'rgb(' + [v, v, v].map(n => Math.round(n * 255)).join(',') + ')';
      g.fillRect(x, y, 1, 1);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;                 // nah: harte Texel
  t.minFilter = THREE.LinearMipmapLinearFilter;      // fern: kein Flimmern
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();

const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true });
terrainMat.onBeforeCompile = (sh) => {
  sh.uniforms.uGrain = { value: grainTex };
  sh.uniforms.uScale = { value: mcScale };

  sh.vertexShader = 'varying vec3 vWPos;\nvarying vec3 vWNrm;\nuniform vec3 uScale;\n'
    + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;
      // Das Objekt ist ungleichmäßig skaliert — die Normale muss mit dem
      // Kehrwert der Skalierung zurückgerechnet werden, sonst kippt die
      // Achsenwahl auf den Flanken.
      vWNrm = normalize(objectNormal / uScale);`);

  sh.fragmentShader = 'varying vec3 vWPos;\nvarying vec3 vWNrm;\nuniform sampler2D uGrain;\n'
    + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      vec3 an = abs(vWNrm);
      vec2 tuv = (an.y >= an.x && an.y >= an.z) ? vWPos.xz
               : (an.x >= an.z)                ? vWPos.zy
                                               : vWPos.xy;
      float grain = texture2D(uGrain, tuv * 4.0).r;   // 64 Texel je Block
      diffuseColor.rgb *= 0.82 + grain * 0.36;`);
};

const terrain = new MarchingCubes(MC_RES, terrainMat, false, true, 200000);
terrain.position.copy(mcCenter);
terrain.scale.copy(mcScale);
terrain.isolation = 0;
terrain.castShadow = true;
terrain.receiveShadow = true;
scene.add(terrain);

const HALF = MC_RES / 2;
const dist = new Float32Array(terrain.size3);      // Distanz zum nächsten Block

// Feldindex <-> Weltkoordinate
const gridToWorld = (i, axis) =>
  (i / HALF - 1) * mcScale.getComponent(axis) + mcCenter.getComponent(axis);
const worldToGrid = (w, axis) =>
  ((w - mcCenter.getComponent(axis)) / mcScale.getComponent(axis) + 1) * HALF;

// Weiches Minimum: verschmilzt zwei Distanzen ohne harte Naht
function smin(a, b, k) {
  const h = Math.min(1, Math.max(0, 0.5 + 0.5 * (b - a) / k));
  return b * (1 - h) + a * h - k * h * (1 - h);
}

// Abgerundete Box um den Ursprung. Die y-Komponente wird gestaucht, damit
// die waagerechten Kanten mit einem viel kleineren Radius runden als die
// senkrechten — Deckel und Boden bleiben so scharf, die Seiten rund.
function sdRoundBox(dx, dy, dz) {
  const qx = Math.max(Math.abs(dx) - BOX_FLAT,   0);
  const qy = Math.max(Math.abs(dy) - BOX_FLAT_Y, 0) * Y_SQUEEZE;
  const qz = Math.max(Math.abs(dz) - BOX_FLAT,   0);
  return Math.sqrt(qx*qx + qy*qy + qz*qz) - BOX_ROUND;
}

let terrainPending = 0;
function scheduleTerrain() {
  if (terrainPending) return;
  terrainPending = requestAnimationFrame(() => { terrainPending = 0; rebuildTerrain(); });
}

const _c = new THREE.Color();
function rebuildTerrain() {
  const { field, palette, size, size2 } = terrain;
  dist.fill(2);
  field.fill(-2);
  palette.fill(0);
  terrain.normal_cache.fill(0);

  // Reichweite eines Blocks in Feldpunkten (je Achse, das Feld ist in y feiner)
  const reachXZ = Math.ceil((0.5 + BLEND) / (MC_SPAN_XZ / MC_RES)) + 1;
  const reachY  = Math.ceil((0.5 + BLEND) / (MC_SPAN_Y  / MC_RES)) + 1;

  for (const [k, b] of world) {
    if (b.type === 'water') continue;              // Wasser hat eine eigene Fläche
    const [bx, by, bz] = k.split(',').map(Number);
    const top = BLOCKS[b.type].top, side = BLOCKS[b.type].side;
    const covered = world.has(key(bx, by + 1, bz));

    const gx = worldToGrid(bx, 0), gy = worldToGrid(by, 1), gz = worldToGrid(bz, 2);
    const x0 = Math.max(0, Math.floor(gx - reachXZ)), x1 = Math.min(size - 1, Math.ceil(gx + reachXZ));
    const y0 = Math.max(0, Math.floor(gy - reachY)),  y1 = Math.min(size - 1, Math.ceil(gy + reachY));
    const z0 = Math.max(0, Math.floor(gz - reachXZ)), z1 = Math.min(size - 1, Math.ceil(gz + reachXZ));

    for (let z = z0; z <= z1; z++) {
      const wz = gridToWorld(z, 2) - bz;
      for (let y = y0; y <= y1; y++) {
        const wy = gridToWorld(y, 1) - by;
        const rowBase = z * size2 + y * size;
        for (let x = x0; x <= x1; x++) {
          const wx = gridToWorld(x, 0) - bx;
          const d = sdRoundBox(wx, wy, wz);
          const i = rowBase + x;
          const prev = dist[i];
          const merged = smin(prev, d, BLEND);
          dist[i] = merged;
          field[i] = -merged;
          // Farbe vom jeweils nächstgelegenen Block; die Oberseite bekommt
          // die Deckfarbe (Gras auf Erde), sofern nichts darüber liegt
          if (d < prev) {
            _c.set(!covered && wy > 0.1 ? top : side);
            palette[i * 3]     = _c.r;
            palette[i * 3 + 1] = _c.g;
            palette[i * 3 + 2] = _c.b;
          }
        }
      }
    }
  }
  terrain.update();
}

/* ---------------------- Geglättete Wasserfläche ----------------------
   Die Welt bleibt ein reines Voxelraster — nur gezeichnet wird das
   Wasser nicht als Würfel, sondern als eine Fläche, deren Uferlinie
   aus dem Belegungsfeld weichgezeichnet wird.

   Ablauf pro Wasserhöhe:
     1. Belegung o(x,z) = 1, wo an dieser Höhe Wasser oben liegt
     2. zweimal ein 3x3-Kernel darüber -> weiches Feld f
     3. Feld auf einem 4x feineren Gitter bilinear abtasten
     4. f steuert Höhe (Ufer sackt ab) und Alpha (Ufer läuft aus)
--------------------------------------------------------------------- */
const WATER_SUB   = 4;      // Untergitterpunkte pro Block
const WATER_EDGE  = 0.30;   // darunter gilt eine Ecke als "kein Wasser"
const WATER_FULL  = 0.62;   // darüber volle Deckkraft
const WATER_DROP  = 0.28;   // wie tief die Uferkante absackt

const waterTex = pixelTexture('#3b7bd4', 0.18);
waterTex.wrapS = waterTex.wrapT = THREE.RepeatWrapping;
const waterMat = new THREE.MeshLambertMaterial({
  map: waterTex, vertexColors: true, transparent: true,
  depthWrite: false, side: THREE.DoubleSide
});
let waterMesh = null;
let waterPending = 0;

function scheduleWater() {
  if (waterPending) return;
  waterPending = requestAnimationFrame(() => { waterPending = 0; rebuildWater(); });
}

const smoothstep = (a, b, t) => {
  t = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function rebuildWater() {
  if (waterMesh) {
    scene.remove(waterMesh);
    waterMesh.geometry.dispose();
    waterMesh = null;
  }

  // Nur die jeweils oberste Wasserzelle einer Säule bildet Oberfläche
  const layers = new Map();               // y -> Set("x,z")
  for (const [k, b] of world) {
    if (b.type !== 'water') continue;
    const [x, y, z] = k.split(',').map(Number);
    if (world.get(key(x, y + 1, z))?.type === 'water') continue;
    if (!layers.has(y)) layers.set(y, new Set());
    layers.get(y).add(x + ',' + z);
  }
  if (!layers.size) return;

  const pos = [], col = [], uv = [], idx = [];
  const base = new THREE.Color('#4a8fe0');

  for (const [y, cells] of layers) {
    // Feld mit 2 Blöcken Rand, damit das Wasser unter das Ufer laufen kann
    const PAD = 2;
    let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
    for (const c of cells) {
      const [x, z] = c.split(',').map(Number);
      x0 = Math.min(x0, x); x1 = Math.max(x1, x);
      z0 = Math.min(z0, z); z1 = Math.max(z1, z);
    }
    x0 -= PAD; z0 -= PAD; x1 += PAD; z1 += PAD;
    const W = x1 - x0 + 1, H = z1 - z0 + 1;

    let f = new Float32Array(W * H);
    for (const c of cells) {
      const [x, z] = c.split(',').map(Number);
      f[(x - x0) + (z - z0) * W] = 1;
    }
    // zweimal weichzeichnen -> runde Uferlinie statt Treppenstufen
    for (let pass = 0; pass < 2; pass++) {
      const g = new Float32Array(W * H);
      for (let j = 0; j < H; j++) {
        for (let i = 0; i < W; i++) {
          let sum = 0, wsum = 0;
          for (let dj = -1; dj <= 1; dj++) {
            for (let di = -1; di <= 1; di++) {
              const ii = i + di, jj = j + dj;
              if (ii < 0 || jj < 0 || ii >= W || jj >= H) continue;
              const w = (di === 0 ? 2 : 1) * (dj === 0 ? 2 : 1);
              sum += f[ii + jj * W] * w; wsum += w;
            }
          }
          g[i + j * W] = sum / wsum;
        }
      }
      f = g;
    }
    const sample = (i, j) => (i < 0 || j < 0 || i >= W || j >= H) ? 0 : f[i + j * W];

    // Bilineare Abtastung auf dem feinen Gitter
    const NX = (W - 1) * WATER_SUB, NZ = (H - 1) * WATER_SUB;
    const start = pos.length / 3;
    const vals = new Float32Array((NX + 1) * (NZ + 1));

    for (let j = 0; j <= NZ; j++) {
      for (let i = 0; i <= NX; i++) {
        const fx = i / WATER_SUB, fz = j / WATER_SUB;
        const ix = Math.floor(fx), iz = Math.floor(fz);
        const tx = fx - ix, tz = fz - iz;
        const v =
          sample(ix,     iz    ) * (1 - tx) * (1 - tz) +
          sample(ix + 1, iz    ) * tx       * (1 - tz) +
          sample(ix,     iz + 1) * (1 - tx) * tz +
          sample(ix + 1, iz + 1) * tx       * tz;
        vals[i + j * (NX + 1)] = v;

        const wx = x0 + fx, wz = z0 + fz;
        const edge = smoothstep(WATER_EDGE, WATER_FULL, v);
        pos.push(wx, y + 0.46 - (1 - edge) * WATER_DROP, wz);
        uv.push(wx * 0.5, wz * 0.5);
        // zum Ufer hin heller und durchsichtiger — flaches Wasser
        const shade = 0.85 + edge * 0.15;
        col.push(base.r * shade, base.g * shade, base.b * shade, 0.30 + edge * 0.52);
      }
    }

    for (let j = 0; j < NZ; j++) {
      for (let i = 0; i < NX; i++) {
        const a = start + i + j * (NX + 1);
        const b = a + 1, c = a + (NX + 1), d = c + 1;
        const m = Math.max(
          vals[i + j * (NX + 1)], vals[i + 1 + j * (NX + 1)],
          vals[i + (j + 1) * (NX + 1)], vals[i + 1 + (j + 1) * (NX + 1)]
        );
        if (m <= WATER_EDGE) continue;   // vollständig trockene Zelle
        idx.push(a, c, b, b, c, d);
      }
    }
  }

  if (!idx.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 4));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();

  waterMesh = new THREE.Mesh(g, waterMat);
  waterMesh.receiveShadow = true;
  waterMesh.renderOrder = 1;
  scene.add(waterMesh);
}

/* Startwelt: sanfte Hügel, ein Wassertümpel, etwas Sand am Ufer */
function generate() {
  world.clear(); meshes.length = 0;
  scheduleWater();
  scheduleTerrain();

  const WATER_LEVEL = 1;
  for (let x = 0; x < SIZE; x++) {
    for (let z = 0; z < SIZE; z++) {
      const h = Math.round(
        1.8 +
        Math.sin(x * 0.45) * 0.9 +
        Math.cos(z * 0.38) * 0.9 +
        Math.sin((x + z) * 0.22) * 0.7
      );
      const top = Math.max(0, h);
      for (let y = 0; y < top; y++) addBlock(x, y, z, y >= top - 1 ? 'dirt' : 'stone', true);
      if (top <= WATER_LEVEL) {
        addBlock(x, top, z, 'sand', true);
        for (let y = top + 1; y <= WATER_LEVEL; y++) addBlock(x, y, z, 'water', true);
      } else {
        addBlock(x, top, z, 'grass', true);
      }
    }
  }
  save();
}

/* ------------------------ Speichern --------------------------
   Jede Änderung landet im localStorage: die Blockwelt selbst und
   getrennt davon der Blickzustand (Kamera, gewähltes Material).
   Geschrieben wird gebündelt am Ende des Frames, damit ein Klick
   nicht mitten im Setzen die ganze Welt serialisiert.
------------------------------------------------------------- */
let savePending = 0;
function saveNow() {
  savePending = 0;
  try {
    const data = [];
    for (const [k, b] of world) data.push(k + ':' + b.type);
    localStorage.setItem(STORAGE_KEY, data.join('|'));
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      cam: camera.position.toArray().map(n => +n.toFixed(3)),
      target: controls.target.toArray().map(n => +n.toFixed(3)),
      type: selected
    }));
  } catch (e) { /* privater Modus o. Ä. */ }
}
function save() {
  if (savePending) return;
  savePending = requestAnimationFrame(saveNow);
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (!raw) return false;
  for (const entry of raw.split('|')) {
    const [pos, type] = entry.split(':');
    if (!BLOCKS[type]) continue;
    const [x, y, z] = pos.split(',').map(Number);
    addBlock(x, y, z, type, true);
  }
  return world.size > 0;
}

let savedView = null;
try { savedView = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) {}
if (savedView && savedView.cam && savedView.target) {
  camera.position.fromArray(savedView.cam);
  controls.target.fromArray(savedView.target);
  controls.update();
}

if (!load()) generate();

// Kameradrehung/Zoom ebenfalls sichern, aber erst wenn sie zur Ruhe kommt
controls.addEventListener('end', save);

// Tabwechsel oder Schließen: sofort schreiben, bevor der Frame nie kommt
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveNow();
});

/* ------------------------ Auswahl-HUD ------------------------ */
let selected = (savedView && BLOCKS[savedView.type]) ? savedView.type : 'grass';
const hud = document.getElementById('hud');
TYPES.forEach((type, i) => {
  const slot = document.createElement('div');
  slot.className = 'slot' + (type === selected ? ' active' : '');
  slot.dataset.type = type;
  slot.style.background = BLOCKS[type].icon;
  slot.innerHTML = '<span>' + (i + 1) + '</span><b>' + BLOCKS[type].name + '</b>';
  slot.addEventListener('click', () => select(type));
  hud.appendChild(slot);
});
function select(type) {
  selected = type;
  for (const s of hud.children) s.classList.toggle('active', s.dataset.type === type);
  save();
}
addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= TYPES.length) select(TYPES[n - 1]);
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('Welt zurücksetzen?')) generate();
});

/* ------------------- Highlight & Interaktion ------------------ */
const highlight = new THREE.Mesh(
  new THREE.BoxGeometry(1.02, 1.02, 1.02),
  new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.45 })
);
highlight.visible = false;
scene.add(highlight);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pick(ev) {
  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshes, false);
  return hits.length ? hits[0] : null;
}

renderer.domElement.addEventListener('pointermove', ev => {
  const hit = pick(ev);
  if (hit) { highlight.position.copy(hit.object.position); highlight.visible = true; }
  else highlight.visible = false;
});

// Klick zählt nur, wenn zwischen down/up kaum gezogen wurde (sonst: Orbit)
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => {
  downAt = { x: ev.clientX, y: ev.clientY, btn: ev.button };
});
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downAt || downAt.btn !== ev.button) { downAt = null; return; }
  const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;

  const hit = pick(ev);
  if (!hit) return;
  const p = hit.object.userData;

  if (ev.button === 2) {
    removeBlock(p.x, p.y, p.z);
    highlight.visible = false;
  } else if (ev.button === 0) {
    const n = hit.face.normal;
    addBlock(p.x + n.x, p.y + n.y, p.z + n.z, selected);
  }
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

/* --------------------------- Loop ---------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
