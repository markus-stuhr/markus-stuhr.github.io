function raiseWater(x, z, atY) {
  const id = bodyAt(x, z);
  if (id !== -1) {
    if (bodies[id].level >= MAX_Y) return;
    const next = bodies[id].level + 1;
    for (const p of pools) if (cellOwner[ci(p.x, p.z)] === id) p.level = next;
  } else {
    pools.push({ x, z, level: Math.min(atY, MAX_Y) });   // neues Becken
  }
  applyWater();
}

function lowerWater(x, z) {
  const id = bodyAt(x, z);
  if (id === -1) return;
  const next = bodies[id].level - 1;
  for (const p of pools) if (cellOwner[ci(p.x, p.z)] === id) p.level = next;
  applyWater();
}

/* Startwelt: eine Bucht in der einen Ecke, dahinter ansteigende Wiese.
   Die Küstenlinie fransen zwei Sinuswellen aus, damit sie nicht als
   Diagonale durchs Raster schneidet. */
function generate() {
  world.clear(); meshes.length = 0;
  scheduleTerrain();

  const WATER_LEVEL = 2;

  for (let x = 0; x < SIZE; x++) {
    for (let z = 0; z < SIZE; z++) {
      // Radialer Abstand zur Ecke (0,0), nicht (x+z): eine diagonale
      // Metrik verteilt die Höhen zu gleichmäßig und der Strand nimmt die
      // halbe Fläche ein. Die Wurzel lässt das Ufer flach auslaufen und
      // hinten trotzdem noch ansteigen.
      const d = Math.hypot(x, z);
      const wave = Math.sin(x * 0.55) * 0.6 + Math.cos(z * 0.45) * 0.5;
      const top = Math.max(0, Math.round(-2.2 + 1.5 * Math.sqrt(d) + wave * 0.55));

      for (let y = 0; y < top; y++) {
        addBlock(x, y, z, y >= top - 1 ? 'dirt' : 'stone', true);
      }

      // Alles bis knapp über die Wasserlinie ist Sand — Meeresboden und
      // Strand. Direkt dahinter fransen ein paar Sandflecken in die Wiese.
      const beach = top <= WATER_LEVEL
        || (top === WATER_LEVEL + 1 && hash3(x, 0, z, 42) < 0.55);
      addBlock(x, top, z, beach ? 'sand' : 'grass', true);

      // Bäume nur auf Wiese und mit Abstand zum Ufer. Der Stamm bleibt ein
      // Voxelblock (im Gelände-SDF wird er zur gerundeten Säule), die Krone
      // besteht aus Laubblöcken, die als überlappende Sphäroide gezeichnet
      // werden — siehe rebuildLeaves.
      // Bewuchs nur auf Wiese und mit Abstand zum Ufer. Ein Baum ist jetzt
      // EIN Deko-Block (KayKit-Modell) statt Stamm plus Laubkrone aus
      // Voxeln — die Voxelvariante bleibt zum Selberbauen erhalten.
      if (!beach && top >= WATER_LEVEL + 2) {
        const r = hash3(x, 0, z, 77);
        const deco = r < 0.045 ? 'tree'
                   : r < 0.085 ? 'bush'
                   : r < 0.105 ? 'rock'
                   : r < 0.150 ? 'fern' : null;
        if (deco) addBlock(x, top + 1, z, deco, true);
      }
    }
  }

  pools = [{ x: 0, z: 0, level: WATER_LEVEL }];
  applyWater();
  save();
}

/* ------------------------ Speichern --------------------------
   Jede Änderung landet im localStorage: die Blockwelt selbst und
   getrennt davon der Blickzustand (Kamera, gewähltes Material).
   Geschrieben wird gebündelt am Ende des Frames, damit ein Klick
   nicht mitten im Setzen die ganze Welt serialisiert.
------------------------------------------------------------- */
let savePending = 0;
function saveNow() {
  savePending = 0;
  try {
    const data = [];
    for (const [k, b] of world) data.push(k + ':' + b.type);
    localStorage.setItem(STORAGE_KEY, data.join('|'));
    localStorage.setItem(WATER_KEY, bodies
      .map(b => [b.cells[0] % SIZE, (b.cells[0] / SIZE) | 0, b.level].join(','))
      .join('|'));
    localStorage.setItem(VIEW_KEY, JSON.stringify({
      cam: camera.position.toArray().map(n => +n.toFixed(3)),
      target: controls.target.toArray().map(n => +n.toFixed(3)),
      type: selected
    }));
  } catch (e) { /* privater Modus o. Ä. */ }
}
function save() {
  if (savePending) return;
  savePending = requestAnimationFrame(saveNow);
}

function load() {
  let raw = null, lvl = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
    lvl = localStorage.getItem(WATER_KEY);
  } catch (e) {}
  if (!raw) return false;

  for (const entry of raw.split('|')) {
    const [pos, type] = entry.split(':');
    if (!BLOCKS[type] || type === 'water') continue;   // altes Blockwasser entfällt
    const [x, y, z] = pos.split(',').map(Number);
    addBlock(x, y, z, type, true);
  }
  pools = [];
  if (lvl) {
    for (const entry of lvl.split('|')) {
      const [x, z, level] = entry.split(',').map(Number);
      if (Number.isFinite(x) && Number.isFinite(z) && Number.isFinite(level)) {
        pools.push({ x, z, level });
      }
    }
  }
  applyWater();
  return world.size > 0;
}

let savedView = null;
try { savedView = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) {}
if (savedView && savedView.cam && savedView.target) {
  camera.position.fromArray(savedView.cam);
  controls.target.fromArray(savedView.target);
  controls.update();
}

if (!load()) generate();

// Deko nachladen: die Welt steht schon, die Modelle kommen asynchron dazu
// und rebuildDeco() setzt sie danach. Faellt der Ladevorgang aus, laeuft
// alles andere weiter — Deko ist Zierrat, kein Fundament.
loadDeco().catch(e => console.warn('Deko konnte nicht geladen werden:', e));

// Kameradrehung/Zoom ebenfalls sichern, aber erst wenn sie zur Ruhe kommt
controls.addEventListener('end', save);

// Tabwechsel oder Schließen: sofort schreiben, bevor der Frame nie kommt
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveNow();
});

/* ------------------------ Auswahl-HUD ------------------------ */
let selected = (savedView && BLOCKS[savedView.type]) ? savedView.type : 'grass';
const hud = document.getElementById('hud');
TYPES.forEach((type, i) => {
  const slot = document.createElement('div');
  slot.className = 'slot' + (type === selected ? ' active' : '');
  slot.dataset.type = type;
  slot.style.setProperty('--chip', BLOCKS[type].icon);
  slot.innerHTML = '<i></i><span>' + (i + 1) + '</span><b>' + BLOCKS[type].name + '</b>';
  slot.addEventListener('click', () => select(type));
  hud.appendChild(slot);
});
function select(type) {
  selected = type;
  for (const s of hud.children) s.classList.toggle('active', s.dataset.type === type);
  save();
}
addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= TYPES.length) select(TYPES[n - 1]);
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('Welt zurücksetzen?')) generate();
});

/* ------------------- Highlight & Interaktion ------------------ */
const highlight = new THREE.Mesh(
  new THREE.BoxGeometry(1.02, 1.02, 1.02),
  new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true,
    opacity: 0.85, depthTest: false, fog: false })
);
highlight.visible = false;
highlight.renderOrder = 10;
scene.add(highlight);

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function pick(ev) {
  pointer.x = (ev.clientX / innerWidth) * 2 - 1;
  pointer.y = -(ev.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshes, false);
  return hits.length ? hits[0] : null;
}

renderer.domElement.addEventListener('pointermove', ev => {
  const hit = pick(ev);
  if (hit) { highlight.position.copy(hit.object.position); highlight.visible = true; }
  else highlight.visible = false;
});

// Klick zählt nur, wenn zwischen down/up kaum gezogen wurde (sonst: Orbit)
let downAt = null;
renderer.domElement.addEventListener('pointerdown', ev => {
  downAt = { x: ev.clientX, y: ev.clientY, btn: ev.button };
});
renderer.domElement.addEventListener('pointerup', ev => {
  if (!downAt || downAt.btn !== ev.button) { downAt = null; return; }
  const moved = Math.hypot(ev.clientX - downAt.x, ev.clientY - downAt.y);
  downAt = null;
  if (moved > 5) return;

  const hit = pick(ev);
  if (!hit) return;
  const p = hit.object.userData;

  if (selected === 'water') {
    if (ev.button === 2) lowerWater(p.x, p.z);
    else raiseWater(p.x, p.z, p.y + hit.face.normal.y);
  } else if (ev.button === 2) {
    removeBlock(p.x, p.y, p.z);
    highlight.visible = false;
  } else if (ev.button === 0) {
    const n = hit.face.normal;
    addBlock(p.x + n.x, p.y + n.y, p.z + n.z, selected);
  }
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

/* --------------------------- Loop ---------------------------- */
function sizeTargets() {
  const dpr = renderer.getPixelRatio();
  depthTarget.setSize(Math.round(innerWidth * dpr), Math.round(innerHeight * dpr));
  waterUniforms.uRes.value.set(innerWidth * dpr, innerHeight * dpr);
}
sizeTargets();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeTargets();
});

const clock = new THREE.Clock();
let simTime = 0;
renderer.setAnimationLoop(() => {
  // getElapsedTime() würde den Delta-Zähler mitverbrauchen — deshalb nur
  // getDelta() abfragen und die Zeit selbst mitführen.
  const dt = Math.min(0.05, clock.getDelta());
  simTime += dt;
  const t = simTime;
  waterUniforms.uTime.value = t;
  updateFish(t, dt);
  grassUniforms.uTime.value = t;
  controls.update();

  // Erst die Szene ohne Wasser in die Depth-Textur, dann normal zeichnen
  if (waterSurface.visible) {
    waterSurface.visible = false;
    renderer.setRenderTarget(depthTarget);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    waterSurface.visible = true;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
