<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Kitty — deine 3D-Katze</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1b1420" />
<style>
  :root {
    --bg: #1b1420;
    --panel: rgba(28, 20, 34, 0.72);
    --line: rgba(255, 236, 210, 0.14);
    --text: #f3e9dd;
    --muted: #b9a894;
    --accent: #ffb26b;
    --good: #7fd6a0;
    --warn: #ffcf5c;
    --bad: #ff7a7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }

  /* ---------- Ladebildschirm ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: var(--bg);
    transition: opacity .6s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .paw { font-size: 40px; animation: bob 1.1s ease-in-out infinite; }
  #loader .txt { color: var(--muted); font-size: 13px; letter-spacing: .04em; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-10px) rotate(6deg); } }

  /* ---------- Kopfzeile ---------- */
  #title {
    position: fixed; top: 16px; left: 18px; z-index: 20;
    font-size: 15px; font-weight: 600; letter-spacing: .02em;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
    pointer-events: none;
  }
  #title span { color: var(--muted); font-weight: 400; }

  /* ---------- Statusanzeige ---------- */
  #stats {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    width: 208px; padding: 12px 13px 11px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .stat { margin-bottom: 9px; }
  .stat:last-child { margin-bottom: 0; }
  .stat .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
    letter-spacing: .03em;
  }
  .stat .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 50%; border-radius: 4px; transition: width .45s ease, background-color .45s ease; }

  /* ---------- Stimmung ---------- */
  #mood {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 92px; z-index: 20;
    font-size: 13px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line);
    padding: 7px 15px; border-radius: 999px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    white-space: nowrap; pointer-events: none;
    transition: opacity .35s ease;
  }

  /* ---------- Aktionsleiste ---------- */
  #actions {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 20px; z-index: 20;
    display: flex; gap: 8px; padding: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #actions button {
    appearance: none; border: 1px solid transparent; cursor: pointer;
    background: rgba(255,255,255,.06); color: var(--text);
    font: inherit; font-size: 12px; font-weight: 500;
    padding: 9px 13px; border-radius: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-width: 62px; line-height: 1.1;
    transition: background-color .18s ease, transform .12s ease, border-color .18s ease;
  }
  #actions button .ico { font-size: 17px; }
  #actions button:hover:not(:disabled) { background: rgba(255,255,255,.13); border-color: var(--line); }
  #actions button:active:not(:disabled) { transform: scale(.94); }
  #actions button:disabled { opacity: .34; cursor: default; }
  #actions button.on { background: rgba(255,178,107,.22); border-color: rgba(255,178,107,.5); }

  /* ---------- Fußzeile / Credit ---------- */
  #credit {
    position: fixed; bottom: 7px; left: 12px; z-index: 20;
    font-size: 10px; color: rgba(185,168,148,.55); line-height: 1.5;
    max-width: 300px; pointer-events: auto;
  }
  #credit a { color: rgba(185,168,148,.8); }

  #hint {
    position: fixed; top: 44px; left: 18px; z-index: 20;
    font-size: 11.5px; color: var(--muted); line-height: 1.6;
    text-shadow: 0 2px 10px rgba(0,0,0,.7);
    pointer-events: none; transition: opacity .8s ease;
  }

  @media (max-width: 640px) {
    #stats { width: 150px; padding: 9px 10px; top: 10px; right: 10px; }
    #title { font-size: 13px; top: 12px; left: 12px; }
    #title span { display: none; }
    #hint { display: none; }
    #actions { gap: 5px; padding: 6px; bottom: 12px; }
    #actions button { min-width: 52px; padding: 8px 8px; font-size: 10.5px; }
    #mood { bottom: 84px; font-size: 12px; }
    #credit { display: none; }
  }
</style>
  <script defer src="/analytics.js"></script>
</head>
<body>

<div id="loader">
  <div class="paw">🐾</div>
  <div class="txt">Katze wird geweckt …</div>
</div>

<div id="title">Kitty <span>— pass gut auf sie auf</span></div>

<div id="credit">

  von <a href="https://sketchfab.com/omabuarts" target="_blank" rel="noopener">Omabuarts Studio</a>,

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// =====================================================================
//  Kitty — eine prozedural animierte 3D-Katze
//  Das GLB liefert Mesh + Skelett; jede Bewegung entsteht hier im Code,
//  damit Kopf, Ohren und Schwanz live auf den Mauszeiger reagieren können.
// =====================================================================

const clock = new THREE.Clock();
const TAU = Math.PI * 2;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const smooth = t => t * t * (3 - 2 * t);
// Rahmenratenunabhängiges Nachziehen: erreicht in `tau` Sekunden ~63 % des Wegs
const damp = (a, b, tau, dt) => lerp(a, b, 1 - Math.exp(-dt / Math.max(1e-4, tau)));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

// ---------------------------------------------------------------------
//  Renderer / Szene / Kamera
// ---------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2032);
scene.fog = new THREE.Fog(0x2a2032, 11, 26);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
const CAM_BASE = new THREE.Vector3(0, 1.95, 5.10);

/**
 * Kameraabstand an das Seitenverhältnis anpassen.
 * Bei fester Distanz füllt die Katze im Hochformat den halben Bildschirm,
 * weil dort die sichtbare Breite stark schrumpft. Der Abstand wird deshalb
 * aus der gewünschten sichtbaren Breite zurückgerechnet — nach oben
 * begrenzt, damit sie auf dem Handy nicht zur Briefmarke wird.
 */
function frameCamera() {
  const aspect = window.innerWidth / window.innerHeight;
  const halfW = 2.15;
  const d = halfW / (Math.tan(camera.fov * Math.PI / 360) * aspect);
  CAM_BASE.z = clamp(d, 4.8, 7.0);
  CAM_BASE.y = 1.75 + (CAM_BASE.z - 4.8) * 0.22;
}
frameCamera();
camera.position.copy(CAM_BASE);
camera.lookAt(0, 0.55, 0);

// ---------------------------------------------------------------------
//  Licht — warm von vorn/links, kühles Gegenlicht für die Silhouette
// ---------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xffe6c8, 0x4a3a52, 1.9));

const keyLight = new THREE.DirectionalLight(0xfff0d8, 2.9);
keyLight.position.set(3.6, 6.4, 4.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0012;
keyLight.shadow.normalBias = 0.022;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xaed4ff, 1.25);
rimLight.position.set(-4.5, 3.2, -4.0);
scene.add(rimLight);

// Weiches, warmes Licht von unten, damit der Bauch nicht absäuft
const fill = new THREE.PointLight(0xffb277, 0.85, 12, 2);
fill.position.set(-1.2, 0.9, 2.6);
scene.add(fill);

// ---------------------------------------------------------------------
//  Der Raum: Boden, Teppich, Napf, Kissen, Spielball
// ---------------------------------------------------------------------
const room = new THREE.Group();
scene.add(room);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0x5c4760, roughness: 0.95, metalness: 0.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
room.add(floor);

// Runder Teppich als optischer Anker für den Spielbereich
const rug = new THREE.Mesh(
  new THREE.CircleGeometry(3.15, 64),
  new THREE.MeshStandardMaterial({ color: 0x8f5b78, roughness: 1.0 })
);
rug.rotation.x = -Math.PI / 2;
rug.position.y = 0.004;
rug.receiveShadow = true;
room.add(rug);

const rugRing = new THREE.Mesh(
  new THREE.RingGeometry(2.72, 2.94, 64),
  new THREE.MeshStandardMaterial({ color: 0xb2748f, roughness: 1.0, side: THREE.DoubleSide })
);
rugRing.rotation.x = -Math.PI / 2;
rugRing.position.y = 0.006;
rugRing.receiveShadow = true;
room.add(rugRing);

// --- Futternapf -------------------------------------------------------
const BOWL_POS = new THREE.Vector3(1.85, 0, 1.05);
const bowl = new THREE.Group();
bowl.position.copy(BOWL_POS);
{
  const outer = new THREE.Mesh(
    new THREE.CylinderGeometry(0.30, 0.20, 0.15, 32),
    new THREE.MeshStandardMaterial({ color: 0x64b5c4, roughness: 0.42, metalness: 0.05 })
  );
  outer.position.y = 0.075;
  outer.castShadow = true; outer.receiveShadow = true;
  bowl.add(outer);

  const inner = new THREE.Mesh(
    new THREE.CylinderGeometry(0.245, 0.245, 0.02, 32),
    new THREE.MeshStandardMaterial({ color: 0x2c4a52, roughness: 0.6 })
  );
  inner.position.y = 0.128;
  bowl.add(inner);
}
room.add(bowl);

// Futter im Napf — wird beim Füttern eingeblendet und beim Fressen kleiner
const food = new THREE.Mesh(
  new THREE.SphereGeometry(0.2, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xe08a55, roughness: 0.75 })
);
food.scale.setScalar(0.001);
food.position.set(BOWL_POS.x, 0.145, BOWL_POS.z);
food.castShadow = true;
room.add(food);

// --- Schlafkissen -----------------------------------------------------
const BED_POS = new THREE.Vector3(-1.85, 0, 0.95);
{
  const cushion = new THREE.Mesh(
    new THREE.CylinderGeometry(0.78, 0.70, 0.17, 32),
    new THREE.MeshStandardMaterial({ color: 0x4d6ea8, roughness: 0.95 })
  );
  cushion.position.set(BED_POS.x, 0.085, BED_POS.z);
  cushion.castShadow = true; cushion.receiveShadow = true;
  room.add(cushion);

  const piping = new THREE.Mesh(
    new THREE.TorusGeometry(0.74, 0.075, 12, 40),
    new THREE.MeshStandardMaterial({ color: 0x6a8dc9, roughness: 0.9 })
  );
  piping.rotation.x = -Math.PI / 2;
  piping.position.set(BED_POS.x, 0.15, BED_POS.z);
  piping.castShadow = true; piping.receiveShadow = true;
  room.add(piping);
}

// ---------------------------------------------------------------------
//  Bodenprofil
//
//  Der Zimmerboden liegt auf y = 0, das Körbchen ist aber eine eigene Höhe.
//  Ohne dieses Profil läuft die Katze einfach hindurch.
// ---------------------------------------------------------------------
const BED_R_FLAT = 0.62;    // ebene Liegefläche in der Mitte
const BED_TOP    = 0.17;    // Oberkante des Kissens
const PIPE_R     = 0.74;    // Mitte des Randwulstes
const PIPE_TOP   = 0.225;   // Scheitel des Randwulstes
const BED_R_OUT  = 0.95;    // ab hier wieder Zimmerboden

/**
 * Höhe des begehbaren Bodens an einer Stelle.
 *
 * Profil des Körbchens: innen flach, zum Rand hin auf den Wulst ansteigend,
 * nach außen sanft auf Null auslaufend. Die weichen Übergänge sind wichtig —
 * mit einer harten Kante würde die Katze am Rand springen statt zu steigen.
 */
function groundHeightAt(x, z) {
  const r = Math.hypot(x - BED_POS.x, z - BED_POS.z);
  if (r >= BED_R_OUT) return 0;
  if (r <= BED_R_FLAT) return BED_TOP;
  if (r <= PIPE_R) {
    return lerp(BED_TOP, PIPE_TOP, smooth((r - BED_R_FLAT) / (PIPE_R - BED_R_FLAT)));
  }
  return lerp(PIPE_TOP, 0, smooth((r - PIPE_R) / (BED_R_OUT - PIPE_R)));
}

/** Der Napf ist ein Hindernis, kein Untergrund — da steigt keine Katze hinein. */
const BOWL_KEEP = 0.44;

function pushOutOfBowl(pos) {
  const dx = pos.x - BOWL_POS.x, dz = pos.z - BOWL_POS.z;
  const d = Math.hypot(dx, dz);
  if (d >= BOWL_KEEP || d < 1e-4) return;
  const s = BOWL_KEEP / d;
  pos.x = BOWL_POS.x + dx * s;
  pos.z = BOWL_POS.z + dz * s;
}

// --- Wollknäuel zum Spielen ------------------------------------------
const ball = new THREE.Group();
{
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0xe4576b, roughness: 0.85 })
  );
  core.castShadow = true;
  ball.add(core);
  // Ein paar Fäden als angedeutete Wollwicklung
  for (let i = 0; i < 3; i++) {
    const thread = new THREE.Mesh(
      new THREE.TorusGeometry(0.152, 0.011, 8, 32),
      new THREE.MeshStandardMaterial({ color: 0xf7a3ae, roughness: 0.9 })
    );
    thread.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
    ball.add(thread);
  }
}
ball.position.set(0, 0.15, 0);
ball.visible = false;
room.add(ball);

// ---------------------------------------------------------------------
//  Katze laden
// ---------------------------------------------------------------------
// `catRoot` trägt Position und Blickrichtung, `catModel` nur das Mesh.
// Trennung, damit Root-Bewegung und Pose sich nie in die Quere kommen.
const catRoot = new THREE.Group();
scene.add(catRoot);
const catModel = new THREE.Group();
catRoot.add(catModel);

const B = {};          // Knochen nach Kurznamen
let skin = null;       // SkinnedMesh — für mesh-genaues Messen von Pfoten und Augen
const REST = new Map(); // Ruhepose je Knochen (Quaternion + Position)
let catReady = false;

// Kurzname -> Suchmuster im GLB. Das Rig nutzt Blender-Konventionen
// mit angehängten Indizes (z. B. "head_018"), deshalb Präfix-Vergleich.
const BONE_MAP = {
  root:   'root_01',
  torso:  'torso_02',
  spine1: 'spine01',  spine2: 'spine02',
  neck:   'neck_',    head:   'head_',
  earL:   'earL',     earR:   'earR',
  eyeL:   'eyeL',     eyeR:   'eyeR',
  mouth:  'mouth',
  tail0:  'tail_0',   tail1:  'tail01', tail2: 'tail02', tail3: 'tail03',
  // Vorderbeine (drei Glieder)
  fUpL: 'legupperFL', fLowL: 'leglowerFL', fFootL: 'footFL',
  fUpR: 'legupperFR', fLowR: 'leglowerFR', fFootR: 'footFR',
  // Hinterbeine (vier Glieder, mit Oberschenkel)
  bThighL: 'thighBL', bUpL: 'legupperBL', bLowL: 'leglowerBL', bFootL: 'footBL',
  bThighR: 'thighBR', bUpR: 'legupperBR', bLowR: 'leglowerBR', bFootR: 'footBR',
};

// Cel-Shading: Toon-Material mit dreistufiger Rampe für den Comic-Look
const toonRamp = (() => {
  const steps = new Uint8Array([90, 90, 90, 165, 165, 255, 255, 255]);
  const tex = new THREE.DataTexture(steps, steps.length, 1, THREE.RedFormat);
  tex.needsUpdate = true;
  return tex;
})();

new GLTFLoader().load('assets/toon_cat.glb', gltf => {
  const src = gltf.scene;

  src.traverse(o => {
    if (o.isSkinnedMesh) skin = o;
    if (o.isMesh || o.isSkinnedMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      o.frustumCulled = false; // Skinning kann die Bounding-Box verlassen
      const old = o.material;
      o.material = new THREE.MeshToonMaterial({
        map: old.map || null,
        color: old.color ? old.color.clone() : new THREE.Color(0xffffff),
        gradientMap: toonRamp,
      });
      if (o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
    }
    if (o.isBone) {
      for (const [key, needle] of Object.entries(BONE_MAP)) {
        if (!B[key] && o.name.startsWith(needle)) B[key] = o;
      }
    }
  });

  // Auf eine feste Schulterhöhe normieren und die Pfoten auf y = 0 setzen,
  // damit Kameraeinstellung und Requisiten unabhängig vom Export passen.
  const box = new THREE.Box3().setFromObject(src);
  const size = new THREE.Vector3(); box.getSize(size);
  const s = 0.95 / size.y;
  src.scale.setScalar(s);
  const box2 = new THREE.Box3().setFromObject(src);
  const c = new THREE.Vector3(); box2.getCenter(c);
  src.position.x -= c.x;
  src.position.z -= c.z;
  src.position.y -= box2.min.y;

  catModel.add(src);

  // Ruhepose sichern — jede Animation ist ein Offset darauf.
  // Zusätzlich die Weltdrehung des Elternknochens merken: damit lassen sich
  // Rotationen im Modellraum ausdrücken statt in der Achsenkonvention
  // des jeweiligen Knochens (die hier von Knochen zu Knochen abweicht).
  catModel.updateWorldMatrix(true, true);
  const _qp = new THREE.Quaternion();
  for (const bone of Object.values(B)) {
    bone.parent.getWorldQuaternion(_qp);
    REST.set(bone, {
      q: bone.quaternion.clone(),
      p: bone.position.clone(),
      s: bone.scale.clone(),
      qp: _qp.clone(),
      qpInv: _qp.clone().invert(),
    });
  }

  calibrateNeutral();
  buildEyes();

  catReady = true;
  document.getElementById('loader').classList.add('done');
  setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }, 9000);
}, undefined, err => {
  // Der Fehlerpfad des Loaders fängt auch Fehler aus dem obigen Aufbau ab.
  // Deshalb unterscheiden, sonst zeigt ein Programmierfehler fälschlich
  // "Modell nicht gefunden" an.
  const missing = err && /404|fetch|load/i.test(String(err.message || err));
  console.error(missing ? 'Modell konnte nicht geladen werden' : 'Fehler beim Aufbau der Katze', err);
  const l = document.getElementById('loader');
  l.querySelector('.txt').textContent = missing
    ? 'Die Katze versteckt sich — Modell nicht gefunden.'
    : 'Die Katze klemmt — Fehler beim Aufbau (siehe Konsole).';
  l.querySelector('.paw').textContent = '😿';
});

// ---------------------------------------------------------------------
//  Pose-System
//
//  Alle Drehungen werden im MODELLRAUM angegeben, nicht in der lokalen
//  Achsenkonvention des Knochens (die im Rig uneinheitlich ist):
//      +X = nach vorn kippen / nicken      (Bein: Fuß nach hinten)
//      +Y = nach rechts drehen
//      +Z = nach links neigen
//  Sie werden pro Bild aufsummiert und erst am Ende in die lokale
//  Knochendrehung zurückgerechnet.
// ---------------------------------------------------------------------
const _e = new THREE.Euler();
const _q = new THREE.Quaternion();
const accum = new Map();   // Knochen -> aufsummierte Modellraum-Drehung

/** Dreht einen Knochen im Modellraum (additiv zu allem bisher Gesetzten). */
function rotBone(bone, x, y, z) {
  if (!bone) return;
  _q.setFromEuler(_e.set(x || 0, y || 0, z || 0));
  let acc = accum.get(bone);
  if (!acc) { acc = new THREE.Quaternion(); accum.set(bone, acc); }
  acc.multiply(_q);
}

function rot(key, x, y, z) { rotBone(B[key], x, y, z); }

/** Setzt alle Knochen auf die Ruhepose und leert die Sammlung. */
function resetPose() {
  for (const [bone, rest] of REST) {
    bone.quaternion.copy(rest.q);
    bone.position.copy(rest.p);
    bone.scale.copy(rest.s);
  }
  for (const acc of accum.values()) acc.identity();
}

/**
 * Rechnet die gesammelten Modellraum-Drehungen in lokale Knochendrehungen um.
 *   weltNeu = delta * weltRuhe
 *   lokalNeu = elternRuhe⁻¹ · delta · elternRuhe · lokalRuhe
 */
function commitPose() {
  for (const [bone, acc] of accum) {
    if (acc.w > 0.999999) continue;   // unverändert
    const rest = REST.get(bone);
    _q.copy(rest.qpInv).multiply(acc).multiply(rest.qp);
    bone.quaternion.copy(_q).multiply(rest.q);
  }
}

// ---------------------------------------------------------------------
//  Neutrale Standpose
//
//  Die Bindepose des Modells ist kein symmetrischer Stand, sondern ein
//  Zwischenbild eines Schrittes: ein Vorderbein steht vorn, das andere
//  hinten. Jede Animation als Offset darauf erbt diese Schieflage — die
//  Pfoten landen links und rechts auf unterschiedlicher Höhe.
//
//  Deshalb wird beim Laden einmalig vermessen, wie weit jeder Knochen
//  eines Paares nach vorn bzw. hinten zeigt. Die Differenz zum Mittelwert
//  wird als dauerhafte Korrektur unter ALLE Animationen gelegt. Damit ist
//  der Ausgangszustand ein echter, gerader Stand.
// ---------------------------------------------------------------------
const NEUTRAL = new Map();   // Knochen -> Nickkorrektur um die Modell-X-Achse
let BASE_LIFT = 0;           // Höhenausgleich, damit die Pfoten auf y = 0 stehen

const _p1 = new THREE.Vector3(), _p2 = new THREE.Vector3();

/**
 * Winkel des Knochens in der Sagittalebene.
 * 0 = zeigt gerade nach unten, positiv = Spitze nach vorn (+Z).
 */
function sagittal(bone) {
  const child = bone && bone.children.find(c => c.isBone);
  if (!child) return null;
  _p1.setFromMatrixPosition(bone.matrixWorld);
  _p2.setFromMatrixPosition(child.matrixWorld);
  return Math.atan2(_p2.z - _p1.z, _p1.y - _p2.y);
}


/**
 * Gewünschte Standpose als Sollwinkel der Beinknochen in der Sagittalebene.
 * 0 = senkrecht nach unten, positiv = Knochenspitze nach vorn.
 *
 * Links und rechts bekommen bewusst DIESELBEN Werte. Dadurch sind Symmetrie
 * und Knickrichtung per Konstruktion richtig — unabhängig davon, wie die
 * Bindepose des Modells aussieht.
 */
const STANCE = {
  fUpL: -12, fUpR: -12,      // Oberarm leicht nach hinten
  fLowL:  10, fLowR:  10,    // Unterarm leicht nach vorn -> Ellbogen zeigt nach hinten
  bThighL: 20, bThighR: 20,  // Oberschenkel nach vorn
  bUpL: -40, bUpR: -40,      // Schienbein nach hinten -> Sprunggelenk zeigt nach hinten
  bLowL:  25, bLowR:  25,    // Mittelfuß wieder nach vorn
};

// Reihenfolge von der Wurzel zur Spitze. Wichtig: Die Korrektur eines
// Knochens dreht alle darunter mit, deshalb wird nach jedem Schritt neu
// gemessen statt alles auf einmal aus der Bindepose zu berechnen.
const STANCE_ORDER = [
  'fUpL', 'fUpR', 'fLowL', 'fLowR',
  'bThighL', 'bThighR', 'bUpL', 'bUpR', 'bLowL', 'bLowR',
];

/**
 * Dreht jeden Beinknochen auf seinen Sollwinkel.
 *
 * Der frühere Ansatz — die Winkel des linken und rechten Beins zu mitteln —
 * ist an der Bindepose gescheitert: Die zeigt einen tiefen Schritt, in dem
 * die Paare 46° bis 61° auseinanderstehen. Ein Mittelwert daraus liegt in
 * keinem der beiden Beine richtig und kann ein Gelenk sogar verkehrt herum
 * knicken lassen.
 */
/**
 * Macht das Beinskelett spiegelsymmetrisch.
 *
 * Im Modell sitzen die Beine links und rechts nicht nur in anderen WINKELN,
 * sondern auch an anderen STELLEN: die rechte Schulter liegt rund 0,07 tiefer
 * als die linke. Gleiche Gelenkwinkel führen dann zwangsläufig zu Pfoten auf
 * unterschiedlicher Höhe — und wer das über die Pfoten ausgleicht, macht ein
 * Bein sichtbar länger als das andere (gemessen 0,355 gegen 0,258).
 *
 * Deshalb werden hier die Ansatzpunkte selbst korrigiert: jedes Paar wird auf
 * die gemeinsame Mitte gezogen, seitlich gespiegelt. Danach ist das Skelett
 * symmetrisch und gleiche Winkel ergeben gleiche Pfotenhöhen.
 *
 * Reihenfolge von der Wurzel zur Spitze, weil das Verschieben eines Knochens
 * alle darunter mitnimmt.
 */
const MIRROR_PAIRS = [
  ['fUpL', 'fUpR'], ['fLowL', 'fLowR'], ['fFootL', 'fFootR'],
  ['bThighL', 'bThighR'], ['bUpL', 'bUpR'], ['bLowL', 'bLowR'], ['bFootL', 'bFootR'],
];

function symmetrizeSkeleton() {
  const wl = new THREE.Vector3(), wr = new THREE.Vector3();
  const inv = new THREE.Matrix4();
  const ql = new THREE.Quaternion(), qp = new THREE.Quaternion();

  for (const [l, r] of MIRROR_PAIRS) {
    const bl = B[l], br = B[r];
    if (!bl || !br || !bl.parent || !br.parent) continue;

    // Bindepose herstellen und die Weltlage des Paares messen
    resetPose();
    catModel.position.set(0, 0, 0);
    catRoot.updateMatrixWorld(true);
    wl.setFromMatrixPosition(bl.matrixWorld);
    wr.setFromMatrixPosition(br.matrixWorld);

    // --- Ansatzpunkt: auf die gemeinsame Mitte, seitlich gespiegelt -----
    const halfX = (Math.abs(wl.x) + Math.abs(wr.x)) / 2;
    const my = (wl.y + wr.y) / 2;
    const mz = (wl.z + wr.z) / 2;
    const tl = new THREE.Vector3(Math.sign(wl.x || 1) * halfX, my, mz);
    const tr = new THREE.Vector3(Math.sign(wr.x || -1) * halfX, my, mz);

    inv.copy(bl.parent.matrixWorld).invert();
    REST.get(bl).p.copy(tl.applyMatrix4(inv));
    inv.copy(br.parent.matrixWorld).invert();
    REST.get(br).p.copy(tr.applyMatrix4(inv));

    // --- Bindedrehung: rechts an links angleichen ----------------------
    // Alle Beinknochen dieses Rigs nutzen dieselbe Achsenkonvention
    // (lokales X zeigt bei jedem nach Welt-+X, nicht gespiegelt). Für einen
    // Vierbeiner sollen linke und rechte Gliedmaße im Modellraum ohnehin
    // GLEICH ausgerichtet sein — beide Knie knicken nach hinten, beide
    // Pfoten zeigen nach vorn. Gespiegelt wird nur die seitliche Lage,
    // und die steckt bereits in der Position oben.
    //
    // Ohne diesen Schritt hängt die Pfote links und rechts in anderem
    // Winkel am Bein, und die Sohlen landen trotz gleicher Gelenkwinkel
    // auf verschiedenen Höhen.
    bl.getWorldQuaternion(ql);
    br.parent.getWorldQuaternion(qp);
    REST.get(br).q.copy(qp.invert()).multiply(ql);
  }

  resetPose();
  catModel.position.set(0, 0, 0);
  catRoot.updateMatrixWorld(true);
}

function aimLegs() {
  for (const key of STANCE_ORDER) {
    const bone = B[key];
    if (!bone) continue;
    evalNeutral();
    const a = sagittal(bone);
    if (a === null) continue;
    // Drehung um +X zieht die Knochenspitze nach hinten und verkleinert den
    // gemessenen Winkel -> Korrektur = Istwinkel − Sollwinkel.
    const target = STANCE[key] * Math.PI / 180;
    NEUTRAL.set(bone, (NEUTRAL.get(bone) || 0) + (a - target));
  }
  evalNeutral();
}

/**
 * Gleicht die verbleibenden Höhenunterschiede der Pfoten aus, indem der
 * Pfotenknochen SENKRECHT VERSCHOBEN wird.
 *
 * Naheliegender wäre, dafür die Gelenkwinkel nachzustellen — das macht die
 * Pose aber sichtbar unsymmetrisch (gemessen bis zu 40° Unterschied zwischen
 * linkem und rechtem Ellbogen). Eine reine Verschiebung rückt die Pfote starr
 * an ihren Platz und lässt alle Beinwinkel unangetastet. Die Beträge liegen
 * im Bereich weniger Zentimeter und fallen am Übergang nicht auf.
 */
const _pq = new THREE.Quaternion(), _ps = new THREE.Vector3(), _pp = new THREE.Vector3();

const _axis = new THREE.Vector3(), _fp = new THREE.Vector3();

function offsetFoot(key, dy) {
  const bone = B[key];
  const rest = REST.get(bone);
  if (!bone || !rest || !bone.parent) return;

  bone.parent.matrixWorld.decompose(_pp, _pq, _ps);
  _fp.setFromMatrixPosition(bone.matrixWorld);

  // Entlang der BEINACHSE verschieben, nicht senkrecht.
  // Eine senkrechte Verschiebung rückt die Pfote quer aus der Flucht des
  // Unterschenkels — das sieht aus, als knicke das Bein am Gelenk ab.
  // In Achsrichtung wird das Glied nur unmerklich länger oder kürzer.
  _axis.subVectors(_fp, _pp);
  if (_axis.lengthSq() < 1e-8 || Math.abs(_axis.y) < 1e-4) return;
  _axis.normalize();
  const t = dy / _axis.y;               // so weit an der Achse entlang
  if (!Number.isFinite(t) || Math.abs(t) > 0.25) return;   // unplausibel -> lassen

  const d = _axis.multiplyScalar(t).applyQuaternion(_pq.invert());
  d.x /= _ps.x || 1; d.y /= _ps.y || 1; d.z /= _ps.z || 1;
  rest.p.add(d);
}

/**
 * Bodenabgleich am TATSÄCHLICH GERENDERTEN Bild.
 *
 * Die Kalibrierung beim Laden rechnet in einem anderen Matrixzustand als der
 * Renderer (SkinnedMesh frischt seine Bindematrix nur in bestimmten Pfaden
 * auf), weshalb ihr Ergebnis um einige Zentimeter danebenliegen kann. Statt
 * das nachzubilden, wird hier in den ersten Bildern gemessen, was wirklich
 * zu sehen ist, und nachgezogen: erst die Pfoten auf eine Ebene, dann die
 * ganze Katze auf den Boden.
 */
let groundPasses = 4;

function settleOnGround() {
  const heights = FOOT_KEYS.map(pawGroundY);
  if (heights.some(h => !Number.isFinite(h))) return;

  const mean = heights.reduce((a, b) => a + b, 0) / heights.length;

  // Paarweise ausgleichen: links und rechts bekommen denselben Betrag,
  // sonst würde der Bodenabgleich die eben hergestellte Symmetrie wieder
  // zerstören (ein Bein sichtbar länger als das andere).
  const PAIRS = [['fFootL', 'fFootR'], ['bFootL', 'bFootR']];
  for (const [l, r] of PAIRS) {
    const hl = heights[FOOT_KEYS.indexOf(l)];
    const hr = heights[FOOT_KEYS.indexOf(r)];
    const dy = mean - (hl + hr) / 2;
    offsetFoot(l, dy);
    offsetFoot(r, dy);
  }

  BASE_LIFT -= Math.min(...heights);
  groundPasses--;
}


function calibrateNeutral() {
  catModel.updateWorldMatrix(true, true);

  collectVertexGroups();
  symmetrizeSkeleton();
  aimLegs();
  // Ausrichten und Höhenausgleich hängen voneinander ab: ein getrimmtes
  // Gelenk kippt die Pfote mit, eine gekippte Pfote ändert den Bodenpunkt.
  flattenPaws();

  // Boden aus dem tiefsten Pfotenpunkt bestimmen
  evalNeutral();
  let lowest = Infinity;
  for (const key of FOOT_KEYS) lowest = Math.min(lowest, pawGroundY(key));
  BASE_LIFT = Number.isFinite(lowest) ? -lowest : 0;
}

const FOOT_KEYS = ['fFootL', 'fFootR', 'bFootL', 'bFootR'];
const VERTS = new Map();   // Knochen-Kurzname -> Vertex-Indizes des Mesh-Teils

/**
 * Rechnet die neutrale Pose einmal komplett durch.
 *
 * Wichtig ist hier updateMatrixWorld(true) statt updateWorldMatrix():
 * SkinnedMesh frischt seine `bindMatrixInverse` NUR in updateMatrixWorld auf.
 * Mit der anderen Methode rechnet applyBoneTransform() gegen eine veraltete
 * Bindematrix — die Messwerte kommen dann um den Modellmaßstab gestaucht
 * heraus (0,0005 statt 0,11) und jeder Höhenausgleich hält die Pfoten
 * fälschlich für längst ausgerichtet.
 */
function evalNeutral() {
  resetPose();
  catModel.position.set(0, 0, 0);
  applyNeutral();
  commitPose();
  catRoot.updateMatrixWorld(true);
}

/**
 * Sammelt je Knochen die Vertices, die überwiegend an ihm hängen.
 * Damit lassen sich Pfoten und Augen am tatsächlichen Mesh vermessen
 * statt nur an den Knochenachsen.
 */
function collectVertexGroups() {
  if (!skin) return;
  const si = skin.geometry.attributes.skinIndex;
  const sw = skin.geometry.attributes.skinWeight;
  const bones = skin.skeleton.bones;

  for (const key of [...FOOT_KEYS, 'eyeL', 'eyeR']) {
    const bone = B[key];
    const bi = bone ? bones.indexOf(bone) : -1;
    if (bi < 0) continue;
    const list = [];
    for (let v = 0; v < si.count; v++) {
      let w = 0;
      for (let c = 0; c < 4; c++) if (si.getComponent(v, c) === bi) w += sw.getComponent(v, c);
      if (w > 0.5) list.push(v);
    }
    VERTS.set(key, list);
  }
}

const _v = new THREE.Vector3();

/**
 * Welt-Höhen aller Punkte einer Pfote im aktuell berechneten Zustand.
 *
 * ACHTUNG: applyBoneTransform() nimmt die Ausgangsposition aus dem
 * ÜBERGEBENEN Vektor (`_basePosition.copy(vector)`), nicht aus dem
 * Geometrie-Attribut. Der Vektor muss deshalb vorher aus der Geometrie
 * gefüllt werden — sonst verrechnet jeder Aufruf das Ergebnis des
 * vorherigen weiter und alle Messwerte sind wertlos.
 */
function pawYs(key) {
  const list = VERTS.get(key);
  const ys = [];
  if (!list || !skin) return ys;
  const posAttr = skin.geometry.attributes.position;
  for (const v of list) {
    _v.fromBufferAttribute(posAttr, v);
    skin.applyBoneTransform(v, _v);
    skin.localToWorld(_v);
    ys.push(_v.y);
  }
  return ys;
}

/** Tiefster Punkt der Pfote — der echte Bodenkontakt, nicht der Knöchel. */
function pawGroundY(key) {
  const ys = pawYs(key);
  return ys.length ? Math.min(...ys) : 0;
}

/**
 * Maß dafür, wie flach die Pfote steht: die Höhenstreuung des unteren
 * Fünftels der Pfotenpunkte. Liegt die Sohle waagerecht, liegen diese
 * Punkte alle auf einer Höhe und der Wert geht gegen null.
 */
function soleSpread(key) {
  const ys = pawYs(key).sort((a, b) => a - b);
  if (ys.length < 5) return 0;
  const n = Math.max(3, Math.round(ys.length * 0.2));
  return ys[n - 1] - ys[0];
}

/**
 * Richtet jede Pfote flach zum Boden aus.
 *
 * In der Bindepose stehen die Pfoten völlig unterschiedlich — gemessen
 * 19° vorn links gegen 107° vorn rechts, weil das Modell einen Schritt
 * zeigt, in dem eine Pfote flach steht und die andere gerade abrollt.
 * Der passende Winkel lässt sich nicht aus den Knochenachsen ableiten,
 * wohl aber am Mesh finden: gesucht ist die Drehung, bei der die Sohle
 * waagerecht liegt. Grobe Suche, dann Feinsuche um das Minimum.
 */
function flattenPaws() {
  if (!skin) return;
  for (const key of FOOT_KEYS) {
    const bone = B[key];
    if (!bone || !VERTS.get(key)) continue;

    let best = NEUTRAL.get(bone) || 0;
    let bestVal = Infinity;
    const scan = (from, to, step) => {
      for (let th = from; th <= to; th += step) {
        NEUTRAL.set(bone, th);
        evalNeutral();
        const val = soleSpread(key);
        if (val < bestVal) { bestVal = val; best = th; }
      }
    };
    scan(-1.5, 1.5, 0.1);
    scan(best - 0.1, best + 0.1, 0.02);
    NEUTRAL.set(bone, best);
  }
  evalNeutral();
}


/**
 * Freundlichere Augen.
 *
 * Das Modell hat echte Augengeometrie (je 89 Vertices an einem eigenen
 * Knochen), aber ohne Lichtreflex — dadurch wirkt der Blick flach. Hier
 * werden die Augen leicht vergrößert und zwei Glanzpunkte aufgesetzt.
 *
 * Lage und Größe werden am Mesh AUSGEMESSEN statt geschätzt: Schwerpunkt
 * und Radius der Augenvertices im Knochenraum, Blickrichtung aus der
 * gemittelten Normalen. Die Punkte hängen am Augenknochen und machen
 * Kopfdrehung und Blinzeln dadurch von selbst mit.
 */
function buildEyes() {
  if (!skin) return;
  const posAttr = skin.geometry.attributes.position;
  const normAttr = skin.geometry.attributes.normal;
  const bones = skin.skeleton.bones;

  for (const [key, side] of [['eyeL', 1], ['eyeR', -1]]) {
    const bone = B[key];
    const list = VERTS.get(key);
    if (!bone || !list || !list.length) continue;

    // Augenvertices in den Knochenraum holen
    const bi = bones.indexOf(bone);
    const toBone = skin.skeleton.boneInverses[bi].clone().multiply(skin.bindMatrix);
    const nrm = new THREE.Matrix3().getNormalMatrix(toBone);

    const mid = new THREE.Vector3();
    const dir = new THREE.Vector3();
    const tmp = new THREE.Vector3();
    const pts = [];
    for (const v of list) {
      pts.push(new THREE.Vector3().fromBufferAttribute(posAttr, v).applyMatrix4(toBone));
      mid.add(pts[pts.length - 1]);
      if (normAttr) dir.add(tmp.fromBufferAttribute(normAttr, v).applyMatrix3(nrm).normalize());
    }
    mid.divideScalar(pts.length);
    if (dir.lengthSq() < 1e-6) dir.set(side, 0, 1);
    dir.normalize();

    // Sichtbarer Radius des Auges = größte Ausdehnung QUER zur Blickrichtung,
    // und die Wölbung = größte Ausdehnung ENTLANG der Blickrichtung.
    let R = 0, bulge = -Infinity;
    const rel = new THREE.Vector3();
    for (const p of pts) {
      rel.copy(p).sub(mid);
      const along = rel.dot(dir);
      bulge = Math.max(bulge, along);
      R = Math.max(R, rel.addScaledVector(dir, -along).length());
    }

    // Zwei Achsen quer zur Blickrichtung, um Punkte auf der Augenfläche
    // anzupeilen: ax seitlich, ay nach oben.
    const ax = new THREE.Vector3(0, 1, 0).cross(dir);
    if (ax.lengthSq() < 1e-6) ax.set(1, 0, 0);
    ax.normalize();
    const ay = new THREE.Vector3().crossVectors(dir, ax).normalize();

    /**
     * Legt eine flache Scheibe auf die Augenfläche.
     *
     * Die Lage wird gerechnet, nicht am nächsten Vertex eingerastet: Das
     * Low-Poly-Auge hat seine Vertices fast nur auf dem Rand, ein Einrasten
     * schöbe jeden Glanzpunkt an die Kante statt auf die Fläche.
     * (u, v) sind Anteile des Augenradius, die Scheibe wird knapp vor die
     * Wölbung gesetzt und quer zur Blickrichtung ausgerichtet.
     */
    const decal = (u, v, radius, color) => {
      const disc = new THREE.Mesh(
        new THREE.CircleGeometry(R * radius, 20),
        new THREE.MeshBasicMaterial({ color, depthWrite: false })
      );
      disc.position.copy(mid)
        .addScaledVector(ax, u * R)
        .addScaledVector(ay, v * R)
        .addScaledVector(dir, bulge + R * 0.04);
      disc.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
      disc.renderOrder = 2;
      bone.add(disc);
    };

    // Weit genug innen, dass die Scheiben ganz auf der Augenfläche liegen —
    // ragen sie über den Rand, lesen sie sich als Sichel statt als Lichtpunkt.
    decal(side * 0.30,  0.30, 0.26, 0xffffff);   // großer Reflex oben außen
    decal(-side * 0.26, -0.30, 0.12, 0xbfdcf5);  // kleiner Gegenreflex unten innen
  }
}

/** Legt die neutrale Standpose unter alle weiteren Bewegungen. */
function applyNeutral() {
  for (const [bone, pitch] of NEUTRAL) rotBone(bone, pitch, 0, 0);
}

/**
 * Haltungen. `w` ist das Überblendgewicht (0..1), damit zwei Haltungen
 * sauber ineinander laufen können.
 */
const POSTURE = {
  stand(w) { /* Ruhepose ist bereits der Stand */ },

  sit(w) {
    // Hinterhand klappt zu Boden, Brust richtet sich auf.
    // Die Vorderbeine werden gegen die Rumpfdrehung zurückgedreht,
    // damit sie senkrecht stehen bleiben.
    rot('bThighL', -1.30 * w, 0, 0);  rot('bThighR', -1.30 * w, 0, 0);
    rot('bLowL',    2.10 * w, 0, 0);  rot('bLowR',    2.10 * w, 0, 0);
    rot('bFootL',  -1.05 * w, 0, 0);  rot('bFootR',  -1.05 * w, 0, 0);
    rot('torso',   -0.55 * w, 0, 0);
    rot('fUpL',     0.55 * w, 0, 0);  rot('fUpR',     0.55 * w, 0, 0);
    rot('neck',     0.25 * w, 0, 0);
    rot('tail0',    0.35 * w, 0, 0);
    catModel.position.y -= 0.27 * w;
  },

  lie(w) {
    // Brotlaib: Rumpf liegt auf, alle vier Beine falten darunter
    rot('bThighL', -1.35 * w, 0,  0.20 * w); rot('bThighR', -1.35 * w, 0, -0.20 * w);
    rot('bLowL',    2.25 * w, 0, 0);         rot('bLowR',    2.25 * w, 0, 0);
    rot('bFootL',  -1.10 * w, 0, 0);         rot('bFootR',  -1.10 * w, 0, 0);
    rot('fUpL',     1.10 * w, 0, 0);         rot('fUpR',     1.10 * w, 0, 0);
    rot('fLowL',   -1.70 * w, 0, 0);         rot('fLowR',   -1.70 * w, 0, 0);
    rot('fFootL',   0.80 * w, 0, 0);         rot('fFootR',   0.80 * w, 0, 0);
    rot('neck',     0.12 * w, 0, 0);
    catModel.position.y -= 0.38 * w;
  },

  sleep(w) {
    // Eingerollt: Wirbelsäule krümmt sich, Kopf legt sich an die Flanke
    POSTURE.lie(w);
    rot('spine1', 0, -0.30 * w, 0);
    rot('spine2', 0, -0.28 * w, 0);
    rot('neck',   0.20 * w, -0.50 * w, 0);
    rot('head',   0.34 * w, -0.42 * w, 0.28 * w);
    rot('earL',   0.40 * w, 0, 0);
    rot('earR',   0.40 * w, 0, 0);
  },

  crouch(w) {
    // Angespannt vor dem Sprung: tief, Hinterhand geladen
    rot('bThighL', -0.70 * w, 0, 0); rot('bThighR', -0.70 * w, 0, 0);
    rot('bLowL',    1.15 * w, 0, 0); rot('bLowR',    1.15 * w, 0, 0);
    rot('bFootL',  -0.55 * w, 0, 0); rot('bFootR',  -0.55 * w, 0, 0);
    rot('fUpL',     0.45 * w, 0, 0); rot('fUpR',     0.45 * w, 0, 0);
    rot('fLowL',   -0.55 * w, 0, 0); rot('fLowR',   -0.55 * w, 0, 0);
    rot('fFootL',   0.20 * w, 0, 0); rot('fFootR',   0.20 * w, 0, 0);
    rot('torso',   -0.12 * w, 0, 0);
    rot('neck',    -0.18 * w, 0, 0);
    catModel.position.y -= 0.20 * w;
  },

  stretch(w) {
    // Genüssliches Strecken/Gähnen aus dem Sitzen heraus.
    // Bewusst auf der Sitzhaltung aufgebaut: die Vorderbeine hängen im Rig
    // an der Wirbelsäule, ein gebeugter Rücken zöge die Pfoten unter den Boden.
    POSTURE.sit(w);
    rot('neck',  -0.45 * w, 0, 0);   // Hals streckt sich
    rot('head',  -0.40 * w, 0, 0);   // Kopf in den Nacken
    rot('tail0', -0.30 * w, 0, 0);
  },
};

// ---------------------------------------------------------------------
//  Gangwerk — diagonaler Trab (vorn links schwingt mit hinten rechts)
// ---------------------------------------------------------------------
let gaitPhase = 0;

function applyGait(w) {
  if (w < 0.001) return;
  const p = gaitPhase;
  // Vorn kleinerer Ausschlag als hinten: Schwingt die Schulter zu weit vor,
  // wandert der Ellbogen VOR die Schulter und das Bein wirkt nach vorn
  // abgeknickt. Die Hinterhand liefert ohnehin den Vortrieb.
  const hipAmp  = 0.30 * w;   // Vorderbein: Schulterausschlag
  const rearAmp = 0.44 * w;   // Hinterbein: Oberschenkelausschlag
  const HIP_BIAS  = 0.12 * w; // hält den Ellbogen hinter der Schulter
  const REAR_BIAS = 0.12 * w; // hält das Knie vor der Hüfte
  const kneeAmp = 0.80 * w;   // Beugung in der Schwungphase

  // Das Gelenk beugt sich NUR in der Schwungphase — das Standbein bleibt
  // gestreckt und die Pfote behält Bodenkontakt. Ein konstanter Beugeanteil
  // würde die Beine dauerhaft verkürzen und die Katze schweben lassen.
  const swingOf = ph => Math.max(0, Math.sin(ph - 0.5));

  // Vorderbein: Schulter, Ellbogen, Handwurzel. Der Ellbogen knickt nach
  // HINTEN (negativ) — mit der Beugerichtung des Hinterbeins überstreckt er
  // nach vorn und die Pfote sinkt in den Boden ein.
  const frontLeg = (up, low, foot, ph) => {
    const swing = swingOf(ph);
    // Der Schwung ist gegen die kritische Lage VERSCHOBEN, nicht symmetrisch
    // um den Standwinkel: Ohne diesen Versatz wandert der Ellbogen im vorderen
    // Umkehrpunkt vor die Schulter und das Bein knickt sichtbar nach vorn ab.
    rot(up,   -hipAmp * Math.sin(ph) + HIP_BIAS, 0, 0);
    rot(low,  -kneeAmp * swing, 0, 0);
    // Auch die Handwurzel FALTET sich (negativ). Mit positivem Vorzeichen
    // kickt die Pfote in der Schwungphase nach vorn statt sich anzuziehen.
    rot(foot, -0.35 * kneeAmp * swing, 0, 0);
  };

  // Hinterbein: Oberschenkel, Knie, Sprunggelenk. Gebeugt wird am KNIE,
  // nicht am Mittelfuß — sonst hebt die Hinterpfote kaum ab (gemessen 0,03
  // gegen 0,12 vorn) und der Gang wirkt hinten steif.
  const backLeg = (thigh, knee, hock, ph) => {
    const swing = swingOf(ph);
    // Gegenrichtung zum Vorderbein: Das Knie muss VOR der Hüfte bleiben.
    rot(thigh, -rearAmp * Math.sin(ph) - REAR_BIAS, 0, 0);
    rot(knee,  -0.68 * kneeAmp * swing, 0, 0);   // sonst stakst die Hinterhand zu hoch
    // Ebenfalls faltend: ein positives Vorzeichen schleudert die Hinterpfote
    // nach vorn — nachgemessen kippt +0,6 rad am Sprunggelenk den Unterschenkel
    // sichtbar vor die Körperachse.
    rot(hock, -0.45 * kneeAmp * swing, 0, 0);
  };

  // Lateraler Viertakt — die Gangart, die Katzen im Schritt tatsächlich
  // benutzen: hinten links, vorn links, hinten rechts, vorn rechts, jeweils
  // um ein Viertel des Zyklus versetzt. Ein diagonaler Trab (zwei Beine
  // gleichzeitig) ist eine schnellere Gangart und wirkt im Schritt hüpfend.
  const Q = Math.PI / 2;
  backLeg('bThighL', 'bUpL', 'bLowL', p);
  frontLeg('fUpL', 'fLowL', 'fFootL', p + Q);
  backLeg('bThighR', 'bUpR', 'bLowR', p + 2 * Q);
  frontLeg('fUpR', 'fLowR', 'fFootR', p + 3 * Q);

  // Ausgeschwenkte Beine sind effektiv kürzer als gestreckte; der kleine
  // Grundhub gleicht das aus, damit die Standpfote nicht einsinkt.
  catModel.position.y += (0.022 + Math.sin(p * 2) * 0.022) * w;
  rot('torso',  Math.sin(p * 2) * 0.030 * w, Math.sin(p) * 0.05 * w, 0);
  rot('spine1', 0, Math.sin(p + 0.5) * 0.04 * w, Math.sin(p) * 0.04 * w);
  rot('neck',   0, Math.sin(p + 1.0) * -0.035 * w, 0);
}

// ---------------------------------------------------------------------
//  Overlays — laufen unabhängig von der Haltung mit
// ---------------------------------------------------------------------
const look = { x: 0, y: 0 };          // aktuell gedrehter Blick (geglättet)
const lookTarget = { x: 0, y: 0 };    // gewünschter Blick
let blinkTimer = rand(2, 5);
let blinkAmount = 0;
let earTwitch = 0, earTwitchTimer = rand(3, 7);
let tailFlick = 0, tailFlickTimer = rand(4, 10);
let purr = 0;                          // 0..1, moduliert die Schnurr-Vibration
let tailMood = 0.5;                    // 0 = ruhig, 1 = aufgeregt

function applyOverlays(t, dt, awake) {
  // --- Atmen: im Schlaf langsam und tiefer ----------------------------
  const rate = awake ? 0.55 : 0.28;
  const breath = Math.sin(t * TAU * rate);
  const depth = awake ? 1 : 1.6;
  rot('torso',  breath * 0.026 * depth, 0, 0);
  rot('spine1', breath * 0.020 * depth, 0, 0);
  rot('spine2', breath * 0.014 * depth, 0, 0);

  // --- Blick: Hals und Kopf teilen sich die Drehung -------------------
  look.x = damp(look.x, lookTarget.x, 0.16, dt);
  look.y = damp(look.y, lookTarget.y, 0.16, dt);
  rot('neck', look.y * 0.35, look.x * 0.40, 0);
  rot('head', look.y * 0.55, look.x * 0.60, look.x * -0.20);

  // --- Ohren: folgen dem Blick, zucken gelegentlich -------------------
  earTwitchTimer -= dt;
  if (earTwitchTimer <= 0) { earTwitch = 1; earTwitchTimer = rand(2.5, 8); }
  earTwitch = Math.max(0, earTwitch - dt * 3.5);
  const flick = Math.sin(earTwitch * Math.PI) * 0.5;
  const alert = clamp(tailMood, 0, 1);
  // Aufmerksam = aufgestellt (Z spreizt sie), entspannt = leicht abgelegt
  rot('earL', 0.18 * (1 - alert) + flick,       look.x * 0.3, -0.16 * alert);
  rot('earR', 0.18 * (1 - alert) + flick * 0.4, look.x * 0.3,  0.16 * alert);

  // --- Schwanz --------------------------------------------------------
  // Katzen wedeln nicht, sie FÜHREN den Schwanz: eine sehr langsame Welle
  // läuft von der Wurzel zur Spitze. Schnelle Bewegung gibt es nur als
  // kurzes Zucken der Spitze, nie als Dauerschwingen des ganzen Schwanzes.
  const tf = lerp(0.085, 0.30, tailMood);    // Frequenz — bewusst sehr niedrig
  const ta = lerp(0.16, 0.34, tailMood);     // Amplitude — dafür weit ausholend
  const lift = lerp(-0.20, 0.60, tailMood);  // Grundhaltung
  const LAG = 1.25;                          // Verzögerung je Glied

  // Gelegentliches Zucken, das nur die äußeren Glieder erfasst.
  tailFlickTimer -= dt;
  if (tailFlickTimer <= 0) {
    tailFlick = 1;
    tailFlickTimer = rand(5, 14) - tailMood * 3.5;   // gereizt zuckt es öfter
  }
  tailFlick = Math.max(0, tailFlick - dt * 3.2);
  const flickWave = Math.sin(tailFlick * Math.PI * 3) * tailFlick * 0.30;

  for (let i = 0; i < 4; i++) {
    const ph = t * TAU * tf - i * LAG;
    const swing = Math.sin(ph) * ta * (0.35 + i * 0.30);
    const tip = i >= 2 ? flickWave * (i - 1) : 0;    // Zucken nur außen
    rot('tail' + i, -lift * (i === 0 ? 1 : 0.28), swing + tip, 0);
  }

  // --- Blinzeln (Augenknochen werden gestaucht) -----------------------
  blinkTimer -= dt;
  if (blinkTimer <= 0) { blinkAmount = 1; blinkTimer = rand(2.5, 6.5); }
  blinkAmount = Math.max(0, blinkAmount - dt * 7);
  const closed = awake ? Math.sin(blinkAmount * Math.PI) : 1;
  let sq = 1 - closed * 0.9;
  if (purr > 0.01) sq *= 1 - 0.5 * purr;     // zufriedene Schlitzaugen
  if (B.eyeL) B.eyeL.scale.y = REST.get(B.eyeL).s.y * sq;
  if (B.eyeR) B.eyeR.scale.y = REST.get(B.eyeR).s.y * sq;

  // --- Schnurren: feines, hochfrequentes Zittern ----------------------
  if (purr > 0.01) {
    const v = Math.sin(t * TAU * 20) * 0.010 * purr;
    rot('torso', v, 0, v * 0.6);
    rot('head', v * 1.3, 0, 0);
  }
}

// ---------------------------------------------------------------------
//  Tamagotchi-Werte — überleben den Seitenneuaufruf via localStorage
// ---------------------------------------------------------------------
const SAVE_KEY = 'kitty.state.v1';
const MAX_AWAY_H = 6;   // längere Abwesenheit wird gedeckelt, sonst ist sie immer am Verhungern

const stats = { food: 78, fun: 72, energy: 85 };

// Verfallsraten in Punkten pro Minute — an einer Stelle, damit Online- und
// Offline-Verlauf nicht auseinanderlaufen.
const DECAY = {
  food: 1.1,        // 100 -> 0 in gut 90 Minuten
  fun: 1.67,        // 100 -> 0 in etwa einer Stunde
  funAsleep: 0.4,   // im Schlaf langweilt sie sich kaum
  energy: 0.83,     // wach: 100 -> 0 in rund zwei Stunden
  sleepGain: 25,    // Nickerchen: in etwa vier Minuten wieder voll
};

function loadStats() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (!s || typeof s.food !== 'number') return;
    Object.assign(stats, { food: s.food, fun: s.fun, energy: s.energy });
    // Werte während der Abwesenheit weiterlaufen lassen
    const awayMin = clamp((Date.now() - (s.t || Date.now())) / 60000, 0, MAX_AWAY_H * 60);
    stats.food   -= awayMin * DECAY.food;
    stats.fun    -= awayMin * DECAY.fun;
    stats.energy += awayMin * 4;     // in der Zwischenzeit hat sie geschlafen
    clampStats();
  } catch (e) { /* defekter Eintrag: Startwerte behalten */ }
}
function saveStats() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...stats, t: Date.now() })); } catch (e) {}
}
function clampStats() {
  for (const k of ['food', 'fun', 'energy']) stats[k] = clamp(stats[k], 0, 100);
}
loadStats();
setInterval(saveStats, 5000);
window.addEventListener('pagehide', saveStats);

// ---------------------------------------------------------------------
//  Zustandsmaschine
// ---------------------------------------------------------------------
const CAT = {
  state: 'idle',
  prevPosture: 'stand',
  posture: 'stand',
  blend: 1,          // 0 -> prevPosture, 1 -> posture
  timer: 2,          // Restdauer des aktuellen Zustands
  speed: 0,          // aktuelle Laufgeschwindigkeit
  target: null,      // Zielpunkt am Boden
  facing: 0,         // Blickrichtung (Gierwinkel)
  jump: 0,           // Sprungfortschritt 0..1
  jumpY: 0,
};
const ROAM_R = 1.9;  // Radius, in dem sie frei umherstreift

function setPosture(name, speed = 0.28) {
  if (CAT.posture === name) return;
  CAT.prevPosture = CAT.posture;
  CAT.posture = name;
  CAT.blend = 0;
  CAT.blendSpeed = 1 / speed;
}
CAT.blendSpeed = 1 / 0.28;

function setState(name, dur = 3, opts = {}) {
  CAT.state = name;
  CAT.timer = dur;
  CAT.target = opts.target || null;
  if (opts.posture) setPosture(opts.posture, opts.blend);
}

/** Zufälliger Punkt auf dem Teppich, nicht zu nah am aktuellen Standort. */
function roamPoint() {
  for (let i = 0; i < 12; i++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * ROAM_R;
    const p = new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r);
    if (p.distanceTo(catRoot.position) > 1.0 && p.distanceTo(BOWL_POS) > BOWL_KEEP + 0.2) return p;
  }
  return new THREE.Vector3(0, 0, 0);
}

/** Dreht die Katze zum Ziel und schiebt sie vorwärts. Liefert true bei Ankunft. */
function walkToward(target, dt, speed = 1.25, stopAt = 0.12) {
  // Ohne Ziel gilt der Weg als beendet. Ein fehlendes Ziel würde sonst eine
  // Ausnahme in der Renderschleife auslösen und die ganze Seite einfrieren.
  if (!target) { CAT.speed = damp(CAT.speed, 0, 0.12, dt); return true; }

  const dx = target.x - catRoot.position.x;
  const dz = target.z - catRoot.position.z;
  const dist = Math.hypot(dx, dz);

  // Blickrichtung nachführen (kürzester Weg um den Kreis)
  const want = Math.atan2(dx, dz);
  let diff = ((want - CAT.facing + Math.PI * 3) % TAU) - Math.PI;
  CAT.facing += clamp(diff, -4.5 * dt, 4.5 * dt);

  if (dist <= stopAt) { CAT.speed = damp(CAT.speed, 0, 0.12, dt); return true; }

  // Erst drehen, dann Gas geben — sonst driftet sie seitwärts
  const aligned = clamp(1 - Math.abs(diff) / 1.4, 0, 1);
  const want_v = speed * aligned * clamp(dist / 0.5, 0.25, 1);
  CAT.speed = damp(CAT.speed, want_v, 0.14, dt);
  catRoot.position.x += Math.sin(CAT.facing) * CAT.speed * dt;
  catRoot.position.z += Math.cos(CAT.facing) * CAT.speed * dt;
  return false;
}

/** Wählt selbstständig, was sie als Nächstes tut. */
function decideNext() {
  // Bedürfnisse gehen vor: müde Katzen schlafen, hungrige gehen zum Napf
  if (stats.energy < 18) return setState('goSleep', 20, { target: BED_POS.clone() });
  if (stats.food < 22 && foodAmount > 0) return setState('goEat', 20, { target: eatSpot() });

  const r = Math.random();
  if (r < 0.34)      setState('walk', rand(4, 9), { target: roamPoint() });
  else if (r < 0.52) setState('sit',  rand(4, 10), { posture: 'sit' });
  else if (r < 0.63) setState('groom', rand(3.5, 6), { posture: 'sit' });
  else if (r < 0.73) setState('stretch', 2.4, { posture: 'stretch', blend: 0.55 });
  else if (r < 0.84) setState('lie',  rand(5, 11), { posture: 'lie', blend: 0.6 });
  else               setState('idle', rand(2.5, 5), { posture: 'stand' });
}

/** Standposition vor dem Napf — leicht davor, damit der Kopf hineinreicht. */
function eatSpot() {
  const d = new THREE.Vector3().subVectors(catRoot.position, BOWL_POS).setY(0);
  if (d.lengthSq() < 1e-4) d.set(0, 0, -1);
  return d.normalize().multiplyScalar(0.52).add(BOWL_POS);
}

// ---------------------------------------------------------------------
//  Zustands-Update — was in jedem Zustand konkret passiert
// ---------------------------------------------------------------------
let foodAmount = 0;      // 0..1, Füllstand des Napfs
let playUntil = 0;       // Zeitstempel, bis wann Spielmodus läuft
let petHold = 0;         // wie lange gerade gestreichelt wird
const ballVel = new THREE.Vector3();

// Standbild-Modus zum Beurteilen und Abstimmen der Posen:
//   ?pose=stand | sit | lie | sleep | crouch | stretch
// Hält die Zustandsmaschine an und friert eine Haltung ein.
// Zusätzlich: ?side=1 stellt sie ins Profil, ?zoom=<fov> holt sie heran.
const params = new URLSearchParams(location.search);
const FREEZE = params.get('pose');
const FREEZE_SIDE = params.has('side');
const FREEZE_ZOOM = parseFloat(params.get('zoom'));

function updateFrozen() {
  CAT.state = 'frozen';
  CAT.posture = FREEZE;
  CAT.prevPosture = FREEZE;
  CAT.blend = 1;
  CAT.speed = 0;
  CAT.facing = FREEZE_SIDE ? Math.PI / 2 : 0;
  catRoot.position.set(0, 0, 0);
  tailMood = 0.3;
  if (Number.isFinite(FREEZE_ZOOM)) {
    camera.fov = FREEZE_ZOOM;
    camera.updateProjectionMatrix();
  }
}

function updateState(dt, t) {
  if (FREEZE) { updateFrozen(); return; }
  CAT.timer -= dt;
  let moving = false;

  switch (CAT.state) {

    case 'idle':
      setPosture('stand');
      tailMood = damp(tailMood, 0.28, 0.8, dt);
      if (CAT.timer <= 0) decideNext();
      break;

    case 'walk': {
      setPosture('stand');
      tailMood = damp(tailMood, 0.5, 0.8, dt);
      moving = true;
      const done = walkToward(CAT.target, dt, 1.15);
      if (done || CAT.timer <= 0) decideNext();
      break;
    }

    case 'sit':
      tailMood = damp(tailMood, 0.22, 1.0, dt);
      if (CAT.timer <= 0) decideNext();
      break;

    case 'groom':
      // Putzen: Kopf senkt sich rhythmisch zur Flanke
      tailMood = damp(tailMood, 0.18, 1.0, dt);
      lookTarget.x = Math.sin(t * 2.1) * 0.5 - 0.35;
      lookTarget.y = 0.75 + Math.sin(t * 6.5) * 0.18;
      if (CAT.timer <= 0) decideNext();
      break;

    case 'stretch':
      tailMood = damp(tailMood, 0.35, 0.6, dt);
      if (CAT.timer <= 0) setState('idle', rand(1.5, 3), { posture: 'stand' });
      break;

    case 'lie':
      tailMood = damp(tailMood, 0.12, 1.2, dt);
      if (CAT.timer <= 0) decideNext();
      break;

    // --- Fressen ------------------------------------------------------
    case 'goEat':
      setPosture('stand');
      moving = true;
      tailMood = damp(tailMood, 0.62, 0.6, dt);
      if (walkToward(CAT.target, dt, 1.35, 0.14) || CAT.timer <= 0) {
        setState('eat', 5.5, { posture: 'stand' });
      }
      break;

    case 'eat': {
      // Kopf taucht in den Napf und bewegt sich beim Fressen
      const dir = new THREE.Vector3().subVectors(BOWL_POS, catRoot.position);
      CAT.facing = damp(CAT.facing, Math.atan2(dir.x, dir.z), 0.2, dt);
      lookTarget.x = 0;
      lookTarget.y = 0.95 + Math.sin(t * 9) * 0.16;
      tailMood = damp(tailMood, 0.4, 0.8, dt);
      const bite = dt * 0.22;
      foodAmount = Math.max(0, foodAmount - bite);
      stats.food += bite * 190;
      if (CAT.timer <= 0 || foodAmount <= 0) {
        stats.fun += 4;
        setState('groom', 4, { posture: 'sit' });
      }
      break;
    }

    // --- Schlafen -----------------------------------------------------
    case 'goSleep':
      setPosture('stand');
      moving = true;
      tailMood = damp(tailMood, 0.15, 1.0, dt);
      if (walkToward(CAT.target, dt, 0.85, 0.16) || CAT.timer <= 0) {
        setState('sleep', 999, { posture: 'sleep', blend: 1.1 });
      }
      break;

    case 'sleep':
      tailMood = damp(tailMood, 0.05, 2.0, dt);
      lookTarget.x = damp(lookTarget.x, 0, 0.5, dt);
      lookTarget.y = damp(lookTarget.y, 0.2, 0.5, dt);
      stats.energy += dt * (DECAY.sleepGain / 60);
      // Wacht von selbst auf, wenn sie ausgeruht oder hungrig ist
      if (stats.energy >= 98 || stats.food < 12) {
        setState('stretch', 2.6, { posture: 'stretch', blend: 0.7 });
      }
      break;

    // --- Kuscheln -----------------------------------------------------
    case 'goPet':
      setPosture('stand');
      moving = true;
      tailMood = damp(tailMood, 0.75, 0.5, dt);
      if (walkToward(CAT.target, dt, 1.5, 0.2) || CAT.timer <= 0) {
        setState('pet', 6, { posture: 'sit' });
      }
      break;

    case 'pet':
      // Schnurrt, schmiegt den Kopf zur Hand (= Mauszeiger)
      purr = damp(purr, 1, 0.4, dt);
      tailMood = damp(tailMood, 0.3, 0.9, dt);
      lookTarget.y = damp(lookTarget.y, -0.25 + Math.sin(t * 1.6) * 0.15, 0.3, dt);
      stats.fun += dt * 3.0;
      if (CAT.timer <= 0) decideNext();
      break;

    // --- Spielen ------------------------------------------------------
    case 'chase': {
      // Jagt den Ball; kurz vor dem Ziel duckt sie sich und springt
      moving = true;
      const d = catRoot.position.distanceTo(ball.position);
      tailMood = damp(tailMood, 1, 0.35, dt);

      if (d < 0.62 && CAT.jump <= 0) {
        CAT.jump = 1;
        // Ball wegkicken
        const away = new THREE.Vector3().subVectors(ball.position, catRoot.position).setY(0).normalize();
        ballVel.copy(away).multiplyScalar(rand(2.2, 3.6));
        ballVel.y = rand(1.6, 2.6);
        stats.fun += 5;
        stats.energy -= 1.6;
      }

      if (CAT.jump > 0) {
        setPosture('crouch', 0.12);
        CAT.jump -= dt * 1.9;
        const k = 1 - CAT.jump;
        CAT.jumpY = Math.sin(clamp(k, 0, 1) * Math.PI) * 0.42;
        if (CAT.jump <= 0) { CAT.jump = 0; CAT.jumpY = 0; }
      } else {
        setPosture('stand', 0.15);
        CAT.jumpY = 0;
        walkToward(ball.position, dt, 2.3, 0.3);
      }

      stats.energy -= dt * 0.15;
      stats.fun += dt * 0.9;
      if (performance.now() > playUntil || stats.energy < 6) {
        stopPlay();
        setState('sit', 4, { posture: 'sit' });
      }
      break;
    }
  }

  // Ohne aktiven Lauf sanft ausrollen
  if (!moving) CAT.speed = damp(CAT.speed, 0, 0.15, dt);

  pushOutOfBowl(catRoot.position);

  // Innerhalb des Zimmers halten
  const r = Math.hypot(catRoot.position.x, catRoot.position.z);
  if (r > 2.9) {
    catRoot.position.x *= 2.9 / r;
    catRoot.position.z *= 2.9 / r;
  }

  // Schrittphase koppelt an die tatsächliche Geschwindigkeit
  gaitPhase += CAT.speed * 7.4 * dt;

  // Werteverfall. Die Raten sind PRO MINUTE gedacht und werden hier auf
  // Sekunden umgerechnet: Sattheit hält ~90 min, Laune ~60 min,
  // Energie ~120 min. Ein Nickerchen lädt in etwa vier Minuten voll auf.
  const asleep = CAT.state === 'sleep';
  stats.food -= dt * (DECAY.food / 60);
  stats.fun  -= dt * ((asleep ? DECAY.funAsleep : DECAY.fun) / 60);
  if (!asleep) stats.energy -= dt * (DECAY.energy / 60);
  clampStats();

  purr = damp(purr, CAT.state === 'pet' || petHold > 0 ? 1 : 0, 0.5, dt);
  petHold = Math.max(0, petHold - dt);
}

// ---------------------------------------------------------------------
//  Zeigereingabe — der Cursor wird auf den Boden projiziert
// ---------------------------------------------------------------------
const ndc = new THREE.Vector2(0, 0);
const raycaster = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const pointerGround = new THREE.Vector3(0, 0, 2.5);
const pointerHead = new THREE.Vector3(0, 0.8, 2.5);   // Zielpunkt auf Kopfhöhe
let pointerActive = false;
let pointerSpeed = 0;
let lastPointer = new THREE.Vector2(0, 0);

function updatePointerWorld() {
  raycaster.setFromCamera(ndc, camera);
  // Bodenpunkt für Laufziele und das Spielzeug
  raycaster.ray.intersectPlane(groundPlane, pointerGround);

  // Blickpunkt getrennt davon: ein Punkt auf dem Mausstrahl in der Tiefe der
  // Katze. Der Bodenpunkt taugt dafür nicht — er liegt immer auf y = 0, die
  // Katze könnte dem Zeiger also nur seitlich folgen, nie nach oben.
  const depth = Math.max(1, camera.position.distanceTo(catRoot.position));
  raycaster.ray.at(depth, pointerHead);
}

function onPointerMove(e) {
  const x = (e.clientX / window.innerWidth) * 2 - 1;
  const y = -(e.clientY / window.innerHeight) * 2 + 1;
  pointerSpeed = Math.hypot(x - lastPointer.x, y - lastPointer.y) * 60;
  lastPointer.set(x, y);
  ndc.set(x, y);
  pointerActive = true;
  updatePointerWorld();
}
window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('pointerleave', () => { pointerActive = false; });

// Klick auf die Katze = streicheln
renderer.domElement.addEventListener('pointerdown', e => {
  if (!catReady) return;
  onPointerMove(e);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(catModel, true);
  if (hit.length) {
    petHold = 1.6;
    stats.fun += 3.5;
    clampStats();
    if (CAT.state !== 'sleep' && CAT.state !== 'chase') {
      setState('pet', 4.5, { posture: 'sit' });
    } else if (CAT.state === 'sleep') {
      // Nicht gleich aufwecken, nur kurz zucken
      earTwitch = 1;
    }
    flash('mrrrp 💛');
  }
});

// ---------------------------------------------------------------------
//  Aktionen
// ---------------------------------------------------------------------
function feed() {
  foodAmount = 1;
  stats.fun += 2;
  clampStats();
  flash('Nom nom … 🐟');
  setState('goEat', 22, { target: eatSpot(), posture: 'stand' });
}

function petAction() {
  const t = pointerActive ? pointerGround.clone().setY(0) : new THREE.Vector3(0, 0, 1.4);
  t.clampLength(0, 2.2);
  flash('Schnurr … 🤍');
  setState('goPet', 14, { target: t, posture: 'stand' });
}

/** Freier Platz auf dem Teppich, mit Abstand zu Napf und Körbchen. */
function freeSpot() {
  const p = new THREE.Vector3();
  for (let i = 0; i < 20; i++) {
    const a = rand(0, TAU), r = rand(0.8, 1.9);
    p.set(Math.cos(a) * r, 0.15, Math.sin(a) * r);
    if (p.distanceTo(BOWL_POS) > 0.75 && p.distanceTo(BED_POS) > 0.95) return p;
  }
  return p.set(0, 0.15, -0.6);
}

function startPlay() {
  playUntil = performance.now() + 22000;
  ball.visible = true;
  ball.position.copy(freeSpot());
  ballVel.set(rand(-1, 1), 0, rand(-1, 1));
  setState('chase', 999, { posture: 'stand' });
  document.getElementById('a-play').classList.add('on');
  flash('Fang das Knäuel! 🧶');
}

function stopPlay() {
  playUntil = 0;
  ball.visible = false;
  CAT.jump = 0; CAT.jumpY = 0;
  document.getElementById('a-play').classList.remove('on');
}

function sleepAction() {
  if (CAT.state === 'sleep') {
    setState('stretch', 2.6, { posture: 'stretch', blend: 0.7 });
    flash('Guten Morgen ☀️');
  } else {
    stopPlay();
    setState('goSleep', 22, { target: BED_POS.clone(), posture: 'stand' });
    flash('Gute Nacht 🌙');
  }
}

document.getElementById('a-feed').onclick  = feed;
document.getElementById('a-pet').onclick   = petAction;
document.getElementById('a-play').onclick  = () => (CAT.state === 'chase' ? (stopPlay(), decideNext()) : startPlay());
document.getElementById('a-sleep').onclick = sleepAction;

// ---------------------------------------------------------------------
//  Ball-Physik (leichtgewichtig: Schwerkraft, Hüpfen, Reibung)
// ---------------------------------------------------------------------
function updateBall(dt) {
  if (!ball.visible) return;
  ballVel.y -= 7.5 * dt;
  ball.position.addScaledVector(ballVel, dt);

  // Auch das Knäuel liegt auf dem Untergrund auf, nicht auf fester Höhe —
  // sonst versinkt es im Körbchen.
  const floor = groundHeightAt(ball.position.x, ball.position.z) + 0.15;
  if (ball.position.y < floor) {
    ball.position.y = floor;
    ballVel.y *= -0.48;
    ballVel.x *= 0.72; ballVel.z *= 0.72;
    if (Math.abs(ballVel.y) < 0.35) ballVel.y = 0;
  }
  // Rollreibung
  ballVel.x = damp(ballVel.x, 0, 0.85, dt);
  ballVel.z = damp(ballVel.z, 0, 0.85, dt);

  // Im Zimmer halten
  const r = Math.hypot(ball.position.x, ball.position.z);
  if (r > 2.6) {
    ball.position.x *= 2.6 / r; ball.position.z *= 2.6 / r;
    ballVel.x *= -0.55; ballVel.z *= -0.55;
  }
  // Rollen sichtbar machen
  ball.rotation.x += ballVel.z * dt * 6;
  ball.rotation.z -= ballVel.x * dt * 6;
}

// ---------------------------------------------------------------------
//  Oberfläche: Balken, Stimmungstext
// ---------------------------------------------------------------------
const ui = {
  food: [document.getElementById('v-food'), document.getElementById('b-food')],
  fun:  [document.getElementById('v-fun'),  document.getElementById('b-fun')],
  nrg:  [document.getElementById('v-nrg'),  document.getElementById('b-nrg')],
};
const moodEl = document.getElementById('mood');
let flashUntil = 0;

function flash(msg) {
  moodEl.textContent = msg;
  flashUntil = performance.now() + 2600;
}

function barColor(v) {
  return v > 55 ? 'var(--good)' : v > 25 ? 'var(--warn)' : 'var(--bad)';
}

function moodText() {
  if (CAT.state === 'sleep')  return 'schläft tief und fest 💤';
  if (CAT.state === 'eat')    return 'frisst genüsslich 🐟';
  if (CAT.state === 'chase')  return 'jagt wie verrückt 🧶';
  if (CAT.state === 'pet')    return 'schnurrt zufrieden 🤍';
  if (CAT.state === 'groom')  return 'putzt sich ausgiebig';
  if (CAT.state === 'stretch')return 'streckt sich lang';
  if (stats.food < 20)        return 'hat großen Hunger …';
  if (stats.energy < 20)      return 'ist hundemüde 😴';
  if (stats.fun < 20)         return 'langweilt sich sehr';
  if (stats.food < 40)        return 'schielt zum Napf';
  if (stats.fun < 40)         return 'hätte Lust zu spielen';
  if (CAT.state === 'walk')   return 'streift durchs Zimmer';
  if (CAT.state === 'lie')    return 'döst vor sich hin';
  return 'ist rundum zufrieden';
}

let uiTick = 0;
function updateUI(dt) {
  uiTick -= dt;
  if (uiTick > 0) return;
  uiTick = 0.25;

  const vals = { food: stats.food, fun: stats.fun, nrg: stats.energy };
  for (const [k, [label, bar]] of Object.entries(ui)) {
    const v = Math.round(vals[k]);
    label.textContent = v + '%';
    bar.style.width = v + '%';
    bar.style.backgroundColor = barColor(v);
  }

  if (performance.now() > flashUntil) moodEl.textContent = moodText();

  const sleepBtn = document.getElementById('a-sleep');
  sleepBtn.querySelector('.ico').textContent = CAT.state === 'sleep' ? '☀️' : '🌙';
  sleepBtn.childNodes[1].nodeValue = CAT.state === 'sleep' ? 'Wecken' : 'Schlafen';
  document.getElementById('a-feed').disabled = foodAmount > 0.05;
}

// ---------------------------------------------------------------------
//  Blickverhalten gegenüber dem Mauszeiger
// ---------------------------------------------------------------------
const _toPointer = new THREE.Vector3();
const EYE_HEIGHT = 0.62;   // ungefähre Augenhöhe über dem Boden

function updateLook(dt, t) {
  // In diesen Zuständen bestimmt das Verhalten den Blick selbst
  if (CAT.state === 'groom' || CAT.state === 'eat' || CAT.state === 'sleep') return;

  let focus = null;
  if (CAT.state === 'chase') focus = ball.position;
  else if (pointerActive)    focus = pointerHead;

  if (!focus) {
    // Ohne Zeiger schaut sie sich gelegentlich träge um
    lookTarget.x = damp(lookTarget.x, Math.sin(t * 0.31) * 0.5, 1.2, dt);
    lookTarget.y = damp(lookTarget.y, Math.sin(t * 0.23) * 0.2, 1.2, dt);
    return;
  }

  _toPointer.subVectors(focus, catRoot.position);
  // In den lokalen Raum der Katze drehen -> Winkel relativ zur Blickrichtung
  const localX = _toPointer.x * Math.cos(-CAT.facing) - _toPointer.z * Math.sin(-CAT.facing);
  const localZ = _toPointer.x * Math.sin(-CAT.facing) + _toPointer.z * Math.cos(-CAT.facing);
  const yaw = Math.atan2(localX, Math.max(0.25, localZ));
  const dist = Math.hypot(_toPointer.x, _toPointer.z);
  // Augenhöhe der sitzenden Katze als Bezug; liegt der Zeiger darüber,
  // wird der Wert negativ und der Kopf hebt sich.
  const pitch = Math.atan2(EYE_HEIGHT - focus.y, Math.max(0.4, dist));

  // Der Kopf dreht sich nur bis zu einem natürlichen Anschlag
  lookTarget.x = damp(lookTarget.x, clamp(yaw, -1.25, 1.25), 0.12, dt);
  lookTarget.y = damp(lookTarget.y, clamp(pitch, -0.95, 0.85), 0.18, dt);

  // Schnelle Mausbewegung in der Nähe macht sie aufmerksam
  if (pointerSpeed > 1.4 && dist < 2.4 && CAT.state !== 'chase') {
    tailMood = Math.min(1, tailMood + 0.35);
    if (Math.random() < 0.02) earTwitch = 1;
  }
  pointerSpeed = damp(pointerSpeed, 0, 0.25, dt);
}

// ---------------------------------------------------------------------
//  Hauptschleife
// ---------------------------------------------------------------------
let t = 0;
const camLook = new THREE.Vector3(0, 0.55, 0);
let groundY = 0;   // aktuelle Höhe des Untergrunds unter der Katze

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20); // große Sprünge nach Tabwechsel abfangen
  t += dt;

  if (catReady) {
    updateState(dt, t);
    updateLook(dt, t);
    updateBall(dt);

    // --- Pose neu aufbauen -------------------------------------------
    resetPose();
    catModel.position.set(0, BASE_LIFT, 0);
    applyNeutral();

    CAT.blend = Math.min(1, CAT.blend + dt * CAT.blendSpeed);
    const w = smooth(CAT.blend);
    if (w < 1) POSTURE[CAT.prevPosture](1 - w);
    POSTURE[CAT.posture](w);

    const gaitWeight = clamp(CAT.speed / 0.5, 0, 1) * (CAT.posture === 'stand' ? 1 : 0.25);
    applyGait(gaitWeight);

    const awake = CAT.state !== 'sleep';
    // Im Standbild-Modus die Zeit anhalten, damit Atmen und Schwanz die
    // zu beurteilende Pose nicht verwackeln.
    applyOverlays(FREEZE ? 0 : t, dt, awake);

    commitPose();   // gesammelte Modellraum-Drehungen anwenden

    // --- Wurzeltransformation ----------------------------------------
    catRoot.rotation.y = CAT.facing;
    // Der Höhe des Untergrunds nachgehen statt hindurchzulaufen. Leicht
    // gedämpft, damit das Aufsteigen aufs Körbchen weich wirkt.
    groundY = damp(groundY, groundHeightAt(catRoot.position.x, catRoot.position.z), 0.07, dt);
    catRoot.position.y = groundY + CAT.jumpY;
  }

  updateUI(dt);

  // Kamera atmet leicht mit dem Zeiger mit — gibt Tiefe ohne Steuerung
  const px = pointerActive ? lastPointer.x : 0;
  const py = pointerActive ? lastPointer.y : 0;
  camera.position.x = damp(camera.position.x, CAM_BASE.x + px * 0.55, 0.5, dt);
  camera.position.y = damp(camera.position.y, CAM_BASE.y + py * 0.30, 0.5, dt);
  // Blickziel weich nachziehen statt hart setzen — hält die Katze mittig,
  // ohne dass die Kamera an ihr zu kleben scheint.
  camLook.x = damp(camLook.x, catRoot.position.x, 0.45, dt);
  camLook.z = damp(camLook.z, catRoot.position.z * 0.35, 0.45, dt);
  camera.lookAt(camLook);

  // Napfinhalt sichtbar machen
  const target = foodAmount * 0.95;
  food.scale.setScalar(damp(food.scale.x, Math.max(0.001, target), 0.2, dt));

  renderer.render(scene, camera);

  // Nach dem Zeichnen sind alle Matrizen auf dem Stand des Bildes — der
  // richtige Moment, um Bodenhöhe und Pfotenausrichtung nachzumessen.
  if (catReady && groundPasses > 0 && CAT.posture === 'stand' && CAT.speed < 0.01 &&
      groundHeightAt(catRoot.position.x, catRoot.position.z) === 0) {
    settleOnGround();
  }

  requestAnimationFrame(frame);
}
frame();

// Prüfhilfe für die Entwicklung (schadet im Betrieb nicht)
window.__kitty = { CAT, stats, setState, setPosture, camera, catRoot, catModel, B, REST, NEUTRAL, POSTURE, rot, accum, commitPose, skin, VERTS, pawGroundY, soleSpread, evalNeutral, sagittal, STANCE, aimLegs, flattenPaws, calibrateNeutral, groundHeightAt, BED_POS, BOWL_POS };

// ---------------------------------------------------------------------
//  Fenstergröße
// ---------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  frameCamera();
  renderer.setSize(window.innerWidth, window.innerHeight);
  updatePointerWorld();
});
</script>
</body>
</html>
