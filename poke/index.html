<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon TCG — Kartenbaum</title>
<meta name="description" content="Alle Pokémon-Sammelkarten als aufklappbare Mindmap: Serien, Sets und Karten in 15 Sprachen.">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23ee3d3d'/><path d='M4 50h92' stroke='%230d1117' stroke-width='8'/><circle cx='50' cy='50' r='16' fill='%230d1117'/><circle cx='50' cy='50' r='9' fill='%23fff'/></svg>">
<style>
  :root{
    --bg:#0d1117; --bg2:#131a24; --panel:#161d27; --panel2:#1b2430;
    --line:#2c3a4d; --line2:#3d5069;
    --tx:#e6edf5; --tx2:#93a4bb; --tx3:#5f7189;
    --acc:#ffcb3d; --acc2:#ee3d3d;
    --ok:#3fb950; --warn:#d29922;
    --r:12px;
    --fs:15px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--tx);
    font:var(--fs)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  ul{list-style:none}

  /* ---------- Kopfzeile ---------- */
  header{
    position:fixed; inset:0 0 auto 0; z-index:40;
    display:flex; align-items:center; gap:14px;
    padding:10px 16px; padding-top:max(10px,env(safe-area-inset-top));
    background:rgba(13,17,23,.86); backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
  .brand svg{width:22px;height:22px;flex:none}
  .brand span{color:var(--tx2);font-weight:500}
  @media(max-width:720px){.brand span{display:none}}

  .spacer{flex:1}

  /* ---------- Hauptmenü ---------- */
  .tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{
    padding:5px 15px;border-radius:8px;font-size:13.5px;font-weight:600;
    color:var(--tx3);transition:.15s;white-space:nowrap;
  }
  .tab:hover{color:var(--tx2)}
  .tab.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
  @media(max-width:560px){.tab{padding:5px 10px;font-size:12.5px}}

  .ctl{
    display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:5px 9px;
  }
  .ctl:focus-within{border-color:var(--line2)}
  .ctl svg{width:15px;height:15px;flex:none;color:var(--tx3)}
  #q{background:none;border:none;outline:none;color:var(--tx);width:150px;font:inherit;min-width:0}
  #q::placeholder{color:var(--tx3)}
  @media(max-width:720px){#q{width:100%}}

  /* Auf schmalen Geräten muss die Suche schrumpfen dürfen, sonst schiebt sie
     Sprachwahl und Zuklapp-Knopf aus dem Bild. */
  @media(max-width:560px){
    header{gap:8px;padding:9px 10px}
    .brand{font-size:0;gap:0}
    .brand svg{width:24px;height:24px}
    .ctl{flex:1;min-width:0}
    select{max-width:104px;padding:6px 4px}
  }

  select{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 9px;color:var(--tx);font:inherit;cursor:pointer;outline:none;
  }
  select:focus{border-color:var(--line2)}

  .iconbtn{
    width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);display:grid;place-items:center;color:var(--tx2);
    transition:.15s;
  }
  .iconbtn:hover{background:var(--panel2);color:var(--tx);border-color:var(--line2)}
  .iconbtn svg{width:16px;height:16px}

  /* ---------- Bühne ---------- */
  #stage{
    position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:78px 24px 96px;
    scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  }
  #stage::-webkit-scrollbar{width:11px;height:11px}
  #stage::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid var(--bg)}
  #tree{width:100%}

  /* ---------- Mindmap-Äste ---------- */
  .kids{padding-left:30px}
  .branch{position:relative;padding-left:30px}
  .branch::before{
    content:'';position:absolute;left:0;top:0;
    width:26px;height:24px;
    border-left:2px solid var(--line);border-bottom:2px solid var(--line);
    border-bottom-left-radius:12px;
  }
  .branch::after{
    content:'';position:absolute;left:0;top:24px;bottom:0;
    border-left:2px solid var(--line);
  }
  .branch:last-child::after{display:none}
  .branch.on::before,.branch.on::after{border-color:var(--line2)}

  /* ---------- Knoten ---------- */
  .node{
    display:inline-flex;align-items:center;gap:10px;
    margin:5px 0;padding:7px 13px 7px 9px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    transition:.15s;text-align:left;max-width:100%;
  }
  .node:hover{background:var(--panel2);border-color:var(--line2);transform:translateX(2px)}
  .node.on{border-color:var(--dot,var(--acc));background:var(--panel2)}
  .node.root{background:linear-gradient(135deg,#1d2836,#161d27);border-color:var(--line2);padding:10px 18px 10px 12px}

  .tw{width:15px;height:15px;flex:none;display:grid;place-items:center;color:var(--tx3);transition:transform .18s}
  .node.on .tw{transform:rotate(90deg);color:var(--dot,var(--acc))}
  .tw svg{width:11px;height:11px}

  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dot,var(--acc))}
  .logo{height:22px;width:auto;max-width:74px;object-fit:contain;flex:none}

  .lbl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node.root .lbl{font-size:17px;letter-spacing:-.3px}
  .sub{color:var(--tx3);font-size:12.5px;white-space:nowrap;flex:none}
  .cnt{
    font-size:11.5px;font-weight:700;color:var(--tx2);
    background:var(--bg2);border:1px solid var(--line);
    border-radius:20px;padding:1px 8px;flex:none;
    font-variant-numeric:tabular-nums;
  }

  .spin{width:13px;height:13px;flex:none;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- Kartenblock ---------- */
  .block{
    margin:8px 0 14px;padding:14px;
    background:var(--bg2);border:1px solid var(--line);border-radius:14px;
  }
  .blockbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:var(--tx3);font-size:12.5px}
  .blockbar b{color:var(--tx2);font-weight:600}
  .grid{
    display:grid;gap:13px;
    grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
  }
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    overflow:hidden;text-align:left;transition:.15s;
  }
  .card:hover{border-color:var(--dot,var(--acc));transform:translateY(-3px)}
  .card .ph{aspect-ratio:.716;background:var(--panel2);position:relative;overflow:hidden}
  .card img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
  .card img.in{opacity:1}
  .card .ph::after{
    content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;
    color:var(--tx3);font-size:12px;font-weight:700;
  }
  .card .flag{
    position:absolute;top:5px;right:5px;z-index:2;
    background:rgba(6,9,13,.8);border:1px solid var(--line2);border-radius:5px;
    font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--tx2);
    padding:1px 4px;
  }
  .card .meta{padding:8px 9px}
  .card .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .no{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}

  .empty{color:var(--tx3);font-size:13px;padding:6px 2px}

  /* ---------- Suchergebnisse ---------- */
  #results{display:none}
  #results.on{display:block}
  #tree.hide{display:none}
  .rbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-bottom:14px;color:var(--tx3);font-size:13px;
  }
  .rbar b{color:var(--tx);font-size:15px;font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{
    background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:4px 11px;font-size:12.5px;color:var(--tx2);transition:.15s;
  }
  .chip:hover{border-color:var(--line2);color:var(--tx);background:var(--panel2)}
  .chip .k{color:var(--tx3);margin-right:5px}
  .card .set{font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- Pokédex ---------- */
  #dex{display:none}
  #dex.on{display:block}
  /* Masonry: Spalten nebeneinander, jeder Block wandert in die gerade
     kürzeste. CSS `columns` schied aus — das füllt spaltenweise, wodurch die
     ersten ~180 Pokémon alle in Spalte 1 gelandet wären. */
  .chains{display:flex;gap:12px;align-items:flex-start}
  .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:12px}
  /* Entwicklungsstufen laufen von oben nach unten, eine Zeile je Stufe.
     Verzweigungen (Evoli hat acht) stehen dadurch nebeneinander in ihrer Zeile. */
  .chain{
    background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  /* In einer Multicol-Spalte muss der Block die volle Spaltenbreite belegen */
  .chains > .chain{width:100%}
  .rank{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}
  .down{color:var(--tx3);font-size:13px;line-height:1.1}
  /* Verzweigungskacheln: 112px, damit zwei in die schmalste Spalte (260px minus
     Polster ≈ 238px) passen. Dass sie kleiner sind als eine Einzelstufe ist
     gewollt — man sieht auf einen Blick, dass die Stufe mehrere Formen hat. */
  .mon{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:7px 4px 9px;border-radius:13px;border:1px solid transparent;
    transition:.15s;width:112px;max-width:100%;
  }
  .mon:hover{background:var(--panel2);border-color:var(--line2)}
  .mon img{width:96px;height:96px;flex:none;object-fit:contain;opacity:0;transition:opacity .25s}
  .mon img.in{opacity:1}
  .mon .t{min-width:0;width:100%;text-align:center}
  .mon .n{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mon .d{font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums}
  /* Kartenzahl — erscheint erst, wenn der Kartenindex nachgeladen ist */
  /* Von Anfang an sichtbar, damit das Masonry-Ausmessen stimmt — sonst
     würden die Blöcke beim Nachtragen der Zahlen alle höher und die
     Spaltenverteilung wäre falsch. */
  .mon .pill{
    display:inline-block;margin-top:4px;
    font-size:10px;font-weight:700;color:var(--tx2);
    background:var(--panel);border:1px solid var(--line);
    border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .mon .pill.laedt{color:var(--tx3);opacity:.35}
  .mon .pill.leer{color:var(--tx3);opacity:.55}

  /* Pokémon ohne Karte in der gewählten Sprache: ausgegraut und blass, damit
     man die Lücken einer Sprache auf einen Blick sieht. */
  .mon.leer{opacity:.4}
  .mon.leer img{filter:grayscale(1)}
  .mon.leer:hover{opacity:.75}
  .rank .mon:only-child .pill{font-size:11.5px;padding:2px 9px}
  .arrow{color:var(--tx3);flex:none;font-size:15px;line-height:1}

  /* Steht eine Stufe allein in ihrer Zeile — der Normalfall —, darf sie die
     Spaltenbreite ausnutzen. Verzweigungszeilen bleiben bei der Grundgröße,
     sonst würde Evoli acht Zeilen hoch. */
  .rank .mon:only-child{width:100%;max-width:250px}
  .rank .mon:only-child img{width:200px;height:200px}
  .rank .mon:only-child .n{font-size:15px}

  /* Handy: zwei Spalten. Dafür müssen die Kacheln deutlich kleiner werden —
     die Einzelstufe füllt ihre Spalte, Verzweigungen bleiben zu zweit nebeneinander,
     sonst würde Evoli achtmal untereinander stehen. */
  @media(max-width:640px){
    #stage{padding:70px 12px 96px}
    /* Zwei Ebenen Einrückung fressen sonst die halbe Schirmbreite und der
       Kartenblock wird breiter als das Fenster. */
    .kids{padding-left:15px}
    .branch{padding-left:16px}
    .branch::before{width:13px;height:22px;border-bottom-left-radius:9px}
    .branch::after{top:22px}
    .block{padding:10px 9px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:9px}
    .card .nm{font-size:12px}
    .card .meta{padding:6px 7px}
    .chain{padding:9px 6px;border-radius:12px}
    /* 72px: zwei davon plus Lücke passen in die ~156px Innenbreite einer
       Handy-Spalte. Bei 80px war es genau eine Kachel zu breit. */
    .rank{gap:4px}
    .mon{width:72px;padding:4px 1px 6px;border-radius:10px}
    .mon img{width:62px;height:62px}
    .mon .n{font-size:11px}
    .mon .d{font-size:9.5px}
    /* Auf der 72px-Zweigkachel würde "151 Karten" bei 10px überstehen */
    .mon .pill{font-size:9px;padding:1px 5px;margin-top:3px}
    .rank .mon:only-child{width:100%;max-width:none}
    .rank .mon:only-child img{width:min(132px,100%);height:auto;aspect-ratio:1}
    .rank .mon:only-child .n{font-size:12.5px}
    .rank .mon:only-child .pill{font-size:10.5px;padding:1px 8px}
    .sbar img{width:200px;height:200px}
    .sbar h2{font-size:20px}
  }

  .sbar{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
  .sbar img{width:300px;height:300px;object-fit:contain;flex:none;max-width:60vw}
  .sbar h2{font-size:24px;letter-spacing:-.4px}
  .sbar .d{color:var(--tx3);font-size:13px}
  .back{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:6px 12px;font-size:13px;color:var(--tx2);margin-bottom:14px;transition:.15s;
  }
  .back:hover{background:var(--panel2);color:var(--tx);border-color:var(--line2)}
  .line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .line .mon{background:var(--panel);border-color:var(--line)}
  .line .mon.self{border-color:var(--acc);background:var(--panel2)}

  /* Sonderformen — bewusst neben der Kette, nicht darin */
  .formen{align-items:center;gap:8px;padding-top:2px}
  .formlabel{
    font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
    color:var(--tx3);margin-right:4px;align-self:center;
  }
  .mon.form{width:120px}
  .mon.form img{width:100px;height:100px}
  .mon.form .pill{display:inline-block;margin-top:3px}

  /* ---------- Detail ---------- */
  #ov{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(6,9,13,.78);backdrop-filter:blur(6px);
    padding:20px;overflow:auto;
  }
  #ov.on{display:grid;place-items:center}
  .sheet{
    background:var(--panel);border:1px solid var(--line2);border-radius:18px;
    max-width:820px;width:100%;padding:20px;
    display:grid;grid-template-columns:250px 1fr;gap:22px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  @media(max-width:700px){.sheet{grid-template-columns:1fr;gap:16px;padding:16px}}
  .sheet img.big{width:100%;border-radius:11px;display:block;background:var(--panel2)}
  .sheet h2{font-size:22px;letter-spacing:-.4px;margin-bottom:3px}
  .sheet .rar{color:var(--tx2);font-size:13.5px;margin-bottom:14px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin-bottom:14px}
  .kv dt{color:var(--tx3)}
  .kv dd{color:var(--tx)}
  .vars{display:flex;flex-direction:column;gap:6px}
  .var{
    display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
    background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;
  }
  .var{flex-direction:column;align-items:stretch;gap:9px}
  .vname{min-width:0;font-weight:600;color:var(--tx)}
  .vprices{display:flex;flex-direction:column;gap:9px}

  /* Je Quelle ein Block: Kopfzeile nennt die Zustandsgrundlage, darunter
     eine Zeile je Wert. */
  .quelle{border-left:2px solid var(--line2);padding-left:10px}
  .qkopf{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:3px}
  .qname{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:var(--tx2);text-transform:uppercase}
  a.qname{text-decoration:none;border-bottom:1px solid var(--line2);transition:.15s}
  a.qname:hover{color:var(--acc);border-bottom-color:var(--acc)}
  a.qname::after{content:' ↗';font-size:9px;opacity:.6;border:0}
  .qbasis{font-size:11px;color:var(--tx3)}
  .preisz{display:flex;justify-content:space-between;gap:14px;align-items:baseline;font-size:12.5px}
  .plabel{color:var(--tx3)}
  .var b{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
  /* Hauptpreis: der 30-Tage-Schnitt von Cardmarket, sonst der Trend */
  .preisz.haupt{margin-bottom:2px}
  .preisz.haupt .plabel{color:var(--tx2)}
  .preisz.haupt b{color:var(--acc);font-size:17px;font-weight:700}
  .vsub{color:var(--tx3);font-size:11px;font-variant-numeric:tabular-nums}
  .vars + .vsub{display:block;margin-top:10px}
  .closeb{position:absolute;top:14px;right:14px}
  .sheet{position:relative}
  .blaetter{position:absolute;top:50%;transform:translateY(-50%);z-index:3}
  .blaetter.vor{left:-52px}
  .blaetter.zur{right:-52px}
  .blaetter:disabled{opacity:.25;cursor:default}
  .zaehler{
    position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;
  }
  @media(max-width:900px){
    .blaetter.vor{left:6px}
    .blaetter.zur{right:6px}
    .blaetter{top:auto;bottom:10px;transform:none;background:rgba(6,9,13,.85)}
    .zaehler{bottom:18px}
  }

  /* ---------- Fußzeile ---------- */
  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 16px;padding-bottom:max(8px,env(safe-area-inset-bottom));
    background:rgba(13,17,23,.86);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    font-size:12px;color:var(--tx3);
  }
  footer a{color:var(--tx2)}
  .pill{display:flex;align-items:center;gap:6px}
  .led{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .led.off{background:var(--warn)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#ee3d3d"/><path d="M6 50h88" stroke="#0d1117" stroke-width="9"/><circle cx="50" cy="50" r="15" fill="#0d1117"/><circle cx="50" cy="50" r="8" fill="#fff"/></svg>
    Kartenbaum <span>· Pokémon TCG</span>
  </div>

  <nav class="tabs">
    <button class="tab on" data-view="sets">Sets</button>
    <button class="tab" data-view="dex">Pokémon</button>
  </nav>

  <div class="spacer"></div>

  <label class="ctl">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Serie oder Set…" autocomplete="off" spellcheck="false">
  </label>

  <select id="lang" title="Sprache"></select>

</header>

<main id="stage"><div id="tree"></div><div id="dex"></div><div id="results"></div></main>

<footer>
  <div class="pill"><span class="led" id="led"></span><span id="status">bereit</span></div>
  <div class="pill" id="stats"></div>
  <div>Daten: <a href="https://tcgdex.dev" target="_blank" rel="noopener">TCGdex</a></div>
</footer>

<div id="ov"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';

const API = 'https://api.tcgdex.net/v2';

/* Deutsche Bezeichnungen, solange die Oberfläche deutsch ist */
const LANGS = [
  ['de','Deutsch'],['en','Englisch'],['fr','Französisch'],['it','Italienisch'],
  ['es','Spanisch'],['pt','Portugiesisch'],['ja','Japanisch'],['ko','Koreanisch'],
  ['zh-tw','Chinesisch (trad.)'],['zh-cn','Chinesisch (vereinf.)'],
  ['id','Indonesisch'],['th','Thai'],
  ['nl','Niederländisch'],['pl','Polnisch'],['ru','Russisch']
];

/* Serienfarben — ein fester Farbton je Serie, damit Äste unterscheidbar bleiben */
const HUES = {
  base:45, neo:170, ecard:200, ex:25, dp:210, pl:265, hgss:340, col:15,
  bw:0, xy:290, sm:35, swsh:195, sv:355, tcgp:150, me:100
};
const hue = id => `hsl(${HUES[id] ?? 220} 70% 58%)`;

/* TCGdex nennt die erste Serie auf Deutsch "Grund" — abgeleitet vom "Grundset".
   Im deutschen Sprachgebrauch heißt die Ära aber "Basis-Serie". Andere Sprachen
   verwenden dort ebenfalls Ära-Namen ("Originale", "Clásica"), nur Deutsch
   kürzt den Setnamen ab. Einzelfall-Korrektur statt Datenpflege im Generator. */
const SERIE_NAME = { de: { base: 'Basis' } };
const serieName = s => ((SERIE_NAME[lang] || {})[s.id]) || s.name;

const $  = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; };

let lang  = localStorage.getItem('poke.lang') || 'de';
const open = new Set(JSON.parse(localStorage.getItem('poke.open') || '[]'));
const mem  = new Map();   // In-Memory-Cache je Sprache+Pfad

/* ---------- Netz ---------- */
async function get(path){
  const key = lang + path;
  if (mem.has(key)) return mem.get(key);
  const p = fetch(`${API}/${lang}${path}`)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .catch(e => { mem.delete(key); throw e; });
  mem.set(key, p);
  return p;
}

function status(txt, warn){
  $('#status').textContent = txt;
  $('#led').classList.toggle('off', !!warn);
}

/* ---------- Aufbau ---------- */
async function build(){
  const tree = $('#tree');
  tree.innerHTML = '';
  status('lade Serien…');

  let series;
  try { series = await get('/series'); }
  catch(e){
    tree.append(Object.assign(el('div','empty','Serien konnten nicht geladen werden. Offline und noch kein Cache vorhanden?'),{}));
    status('Fehler', true);
    return;
  }

  /* Wurzel */
  const root = el('div','node root');
  root.style.setProperty('--dot', 'var(--acc)');
  root.append(el('span','dot'));
  root.append(el('span','lbl','Pokémon-Sammelkartenspiel'));
  root.append(el('span','cnt', series.length + ' Serien'));
  tree.append(root);

  const kids = el('ul','kids');
  tree.append(kids);

  for (const s of series) kids.append(serieNode(s));

  status('bereit');
  applyFilter();
  countUp();
}

/* Ebene 1 — Serie */
function serieNode(s){
  const li = el('li','branch');
  const node = el('button','node');
  node.dataset.key = 's:' + s.id;
  node.style.setProperty('--dot', hue(s.id));

  node.append(tw(), Object.assign(el('span','dot'),{}));
  if (s.logo){
    const img = el('img','logo');
    img.src = s.logo + '.webp'; img.alt = ''; img.loading = 'lazy';
    img.onerror = () => img.remove();
    node.append(img);
  }
  node.append(el('span','lbl', serieName(s)));

  const box = el('div');
  li.append(node, box);

  let loaded = false;
  node.onclick = async () => {
    const on = node.classList.toggle('on');
    li.classList.toggle('on', on);
    mark('s:'+s.id, on);
    box.style.display = on ? '' : 'none';
    if (on && !loaded){
      loaded = true;
      const sp = el('span','spin'); node.append(sp);
      try {
        const full = await get('/series/' + s.id);
        const sets = (full.sets || []).slice().sort(byRelease);
        node.append(el('span','cnt', sets.length + ' Sets'));
        const ul = el('ul','kids');
        for (const st of sets) ul.append(setNode(st, s.id));
        box.append(ul);
      } catch(e){
        box.append(el('div','empty','Sets nicht ladbar (offline?)'));
        loaded = false;
      }
      sp.remove();
      applyFilter();
    }
  };

  if (open.has('s:'+s.id)) queueMicrotask(() => node.click());
  else box.style.display = 'none';

  li._name  = norm(serieName(s) || '');
  li._label = serieName(s) || s.id;
  li._kind  = 'serie';
  li._jump  = () => jumpTo(node);
  return li;
}

/* Ebene 2 — Set */
function setNode(st, serieId){
  const li = el('li','branch');
  const node = el('button','node');
  node.dataset.key = 't:' + st.id;
  node.style.setProperty('--dot', hue(serieId));

  node.append(tw());
  if (st.symbol){
    const img = el('img','logo');
    img.src = st.symbol + '.webp'; img.alt=''; img.loading='lazy';
    img.style.height = '17px'; img.style.maxWidth='17px';
    img.onerror = () => img.remove();
    node.append(img);
  } else node.append(el('span','dot'));

  node.append(el('span','lbl', st.name));

  const cc = st.cardCount || {};
  if (cc.total) node.append(el('span','cnt', cc.official && cc.official !== cc.total
      ? `${cc.official} + ${cc.total - cc.official}`
      : String(cc.total)));

  const box = el('div');
  li.append(node, box);

  let loaded = false;
  node.onclick = async () => {
    const on = node.classList.toggle('on');
    li.classList.toggle('on', on);
    mark('t:'+st.id, on);
    box.style.display = on ? '' : 'none';
    if (on && !loaded){
      loaded = true;
      const sp = el('span','spin'); node.append(sp);
      try {
        const full = await get('/sets/' + st.id);
        /* Liefert die API keine Karten, muss der Index einspringen */
        if (!(full.cards || []).length) await loadIndex().catch(()=>{});
        box.append(cardBlock(full, serieId));
      } catch(e){
        box.append(el('div','empty','Karten nicht ladbar (offline?)'));
        loaded = false;
      }
      sp.remove();
    }
  };

  if (open.has('t:'+st.id)) queueMicrotask(() => node.click());
  else box.style.display = 'none';

  li._name  = norm(st.name || '');
  li._label = st.name || st.id;
  li._kind  = 'set';
  li._jump  = () => jumpTo(node);
  return li;
}

/* Ebene 3 — Kartenblock */
function cardBlock(set, serieId){
  const wrap = el('div','block');
  wrap.style.setProperty('--dot', hue(serieId));
  const cards = set.cards || [];
  const cc = set.cardCount || {};

  const bar = el('div','blockbar');
  bar.append(el('b', null, set.name));
  const bits = [];
  if (cc.official) bits.push(`${cc.official} offiziell`);
  if (cc.total > cc.official) bits.push(`${cc.total - cc.official} geheim`);
  if (set.releaseDate) bits.push(set.releaseDate);
  if (set.abbreviation && set.abbreviation.official) bits.push('Code ' + set.abbreviation.official);
  bar.append(el('span', null, bits.join(' · ')));
  wrap.append(bar);

  if (!cards.length){
    const rows = rowsForSet(set.id);
    if (rows && rows.length){
      bar.append(el('span', null, '· Karten aus der englischen Ausgabe'));
      wrap.append(cardGrid(idx, rows));
      return wrap;
    }
    /* Unterschied deutlich machen: TCGdex kennt das Set und seine Größe,
       hat aber keine einzige Karte erfasst. */
    wrap.append(el('div','empty', cc.official
      ? `TCGdex hat für dieses Set in dieser Sprache keine Karten erfasst — laut Set-Angabe wären es ${cc.official}.`
      : 'Keine Karten in dieser Sprache.'));
    return wrap;
  }
  /* Gespiegelte Sprachen: Hinweis in die Kopfzeile, das Raster bleibt */
  if (langSpiegel[lang]) bar.append(el('span', null, '· Karten aus der englischen Ausgabe'));

  const grid = el('div','grid');
  const liste = cards.map(c => ({
    id: c.id, serieId,
    ref: (() => { const r = rowFor(set.id, c.localId); return r != null ? { d: idx, i: r } : null; })()
  }));
  let k = -1;
  for (const c of cards){
    k++;
    const b = el('button','card');
    const ph = el('div','ph'); ph.dataset.n = c.localId || '';

    /* Bildquelle bevorzugt aus dem Index — der weiß auch von pokemontcg.io.
       Ist er noch nicht geladen, bleibt der alte Weg: eigenes Bild, sonst EN. */
    const row = rowFor(set.id, c.localId);
    let url, kz;
    if (row != null){
      url = cardImage(idx, row, false);
      kz  = fremdsprache(idx.cards[row][3]);
    } else {
      url = c.image ? c.image + '/low.webp'
                    : `https://assets.tcgdex.net/en/${serieId}/${set.id}/${c.localId}/low.webp`;
      kz  = c.image ? null : 'EN';
    }
    if (kz && kz.toLowerCase() === lang) kz = null;

    if (url){
      const img = el('img');
      /* crossOrigin vor src setzen: sonst ist die Antwort opak (status 0) und der
         Service Worker kann sie nicht cachen. Beide CDNs schicken ACAO:*. */
      img.crossOrigin = 'anonymous';
      img.alt = c.name || ''; img.loading = 'lazy'; img.decoding = 'async';
      img.dataset.src = url;
      img.onload = () => {
        img.classList.add('in');
        ph.dataset.n = '';
        if (kz) ph.append(el('span','flag', kz));
      };
      ph.append(img);
      io.observe(img);
    }
    const m = el('div','meta');
    m.append(el('div','nm', c.name || '—'));
    m.append(el('div','no', (c.localId||'') + (cc.official ? ' / ' + cc.official : '')));
    b.append(ph, m);
    const pos = k;
    b.onclick = () => oeffne(liste, pos);
    grid.append(b);
  }
  wrap.append(grid);
  return wrap;
}

/* Bilder erst laden, wenn sie in Sichtweite kommen */
const io = new IntersectionObserver((ents) => {
  for (const e of ents){
    if (!e.isIntersecting) continue;
    const img = e.target;
    io.unobserve(img);
    if (img.dataset.src){ img.src = img.dataset.src; delete img.dataset.src; }
  }
}, { rootMargin: '400px' });

/* ---------- Kartendetail ---------- */
async function detail(id, serieId, idxRef){
  const ov = $('#ov'), sh = $('#sheet');
  sh.innerHTML = '<div class="empty">lädt…</div>';
  ov.classList.add('on');

  let c;
  try { c = await get('/cards/' + id); }
  catch(e){ sh.innerHTML = '<div class="empty">Karte nicht ladbar.</div>'; return; }

  sh.innerHTML = '';
  sh.style.setProperty('--dot', hue(serieId));

  const left = el('div');
  /* Bildquelle kommt aus dem Index, nicht aus c.image — der ist bei Lücken
     null, obwohl es anderswo einen Scan gibt. */
  const src = idxRef ? idxRef.d.cards[idxRef.i][3] : (c.image ? 0 : 3);
  const url = idxRef ? cardImage(idxRef.d, idxRef.i, true)
                     : (c.image ? c.image + '/high.webp' : null);
  if (url){
    const i = el('img','big');
    i.crossOrigin = 'anonymous';
    i.src = url; i.alt = c.name || '';
    /* Ältere TCGdex-Scans liegen teils nur als PNG vor */
    if (url.endsWith('.webp')) i.onerror = () => {
      i.onerror = null; i.src = url.replace(/\.webp$/, '.png');
    };
    left.append(i);
    const kz = fremdsprache(src);
    if (kz && kz.toLowerCase() !== lang){
      left.append(el('div','rar',
        src === 2 ? 'Englischer Scan von pokemontcg.io'
      : src === 4 ? 'Scan aus der japanischen Ausgabe'
      :             'Scan aus der englischen Ausgabe'));
    }
  } else {
    left.append(el('div','empty','Für diese Karte gibt es keinen Scan.'));
  }
  sh.append(left);

  const r = el('div');
  r.append(el('h2', null, c.name || '—'));
  r.append(el('div','rar', [c.rarity, c.category].filter(Boolean).join(' · ')));

  const kv = el('dl','kv');
  const row = (k,v) => { if(v==null||v==='') return; kv.append(el('dt',null,k), el('dd',null,String(v))); };
  row('Set', c.set && c.set.name);
  row('Nummer', c.localId + (c.set && c.set.cardCount ? ' / ' + c.set.cardCount.official : ''));
  row('ID', c.id);
  row('Illustrator', c.illustrator);
  if (c.hp) row('KP', c.hp);
  if (c.types) row('Typ', c.types.join(', '));
  if (c.stage) row('Stufe', c.stage);
  row('Sprache', lang.toUpperCase());
  r.append(kv);

  const vs = c.variants_detailed || [];
  if (vs.length){
    r.append(el('div','rar','Varianten'));
    const box = el('div','vars');
    const hatNormal = vs.some(v => vtype(v) === 'normal');

    for (const v of vs){
      const line = el('div','var');
      /* type allein reicht nicht — erst subtype und stamp trennen
         1. Auflage / schattenlos / unbegrenzt voneinander. */
      const label = [
        v.type,
        v.subtype,
        Array.isArray(v.stamp) ? v.stamp.join(' + ') : v.stamp,
        v.size && v.size !== 'Standard' ? v.size : null
      ].filter(Boolean).join(' · ');
      line.append(el('div','vname', label || '—'));

      const preise = el('div','vprices');
      const cm = marktpreis(v, hatNormal, vs.length === 1);
      const tp = tcgplayer(c, v);

      /* Je Quelle ein Block. Der Zustand steht einmal im Kopf statt in jeder
         Zeile — die Grundlage unterscheidet sich zwischen den Quellen, nicht
         zwischen den Werten einer Quelle. */
      const block = (titel, grundlage, zeilen, hauptpreis, link) => {
        const gefuellt = zeilen.filter(z => z[1] != null);
        if (!gefuellt.length) return;
        const q = el('div','quelle');
        const kopf = el('div','qkopf');
        if (link){
          const a = el('a','qname');
          a.href = link; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = titel;
          a.title = 'Bei ' + titel + ' ansehen';
          kopf.append(a);
        } else {
          kopf.append(el('span','qname', titel));
        }
        kopf.append(el('span','qbasis', grundlage));
        q.append(kopf);
        gefuellt.forEach(([label, wert, fmt], i) => {
          /* Die erste befüllte Zeile ist der Hauptpreis — fehlt der
             30-Tage-Schnitt, rückt automatisch der Trend nach. */
          const z = el('div','preisz' + (hauptpreis && i === 0 ? ' haupt' : ''));
          z.append(el('span','plabel', label));
          z.append(el('b', null, fmt(wert)));
          q.append(z);
        });
        preise.append(q);
      };

      /* Cardmarket-Produktseiten laufen über Slugs aus englischem Set- und
         Kartennamen (…/Singles/Pokemon-GO/Charizard-PGO010) — die lassen sich
         aus unseren Daten nicht bilden. Deshalb ein Suchlink auf den
         Kartennamen. TCGplayer geht direkt über die Produkt-ID. */
      const cmLink = c.name
        ? 'https://www.cardmarket.com/de/Pokemon/Products/Search?searchString='
          + encodeURIComponent(c.name)
        : null;
      const tpLink = tp && tp.productId ? 'https://www.tcgplayer.com/product/' + tp.productId : null;

      const cmZeilen = cm ? [
        ['Ø 30 Tage verkauft',  cm.avg30, euro],
        ['Preistrend',          cm.trend, euro],
        ['Günstigstes Angebot', cm.low,   euro],
      ] : [];
      /* Ohne Cardmarket-Wert übernimmt TCGplayer den Hauptpreis — sonst
         stünde die Karte ganz ohne Leitzahl da. */
      const cmHatWert = cmZeilen.some(z => z[1] != null);

      block('Cardmarket', 'alle Zustände gemischt', cmZeilen, true, cmLink);
      if (tp) block('TCGplayer', 'Near Mint', [
        ['Marktpreis',          tp.marketPrice ?? tp.midPrice, dollar],
        ['Günstigstes Angebot', tp.lowPrice,                   dollar],
      ], !cmHatWert, tpLink);
      if (!preise.children.length) preise.append(el('span','vsub','kein Preis zuordenbar'));

      line.append(preise);
      box.append(line);
    }
    r.append(box);
    r.append(el('div','vsub', 'Cardmarket und TCGplayer, Stand ' + stand(c)
      + ' · Cardmarket bündelt alle Zustände unter einem Produkt'));
  }
  sh.append(r);

  if (blaettern && blaettern.liste.length > 1){
    const mach = (schritt, pfad, klasse, titel) => {
      const b = el('button','iconbtn blaetter ' + klasse);
      b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="${pfad}"/></svg>`;
      b.title = titel;
      b.disabled = schritt < 0 ? blaettern.pos === 0
                                : blaettern.pos === blaettern.liste.length - 1;
      b.onclick = ev => { ev.stopPropagation(); nachbar(schritt); };
      return b;
    };
    sh.append(mach(-1, 'M15 5l-7 7 7 7', 'vor',  'Vorherige Karte (Pfeil links)'));
    sh.append(mach( 1, 'M9 5l7 7-7 7',   'zur',  'Nächste Karte (Pfeil rechts)'));
    sh.append(el('div','zaehler', `${blaettern.pos + 1} / ${blaettern.liste.length}`));
  }

  const x = el('button','iconbtn closeb');
  x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  x.onclick = close;
  sh.append(x);
}
/* ---------- Preise ----------
 *
 * Cardmarket kennt je Produkt nur **zwei** Preissätze: die schlichten Felder
 * und dieselben mit Suffix "-holo". TCGdex reicht für jede Variante dasselbe
 * Objekt durch (gleiche idProduct), die Zuordnung muss also hier passieren —
 * sonst zeigt Reverse Holo den Preis der Normalkarte.
 *
 * Regel: "-holo" gilt für Reverse, und für Holo nur dann, wenn es die Karte
 * auch als Normal gibt. Bei einer reinen Holo-Karte steckt ihr Preis in den
 * schlichten Feldern und "-holo" enthält Datenmüll (Grundset-Glurak:
 * trend 632,84 € gegen trend-holo 123,63 €).
 */

const vtype = v => String(v.type || '').toLowerCase();

/* Auflage einer Variante. "offen" heißt: keine Auflagen-Angabe oder ausdrücklich
   unbegrenzt — nur solche Varianten lassen sich einem Marktpreis zuordnen. */
function auflage(v){
  const st = ((v.subtype || '') + ' ' +
              (Array.isArray(v.stamp) ? v.stamp.join(' ') : v.stamp || '')).toLowerCase().trim();
  return {
    erste: /(^|\D)1\.|1st|first/.test(st),
    offen: !st || /unbegrenzt|unlimited/.test(st),
  };
}

function marktpreis(v, hatNormal, einzige){
  const cm = v.pricing && v.pricing.cardmarket;
  if (!cm) return null;

  /* Cardmarket führt 1. Auflage, schattenlos und unbegrenzt unter **einer**
     Produkt-ID (Neo-Lugia: beide Auflagen idProduct 274409, gleicher Trend).
     Diese Varianten also lieber ohne Preis lassen, als allen denselben Wert
     unterzuschieben. Ist es die einzige Variante, gilt der Preis natürlich. */
  if (!einzige && !auflage(v).offen) return null;

  const t = vtype(v);
  const foil = t === 'reverse' || (t === 'holo' && hatNormal);
  const lies = k => cm[foil ? k + '-holo' : k];

  let out = { trend: lies('trend'), low: lies('low'), avg30: lies('avg30'),
              idProduct: cm.idProduct };
  /* Manche Karten führen die Foil-Felder gar nicht — dann lieber der
     schlichte Wert als ein leerer Strich. */
  if (foil && out.trend == null && out.low == null) {
    out = { trend: cm.trend, low: cm.low, avg30: cm.avg30, idProduct: cm.idProduct };
  }
  if (out.trend == null) out.trend = foil ? cm['avg-holo'] : cm.avg;
  return out;
}

/* TCGplayer ist sauberer modelliert — die Preise stehen dort je Variante unter
   eigenen Schlüsseln (normal, holofoil, reverse-holofoil, 1st-edition …).
   Wichtig: **kein Ausweichen über die Auflagengrenze**. Sonst bekäme die
   1.-Auflage-Variante den Preis der unbegrenzten untergeschoben — derselbe
   Fehler, den die Cardmarket-Zuordnung oben vermeidet. Varianten, die sich
   nicht sauber zuordnen lassen (schattenlos, "Copyright 1999-2000"), bleiben
   lieber ohne Preis. */
function tcgplayer(c, v){
  const tp = (c.pricing || {}).tcgplayer;
  if (!tp) return null;

  const t = vtype(v);
  const { erste, offen } = auflage(v);
  if (!erste && !offen) return null;          // schattenlos & Co. nicht zuordenbar

  const kandidaten =
      t === 'reverse' ? ['reverse-holofoil']
    : t === 'holo'    ? (erste ? ['1st-edition-holofoil'] : ['holofoil','unlimited-holofoil'])
    :                   (erste ? ['1st-edition']          : ['normal','unlimited']);

  for (const k of kandidaten){
    const p = tp[k];
    if (p && (p.marketPrice != null || p.midPrice != null || p.lowPrice != null)) return p;
  }
  return null;
}

const euro   = n => n.toLocaleString('de-DE', { style:'currency', currency:'EUR' });
const dollar = n => n.toLocaleString('de-DE', { style:'currency', currency:'USD' });

function stand(c){
  const u = (((c.pricing || {}).cardmarket) || {}).updated;
  if (!u) return 'unbekannt';
  try { return new Date(u).toLocaleDateString('de-DE'); } catch(e){ return u.slice(0,10); }
}

const close = () => { $('#ov').classList.remove('on'); blaettern = null; };
$('#ov').onclick = e => { if (e.target.id === 'ov') close(); };
addEventListener('keydown', e => {
  if (e.key === 'Escape') return close();
  if (!$('#ov').classList.contains('on')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); nachbar(1); }
  if (e.key === 'ArrowLeft'){  e.preventDefault(); nachbar(-1); }
});

/* ---------- Hilfen ---------- */
function tw(){
  const s = el('span','tw');
  s.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>';
  return s;
}
const byRelease = (a,b) => String(a.releaseDate||'').localeCompare(String(b.releaseDate||'')) || String(a.id).localeCompare(String(b.id));

function mark(key, on){
  on ? open.add(key) : open.delete(key);
  localStorage.setItem('poke.open', JSON.stringify([...open]));
}

function countUp(){
  get('/sets').then(s => {
    const n = s.reduce((a,x) => a + ((x.cardCount||{}).total||0), 0);
    $('#stats').textContent = `${s.length} Sets · ${n.toLocaleString('de-DE')} Karten`;
  }).catch(()=>{});
}

/* Filter blendet Serien/Sets aus, deren Name nicht passt */
function applyFilter(){
  const q = norm($('#q').value.trim());
  for (const li of document.querySelectorAll('.branch')){
    if (!q){ li.style.display=''; continue; }
    const self = (li._name||'').includes(q);
    const kid  = [...li.querySelectorAll('.branch')].some(k => (k._name||'').includes(q));
    li.style.display = (self || kid) ? '' : 'none';
  }
}

/* ================= Einzelkartensuche =================
 *
 * Gegen einen eigenen Index statt gegen die API: TCGdex liefert die
 * Gesamtliste unkomprimiert (1,8 MB für Deutsch), derselbe Bestand kompakt
 * umgeschichtet sind ~126 KB gzip. Gebaut von tools/build-index.py.
 */

/* Diakritika weg, damit "Pokemon" auch "Pokémon" findet */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let idx = null, idxLang = null, idxPromise = null;

function loadIndex(){
  if (idx && idxLang === lang) return Promise.resolve(idx);
  if (idxPromise && idxPromise.lang === lang) return idxPromise.p;

  const want = lang;
  const p = fetch(`index/${want}.json`)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      d.norm = d.cards.map(c => norm(c[2]));   // einmal normalisieren, nicht pro Tastendruck
      if (lang === want){ idx = d; idxLang = want; }
      return d;
    });
  idxPromise = { lang: want, p };
  return p;
}

/* Treffer sortieren: exakt vor Präfix vor Teilstring, dann neuestes Set zuerst */
function rank(d, i, q){
  const n = d.norm[i];
  const s = n === q ? 0 : n.startsWith(q) ? 1 : 2;
  const rel = d.sets[d.cards[i][0]][3] || '';
  return [s, rel];
}

function searchCards(d, raw, cap){
  const q = norm(raw);
  const hits = [];
  for (let i = 0; i < d.norm.length; i++) if (d.norm[i].includes(q)) hits.push(i);
  hits.sort((a,b) => {
    const A = rank(d,a,q), B = rank(d,b,q);
    return A[0] - B[0] || B[1].localeCompare(A[1]);
  });
  return { total: hits.length, shown: hits.slice(0, cap) };
}

const CAP = 300;

function renderResults(d, raw){
  const box = $('#results');
  box.innerHTML = '';

  const { total, shown } = searchCards(d, raw, CAP);

  const bar = el('div','rbar');
  bar.append(el('b', null, total.toLocaleString('de-DE')));
  bar.append(el('span', null, total === 1 ? 'Karte' : 'Karten'
    + (total > shown.length ? ` — die ersten ${shown.length} angezeigt` : '')));
  bar.append(el('span', null, `· Index vom ${d.built}, ${d.count.toLocaleString('de-DE')} Karten`));
  box.append(bar);

  /* Sprungmarken in den Baum. Die Set-Namen kommen aus dem Index, nicht aus
     dem DOM — sonst fände man nur Sets, die zufällig schon aufgeklappt sind. */
  const nq = norm(raw);
  const chips = el('div','chips');

  for (const li of document.querySelectorAll('#tree > .kids > .branch')){
    if (!(li._name||'').includes(nq)) continue;
    chips.append(chip('Serie', li._label, li._jump));
  }
  for (const [setId, setName, serieId] of d.sets){
    if (!norm(setName).includes(nq)) continue;
    chips.append(chip('Set', setName, () => jumpToSet(setId, serieId)));
    if (chips.children.length >= 14) break;
  }
  if (chips.children.length) box.append(chips);

  if (!total){ box.append(el('div','empty','Keine Karte mit diesem Namen.')); return; }
  box.append(cardGrid(d, shown));
}

/* Bildquelle steht im Index (siehe tools/build-index.py):
   0 eigene Sprache · 1 englischer Scan · 2 pokemontcg.io · 3 keins.
   Dadurch muss hier nichts mehr geraten und kein Request ins Leere laufen. */
function cardImage(d, i, gross){
  const [si, localId, , src] = d.cards[i];
  const [setId, , serieId, , , ptcgId] = d.sets[si];
  const q = gross ? 'high' : 'low';
  const tcg = l => `https://assets.tcgdex.net/${l}/${serieId}/${setId}/${localId}/${q}.webp`;
  if (src === 0 && serieId) return tcg(lang);
  if (src === 1 && serieId) return tcg('en');
  if (src === 4 && serieId) return tcg('ja');
  if (src === 2 && ptcgId)  return `https://images.pokemontcg.io/${ptcgId}/${localId}${gross ? '_hires' : ''}.png`;
  return null;
}

/* Kürzel für die Ecke der Kachel: aus welcher Ausgabe stammt der Scan? */
const fremdsprache = src => src === 4 ? 'JA' : src > 0 ? 'EN' : null;

/* Zeilennummer im Index zu einer Karten-ID. Der Sets-Tab baut seine Karten aus
   der API und kennt die Bildquelle nicht — hier holt er sie sich. */
let rowMap = null, setRows = null, rowMapKey = '';

function baueRowMap(){
  if (!idx || idxLang !== lang) return false;
  const key = lang + ':' + idx.count;
  if (rowMapKey !== key){
    rowMap = new Map(); setRows = new Map();
    for (let i = 0; i < idx.cards.length; i++){
      const [si, lid] = idx.cards[i];
      const sid = idx.sets[si][0];
      rowMap.set(sid + ' ' + lid, i);
      if (!setRows.has(sid)) setRows.set(sid, []);
      setRows.get(sid).push(i);
    }
    rowMapKey = key;
  }
  return true;
}

function rowFor(setId, localId){
  if (!baueRowMap()) return null;
  const i = rowMap.get(setId + ' ' + localId);
  return i == null ? null : i;
}

/* Alle Index-Zeilen eines Sets — gebraucht, wenn die API für das Set nichts
   liefert (nl, pl, ru), der Index es aber aus dem Englischen gespiegelt hat. */
function rowsForSet(setId){
  if (!baueRowMap()) return null;
  return setRows.get(setId) || null;
}

/* Kartenraster aus Index-Zeilen — von der Suche und vom Pokédex genutzt */
function cardGrid(d, rows){
  const grid = el('div','grid');
  /* Reihenfolge der angezeigten Karten festhalten, damit man im Detail mit
     den Pfeiltasten durch genau diese Liste blättern kann. */
  const liste = rows.map(i => {
    const [si, localId] = d.cards[i];
    const [setId, , serieId] = d.sets[si];
    return { id: `${setId}-${localId}`, serieId, ref: { d, i } };
  });
  let k = -1;
  for (const i of rows){
    k++;
    const [si, localId, name, src] = d.cards[i];
    const [setId, setName, serieId] = d.sets[si];

    const b = el('button','card');
    b.style.setProperty('--dot', hue(serieId));
    const ph = el('div','ph'); ph.dataset.n = localId;

    const url = cardImage(d, i, false);
    if (url){
      const img = el('img');
      img.crossOrigin = 'anonymous';
      img.alt = name; img.loading = 'lazy'; img.decoding = 'async';
      img.dataset.src = url;
      img.onload = () => {
        img.classList.add('in');
        ph.dataset.n = '';
        /* Fremde Ausgabe ehrlich kennzeichnen */
        const kz = fremdsprache(src);
        if (kz && kz.toLowerCase() !== lang) ph.append(el('span','flag', kz));
      };
      ph.append(img);
      io.observe(img);
    }

    const m = el('div','meta');
    m.append(el('div','nm', name));
    m.append(el('div','set', setName));
    m.append(el('div','no', localId));
    b.append(ph, m);
    const pos = k;
    b.onclick = () => oeffne(liste, pos);
    grid.append(b);
  }
  return grid;
}

/* ---------- Blättern im Detail ---------- */
let blaettern = null;

function oeffne(liste, pos){
  blaettern = { liste, pos };
  const it = liste[pos];
  detail(it.id, it.serieId, it.ref);
}

function nachbar(schritt){
  if (!blaettern) return;
  const p = blaettern.pos + schritt;
  if (p < 0 || p >= blaettern.liste.length) return;
  oeffne(blaettern.liste, p);
}

/* ================= Pokédex =================
 *
 * Species, Namen und Evolutionsketten kommen aus PokéAPI, vorgebacken von
 * tools/build-pokedex.py. Die Karten dazu kommen aus demselben Suchindex wie
 * die Volltextsuche — nur mit einer strengeren Zuordnung, siehe unten.
 */

/* Die kleinen Sprites sind nur 96×96 und werden groß matschig. "home" ist
   512×512 und lückenlos vorhanden — dafür rund 120 KB statt 1,3 KB, was
   Lazy Loading und ein eigener Cache-Deckel im Worker auffangen. */
/* Mega-Entwicklung und Gigadynamax sind keine Entwicklungen — sie halten nur
   im Kampf und fallen danach zurück. Deshalb stehen sie als Sonderformen neben
   der Kette, nicht darin. Die Begriffe sind Markennamen; nur Deutsch weicht ab
   (Gigadynamax statt Gigantamax). */
const FORMNAME = {
  de: { 'mega':'Mega', 'mega-x':'Mega X', 'mega-y':'Mega Y', 'gmax':'Gigadynamax' },
  en: { 'mega':'Mega', 'mega-x':'Mega X', 'mega-y':'Mega Y', 'gmax':'Gigantamax' },
};
const formLabel = slug => (FORMNAME[lang] || FORMNAME.en)[slug] || FORMNAME.en[slug] || slug;

/* Welche Karten zeigen diese Form? Nur über den Kartennamen — die Karten
   tragen keine Formangabe. Muster: "Glurak VMAX" für Gigadynamax,
   "M-Glurak EX" und "Mega-Glurak X-ex" für Mega.

   Bei Arten mit X- und Y-Form wird ein **ausdrückliches** Kennzeichen
   verlangt: "M-Glurak EX" heißt für beide Formen gleich und lässt sich nicht
   zuordnen. Solche Karten bleiben lieber ohne Form, als bei der falschen zu
   landen — sie stehen weiter in der ungefilterten Liste. */
function formTrifft(slug, name){
  if (slug === 'gmax') return /vmax/.test(name);
  if (!/(^|\s)m[- ]|mega/.test(name)) return false;
  if (slug === 'mega-x') return /[-\s]x([-\s]|$)/.test(name);
  if (slug === 'mega-y') return /[-\s]y([-\s]|$)/.test(name);
  return true;
}

const SPRITE      = d => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${d}.png`;
const SPRITE_MINI = d => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${d}.png`;

let dex = null, dexLang = null, dexPromise = null;

function loadDex(){
  if (dex && dexLang === lang) return Promise.resolve(dex);
  if (dexPromise && dexPromise.lang === lang) return dexPromise.p;

  const want = lang;
  const p = fetch(`pokedex/${want}.json`)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      d.byDex = new Map(d.species.map(s => [s[0], s]));
      d.chains = new Map();
      for (const s of d.species){
        if (!d.chains.has(s[2])) d.chains.set(s[2], []);
        d.chains.get(s[2]).push(s);
      }
      if (dexLang !== want || !dex){ dex = d; dexLang = want; }
      return d;
    });
  dexPromise = { lang: want, p };
  return p;
}

/* Kartenname -> Species.
 *
 * Reine Teilstringsuche taugt hier nicht: "Mew" steckt in "Mewtu",
 * "Porygon" in "Porygon-Z". Deshalb wortweise, und der längste Treffer
 * gewinnt — "Porygon-Z" schlägt "Porygon", "Mewtu" schlägt "Mew".
 * "Mega-Glurak" und "Glurak-ex" landen beide korrekt bei Glurak.
 */
const TOKEN = /[^\p{L}\p{N}♀♂]+/u;
const tokens = s => s.split(TOKEN).filter(Boolean);

let owner = null, ownerKey = '';

/* Ergebnis: Map dexId -> Kartenindizes. Eine Karte darf bei mehreren Pokémon
   auftauchen — "Reshiram & Glurak GX" gehört zu beiden. */
function buildOwners(cardIdx, dexIdx){
  const key = lang + ':' + cardIdx.count + ':' + dexIdx.count;
  if (owner && ownerKey === key) return owner;

  const byName = new Map();
  for (const s of dexIdx.species) byName.set(norm(s[1]), s[0]);

  /* Für Sprachen ohne Wortgrenzen (ja, zh, ko) greift die Wortsuche nicht:
     "リザードンex" ist ein einziges Token. Dafür ein Präfix-Fallback, nach
     Anfangszeichen gebündelt, damit nicht 1025 Namen pro Karte geprüft werden. */
  const buckets = new Map();
  for (const [n, d] of byName){
    const k = n.slice(0, 2);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push([n, d]);
  }
  for (const list of buckets.values()) list.sort((a,b) => b[0].length - a[0].length);

  const out = new Map();
  const add = (d, i) => {
    let a = out.get(d);
    if (!a) out.set(d, a = []);
    if (a[a.length-1] !== i) a.push(i);
  };

  for (let i = 0; i < cardIdx.norm.length; i++){
    const n = cardIdx.norm[i];
    const tk = tokens(n);
    let traf = false;

    /* Je Wortposition gewinnt der längste Treffer — sonst würde
       "Porygon-Z" auch unter Porygon landen. Über die Positionen hinweg
       zählen dagegen alle Treffer, damit Doppelkarten beide erwischen. */
    for (let t = 0; t < tk.length; t++){
      const pair = t + 1 < tk.length ? tk[t] + '-' + tk[t+1] : null;   // Porygon-Z, Ho-Oh
      const d = (pair && byName.get(pair)) || byName.get(tk[t]);
      if (d){ add(d, i); traf = true; }
    }

    if (!traf){
      for (const [nm, d] of (buckets.get(n.slice(0,2)) || [])){
        if (n.startsWith(nm)){ add(d, i); break; }   // Liste ist nach Länge sortiert
      }
    }
  }

  owner = out; ownerKey = key;
  return out;
}

/* ---------- Kettenübersicht ---------- */
function renderDex(filter){
  const box = $('#dex');
  box.innerHTML = '';
  const d = dex;
  const nq = norm(filter || '');

  const bar = el('div','rbar');
  const wrap = el('div','chains');

  let mons = 0, ketten = 0;
  const blocks = [];
  for (const [chainId, list] of d.chains){
    const hit = !nq || list.some(s => norm(s[1]).includes(nq));
    if (!hit) continue;
    blocks.push(chainBlock(list));
    ketten++; mons += list.length;
  }

  bar.append(el('b', null, mons.toLocaleString('de-DE')));
  bar.append(el('span', null, `Pokémon in ${ketten} `
    + (ketten === 1 ? 'Entwicklungsreihe' : 'Entwicklungsreihen')));
  bar.append(el('span', null, `· Pokédex vom ${d.built}`));
  box.append(bar);

  if (langSpiegel[lang]){
    box.append(el('div','empty',
      'Für diese Sprache hat TCGdex keine eigenen Kartendaten. Gezeigt werden '
      + 'die Karten der englischen Ausgabe derselben Sets — Namen und Scans sind '
      + 'deshalb englisch.'));
  } else if (langMeta[lang] === 0){
    box.append(el('div','empty',
      'Für diese Sprache hat TCGdex keine Karten erfasst.'));
  }

  if (!ketten){ box.append(el('div','empty','Kein Pokémon mit diesem Namen.')); return; }
  box.append(wrap);
  masonry(wrap, blocks);
  fillCounts(wrap, true);
}

/* Blöcke auf Spalten verteilen — jeder in die gerade kürzeste.
   Die Kachelmaße stehen per CSS fest, deshalb ist offsetHeight schon vor dem
   Laden der Bilder verlässlich. */
const COL_GAP = 12;
/* Auf dem Handy sollen zwei Spalten passen, auf großen Schirmen sollen die
   Kacheln nicht zu schmal werden. */
const colMin = () => innerWidth <= 640 ? 150 : 260;
const colCount = w => Math.max(1, Math.floor((w + COL_GAP) / (colMin() + COL_GAP)));

let masonryOf = null;

function masonry(wrap, blocks){
  masonryOf = { wrap, blocks };
  const n = colCount(wrap.clientWidth);

  wrap.innerHTML = '';
  const cols = [], h = new Array(n).fill(0);
  for (let i = 0; i < n; i++){ const c = el('div','col'); cols.push(c); wrap.append(c); }

  for (const b of blocks){
    let k = 0;
    for (let i = 1; i < n; i++) if (h[i] < h[k]) k = i;
    cols[k].append(b);
    h[k] += b.offsetHeight + COL_GAP;
  }
  wrap.dataset.cols  = n;
  wrap.dataset.klein = innerWidth <= 640 ? '1' : '0';
}

let reflow;
addEventListener('resize', () => {
  clearTimeout(reflow);
  reflow = setTimeout(() => {
    if (!masonryOf || !masonryOf.wrap.isConnected) return;
    const n = colCount(masonryOf.wrap.clientWidth);
    /* Über den Handy-Breakpoint ändern sich auch die Kachelmaße — dann neu
       vermessen, selbst wenn die Spaltenzahl gleich bleibt. */
    const klein = innerWidth <= 640 ? '1' : '0';
    if (String(n) !== masonryOf.wrap.dataset.cols || klein !== masonryOf.wrap.dataset.klein){
      masonry(masonryOf.wrap, masonryOf.blocks);
    }
  }, 180);
});

/* Eine Entwicklungsreihe: Grundform, dann die Zweige daneben.
   Evoli hat acht davon, deshalb Zweige untereinander statt nebeneinander. */
/* Dex-Nummern folgen nicht der Entwicklung: Pichu ist #172, kommt aber vor
   Pikachu #25. Also entlang der Vorentwicklung sortieren, nicht nach Nummer. */
function orderChain(list){
  const kids = p => list.filter(s => s[3] === p);
  const out = [];
  const walk = s => { out.push(s); for (const k of kids(s[0])) walk(k); };
  for (const r of list.filter(s => !s[3] || !list.some(x => x[0] === s[3]))) walk(r);
  for (const s of list) if (!out.includes(s)) out.push(s);   // Sicherheitsnetz
  return out;
}

/* Abstand einer Art zur Grundform innerhalb ihrer Kette */
function depthOf(s, list){
  let d = 0, cur = s;
  const seen = new Set();
  while (cur && cur[3] && !seen.has(cur[0])){
    seen.add(cur[0]);
    const p = list.find(x => x[0] === cur[3]);
    if (!p) break;
    cur = p; d++;
  }
  return d;
}

function chainBlock(list){
  const box = el('div','chain');

  /* Nach Stufe gruppieren statt den Baum zu verschachteln: dadurch stehen
     Verzweigungen nebeneinander in einer Zeile, und nichts bricht schief um. */
  const rows = new Map();
  for (const s of list){
    const d = depthOf(s, list);
    if (!rows.has(d)) rows.set(d, []);
    rows.get(d).push(s);
  }

  const stufen = [...rows.keys()].sort((a,b) => a - b);
  stufen.forEach((d, i) => {
    if (i) box.append(el('div','down','↓'));
    const row = el('div','rank');
    for (const s of rows.get(d).sort((a,b) => a[0] - b[0])) row.append(monTile(s));
    box.append(row);
  });

  return box;
}

function monTile(s, self){
  const [dexId, name] = s;
  const b = el('button','mon' + (self ? ' self' : ''));
  const img = el('img');
  img.crossOrigin = 'anonymous';
  img.alt = name; img.loading = 'lazy'; img.decoding = 'async';
  img.dataset.src = SPRITE(dexId);
  img.onload = () => img.classList.add('in');
  img.onerror = () => {
    if (img.dataset.tried) return;
    img.dataset.tried = '1';
    img.src = SPRITE_MINI(dexId);
  };
  io.observe(img);
  const t = el('div','t');
  t.append(el('div','n', name));
  t.append(el('div','d', '#' + String(dexId).padStart(4,'0')));
  t.append(el('span','pill laedt','·'));   // Platzhalter, gefüllt von fillCounts()
  b.append(img, t);
  b.dataset.dex = dexId;
  b.onclick = () => showSpecies(dexId);
  return b;
}

/* Kartenzahlen nachtragen. Bewusst getrennt vom Aufbau: der Pokédex ist 25 KB
   und sofort da, der Kartenindex 460 KB — die Übersicht soll nicht darauf warten. */
async function fillCounts(root, bilanz){
  let ci;
  try { ci = await loadIndex(); } catch(e){ return; }
  if (!root.isConnected) return;

  const m = buildOwners(ci, dex);
  let leer = 0;
  for (const b of root.querySelectorAll('[data-dex]')){
    const p = b.querySelector('.pill');
    if (!p) continue;
    const n = (m.get(+b.dataset.dex) || []).length;
    p.textContent = n === 0 ? 'keine Karte' : n === 1 ? '1 Karte' : `${n} Karten`;
    p.classList.remove('laedt');
    p.classList.toggle('leer', n === 0);
    b.classList.toggle('leer', n === 0);
    if (!n) leer++;
  }

  /* In Sprachen mit wenigen Sets fehlen die meisten Pokémon — das gehört
     in die Kopfzeile, nicht nur in die einzelnen Kacheln. */
  const bar = $('#dex .rbar');
  if (bilanz && bar && leer){
    bar.querySelectorAll('.luecke').forEach(e => e.remove());
    bar.append(el('span','luecke', `· ${leer.toLocaleString('de-DE')} davon ohne Karte in dieser Sprache`));
  }
}

/* Jede Navigation im Pokédex zieht eine neue Nummer. Späte Antworten einer
   überholten Navigation dürfen die Ansicht nicht mehr überschreiben — sonst
   klappt einem die Übersicht über die gerade geöffnete Karte. */
let dexToken = 0;

/* Wo steckt der Pokédex gerade? Wird für den Sprachwechsel gebraucht — die
   Species-IDs sind sprachübergreifend gleich, man kann also an Ort und Stelle
   bleiben. Und für die Scrollposition beim Zurückgehen. */
let dexRoute  = { art: 'uebersicht' };
let dexScroll = 0;

function dexOverview(zurueck){
  const my = ++dexToken;
  dexRoute = { art: 'uebersicht' };
  setView('dex');
  $('#dex').innerHTML = '<div class="empty">Pokédex wird geladen…</div>';
  return loadDex()
    .then(() => {
      if (my !== dexToken) return;
      renderDex($('#q').value.trim());
      /* Erst nach dem Verteilen auf die Spalten steht die Höhe fest */
      if (zurueck && dexScroll) requestAnimationFrame(() => {
        if (my === dexToken) $('#stage').scrollTop = dexScroll;
      });
    })
    .catch(() => { if (my === dexToken) $('#dex').innerHTML = '<div class="empty">Pokédex nicht ladbar.</div>'; });
}

/* ---------- Alle Karten eines Pokémon ---------- */
async function showSpecies(dexId, scrollTo){
  const my = ++dexToken;
  /* Nur beim Verlassen der Übersicht merken — sonst überschriebe ein Klick
     innerhalb der Entwicklungsreihe die Position, zu der man zurück will. */
  if (dexRoute.art === 'uebersicht') dexScroll = $('#stage').scrollTop;
  dexRoute = { art: 'species', dex: dexId };

  const box = $('#dex');
  box.innerHTML = '<div class="empty">lädt…</div>';
  setView('dex');
  $('#stage').scrollTop = 0;

  /* Beides laden: nach einem Sprachwechsel ist der Pokédex noch leer, weil
     showSpecies dann direkt aufgerufen wird statt über die Übersicht. */
  let ci;
  try { [ci] = await Promise.all([loadIndex(), loadDex()]); }
  catch(e){ if (my === dexToken) box.innerHTML = '<div class="empty">Daten nicht ladbar.</div>'; return; }
  if (my !== dexToken) return;

  const s = dex.byDex.get(dexId);
  if (!s){ box.innerHTML = '<div class="empty">Unbekanntes Pokémon.</div>'; return; }

  const rows = (buildOwners(ci, dex).get(dexId) || []).slice();
  rows.sort((a,b) => (ci.sets[ci.cards[b][0]][3]||'').localeCompare(ci.sets[ci.cards[a][0]][3]||''));

  box.innerHTML = '';

  const back = el('button','back','← Alle Pokémon');
  back.onclick = () => { $('#q').value = ''; dexOverview(true); };
  box.append(back);

  const bar = el('div','sbar');
  const img = el('img'); img.crossOrigin='anonymous'; img.src = SPRITE(dexId); img.alt = s[1];
  bar.append(img);
  const t = el('div');
  t.append(el('h2', null, s[1]));
  t.append(el('div','d', `#${String(dexId).padStart(4,'0')} · Generation ${s[4]} · `
    + `${rows.length} ${rows.length === 1 ? 'Karte' : 'Karten'}`));
  bar.append(t);
  box.append(bar);

  /* Die ganze Reihe zum Weiterklicken */
  const list = orderChain(dex.chains.get(s[2]) || []);
  if (list.length > 1){
    const line = el('div','line');
    for (let i = 0; i < list.length; i++){
      if (i) line.append(el('span','arrow','→'));
      line.append(monTile(list[i], list[i][0] === dexId));
    }
    box.append(line);
    fillCounts(line);
  }

  /* Sonderformen: Mega und Gigadynamax stehen neben der Kette, nicht darin.
     Ein Klick filtert die Kartenliste auf die passenden Karten. */
  const formen = s[5] || [];
  let filter = null;
  const gitter = el('div');

  const zeichneKarten = () => {
    gitter.innerHTML = '';
    const sicht = filter
      ? rows.filter(i => formTrifft(filter, ci.norm[i]))
      : rows;
    if (!sicht.length){
      gitter.append(el('div','empty', filter
        ? 'Keine Karte zu dieser Form gefunden.'
        : 'Keine Karte zu diesem Pokémon im Index.'));
      return;
    }
    gitter.append(cardGrid(ci, sicht.slice(0, 400)));
    if (sicht.length > 400) gitter.append(el('div','empty', `… und ${sicht.length-400} weitere.`));
  };

  if (formen.length){
    const reihe = el('div','line formen');
    reihe.append(el('span','formlabel', 'Sonderformen'));
    const knoepfe = [];
    for (const [pid, slug] of formen){
      const b = el('button','mon form');
      const img = el('img');
      img.crossOrigin = 'anonymous'; img.alt = formLabel(slug);
      img.loading = 'lazy'; img.decoding = 'async';
      img.dataset.src = SPRITE(pid);
      img.onload = () => img.classList.add('in');
      io.observe(img);
      const t = el('div','t');
      t.append(el('div','n', formLabel(slug)));
      const n = rows.filter(i => formTrifft(slug, ci.norm[i])).length;
      t.append(el('span','pill' + (n ? '' : ' leer'),
        n === 0 ? 'keine Karte' : n === 1 ? '1 Karte' : `${n} Karten`));
      b.append(img, t);
      b.onclick = () => {
        filter = filter === slug ? null : slug;
        for (const k of knoepfe) k.el.classList.toggle('self', k.slug === filter);
        zeichneKarten();
      };
      knoepfe.push({ el: b, slug });
      reihe.append(b);
    }
    box.append(reihe);
  }

  zeichneKarten();
  box.append(gitter);

  /* Erst jetzt steht die Höhe — vorher liefe die Position ins Leere. */
  if (scrollTo) requestAnimationFrame(() => {
    if (my === dexToken) $('#stage').scrollTop = scrollTo;
  });
}

/* ---------- Ansichtswechsel ---------- */
let view = localStorage.getItem('poke.view') || 'sets';

function setView(v){
  view = v;
  localStorage.setItem('poke.view', v);
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t.dataset.view === v);
  const searching = $('#q').value.trim().length >= 2 && v === 'sets';
  $('#tree').classList.toggle('hide', v !== 'sets' || searching);
  $('#dex').classList.toggle('on', v === 'dex');
  $('#results').classList.toggle('on', searching);
  $('#q').placeholder = v === 'dex' ? 'Pokémon…' : 'Karte, Serie oder Set…';
}

for (const t of document.querySelectorAll('.tab')){
  t.onclick = async () => {
    const v = t.dataset.view;
    $('#q').value = '';
    setView(v);
    if (v === 'dex') dexOverview();
    else onSearch();
  };
}

let tmr = 0;
function onSearch(){
  clearTimeout(tmr);
  tmr = setTimeout(async () => {
    const raw = $('#q').value.trim();

    /* Im Pokédex filtert das Feld die Entwicklungsreihen, nicht die Karten */
    if (view === 'dex'){
      if (dex) renderDex(raw);
      return;
    }

    applyFilter();

    const on = raw.length >= 2;
    $('#tree').classList.toggle('hide', on);
    $('#results').classList.toggle('on', on);
    if (!on) return;

    $('#results').innerHTML = '<div class="empty">Index wird geladen…</div>';
    try {
      const d = await loadIndex();
      if ($('#q').value.trim() !== raw) return;      // schon weitergetippt
      if (!d.count){
        $('#results').innerHTML = '<div class="empty">Für diese Sprache liegen keine Kartendaten vor.</div>';
        return;
      }
      renderResults(d, raw);
    } catch(e){
      $('#results').innerHTML = '<div class="empty">Suchindex nicht ladbar.</div>';
    }
  }, 130);
}
$('#q').oninput = onSearch;

function chip(kind, label, fn){
  const c = el('button','chip');
  c.append(el('span','k', kind));
  c.append(document.createTextNode(label));
  c.onclick = fn;
  return c;
}

/* Suche verlassen und einen bereits vorhandenen Knoten ansteuern */
function jumpTo(node){
  $('#q').value = '';
  onSearch();
  setTimeout(() => {
    if (!node.classList.contains('on')) node.click();
    node.scrollIntoView({ block:'center', behavior:'smooth' });
  }, 180);
}

/* Sprung zu einem Set, das im Baum noch gar nicht existiert: Aufklapp-Zustand
   setzen und neu aufbauen — die Wiederherstellung aus dem Zustand erledigt
   das verschachtelte Aufklappen dann von selbst. */
function jumpToSet(setId, serieId){
  if (serieId) open.add('s:' + serieId);
  open.add('t:' + setId);
  localStorage.setItem('poke.open', JSON.stringify([...open]));

  $('#q').value = '';
  onSearch();
  build().then(() => {
    let tries = 0;
    const look = setInterval(() => {
      const n = document.querySelector(`[data-key="t:${CSS.escape(setId)}"]`);
      if (n){ clearInterval(look); n.scrollIntoView({ block:'center', behavior:'smooth' }); }
      else if (++tries > 25) clearInterval(look);
    }, 120);
  });
}

/* Sprache */
const sel = $('#lang');
for (const [c,n] of LANGS){
  const o = el('option', null, n); o.value = c; sel.append(o);
}
sel.value = lang;

/* Niederländisch, Polnisch und Russisch haben bei TCGdex keine eigenen
   Kartendaten — dort wird die englische Ausgabe derselben Sets gespiegelt.
   Das gehört in die Auswahl, sonst wundert man sich über englische Namen. */
let langMeta = {}, langSpiegel = {};
fetch('index/meta.json')
  .then(r => r.ok ? r.json() : null)
  .then(m => {
    if (!m) return;
    langMeta    = m.counts || {};
    langSpiegel = m.gespiegelt || {};
    for (const o of sel.options){
      /* Der Hinweis steht in der Ansicht selbst — in der Auswahl macht er
         die Einträge nur breit. */
      if (langSpiegel[o.value]) continue;
      if (langMeta[o.value] === 0) o.textContent += ' — keine Kartendaten';
    }
  })
  .catch(()=>{});
sel.onchange = () => {
  lang = sel.value;
  localStorage.setItem('poke.lang', lang);
  document.documentElement.lang = lang;
  idx = idxLang = idxPromise = null;   // Suchindex gilt je Sprache
  dex = dexLang = dexPromise = null;   // Pokédex ebenso
  owner = null; ownerKey = '';
  /* Position halten. Set-, Serien- und Species-IDs sind sprachübergreifend
     gleich, deshalb lässt sich die Stelle wiederherstellen; nur die Namen
     wechseln. Klappt das nicht, landet man auf der jeweiligen Übersicht. */
  const stand = $('#stage').scrollTop;
  build();   // Aufklapp-Zustand überlebt, er hängt an den IDs

  if (view === 'dex'){
    if (dexRoute.art === 'species') showSpecies(dexRoute.dex, stand);
    else { dexScroll = stand; dexOverview(true); }
  } else {
    if ($('#q').value.trim().length >= 2) onSearch();
    /* Der Baum klappt sich erst nach und nach wieder auf, deshalb mehrfach
       nachziehen statt einmal zu raten. */
    [120, 500, 1100].forEach(t => setTimeout(() => { $('#stage').scrollTop = stand; }, t));
  }
};

/* Online-Status */
const netz = () => status(navigator.onLine ? 'online' : 'offline — Cache', !navigator.onLine);
addEventListener('online', netz); addEventListener('offline', netz);

/* Service Worker */
if ('serviceWorker' in navigator){
  addEventListener('load', async () => {
    try {
      await navigator.serviceWorker.register('sw.js');

      /* Beim allerersten Laden läuft der Serien-Request am Worker vorbei — er
         übernimmt die Kontrolle erst danach. `ready` reicht als Signal nicht:
         es löst schon aus, bevor clients.claim() greift. Also auf den
         Controller warten, sonst fehlt ausgerechnet die Wurzel offline. */
      if (!navigator.serviceWorker.controller){
        await new Promise(res => {
          navigator.serviceWorker.addEventListener('controllerchange', res, { once:true });
          setTimeout(res, 4000);
        });
      }
      for (const p of ['/series', '/sets']) fetch(`${API}/${lang}${p}`).catch(()=>{});

      /* Suchindex im Hintergrund vorladen: die Suche ist damit beim ersten
         Tippen sofort da, und der Sets-Tab kennt die Bildquellen. ~126 KB gzip. */
      const idle = self.requestIdleCallback || (f => setTimeout(f, 1200));
      idle(() => loadIndex().catch(()=>{}));
    } catch {}
  });
}

document.documentElement.lang = lang;
setView(view);
build();
if (view === 'dex') dexOverview();
</script>
</body>
</html>
