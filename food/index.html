<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rezepte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf6ef; --paper: #fff; --ink: #2a2420; --muted: #7a6f66; --line: #ece4d8;
  --a1: #8a6a4a; --a2: #d9b98a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 Inter, system-ui, sans-serif; }
a { color: inherit; }
.top { max-width: 1100px; margin: 0 auto; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { font: 700 22px Fraunces, serif; text-decoration: none; letter-spacing: -.01em; }
.brand span { color: var(--a1); }
.top nav a { text-decoration: none; color: var(--muted); font-size: 14px; }

/* Hero */
.hero { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.hero-card { position: relative; border-radius: 28px; overflow: hidden; min-height: 380px;
  background: radial-gradient(circle at 78% 40%, var(--a2), var(--a1) 70%); color: #fff;
  display: grid; grid-template-columns: 1.2fr 1fr; align-items: center; }
.hero-card::after { content: ''; position: absolute; inset: 0;
  background: repeating-radial-gradient(circle at 78% 40%, rgba(255,255,255,.06) 0 2px, transparent 2px 22px); pointer-events: none; }
.hero-text { padding: 48px; position: relative; z-index: 1; }
.kicker { text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 600; opacity: .85; }
h1 { font: 700 clamp(34px, 5vw, 58px)/1.05 Fraunces, serif; margin: 12px 0 16px; letter-spacing: -.02em; }
.teaser { font-size: 18px; opacity: .92; max-width: 34em; margin: 0; }
.hero-emoji { font-size: clamp(120px, 18vw, 220px); text-align: center; position: relative; z-index: 1;
  filter: drop-shadow(0 20px 30px rgba(0,0,0,.25)); animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px) rotate(-3deg); } }
.facts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.fact { background: rgba(255,255,255,.18); backdrop-filter: blur(4px); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; }

/* Inhalt */
.body { max-width: 1100px; margin: 40px auto 80px; padding: 0 20px; display: grid; grid-template-columns: 340px 1fr; gap: 40px; align-items: start; }
.panel { background: var(--paper); border-radius: 22px; padding: 26px; box-shadow: 0 1px 0 var(--line), 0 12px 30px -18px rgba(60,40,20,.25); }
.zutaten { position: sticky; top: 20px; }
h2 { font: 700 26px Fraunces, serif; margin: 0 0 4px; letter-spacing: -.01em; }
h3 { font: 600 12px Inter; text-transform: uppercase; letter-spacing: .12em; color: var(--a1); margin: 22px 0 8px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; margin: 10px 0 6px; background: color-mix(in srgb, var(--a2) 22%, #fff); border-radius: 999px; padding: 4px; }
.stepper button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--paper); color: var(--a1); font: 600 20px/1 Inter; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper span { min-width: 110px; text-align: center; font-weight: 600; font-size: 14px; padding: 0 6px; }
.zl { list-style: none; margin: 0; padding: 0; }
.zl li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); cursor: pointer; user-select: none; transition: opacity .2s; }
.zl li:last-child { border-bottom: 0; }
.ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
  background: color-mix(in srgb, var(--a2) 28%, #fff); transition: transform .2s; }
.zl li:hover .ico { transform: scale(1.08) rotate(-4deg); }
.menge { font-weight: 600; display: block; font-size: 13px; color: var(--a1); line-height: 1.2; }
.zl li.ok { opacity: .38; }
.zl li.ok .name { text-decoration: line-through; }
.zl li.ok .ico { background: #e7f3e2; }

.abschnitt + .abschnitt { margin-top: 34px; }
.steps { list-style: none; margin: 16px 0 0; padding: 0; counter-reset: s; }
.step { position: relative; display: grid; grid-template-columns: 58px 1fr; gap: 18px; padding: 0 0 26px; cursor: pointer; }
.num { width: 58px; height: 58px; display: grid; place-items: center; font-size: 36px; transition: opacity .25s; }
.num b { display: none; }
.step:not(:last-child)::before { content: ''; position: absolute; left: 28px; top: 62px; bottom: 6px; width: 2px; border-radius: 2px; background: color-mix(in srgb, var(--a2) 45%, #fff); }
.step h4 { margin: 4px 0 4px; font: 600 18px Fraunces, serif; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.zeit { font: 500 12px Inter; background: color-mix(in srgb, var(--a2) 30%, #fff); color: var(--a1); border-radius: 999px; padding: 3px 10px; }
.step p { margin: 0; color: #4a413a; }
.step.ok .num { opacity: .35; filter: grayscale(1); }
.step.ok p, .step.ok h4 { opacity: .45; }
.step a { color: var(--a1); font-weight: 600; }

.tipps { margin-top: 30px; background: color-mix(in srgb, var(--a2) 22%, #fff); border-radius: 22px; padding: 24px 26px; }
.tipps h2 { font-size: 22px; }
.tipps ul { margin: 10px 0 0; padding: 0; list-style: none; }
.tipps li { padding: 6px 0 6px 30px; position: relative; }
.tipps li::before { content: '💡'; position: absolute; left: 0; }

.mehr { max-width: 1100px; margin: 0 auto 60px; padding: 0 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
.tile { text-decoration: none; background: var(--paper); border-radius: 22px; overflow: hidden; box-shadow: 0 12px 30px -20px rgba(60,40,20,.35); transition: transform .2s; display: block; }
.tile:hover { transform: translateY(-4px); }
.tile .pic { position: relative; height: 150px; display: grid; place-items: center; font-size: 76px; }
.tile .txt { padding: 14px 18px 18px; }
.tile .pic img { width: 118px !important; height: 118px !important; }
.tile .pill { position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,.92); color: var(--ink); font: 600 12px Inter; border-radius: 999px; padding: 4px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.tile .kicker { white-space: nowrap; overflow: hidden; text-overflow: ellipsis;  color: var(--muted); font-size: 11px; }
.tile h5 { margin: 4px 0 0; font: 600 19px/1.2 Fraunces, serif; }

/* Uebersicht */
.gruppe { margin-bottom: 36px; }
.gruppe h2 { font-size: 30px; margin: 10px 0 18px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
.intro { max-width: 1100px; margin: 20px auto 30px; padding: 0 20px; }
.intro h1 { color: var(--ink); font-size: clamp(40px, 7vw, 76px); margin: 0; }
.intro p { color: var(--muted); font-size: 18px; margin: 8px 0 0; }

@media (max-width: 820px) {
  .hero-card { grid-template-columns: 1fr; }
  .hero-emoji { order: -1; padding-top: 30px; font-size: 120px; }
  .hero-text { padding: 10px 26px 34px; }
  .body { grid-template-columns: 1fr; }
  .zutaten { position: static; }
}
</style>
<script defer src="/analytics.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="./">Familien<span>küche</span></a>
  <nav><a href="./">Alle Rezepte</a></nav>
</header>
<main id="app"></main>

<script src="rezepte.js"></script>
<script>
// Emoji je Zutat: erster passender Begriff gewinnt, daher spezifische zuerst.
const ICONS = [
  ['essiggurk|gurkenwasser|relish', '🥒'], ['gurke', '🥒'], ['rucola|feldsalat|radicchio', '🥬'], ['birne', '🍐'], ['thymian', '🌿'], ['balsamico', '🍶'], ['kichererbsen', '🫘'], ['linsen', '🫘'], ['bulgur', '🌾'], ['aubergine', '🍆'], ['granatapfel', '🍎'], ['piment|baharat|koriandersamen|kurkuma', '🧂'], ['paprikamark', '🥫'], ['fladenbrot|yufka', '🫓'], ['rundkornreis|reismehl', '🍚'], ['vanillezucker', '🍯'], ['tahini', '🫙'], ['kreuzkümmel|sumach', '🧂'], ['minze', '🌿'], ['tomatenmark', '🥫'], ['fadennudeln', '🍝'], ['semmelbrösel', '🍞'], ['lammhack|rinder- oder lamm', '🥩'], ['blätterteig', '🥐'], ['schafskäse|feta', '🧀'], ['schwarzkümmel', '🌰'], ['eiweiß|eigelb', '🥚'], ['pul biber', '🌶️'], ['mandelmehl', '🥜'], ['pottasche|hirschhornsalz', '🧂'], ['lebkuchengewürz', '🌰'], ['kakao|kuvertüre', '🍫'], ['orangeat|zitronat', '🍊'], ['streusel', '🌈'], ['mandelhälften', '🥜'], ['puderzucker', '🍚'], ['lebensmittelfarbe', '🎨'], ['weiße schokolade', '🍫'], ['aroma nach wunsch', '🍓'], ['shiitake', '🍄‍🟫'], ['backpapier', '📄'], ['wan-tan', '🥟'], ['koriander', '🌿'], ['austernsauce', '🫙'], ['sweet-chili', '🌶️'], ['frittieröl', '🫗'], ['zitronengras', '🌾'], ['galgant', '🫚'], ['currypaste', '🌶️'], ['kokosmilch', '🥥'], ['fischsauce', '🫙'], ['limette', '🍋'], ['schalotte', '🧅'], ['reisnudeln|jasminreis', '🍚'], ['rote chili', '🌶️'], ['sojasauce', '🫙'], ['sesamöl', '🫙'], ['sesam', '🌰'], ['honig', '🍯'], ['ingwer', '🫚'], ['reisessig', '🍶'], ['reis', '🍚'], ['frühlingszwiebel', '🌱'], ['brokkoli', '🥦'], ['erbsen', '🫛'], ['stärke', '🌾'], ['pflanzenöl', '🫗'], ['apfelmus', '🍎'], ['kartoffel', '🥔'], ['quark', '🥛'], ['kümmel', '🌿'], ['schnittlauch', '🌿'], ['leinöl', '🫒'], ['kürbiskerne', '🌰'], ['kürbis', '🎃'], ['karotte', '🥕'], ['kokosmilch', '🥥'], ['champignon|pilz', '🍄‍🟫'], ['knoblauch', '🧄'],
  ['zwiebelpulver', '🧂'], ['knoblauchpulver', '🧂'], ['zwiebel', '🧅'], ['tomate', '🍅'], ['paprikapulver|paprika, |kurkuma|zimt|muskat', '🌶️'],
  ['paprika-sauce|paprika“', '🫙'], ['paprika', '🫑'], ['salat|romana', '🥬'], ['petersilie|kräuter|basilikum|oregano', '🌿'], ['zitrone', '🍋'],
  ['schinken', '🍖'], ['lachs', '🐟'], ['rinderfilet', '🥩'], ['butterschmalz|rapsöl', '🫗'], ['schmand|crème fraîche', '🥛'], ['alufolie', '🧻'], ['kastenweißbrot|weißbrot', '🍞'], ['weißwein', '🍷'], ['kirschtomaten', '🍅'], ['chiliflocken', '🌶️'], ['hähnchen', '🍗'], ['hack|patties', '🥩'], ['bacon', '🥓'], ['halloumi', '🧀'], ['cheddar|parmesan|käse', '🧀'],
  ['spaghetti|nudeln', '🍝'], ['pommes', '🍟'], ['mehl', '🌾'], ['hafer', '🌾'], ['backpulver|hefe', '🧫'],
  ['brötchen|brot|baguette|croutons', '🥖'], ['eier|ei \\(|^ei$', '🥚'], ['butter', '🧈'], ['sahne|milch|joghurt', '🥛'],
  ['mayonnaise', '🥚'], ['ketchup', '🥫'], ['senf', '🌭'], ['olivenöl|öl', '🫒'], ['kokosöl', '🥥'], ['mandel|nüsse', '🥜'],
  ['agaven|zucker', '🍯'], ['essig', '🍶'], ['brühe', '🍲'], ['wasser', '💧'], ['salz|pfeffer', '🧂']
];
function icon(name) {
  const n = name.toLowerCase();
  if (n.includes('kokosöl')) return '🥥';
  for (const [re, e] of ICONS) if (new RegExp(re).test(n)) return e;
  return '🥄';
}
// Emoji je Arbeitsschritt nach Stichwort im Titel
const STEP = [['ofen|vorheizen', '🔥'], ['back', '🍞'], ['brat|anbraten|rösten', '🍳'], ['dünst|koch|köchel|sauce', '🍲'],
  ['schneid|würfel|hack|vorbereiten|putz', '🔪'], ['rühr|misch|mix|teig|masse|verrühr|pürier|dressing', '🥣'],
  ['ruhen|gehen|kühl|durchzieh|abkühl|warm halten', '⏳'], ['form|flecht|ausroll|portion', '🤲'], ['servier|zusammen|anricht', '🍽️'],
  ['abschmeck', '👅'], ['auflösen|einweich', '💧'], ['passier', '🥄'], ['unterheb', '🥚'], ['pommes', '🍟']];
function stepIcon(t) {
  const n = t.toLowerCase();
  for (const [re, e] of STEP) if (new RegExp(re).test(n)) return e;
  return '👩‍🍳';
}
// Mengenangabe skalieren: fuehrende Zahl oder Spanne ("2–3", "½", "1,2", "1 ½") mal Faktor
const BRUCH = { '¼': .25, '½': .5, '¾': .75, '⅛': .125, '⅓': 1 / 3, '⅔': 2 / 3 };
const ZAHL = '(?:\\d+(?:[.,]\\d+)?(?:\\s?[¼½¾⅛⅓⅔])?|[¼½¾⅛⅓⅔])';
const MENGE_RE = new RegExp('^(' + ZAHL + ')(?:\\s?[–-]\\s?(' + ZAHL + '))?');
const leseZahl = s => { let v = 0; s = s.trim(); const b = s.slice(-1); if (BRUCH[b]) { v = BRUCH[b]; s = s.slice(0, -1).trim(); } return v + (s ? parseFloat(s.replace(',', '.')) : 0); };
function schoen(v) {
  if (v >= 100) return String(Math.round(v / 10) * 10);
  if (v >= 20) return String(Math.round(v / 5) * 5);
  if (v >= 10) return String(Math.round(v));
  const q = Math.round(v * 4) / 4, ganz = Math.floor(q), rest = q - ganz;
  if (q === 0) return '¼';
  const b = { .25: '¼', .5: '½', .75: '¾' }[rest] || '';
  return ganz ? ganz + (b ? ' ' + b : '') : b;
}
function skaliere(m, f) {
  if (f === 1) return m;
  if (/^\d*\s?(Prise|Msp)/.test(m)) return m;
  const t = m.match(MENGE_RE);
  if (!t) return m;
  const a = schoen(leseZahl(t[1]) * f), b = t[2] ? '–' + schoen(leseZahl(t[2]) * f) : '';
  return a + b + m.slice(t[0].length);
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app');
const R = window.REZEPTE;
const id = new URLSearchParams(location.search).get('r');
const r = R.find(x => x.id === id);

const pic = x => x.bild ? `<img src="${x.bild}" alt="" style="width:1.1em;height:1.1em;display:block;margin:auto">` : x.emoji;
function tile(x) {
  return `<a class="tile" href="?r=${x.id}"><div class="pic" style="background:radial-gradient(circle at 60% 40%, ${x.farbe[1]}, ${x.farbe[0]})">${pic(x)}<span class="pill">⏱ ${esc(x.zeit)}</span></div>
    <div class="txt"><div class="kicker">${esc(x.kategorie)}</div><h5>${esc(x.titel)}</h5></div></a>`;
}


if (!r) {
  document.title = 'Rezepte';
  const GRUPPEN = [
    ['Salat', ['caesar', 'ziegenkaese', 'kartoffelsalat', 'tabouleh', 'coban']],
    ['Suppe', ['kuerbis', 'currysuppe', 'mercimek', 'gazpacho']],
    ['Asiatisch', ['teriyaki', 'eierreis', 'wantan', 'bao', 'tamagoyaki']],
    ['Orientalisch', ['koefte', 'shawarma', 'falafel', 'lahmacun', 'bulgur', 'babaganoush', 'kaesestangen', 'suetlac']],
    ['Mittag', ['filet', 'kuerbiscurry', 'pilzsahne', 'parmesannudeln', 'lachs', 'bolognese', 'schinkennudeln', 'kartoffelquark', 'kartoffelpuffer', 'knoedel', 'cheeseburger', 'pizzateig', 'wraps', 'pfannkuchen']],
    ['Backen', ['pide', 'broetchen', 'hefezopf', 'macarons', 'plaetzchen', 'pfefferkuchen', 'granola']],
    ['Saucen', ['french', 'bigmac']]
  ];
  const vergeben = new Set(GRUPPEN.flatMap(g => g[1]));
  const rest = R.filter(x => !vergeben.has(x.id)).map(x => x.id);
  if (rest.length) GRUPPEN.push(['Weitere', rest]);
  app.innerHTML = `<section class="intro"><h1>Rezepte</h1><p>${R.length} Lieblingsgerichte aus der Familienküche</p></section>
    ${GRUPPEN.map(([name, ids]) => `<section class="mehr gruppe"><h2>${name}</h2><div class="grid">${
      ids.map(i => R.find(x => x.id === i)).filter(Boolean).map(tile).join('')}</div></section>`).join('')}`;
} else {
  document.title = r.titel;
  document.documentElement.style.setProperty('--a1', r.farbe[0]);
  document.documentElement.style.setProperty('--a2', r.farbe[1]);
  const mehrere = r.abschnitte.length > 1;
  const zutaten = r.abschnitte.filter(a => a.zutaten.length).map(a => `${mehrere && a.titel ? `<h3>${esc(a.titel)}</h3>` : ''}<ul class="zl">${
    a.zutaten.map(([m, n]) => `<li><span class="ico">${icon(n)}</span><span>${m ? `<span class="menge" data-m="${esc(m)}">${esc(m)}</span>` : ''}<span class="name">${esc(n)}</span></span></li>`).join('')}</ul>`).join('');
  let nr = 0;
  const schritte = r.abschnitte.map(a => `<div class="abschnitt">${mehrere && a.titel ? `<h3>${esc(a.titel)}</h3>` : ''}<ol class="steps">${
    a.schritte.map(s => { nr++; const txt = s.link ? esc(s.x).replace('BigMac Sauce', `<a href="?r=${s.link}">BigMac Sauce</a>`) : esc(s.x);
      return `<li class="step"><div class="num">${stepIcon(s.t)}<b>${nr}</b></div><div><h4>${esc(s.t)}${s.z ? `<span class="zeit">⏱ ${esc(s.z)}</span>` : ''}</h4><p>${txt}</p></div></li>`; }).join('')}</ol></div>`).join('');
  const andere = R.filter(x => x.id !== r.id).sort(() => Math.random() - .5).slice(0, 4);
  app.innerHTML = `
  <section class="hero"><div class="hero-card">
    <div class="hero-text"><div class="kicker">${esc(r.kategorie)}</div><h1>${esc(r.titel)}</h1><p class="teaser">${esc(r.teaser)}</p>
      <div class="facts"><span class="fact" id="portPill">🍽️ ${esc(r.portionen)}</span><span class="fact">⏱ ${esc(r.zeit)}</span>${r.tags.map(t => `<span class="fact"># ${esc(t)}</span>`).join('')}</div></div>
    <div class="hero-emoji">${pic(r)}</div></div></section>
  <section class="body">
    <aside class="panel zutaten"><h2>Zutaten</h2><div class="stepper"><button type="button" data-d="-1" aria-label="weniger">−</button><span id="portLabel">${esc(r.portionen)}</span><button type="button" data-d="1" aria-label="mehr">+</button></div><p class="hint">Antippen zum Abhaken</p>${zutaten}</aside>
    <div><div class="panel"><h2>Zubereitung</h2><p class="hint">Erledigte Schritte antippen</p>${schritte}</div>
      ${r.quelle ? `<p class="hint" style="margin-top:18px">Quelle: <a href="${r.quelle}" target="_blank">${new URL(r.quelle).hostname}</a></p>` : ''}${r.tipps ? `<div class="tipps"><h2>Tipps</h2><ul>${r.tipps.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>` : ''}</div>
  </section>
  <section class="mehr"><h2 style="margin-bottom:18px">Mehr aus der Küche</h2><div class="grid">${andere.map(tile).join('')}</div></section>`;
  // Portionen umrechnen: erste Zahl in r.portionen ist die Basis
  const basis = parseInt((r.portionen.match(/\d+/) || ['1'])[0], 10);
  let anzahl = basis;
  const setzePortionen = n => {
    anzahl = Math.max(1, n);
    const f = anzahl / basis;
    const txt = r.portionen.replace(/\d+/g, (z, i) => i === r.portionen.search(/\d/) ? anzahl : Math.round(z * f));
    document.getElementById('portLabel').textContent = txt;
    document.getElementById('portPill').textContent = '🍽️ ' + txt;
    document.querySelectorAll('.menge[data-m]').forEach(el => { el.textContent = skaliere(el.dataset.m, f); });
    document.querySelector('.stepper [data-d="-1"]').disabled = anzahl <= 1;
  };
  app.addEventListener('click', e => {
    const b = e.target.closest('.stepper button');
    if (b) { setzePortionen(anzahl + Number(b.dataset.d)); return; }
    const li = e.target.closest('.zl li, .step');
    if (li && !e.target.closest('a')) li.classList.toggle('ok');
  });
}
</script>
</body>
</html>
