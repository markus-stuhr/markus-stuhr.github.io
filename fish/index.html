<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Abendangeln</title>
<script defer src="/analytics.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a1f33;font-family:Georgia,'Times New Roman',serif;color:#fff4e6;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  .hud{position:fixed;pointer-events:none;text-shadow:0 1px 3px rgba(40,20,30,.7)}
  #title{top:16px;left:20px}
  #title h1{margin:0;font-size:26px;font-weight:normal;letter-spacing:.04em}
  #title p{margin:2px 0 0;font-size:13px;opacity:.75;font-style:italic}
  #bucket{top:16px;right:18px;text-align:right;background:rgba(40,25,40,.35);padding:10px 14px;border-radius:12px;
    backdrop-filter:blur(4px);min-width:150px}
  #bucket b{font-size:15px;font-weight:normal;letter-spacing:.05em}
  #bucket ul{list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.5}
  #bucket li span{opacity:.65}
  #hint{bottom:22px;left:50%;transform:translateX(-50%);font-size:15px;background:rgba(40,25,40,.4);padding:8px 16px;
    border-radius:20px;white-space:nowrap;backdrop-filter:blur(4px);transition:opacity .4s}
  #toast{top:38%;left:50%;transform:translate(-50%,-50%) scale(.9);font-size:30px;opacity:0;transition:all .5s;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast small{display:block;font-size:15px;font-style:italic;opacity:.8}
  #fight{bottom:70px;left:50%;transform:translateX(-50%);width:260px;display:none}
  .bar{height:10px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;width:0}
  #tension i{background:linear-gradient(90deg,#9fd3a8,#f3d27a 60%,#e8665a)}
  #progress i{background:#f6e7c8}
  #fight label{font-size:12px;opacity:.8}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    background:linear-gradient(#3b2a4a,#c9786a);z-index:5;transition:opacity .8s}
  #loading div{font-size:28px;letter-spacing:.05em}
  #loading small{margin-top:8px;opacity:.7;font-style:italic}
  .btn{position:fixed;pointer-events:auto;border:1px solid rgba(255,240,220,.4);background:rgba(40,25,40,.45);color:#fff4e6;
    font:inherit;font-size:15px;padding:10px 18px;border-radius:24px;cursor:pointer;backdrop-filter:blur(4px)}
  #modeBtn{bottom:18px;right:18px}
  #soundBtn{bottom:18px;left:18px;padding:10px 13px}
  #stick{position:fixed;left:30px;bottom:80px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,240,220,.35);
    background:rgba(40,25,40,.2);display:none;touch-action:none}
  #stick i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,240,220,.45)}
  @media (max-width:600px){#title h1{font-size:20px}#title p{display:none}#hint{font-size:13px;bottom:auto;top:64px;white-space:normal;text-align:center;width:max-content;max-width:86vw}#bucket{min-width:0}}
</style>
</head>
<body>
<div id="loading"><div>Abendangeln</div><small id="loadMsg">Die Sonne sinkt …</small></div>
<div id="title" class="hud"><h1>Abendangeln</h1><p>Eine stille Bucht, ein Ruderboot, ein Eimer.</p></div>
<div id="bucket" class="hud"><b>Eimer · <span id="count">0</span>/10</b><ul id="list"></ul></div>
<div id="hint" class="hud"></div>
<div id="toast" class="hud"></div>
<div id="fight" class="hud">
  <label>Schnurspannung</label><div class="bar" id="tension"><i></i></div>
  <label>Einholen</label><div class="bar" id="progress"><i></i></div>
</div>
<button id="modeBtn" class="btn">Angeln (F)</button>
<button id="soundBtn" class="btn" title="Ton">🔈</button>
<div id="stick"><i></i></div>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const M = '../assets/models/';
const FISHPACK = M + 'Quaternius Animated Cute Fish Pack/glTF/';
const NATURE = M + 'KayKit_Forest_Nature_Pack_1.0_FREE/Assets/gltf/';
const CHAR = M + 'KayKit_Adventurers_2.0_FREE/Characters/gltf/Ranger.glb';
const LIB_TOOLS = M + 'KayKit_Character_Animations_1.1/Animations/gltf/Rig_Medium/Rig_Medium_Tools.glb';
const LIB_SIM = M + 'KayKit_Character_Animations_1.1/Animations/gltf/Rig_Medium/Rig_Medium_Simulation.glb';
const LIB_GENERAL = M + 'KayKit_Adventurers_2.0_FREE/Animations/gltf/Rig_Medium/Rig_Medium_General.glb';

const SPECIES = {
  RedSnapper:   {de:'Roter Schnapper', kg:[0.8, 3.5]},
  Flatfish:     {de:'Scholle',         kg:[0.4, 2.0]},
  Turbot:       {de:'Steinbutt',       kg:[1.0, 6.0]},
  CoralGrouper: {de:'Zackenbarsch',    kg:[2.0, 9.0]},
  Tuna:         {de:'Thunfisch',       kg:[6.0, 30.0]},
  Puffer:       {de:'Kugelfisch',      kg:[0.3, 1.5]},
  Sunfish:      {de:'Mondfisch',       kg:[20.0, 80.0]},
  Swordfish:    {de:'Schwertfisch',    kg:[15.0, 60.0]},
};
// Seichte Arten nahe der Küste, seltene im tiefen Wasser
const SHALLOW = ['RedSnapper', 'RedSnapper', 'Flatfish', 'Flatfish', 'Turbot', 'Puffer', 'CoralGrouper'];
const DEEP = ['Tuna', 'Tuna', 'Tuna', 'CoralGrouper', 'CoralGrouper', 'RedSnapper', 'Turbot', 'Sunfish', 'Swordfish'];

// ---------- Renderer, Szene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
// Auflösung deckeln: auf großen Retina-Fenstern sonst über 10 Mio. Pixel pro Bild
function pixelRatioFor(w, h){
  const budget = 5.2e6;
  return Math.min(devicePixelRatio, 2, Math.max(1, Math.sqrt(budget / (w * h))));
}
renderer.setPixelRatio(pixelRatioFor(innerWidth, innerHeight));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0xd9957e);
scene.fog = new THREE.FogExp2(FOG, 0.0032);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
camera.layers.enable(1);   // Boot-Layer

// Sonne tief im Westen
const SUN_DIR = new THREE.Vector3(-0.8, 0.24, -0.55).normalize();
const sun = new THREE.DirectionalLight(0xffb98a, 2.6);
sun.castShadow = true;
const SHADOW_MAP = renderer.capabilities.maxTextureSize >= 8192 ? 6144 : 4096;
sun.shadow.mapSize.set(SHADOW_MAP, SHADOW_MAP);
// Schattenbereich deckt die ganze Welt ab (760 m) und steht fest
const SHADOW_R = 400;
Object.assign(sun.shadow.camera, {left:-SHADOW_R, right:SHADOW_R, top:SHADOW_R, bottom:-SHADOW_R, near:1, far:1600});
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 0.004;   // klein, damit dünne Halme noch Schatten werfen
// Die Weltschattenkarte wird nur jedes dritte Bild neu gerechnet – das reicht für
// die sich wiegenden Pflanzen und spart Leistung auf schwächeren Geräten.
sun.shadow.autoUpdate = false;
sun.position.copy(SUN_DIR).multiplyScalar(700);
scene.add(sun, sun.target);
// Eigene scharfe Schattenkarte nur fürs Boot (Layer 1). Das Licht ist praktisch dunkel –
// die ShadowMaterial-Fläche auf dem Wasser zeigt seinen Schatten trotzdem.
// Das Boot selbst liegt nicht auf Layer 0 und fehlt deshalb in der groben Weltkarte.
const BOAT_LAYER = 1;
const boatSun = new THREE.DirectionalLight(0xffffff, 0.0001);
boatSun.castShadow = true;
boatSun.shadow.mapSize.set(2048, 2048);
Object.assign(boatSun.shadow.camera, {left:-7, right:7, top:7, bottom:-7, near:1, far:60});
boatSun.shadow.camera.layers.set(BOAT_LAYER);
boatSun.shadow.bias = -0.0005;
scene.add(boatSun, boatSun.target);
scene.add(new THREE.HemisphereLight(0xffc4b0, 0x3b4a70, 0.9));

// Himmel
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {sunDir: {value: SUN_DIR}},
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 sunDir; varying vec3 vDir;
    void main(){
      // Pro Fragment neu normieren, sonst wird die Sonnenscheibe eckig
      vec3 vd = normalize(vDir);
      float h = vd.y;
      vec3 top = vec3(0.16,0.14,0.32), mid = vec3(0.72,0.42,0.55), hor = vec3(1.0,0.66,0.45);
      vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, h));
      c = mix(c, top, smoothstep(0.15, 0.6, h));
      if(h < 0.0) c = mix(hor, vec3(0.85,0.55,0.48), smoothstep(0.0,-0.2,h));
      float s = max(dot(vd, sunDir), 0.0);
      c += vec3(1.0,0.55,0.25) * pow(s, 8.0) * 0.55;
      c += vec3(1.0,0.8,0.5) * pow(s, 1600.0) * 0.45;                        // Hof
      c += vec3(1.0,0.9,0.72) * smoothstep(0.99930, 0.99955, s) * 2.2;       // Scheibe,
      // gleiche Größe wie das Spiegelbild im Wasser
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
scene.add(sky);

// Sichttiefe im Wasser: alles unter der Oberfläche geht mit der Tiefe in die
// Wasserfarbe über. Bei etwa 5 m ist nichts mehr zu erkennen.
const WATER_VIS = 3.5;                 // Abklinglänge; bei etwa 8 m Tiefe sieht man nichts mehr
const WATER_BODY = new THREE.Vector3(0.012, 0.055, 0.075);   // linear, dunkles Tiefwasser
// Zwei Regler: Objekte unter Wasser blenden mit der Entfernung aus, und die
// Wasseroberfläche wird ab einer Entfernung undurchsichtig. Erst zusammen
// verdecken sie auch Dinge, deren Material nicht angefasst ist (Stegpfähle).
const WATER_SIGHT_NEAR = 30, WATER_SIGHT_FAR = 60;            // Objekte
const SURFACE_OPAQUE_NEAR = 26, SURFACE_OPAQUE_FAR = 55;      // Oberfläche
function underwaterFade(mat){
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, renderer) => {
    if(prev) prev(sh, renderer);
    sh.vertexShader = 'varying float vWY;\nvarying float vUwD;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vec4 _wp = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        _wp = instanceMatrix * _wp;
      #endif
      vWY = (modelMatrix * _wp).y;
      vUwD = -mvPosition.z;`);
    sh.fragmentShader = 'varying float vWY;\nvarying float vUwD;\n' + sh.fragmentShader.replace('#include <opaque_fragment>',
      `float _depthFade = 1.0 - exp(-max(0.0, -vWY) / ${WATER_VIS.toFixed(2)});
       // unter Wasser reicht der Blick auch in die Weite nur etwa 100 m
       float _under = smoothstep(0.0, -0.6, vWY);
       float _distFade = smoothstep(${WATER_SIGHT_NEAR.toFixed(1)}, ${WATER_SIGHT_FAR.toFixed(1)}, vUwD) * _under;
       outgoingLight = mix(outgoingLight, vec3(${WATER_BODY.x}, ${WATER_BODY.y}, ${WATER_BODY.z}),
         max(_depthFade, _distFade));
       #include <opaque_fragment>`);
  };
  const key = mat.customProgramCacheKey;
  mat.customProgramCacheKey = () => 'uwFade' + (key ? key.call(mat) : mat.type);
  return mat;
}

// ---------- Rauschen und Gelände ----------
function hash(x, z){ const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
}
function fbm(x, z){ let s = 0, a = 0.5, f = 1; for(let i = 0; i < 5; i++){ s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; } return s - 0.5; }

const ISLANDS = [[70, 40, 28], [-60, 110, 20], [150, -20, 16], [-20, 190, 34], [210, 140, 26]];
// v < 0 Wasser, v > 0 Land. Festland im Norden und Westen, dazu Inseln.
function landness(x, z){
  const n = fbm(x * 0.009, z * 0.009);
  let v = (-z - 70 + n * 90) / 45;
  v = Math.max(v, (-x - 170 + n * 70) / 45);
  for(const [ix, iz, r] of ISLANDS){
    const d = Math.hypot(x - ix, z - iz);
    v = Math.max(v, (r - d + n * 22) / (r * 0.9));
  }
  return v;
}
function height(x, z){
  const v = landness(x, z);
  const detail = fbm(x * 0.05 + 7, z * 0.05) * 0.8;
  if(v < 0) return Math.max(v * 11, -14) + detail * 0.6 - 0.15;
  const hills = Math.max(0, fbm(x * 0.02 + 3, z * 0.02 - 5) + 0.25) * 26;
  return Math.min(v, 1.5) * 2.2 + hills * THREE.MathUtils.smoothstep(v, 0.1, 1.4) + detail;
}

const WORLD = 760, SEG = 300;
// Endgültige Geländehöhe: wie height(), aber zum Weltrand hin auf Tiefwasser
// abgesenkt. Alles, was auf dem Grund steht, muss diese Funktion benutzen.
function terrainH(x, z){
  const e = THREE.MathUtils.smoothstep(Math.max(Math.abs(x), Math.abs(z)) / (WORLD / 2), 0.8, 1.0);
  return e > 0 ? THREE.MathUtils.lerp(height(x, z), -14, e) : height(x, z);
}


// Höhe der tatsächlich gezeichneten Gitterfläche: zwischen den Stützpunkten liegt
// sie unter der berechneten Höhe – sonst schweben Bäume auf Kuppen.
const CELL = WORLD / SEG;
function meshH(x, z){
  const gx = Math.floor((x + WORLD / 2) / CELL), gz = Math.floor((z + WORLD / 2) / CELL);
  const x0 = -WORLD / 2 + gx * CELL, z0 = -WORLD / 2 + gz * CELL;
  const tx = (x - x0) / CELL, tz = (z - z0) / CELL;
  const h00 = terrainH(x0, z0), h10 = terrainH(x0 + CELL, z0),
        h01 = terrainH(x0, z0 + CELL), h11 = terrainH(x0 + CELL, z0 + CELL);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(h00, h10, tx), THREE.MathUtils.lerp(h01, h11, tx), tz);
}

const tgeo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG).rotateX(-Math.PI / 2);
{
  const p = tgeo.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  const sand = new THREE.Color(0xd8c29a), wetSand = new THREE.Color(0xa99470), weed = new THREE.Color(0x3f6a58),
    deep = new THREE.Color(0x0e2e40), grass = new THREE.Color(0x6f8a46), dark = new THREE.Color(0x3c5a33), rock = new THREE.Color(0x8a7d72);
  for(let i = 0; i < p.count; i++){
    const x = p.getX(i), z = p.getZ(i), h = terrainH(x, z);
    p.setY(i, h);
    if(h < -0.2){
      const t = Math.min(1, -h / 12);
      c.copy(wetSand).lerp(weed, THREE.MathUtils.smoothstep(t, 0.08, 0.35) * (0.5 + hash(x * .3, z * .3) * 0.5));
      c.lerp(deep, THREE.MathUtils.smoothstep(t, 0.25, 1.0));
    } else if(h < 1.3){
      c.copy(sand);
    } else {
      const g = THREE.MathUtils.smoothstep(h, 1.3, 2.4);
      c.copy(sand).lerp(grass, g).lerp(dark, Math.max(0, fbm(x * 0.03, z * 0.03) + 0.2) * g);
      c.lerp(rock, THREE.MathUtils.smoothstep(h, 12, 22));
    }
    col.set([c.r, c.g, c.b], i * 3);
  }
  tgeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  tgeo.computeVertexNormals();
}
// Tiefsee: eine große flache Fläche auf Bodenniveau, damit der Grund nirgends endet
const abyss = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2),
  underwaterFade(new THREE.MeshLambertMaterial({color: 0x0c2735})));
abyss.position.y = -14.05;
scene.add(abyss);
const terrain = new THREE.Mesh(tgeo, underwaterFade(new THREE.MeshLambertMaterial({vertexColors:true})));
terrain.receiveShadow = true;
terrain.castShadow = true;           // Hügel und Inseln werfen selbst Schatten
scene.add(terrain);

// ---------- Wasser ----------
function waveH(x, z, t){
  return Math.sin(x * 0.35 + t * 0.9) * 0.05 + Math.sin(z * 0.28 - t * 0.7) * 0.05
       + Math.sin((x + z) * 0.9 + t * 1.6) * 0.02;
}
// Der Wasser-Shader fragt die Schattenkarten selbst ab (lights: true plus die
// shadowmap-Chunks), damit im Schatten die Sonnenreflexion wegfällt, ohne dass
// die Schattenfläche kräftig deckt.
const waterUniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.lights, {
  time: {value: 0}, sunDir: {value: null},
  fogColor: {value: null}, fogDensity: {value: 0},
  sightNear: {value: 0}, sightFar: {value: 0},
}]);
waterUniforms.sunDir.value = SUN_DIR;
waterUniforms.fogColor.value = FOG;
waterUniforms.fogDensity.value = scene.fog.density;
waterUniforms.sightNear.value = SURFACE_OPAQUE_NEAR;
waterUniforms.sightFar.value = SURFACE_OPAQUE_FAR;
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(1800, 1800, 1, 1).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, uniforms: waterUniforms, lights: true,
    vertexShader: `
      #include <common>
      #include <shadowmap_pars_vertex>
      varying vec3 vW; varying float vFogDepth;
      void main(){
        vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz;
        vec4 mv = viewMatrix * w; vFogDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
        vec4 worldPosition = w;                      // von shadowmap_vertex erwartet
        vec3 transformedNormal = vec3(0.0, 1.0, 0.0);  // ebenso
        #include <shadowmap_vertex>
      }`,
    fragmentShader: `
      #include <common>
      #include <packing>
      uniform bool receiveShadow;                    // setzt der Renderer je Objekt
      #include <shadowmap_pars_fragment>
      #include <shadowmask_pars_fragment>
      uniform float time; uniform vec3 sunDir; uniform vec3 fogColor; uniform float fogDensity;
      uniform float sightNear; uniform float sightFar;
      varying vec3 vW; varying float vFogDepth;
      vec3 wn(vec2 p, float t){
        // Summe schräg laufender Wellen, damit kein Karomuster entsteht
        vec2 g = vec2(0.0);
        float k = 0.11, a = 0.05, w = 0.55;    // lange Wellen
        float ang = 0.4;
        for(int i = 0; i < 6; i++){
          vec2 d = vec2(cos(ang), sin(ang));
          g += d * k * a * cos(dot(d, p) * k + t * w + float(i) * 1.7);
          k *= 1.95; a *= 0.55; w *= 1.25; ang += 2.1;
        }
        return normalize(vec3(-g.x * 1.1, 1.0, -g.y * 1.1));   // lange Wellen, feine Kräuselung darüber
      }
      void main(){
        vec3 n = wn(vW.xz, time);
        vec3 v = normalize(cameraPosition - vW);
        float fres = pow(1.0 - max(dot(n, v), 0.0), 4.0);
        vec3 r = reflect(-v, n);
        float h = max(r.y, 0.0);
        vec3 skyc = mix(vec3(1.0,0.66,0.45), vec3(0.72,0.42,0.55), smoothstep(0.0,0.18,h));
        skyc = mix(skyc, vec3(0.16,0.14,0.32), smoothstep(0.15,0.6,h));
        float s = max(dot(r, sunDir), 0.0);
        // Die Scheibe wird an einer nur leicht gewellten Fläche gespiegelt: ganz
        // glatt wäre sie starr, mit voller Wellennormale verschmiert sie zu einem
        // großen Fleck. So bleibt sie klein und wird von den Wellen verzerrt.
        vec3 nSoft = normalize(mix(vec3(0.0, 1.0, 0.0), n, 0.3));
        vec3 rFlat = reflect(-v, nSoft);
        float sf = max(dot(rFlat, sunDir), 0.0);
        vec3 spec = vec3(1.0,0.9,0.72) * smoothstep(0.99930, 0.99955, sf) * 2.2
                  + vec3(1.0,0.8,0.5) * pow(sf, 1600.0) * 0.45
                  + vec3(1.0,0.78,0.48) * pow(s, 45.0) * 0.5;
        // Im Schatten liegt keine Sonne auf dem Wasser: Reflexion ausknipsen
        float shade = getShadowMask();
        spec *= shade;
        vec3 body = vec3(0.035,0.105,0.135);   // dunkel wie das Tiefwasser darunter
        float a = mix(0.36, 0.92, fres);
        vec3 c = mix(body, skyc * mix(0.82, 1.0, shade), fres) + spec;
        a = min(1.0, a + length(spec) * 0.5);
        // In die Ferne wird die Oberfläche undurchsichtig: man sieht nur in der
        // Nähe ins Wasser hinein. Das verdeckt alles Untergetauchte zuverlässig.
        a = mix(a, 1.0, smoothstep(sightNear, sightFar, vFogDepth));
        float fogF = 1.0 - exp(-fogDensity*fogDensity*vFogDepth*vFogDepth);
        c = mix(c, fogColor, fogF);
        a = mix(a, 1.0, fogF);
        gl_FragColor = vec4(c, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
water.receiveShadow = true;
water.renderOrder = 2;

// Prozedural: Seegras-Büschel im Flachen, lange Tangbänder im Tieferen.
// Wiegen sich per Vertex-Shader; Stärke wächst mit der Höhe am Halm.
const plantTime = {value: 0};
function swayInject(sh, amp, speed){
  sh.uniforms.time = plantTime;
  sh.vertexShader = 'uniform float time;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
    float ph = instanceMatrix[3].x * 0.37 + instanceMatrix[3].z * 0.23;
    float hh = position.y * position.y;
    transformed.x += sin(time * ${speed.toFixed(2)} + ph + position.y * 2.2) * ${amp.toFixed(3)} * hh;
    transformed.z += cos(time * ${(speed * 0.8).toFixed(2)} + ph * 1.3 + position.y * 1.7) * ${(amp * 0.6).toFixed(3)} * hh;`);
}
function swayMaterial(amp, speed, underwater){
  const m = new THREE.MeshLambertMaterial({vertexColors: true, side: THREE.DoubleSide});
  m.onBeforeCompile = (sh) => swayInject(sh, amp, speed);
  m.customProgramCacheKey = () => 'sway' + amp;
  return underwater ? underwaterFade(m) : m;
}
// Der Schattenwurf braucht dieselbe Bewegung, sonst steht der Schatten still
function swayDepthMaterial(amp, speed){
  const m = new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking, side: THREE.DoubleSide});
  m.onBeforeCompile = (sh) => swayInject(sh, amp, speed);
  m.customProgramCacheKey = () => 'swayDepth' + amp;
  return m;
}
function colorRamp(geo, base, tip){
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3), c = new THREE.Color();
  for(let i = 0; i < pos.count; i++){
    c.copy(base).lerp(tip, Math.min(1, Math.max(0, pos.getY(i))));
    col.set([c.r, c.g, c.b], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}
function blade(w, segs, taper, bend){
  const g = new THREE.PlaneGeometry(w, 1, 1, segs).translate(0, 0.5, 0);
  const p = g.attributes.position;
  for(let i = 0; i < p.count; i++){
    const y = p.getY(i);
    p.setX(i, p.getX(i) * (1 - y * taper));
    p.setZ(i, y * y * bend);
  }
  return g;
}
function grassClumpGeo(base, tip){
  const parts = [];
  for(let i = 0; i < 6; i++){
    const b = blade(0.05, 4, 0.85, 0.15 + Math.random() * 0.2);
    b.scale(1, 0.6 + Math.random() * 0.6, 1);
    b.rotateY(Math.random() * Math.PI);
    b.translate((Math.random() - 0.5) * 0.25, 0, (Math.random() - 0.5) * 0.25);
    parts.push(b);
  }
  const g = mergeGeometries(parts);
  g.computeVertexNormals();
  return colorRamp(g, base, tip);
}
function kelpGeo(){
  // gewelltes Band, zwei Stränge über Kreuz
  const parts = [];
  for(let k = 0; k < 2; k++){
    const b = new THREE.PlaneGeometry(0.22, 1, 1, 14).translate(0, 0.5, 0);
    const p = b.attributes.position;
    for(let i = 0; i < p.count; i++){
      const y = p.getY(i);
      const w = Math.sin(y * 40) * 0.25 + 1;
      p.setX(i, p.getX(i) * w * (0.4 + Math.sin(y * Math.PI) * 0.9));
      p.setZ(i, Math.sin(y * 6 + k) * 0.08);
    }
    b.rotateY(k * Math.PI / 2 + 0.3);
    parts.push(b);
  }
  const g = mergeGeometries(parts);
  g.computeVertexNormals();
  return colorRamp(g, new THREE.Color(0x2e3a18), new THREE.Color(0x8a8f3a));
}
// Korallen: verzweigte Äste, runde Hirnkorallen, Fächer
function branchCoralGeo(){
  const parts = [];
  const grow = (x, y, z, dx, dz, r, len, depth) => {
    const g = new THREE.CylinderGeometry(r * 0.6, r, len, 6, 1);
    g.translate(0, len / 2, 0);
    g.rotateX(dz * 0.9); g.rotateZ(-dx * 0.9);
    g.translate(x, y, z);
    parts.push(g);
    if(depth <= 0) return;
    const ny = y + len * 0.85;
    for(let i = 0; i < 2; i++){
      const a = Math.random() * 6.28;
      grow(x + dx * len * 0.6, ny, z + dz * len * 0.6,
        Math.cos(a) * 0.5, Math.sin(a) * 0.5, r * 0.7, len * 0.7, depth - 1);
    }
  };
  grow(0, 0, 0, 0, 0, 0.06, 0.32, 3);
  const g = mergeGeometries(parts);
  g.computeVertexNormals();
  return g;
}
function brainCoralGeo(){
  const g = new THREE.IcosahedronGeometry(0.35, 2);
  const p = g.attributes.position, v = new THREE.Vector3();
  for(let i = 0; i < p.count; i++){
    v.fromBufferAttribute(p, i);
    const n = 1 + fbm(v.x * 9, v.z * 9 + v.y * 5) * 0.35;
    p.setXYZ(i, v.x * n, Math.max(v.y * 0.65 * n, -0.02), v.z * n);
  }
  g.computeVertexNormals();
  return g;
}
function fanCoralGeo(){
  const parts = [];
  for(let i = 0; i < 9; i++){
    const a = (i / 8 - 0.5) * 1.5;
    const g = new THREE.CylinderGeometry(0.012, 0.02, 0.5 + Math.cos(a) * 0.25, 4, 1);
    g.translate(0, (0.5 + Math.cos(a) * 0.25) / 2, 0);
    g.rotateZ(a);
    parts.push(g);
  }
  const g = mergeGeometries(parts);
  g.rotateY(Math.random() * 3);
  g.computeVertexNormals();
  return g;
}
const CORAL_COLORS = [0xd06a7a, 0xe08a5a, 0xa06aa8, 0xd8a45a, 0xc85a6a, 0x7a8ab8];
function buildCorals(){
  const kinds = [
    {geo: branchCoralGeo(), list: [], scale: [0.8, 1.6]},
    {geo: brainCoralGeo(), list: [], scale: [0.7, 1.5]},
    {geo: fanCoralGeo(), list: [], scale: [0.9, 1.8]},
  ];
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(),
    p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  for(let i = 0; i < 160000; i++){
    const x = (rnd() - 0.5) * WORLD * 0.96, z = (rnd() - 0.5) * WORLD * 0.96;
    const h = meshH(x, z), d = -h;
    if(d < 1.2 || d > 9) continue;
    // Korallen sind selten: nur in wenigen Flecken und dort einzeln verteilt
    if(fbm(x * 0.05 - 21, z * 0.05 + 8) < 0.12) continue;
    if(rnd() > 0.09) continue;
    const k = kinds[(rnd() * kinds.length) | 0];
    const s = k.scale[0] + rnd() * (k.scale[1] - k.scale[0]);
    p.set(x, h - 0.04, z); q.setFromAxisAngle(up, rnd() * 6.28); sc.setScalar(s);
    k.list.push({m: m.compose(p, q, sc).clone(), c: CORAL_COLORS[(rnd() * CORAL_COLORS.length) | 0]});
  }
  const teal = new THREE.Color(0x1d5560), col = new THREE.Color();
  let count = 0;
  for(const k of kinds){
    if(!k.list.length) continue;
    const mat = underwaterFade(new THREE.MeshLambertMaterial({}));
    const im = new THREE.InstancedMesh(k.geo, mat, k.list.length);
    k.list.forEach((e, i) => {
      im.setMatrixAt(i, e.m);
      im.setColorAt(i, col.setHex(e.c).lerp(teal, 0.4));   // unter Wasser gedämpft
    });
    im.computeBoundingSphere();
    im.receiveShadow = true;
    im.castShadow = true;
    scene.add(im);
    count += k.list.length;
  }
  return count;
}

function buildPlants(){
  const CH = 8, cell = WORLD / CH;
  const grass = Array.from({length: CH * CH}, () => []);
  const kelp = Array.from({length: CH * CH}, () => []);
  const land = Array.from({length: CH * CH}, () => []);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const put = (arr, x, z, y, s, h) => {
    const ci = Math.min(CH - 1, Math.floor((x + WORLD / 2) / cell)) + Math.min(CH - 1, Math.floor((z + WORLD / 2) / cell)) * CH;
    p.set(x, y, z); q.setFromAxisAngle(up, rnd() * 6.28); sc.set(s, h, s);
    arr[ci].push(m.compose(p, q, sc).clone());
  };
  for(let i = 0; i < 420000; i++){
    const x = (rnd() - 0.5) * WORLD * 0.96, z = (rnd() - 0.5) * WORLD * 0.96;
    const h = meshH(x, z), d = -h;
    const patch = fbm(x * 0.04 + 11, z * 0.04 - 3);
    if(h > 1.4 && h < 22){
      // Grasbüschel an Land, fleckenweise auf flachem Grund
      const slope = Math.abs(meshH(x + 1, z) - h) + Math.abs(meshH(x, z + 1) - h);
      if(slope < 1.2 && fbm(x * 0.03 - 31, z * 0.03 + 17) > 0.06)
        put(land, x, z, h - 0.03, 1 + rnd() * 1.1, 0.3 + rnd() * 0.45);
      continue;
    }
    if(d < 2 || d > 12) continue;
    if(d < 5.5 && patch > -0.08){
      put(grass, x, z, h - 0.05, 1.2 + rnd() * 1.3, Math.min(d - 0.5, 0.5 + rnd() * 1.2));
    } else if(d > 3.5 && patch > 0.08 && rnd() < 0.35){
      put(kelp, x, z, h - 0.1, 1 + rnd() * 0.8, Math.min(d - 0.8, d * (0.45 + rnd() * 0.4)));
    }
  }
  const gGeo = grassClumpGeo(new THREE.Color(0x1f4a30), new THREE.Color(0x7fae55));
  const lGeo = grassClumpGeo(new THREE.Color(0x46601f), new THREE.Color(0x9cbc52));
  const kGeo = kelpGeo();
  const gMat = swayMaterial(0.12, 1.1, true), kMat = swayMaterial(0.35, 0.6, true), lMat = swayMaterial(0.05, 1.7);
  const gDepth = swayDepthMaterial(0.12, 1.1), kDepth = swayDepthMaterial(0.35, 0.6), lDepth = swayDepthMaterial(0.05, 1.7);
  let count = 0;
  const add = (lists, geo, mat, depth) => lists.forEach(list => {
    if(!list.length) return;
    const im = new THREE.InstancedMesh(geo, mat, list.length);
    list.forEach((mm, i) => im.setMatrixAt(i, mm));
    im.computeBoundingSphere();
    im.receiveShadow = true;
    im.castShadow = true;
    im.customDepthMaterial = depth;
    scene.add(im);
    count += list.length;
  });
  add(grass, gGeo, gMat, gDepth);
  add(kelp, kGeo, kMat, kDepth);
  add(land, lGeo, lMat, lDepth);
  return count;
}

const loader = new GLTFLoader();
loader.setDRACOLoader(new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/libs/draco/gltf/'));
const enc = (p)=> p.split('/').map(encodeURIComponent).join('/');
const load = (p)=> loader.loadAsync(enc(p));
const loadMsg = document.getElementById('loadMsg');

function fit(obj, size, axis = 'y'){
  const b = new THREE.Box3().setFromObject(obj), s = new THREE.Vector3();
  b.getSize(s);
  obj.scale.multiplyScalar(size / s[axis]);
  return obj;
}
function shadows(o, cast = true){ o.traverse(m => { if(m.isMesh){ m.castShadow = cast; m.receiveShadow = true; } }); }

// Viele gleiche Modelle als InstancedMesh (pro Teilmesh eines)
const uwTint = new THREE.Color(0x1d5560);
function scatter(gltfScene, mats, underwater){
  gltfScene.updateMatrixWorld(true);
  gltfScene.traverse(m => {
    if(!m.isMesh) return;
    let mat = m.material;
    if(underwater){                      // Sichttiefe wie bei allem unter Wasser
      mat = underwaterFade(mat.clone());
    }
    const im = new THREE.InstancedMesh(m.geometry, mat, mats.length);
    const tmp = new THREE.Matrix4();
    mats.forEach((mm, i) => im.setMatrixAt(i, tmp.multiplyMatrices(mm, m.matrixWorld)));
    im.computeBoundingSphere();      // sonst cullt three die Instanzen weg
    im.castShadow = true; im.receiveShadow = true;
    scene.add(im);
  });
}

const rnd = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// Runde Felsmodelle: Pirate Kit und die Rock_3-Reihe aus dem Forest Nature Pack.
// Die anderen KayKit-Felsen sind gestufte Plattformen und passen nicht.
const ROCK_FILES = [
  M + 'Quaternius Pirate Kit/glTF/Environment_Rock_1.glb',
  M + 'Quaternius Pirate Kit/glTF/Environment_Rock_2.glb',
  M + 'Quaternius Pirate Kit/glTF/Environment_Rock_3.glb',
  M + 'Quaternius Pirate Kit/glTF/Environment_Rock_4.glb',
  M + 'Quaternius Pirate Kit/glTF/Environment_Rock_5.glb',
  NATURE + 'Rock_3_C_Color1.gltf', NATURE + 'Rock_3_E_Color1.gltf',

// Platz des Fischerhauses: Ufer der ersten Insel in Richtung Bucht
const HOUSE_SPOT = (() => {
  const [cx, cz, r] = [ISLANDS[0][0], ISLANDS[0][1], ISLANDS[0][2]];
  const dir = new THREE.Vector2(-cx, 20 - cz).normalize();
  let t = 0;
  while(t < r + 40 && terrainH(cx + dir.x * t, cz + dir.y * t) > 0.25) t += 0.5;
  return {x: cx + dir.x * t, z: cz + dir.y * t, dir};
})();

// Bäume für die ganze Welt: Laubbäume, Birken, Kiefern, dazu ein paar kahle
const LEAFY = ['Tree_1', 'Tree_2', 'Tree_4', 'Tree_5', 'Tree_7', 'Tree_9', 'Tree_10',
  'Birch_2', 'Birch_4', 'Birch_5', 'Birch_8', 'Pine_1', 'Pine_2', 'Pine_4', 'DeadTree_3'];
const LEAFY_DIR = M + 'Quaternius Stylized Tree Pack/glTF/';
// Das Pack bringt keine Texturen mit, alle Materialien sind weiß
const LEAFY_COLORS = {
  Bark: 0x6a4a31, Birch_Bark: 0xd9d4c4,
  Tree_Leaves: 0x4e7f3a, Birch_Leaves: 0x76a344, Pine_Leaves: 0x2f6242,
};
function colorLeafy(scene3){
  scene3.traverse(o => {
    if(!o.isMesh) return;
    const c = LEAFY_COLORS[o.material.name];
    if(c === undefined) return;
    const mat = o.material.clone();
    mat.color.setHex(c);
    o.material = mat;
  });
  return scene3;
}

async function buildNature(){
  const leafy = {};
  for(const n of LEAFY) leafy[n] = [];
  // Felsmodelle vorab laden und ihre Größe messen, um auf Zielgrößen zu normieren
  const rocks = [];
  for(const f of ROCK_FILES){
    try{
      const g = await load(f);
      const box = new THREE.Box3().setFromObject(g.scene), size = new THREE.Vector3();
      box.getSize(size);
      rocks.push({scene: g.scene, unit: Math.max(size.x, size.y, size.z), land: [], uw: []});
    } catch(e){ console.warn('Fels fehlt', f, e); }
  }
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(),
    p = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), axis = new THREE.Vector3();
  const putRock = (r, list, x, z, h, target, sink) => {
    const k = target / r.unit;
    p.set(x, h - target * sink, z);
    axis.set((rnd() - 0.5) * 0.35, 1, (rnd() - 0.5) * 0.35).normalize();   // leicht verkippt
    q.setFromAxisAngle(axis, rnd() * 6.28);
    s.set(k * (0.85 + rnd() * 0.35), k * (0.8 + rnd() * 0.4), k * (0.85 + rnd() * 0.35));
    list.push(m.compose(p, q, s).clone());
  };
  for(let i = 0; i < 9000; i++){
    const x = (rnd() - 0.5) * WORLD * 0.96, z = (rnd() - 0.5) * WORLD * 0.96;
    const h = meshH(x, z);
    if(h > 24 || !rocks.length) continue;
    const r = rocks[(rnd() * rocks.length) | 0];
    if(h < -1.2){
      // große Brocken auf dem Grund: selten, fleckenweise
      if(h < -13 || rnd() > 0.09) continue;
      if(fbm(x * 0.035 + 61, z * 0.035 - 12) < 0.02) continue;
      putRock(r, r.uw, x, z, h, 1.6 + rnd() * 3.0, 0.3);
      continue;
    }
    if(h < -1.5) continue;
    // rund um Haus und Steg bleibt es frei
    if(Math.hypot(x - HOUSE_SPOT.x, z - HOUSE_SPOT.z) < 16) continue;
    const slope = Math.abs(meshH(x + 1, z) - h) + Math.abs(meshH(x, z + 1) - h);
    if(h < 1.6){
      if(rnd() > 0.12) continue;
      putRock(r, r.land, x, z, h, 0.4 + rnd() * 0.9, 0.25);
      continue;
    }
    if(slope > 1.4){
      if(rnd() > 0.3) continue;
      putRock(r, r.land, x, z, h, 0.5 + rnd() * 1.3, 0.25);
      continue;
    }
    if(fbm(x * 0.02 + 50, z * 0.02) > -0.08 || rnd() < 0.15){
      // seltene kahle Bäume nur vereinzelt
      let name = LEAFY[(rnd() * (LEAFY.length - 1)) | 0];
      if(rnd() < 0.04) name = 'DeadTree_3';
      q.setFromAxisAngle(up, rnd() * 6.28);
      p.set(x, h - 0.15, z);
      s.setScalar(0.8 + rnd() * 0.5);            // Modelle sind schon 4-9 m hoch
      leafy[name].push(m.compose(p, q, s).clone());
    }
  }
  for(const r of rocks){
    if(r.land.length) scatter(r.scene, r.land, false);
    if(r.uw.length) scatter(r.scene, r.uw, true);
  }
  await Promise.all([
    ...Object.keys(leafy).map(async n => {
      if(!leafy[n].length) return;
      try{ scatter(colorLeafy((await load(LEAFY_DIR + n + '.glb')).scene), leafy[n]); }
      catch(e){ console.warn('Laubbaum fehlt', n, e); }
    }),
  ]);
}

// Fischerhaus mit flachem Steg auf einer Insel. Der Steg ist selbst gebaut,
// damit er niedrig genug liegt, um mit dem Ruderboot anzulegen.
async function buildIslandHouse(){
  const {x: sx, z: sz, dir} = HOUSE_SPOT;                  // Ufer der Insel
  const wood = underwaterFade(new THREE.MeshLambertMaterial({color: 0x8a5a33}));
  const woodDark = underwaterFade(new THREE.MeshLambertMaterial({color: 0x5c3a22}));
  const group = new THREE.Group();

  const DECK_Y = 0.42, LEN = 12, WIDTH = 1.7;
  const ang = Math.atan2(dir.x, dir.y);
  group.position.set(sx, 0, sz);
  group.rotation.y = ang;
  // Planken quer, mit kleinen Fugen
  for(let i = 0; i < 24; i++){
    const plank = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, 0.07, 0.42), i % 3 ? wood : woodDark);
    plank.position.set(0, DECK_Y, 0.5 + i * 0.48);
    shadows(plank);
    group.add(plank);
  }
  // Längsträger und Pfosten bis zum Grund
  for(const sxSide of [-1, 1]){
    const beam = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, LEN), woodDark);
    beam.position.set(sxSide * (WIDTH / 2 - 0.1), DECK_Y - 0.09, 0.5 + LEN / 2 - 0.3);
    shadows(beam);
    group.add(beam);
    for(let i = 0; i <= 5; i++){
      const zz = 0.8 + i * 2.2;
      const gx = sx + dir.x * zz + dir.y * sxSide * (WIDTH / 2 - 0.1);
      const gz = sz + dir.y * zz - dir.x * sxSide * (WIDTH / 2 - 0.1);
      const ground = meshH(gx, gz);
      const h = DECK_Y - ground + 0.2;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, h, 7), woodDark);
      post.position.set(sxSide * (WIDTH / 2 - 0.1), DECK_Y - h / 2, zz);
      shadows(post);
      group.add(post);
    }
  }
  // zwei Pfosten zum Festmachen
  for(const sxSide of [-1, 1]){
    const bol = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.55, 7), wood);
    bol.position.set(sxSide * (WIDTH / 2 + 0.06), DECK_Y + 0.2, 0.5 + LEN - 1.2);
    shadows(bol);
    group.add(bol);
  }
  scene.add(group);

  // Haus etwas landeinwärts, zum Steg ausgerichtet
  try{
    const house = (await load(M + 'Quaternius Ultimate Buildings Pack/glTF/Models with Materials/1Story_GableRoof_Mat.glb')).scene;
    fit(house, 7, 'x');          // 70 % der vorigen Größe
    shadows(house);
    const hx = sx - dir.x * 8, hz = sz - dir.y * 8;
    house.position.set(hx, meshH(hx, hz) - 0.85, hz);   // tiefer, damit die Vorderseite aufliegt
    house.rotation.y = ang;   // Tür (+Z-Seite des Modells) zeigt zum Steg
    scene.add(house);
  } catch(e){ console.warn('Haus fehlt', e); }

  // ein paar Fässer am Ufer
  try{
    const barrel = (await load(M + 'Quaternius Pirate Kit/glTF/Prop_Barrel.glb')).scene;
    for(let i = 0; i < 3; i++){
      const b = barrel.clone();
      fit(b, 0.7, 'y');
      shadows(b);
      const bx = sx - dir.x * (2.5 + i * 0.9) + dir.y * (1.6 - i * 0.5);
      const bz = sz - dir.y * (2.5 + i * 0.9) - dir.x * (1.6 - i * 0.5);

function retarget(clip){
  const keep = clip.tracks.filter(t => !t.name.endsWith('.scale') &&
    (!t.name.endsWith('.position') || /^(root|hips)\./.test(t.name)));
  return new THREE.AnimationClip(clip.name, clip.duration, keep);
}
function play(name, {fade = 0.3, once = false, speed = 1} = {}){
  const a = actions[name];
  if(!a) return null;
  if(curAction === a && !once) return a;
  a.reset(); a.timeScale = speed;
  a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);

// scharfe Schatten ins Boot, Bäume und Inseln kommen weiter aus der Weltkarte.
const patchedMats = new Map();
function boatShadowMaterial(mat){
  if(patchedMats.has(mat)) return patchedMats.get(mat);
  const m = mat.clone();
  m.transparent = false;   // sonst nach der Rumpfmaske gezeichnet und unsichtbar
  m.depthWrite = true;
  m.onBeforeCompile = (sh) => {
    const chunk = THREE.ShaderChunk.lights_fragment_begin.replace(
      'vDirectionalShadowCoord[ i ] ) : 1.0;',
      `vDirectionalShadowCoord[ i ] ) : 1.0;
        #if NUM_DIR_LIGHT_SHADOWS > 1
        if(UNROLLED_LOOP_INDEX == 0) directLight.color *= receiveShadow ? getShadow( directionalShadowMap[ 1 ],
          directionalLightShadows[ 1 ].shadowMapSize, directionalLightShadows[ 1 ].shadowIntensity,
          directionalLightShadows[ 1 ].shadowBias, directionalLightShadows[ 1 ].shadowRadius, vDirectionalShadowCoord[ 1 ] ) : 1.0;
        #endif`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <lights_fragment_begin>', chunk);
  };
  m.customProgramCacheKey = () => 'boatShadow';
  patchedMats.set(mat, m);
  return m;
}

// Unsichtbare Deckfläche auf Höhe des Bootsrands: schreibt nur Tiefe, damit Wasser
// und Schattenfläche nicht durch den Bootsboden scheinen.
function makeHullMask(model){
  model.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(hull.matrixWorld).invert();
  const pts = [], v = new THREE.Vector3();
  let maxY = -1e9;
  model.traverse(o => {
    if(!o.isMesh) return;
    const pos = o.geometry.attributes.position;
    for(let i = 0; i < pos.count; i++){
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld).applyMatrix4(inv);
      pts.push(v.clone());
    }
  });
  // Rumpfumriss knapp über der Wasserlinie
  const band = pts.filter(p => p.y > 0.12 && p.y < 0.3).map(p => new THREE.Vector2(p.x, p.z));
  const hullPts = convexHull(band).map(p => p.multiplyScalar(0.96));
  const shape = new THREE.Shape(hullPts);
  const geo = new THREE.ShapeGeometry(shape).rotateX(Math.PI / 2);
  const mask = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({colorWrite: false, side: THREE.DoubleSide}));
  mask.position.y = 0.2;
  mask.renderOrder = 10;   // nach allen undurchsichtigen Objekten, vor dem Wasser
  return mask;
}
function convexHull(p){
  p = p.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for(const q of p){ while(lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for(const q of p.reverse()){ while(up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

let bones = null;
function grabBones(ch){
  const g = (n) => ch.getObjectByName(n);
  bones = {spine: g('spine'), chest: g('chest'),
    hips: g('hips'),
    l: [g('upperarml'), g('lowerarml'), g('handl')],
    r: [g('upperarmr'), g('lowerarmr'), g('handr')]};
}
const _qa = new THREE.Quaternion(), _qb = new THREE.Quaternion();
const _qw = new THREE.Quaternion(), _qp = new THREE.Quaternion();   // nur in rotateBoneWorld
const _tl = new THREE.Vector3(), _tr = new THREE.Vector3();          // Zielpunkte der Hände
const _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3(),
      _u = new THREE.Vector3(), _v = new THREE.Vector3(), _n = new THREE.Vector3();
// Weltdrehung auf einen Knochen anwenden (lokal umgerechnet)
function rotateBoneWorld(bone, q){
  bone.getWorldQuaternion(_qw);
  bone.parent.getWorldQuaternion(_qp);
  bone.quaternion.copy(_qp.invert().multiply(q).multiply(_qw));
  bone.updateMatrixWorld(true);
}
function solveArm(chain, target){
  const [up, lo, hand] = chain;
  if(!up || !lo || !hand) return;
  up.updateMatrixWorld(true);
  up.getWorldPosition(_a); lo.getWorldPosition(_b); hand.getWorldPosition(_c);
  const l1 = _a.distanceTo(_b), l2 = _b.distanceTo(_c);
  const d = THREE.MathUtils.clamp(_a.distanceTo(target), Math.abs(l1 - l2) + 0.02, l1 + l2 - 0.02);
  // Ellbogenwinkel über den Kosinussatz auf den Zielabstand bringen
  _u.copy(_a).sub(_b); _v.copy(_c).sub(_b);
  const cur = Math.acos(THREE.MathUtils.clamp(_u.dot(_v) / (_u.length() * _v.length()), -1, 1));
  const des = Math.acos(THREE.MathUtils.clamp((l1 * l1 + l2 * l2 - d * d) / (2 * l1 * l2), -1, 1));
  _n.copy(_u).cross(_v);
  if(_n.lengthSq() < 1e-8) _n.set(0, 1, 0); else _n.normalize();
  rotateBoneWorld(lo, _qa.setFromAxisAngle(_n, des - cur));
  // Oberarm so drehen, dass die Hand aufs Ziel zeigt
  hand.getWorldPosition(_b);
  _u.copy(_b).sub(_a).normalize();
  _v.copy(target).sub(_a).normalize();
  rotateBoneWorld(up, _qa.setFromUnitVectors(_u, _v));
}
// Griffpunkt einer Riemen-Halterung in Weltkoordinaten
function gripOf(pivot, side, out){
  return pivot.localToWorld(out.set(-side * 0.57, 0, 0));
}
// Die Sitzhaltung hebt die Hüfte über den Boden – Höhe einmal an die Bank anpassen
function fitSeatToBench(){
  const hips = hull.worldToLocal(bones.hips.getWorldPosition(new THREE.Vector3()));
  seat.position.y += BENCH_Y + 0.07 - hips.y;
  seatRowY = seat.position.y;
  // Die Bank gehört unter den Hintern, nicht unter die Beine: an die Hüfte rücken
  for(const part of benchParts) part.position.z = hips.z - 0.02;
  seat.userData.fitToBench = false;
}
let rowPoseRuns = 0, rowPoseErr = null;
function applyRowPose(){
  if(seat.userData.fitToBench && bones) fitSeatToBench();
  rowPoseRuns++;
  if(!bones || !oars.length || state.mode !== 'row') return;
  // Oberkörper wiegt sich mit dem Schlag
  if(bones.spine){
    rotateBoneWorld(bones.spine, _qb.setFromAxisAngle(
      _n.set(1, 0, 0).applyQuaternion(seat.getWorldQuaternion(_qa)), state.stroke * 0.3));
  }
  // Die Schulter "l" des Rigs liegt im Boot auf der +x-Seite, daher gekreuzt zuordnen
  solveArm(bones.l, gripOf(oars[1], 1, _tl.set(0, 0, 0)));
  solveArm(bones.r, gripOf(oars[0], -1, _tr.set(0, 0, 0)));
}

// Weiche Schattierung: Flächennormalen je Position mitteln. computeVertexNormals
// allein reicht nicht, weil die Modelle an den Kanten getrennte Vertices haben.
function smoothNormals(geo, tol = 1e-4){
  const pos = geo.attributes.position;
  const idx = geo.index ? geo.index.array : null;
  const count = idx ? idx.length : pos.count;
  const acc = new Map(), normals = new Float32Array(pos.count * 3);
  const key = (i) => [pos.getX(i), pos.getY(i), pos.getZ(i)]
    .map(v => Math.round(v / tol)).join(',');
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(),
    ab = new THREE.Vector3(), ac = new THREE.Vector3(), n = new THREE.Vector3();
  for(let f = 0; f < count; f += 3){
    const i0 = idx ? idx[f] : f, i1 = idx ? idx[f + 1] : f + 1, i2 = idx ? idx[f + 2] : f + 2;
    a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2);
    n.copy(ab.subVectors(b, a)).cross(ac.subVectors(c, a));      // Länge = Flächeninhalt
    for(const i of [i0, i1, i2]){
      const k = key(i);
      const e = acc.get(k) || acc.set(k, new THREE.Vector3()).get(k);
      e.add(n);
    }
  }
  for(let i = 0; i < pos.count; i++){
    const e = acc.get(key(i));
    if(!e) continue;
    n.copy(e).normalize();
    normals.set([n.x, n.y, n.z], i * 3);
  }
  geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
  return geo;
}

// Die Spur ist ein Band aus den letzten Bootspositionen: es wird nach hinten

function makeFoamTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 256);
  for(let i = 0; i < 420; i++){
    const x = Math.random() * 256, y = Math.random() * 256, r = 3 + Math.random() * 14;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.25 + Math.random() * 0.5;
    grd.addColorStop(0, `rgba(255,255,255,${a})`);
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    // an den Rändern spiegeln, damit die Kachel nahtlos bleibt
    for(const dx of [-256, 0, 256]) for(const dy of [-256, 0, 256]){
      g.beginPath(); g.arc(x + dx, y + dy, r, 0, 6.283); g.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

  const dir = new THREE.Vector3(-Math.sin(state.heading), 0, -Math.cos(state.heading));
  const stern = boat.position.clone().addScaledVector(dir, -1.5);
  const right = new THREE.Vector3(dir.z, 0, -dir.x);
  const str = THREE.MathUtils.clamp((sp - 0.25) / 2.2, 0, 1);
  // Der letzte Punkt ist der mitlaufende Kopf am Heck. Erst wenn er weit genug
  // vom vorletzten (festen) Punkt weg ist, wird er festgeschrieben und ein
  // neuer Kopf angelegt. Sonst zieht man ewig denselben Punkt mit.
  const mk = () => ({p: stern.clone(), r: right.clone(), born: t, str,
    d: wake.dist, wob: 0.75 + rnd() * 0.5});
  const head = wake.pts[wake.pts.length - 1];
  if(!head){
    wake.pts.push(mk());
  } else {
    head.p.copy(stern); head.r.copy(right); head.born = t; head.str = str;
    const anchor = wake.pts[wake.pts.length - 2];
    const gap = anchor ? anchor.p.distanceTo(stern) : 1e9;
    if(gap > 0.45){
      wake.dist += Math.min(gap, 2);
      head.d = wake.dist;
      wake.pts.push(mk());
      if(wake.pts.length > WAKE_N) wake.pts.shift();
    }
  }
  const pos = wakeGeo.attributes.position, uv = wakeGeo.attributes.uv, col = wakeGeo.attributes.color;
  const n = wake.pts.length, life = 4;   // kürzere Spur
  for(let i = 0; i < WAKE_N; i++){
    const k = Math.min(i, n - 1);
    const e = wake.pts[k];
    if(!e){ col.setXYZW(i * 2, 1, 1, 1, 0); col.setXYZW(i * 2 + 1, 1, 1, 1, 0); continue; }
    const age = THREE.MathUtils.clamp((t - e.born) / life, 0, 1);
    const w = (0.55 + age * 2.4) * (0.4 + e.str) * e.wob;     // nach hinten breiter
    const fade = (1 - age) * (1 - age);
    const near = Math.min(1, (n - 1 - k) / 2);                // direkt am Heck sanft einblenden
    const alpha = (i < n ? 1 : 0) * e.str * fade * near * 0.42;   // deutlich zarter
    for(const side of [0, 1]){
      const j = i * 2 + side, sgn = side ? 1 : -1;
      const x = e.p.x + e.r.x * w * sgn, z = e.p.z + e.r.z * w * sgn;
      pos.setXYZ(j, x, waveH(x, z, t) + 0.05, z);
      uv.setXY(j, side ? 1 : 0, e.d * 0.5);
      col.setXYZW(j, 1, 1, 1, alpha);        // Rand wird im Shader weich (siehe uv)
    }
  }
  pos.needsUpdate = uv.needsUpdate = col.needsUpdate = true;
}

// ---------- Wal auf dem offenen Meer ----------
// Zieht weit draußen im tiefen Wasser seine Runden, meist knapp außer Sicht,
// taucht gelegentlich auf und bläst.
const whale = {obj: null, mixer: null, t: rnd() * 100, blowAt: 25, spouts: []};
// Bahn geprüft: überall mindestens 14 m Wassertiefe, keine Insel im Weg
const WHALE_PATH = {cx: 120, cz: 300, r: 120, sq: 0.6, speed: 0.016};

// Die Schwanzflosse des Modells ist sehr klobig: zum Ende hin dünner und
// etwas breiter ziehen. Der Übergang läuft weich über den Schwanzstiel.
function slimFluke(geo){
  const p = geo.attributes.position;
  for(let i = 0; i < p.count; i++){
    const z = p.getZ(i);
    const t = THREE.MathUtils.smoothstep(z, -4.2, -6.0);   // 0 am Stiel, 1 an der Fluke
    if(t <= 0) continue;
    p.setY(i, p.getY(i) * THREE.MathUtils.lerp(1, 0.35, t));
    p.setX(i, p.getX(i) * THREE.MathUtils.lerp(1, 1.2, t));
  }
  p.needsUpdate = true;
  return geo;
}

async function buildWhale(){
  const g = await load(M + 'Quaternius Animated Fish Pack/glTF/Whale.glb');
  const w = g.scene;
  fit(w, 39, 'z');            // dreimal so groß
  w.traverse(m => {
    if(!m.isMesh) return;
    m.castShadow = false;
    m.frustumCulled = false;
    slimFluke(m.geometry);                  // Schwanzflosse filigraner
    smoothNormals(m.geometry);              // weiche statt facettierter Schattierung
    const mat = m.material.clone();
    mat.flatShading = false;
    m.material = underwaterFade(mat);
  });
  const wrap = new THREE.Group();
  wrap.add(w);
  scene.add(wrap);
  whale.obj = wrap;
  whale.model = w;
  // höchster Punkt des Modells, damit der Rücken immer unter Wasser bleibt
  whale.top = new THREE.Box3().setFromObject(w).max.y;
  whale.mixer = new THREE.AnimationMixer(w);
  const clip = g.animations.find(a => a.name === 'Swim') || g.animations[0];
  if(clip){
    const act = whale.mixer.clipAction(clip);
    act.timeScale = 0.28;        // ruhiger Schlag der Fluke
    act.play();
  }
}

// Blas: ein paar aufsteigende, verblassende Tropfenwolken
const spoutGeo = new THREE.SphereGeometry(0.5, 8, 6);
function spout(x, z){
  for(let i = 0; i < 7; i++){
    const m = new THREE.Mesh(spoutGeo, new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false}));
    m.position.set(x + (rnd() - 0.5) * 1.2, 0.4, z + (rnd() - 0.5) * 1.2);
    m.renderOrder = 4;
    scene.add(m);
    whale.spouts.push({m, t: 0, v: 4 + rnd() * 2.5, sp: 0.7 + rnd() * 0.7});
  }
}

// Der Wal steuert selbst: er hält auf ein Ziel zu, tastet dabei die Tiefe
// voraus ab und weicht flachen Stellen aus. Deshalb schwimmt er zwischen den
// Inseln nur dort durch, wo er auch wirklich durchpasst.
const WHALE_NEED = 8;            // Mindesttiefe unter ihm
const WHALE_SPEED = 2.4;         // m/s
const WHALE_TURN = 0.11;         // rad/s, ein 39-m-Wal wendet träge
const WHALE_VISIT_FIRST = 300;   // erster Ausflug in die Bucht nach 5 min
const WHALE_VISIT_EVERY = 900;   // danach alle 15 min

function whaleCircuitTarget(){
  // Punkt etwas voraus auf der Ellipse
  const p = whale.pos;
  const a = Math.atan2((p.z - WHALE_PATH.cz) / WHALE_PATH.sq, p.x - WHALE_PATH.cx) + 0.5;
  return new THREE.Vector3(WHALE_PATH.cx + Math.cos(a) * WHALE_PATH.r, 0,
    WHALE_PATH.cz + Math.sin(a) * WHALE_PATH.r * WHALE_PATH.sq);
}
// Ziel für den Ausflug: tiefe Stelle mitten in der Bucht
function whaleBayTarget(){
  for(let i = 0; i < 400; i++){
    const x = (rnd() - 0.5) * 320, z = (rnd() - 0.5) * 280 + 40;
    if(-meshH(x, z) < WHALE_NEED + 3) continue;
    return new THREE.Vector3(x, 0, z);
  }
  return new THREE.Vector3(0, 0, 60);
}
function whaleSteer(dt){
  const p = whale.pos;
  const want = Math.atan2(whale.target.x - p.x, whale.target.z - p.z);
  // fünf Richtungen 30 m voraus prüfen, die freie mit dem kleinsten Umweg nehmen
  let best = null, bestScore = -1e9, deepest = null, deepestD = -1e9;
  for(const off of [0, 0.4, -0.4, 0.9, -0.9, 1.5, -1.5]){
    const yaw = whale.yaw + off;
    const d = -meshH(p.x + Math.sin(yaw) * 32, p.z + Math.cos(yaw) * 32);
    if(d > deepestD){ deepestD = d; deepest = yaw; }
    if(d < WHALE_NEED) continue;
    let diff = want - yaw;
    diff = Math.abs(Math.atan2(Math.sin(diff), Math.cos(diff)));
    const score = -diff - Math.abs(off) * 0.25;
    if(score > bestScore){ bestScore = score; best = yaw; }
  }
  const goal = best !== null ? best : deepest;   // notfalls Richtung tiefstes Wasser
  let d = goal - whale.yaw;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  whale.yaw += THREE.MathUtils.clamp(d, -WHALE_TURN * dt, WHALE_TURN * dt);
  p.x += Math.sin(whale.yaw) * WHALE_SPEED * dt;
  p.z += Math.cos(whale.yaw) * WHALE_SPEED * dt;
}

function updateWhale(dt, t){
  if(!whale.obj) return;
  whale.t += dt;
  if(!whale.pos){
    whale.pos = new THREE.Vector3(WHALE_PATH.cx + WHALE_PATH.r, 0, WHALE_PATH.cz);
    whale.yaw = Math.PI / 2;
    whale.mode = 'circuit';
    whale.target = whaleCircuitTarget();
    whale.nextVisit = WHALE_VISIT_FIRST;
  }
  // Ausflug in die Bucht planen bzw. beenden
  if(whale.mode === 'circuit' && whale.t > whale.nextVisit){
    whale.mode = 'visit';
    whale.target = whaleBayTarget();
    whale.visitUntil = whale.t + 420;          // notfalls nach 7 min abbrechen
  }
  if(whale.mode === 'visit'){
    if(whale.pos.distanceTo(whale.target) < 25 || whale.t > whale.visitUntil){
      whale.mode = 'return';
      whale.target = new THREE.Vector3(WHALE_PATH.cx, 0, WHALE_PATH.cz + WHALE_PATH.r * WHALE_PATH.sq);
    }
  } else if(whale.mode === 'return'){
    if(whale.pos.distanceTo(whale.target) < 40){
      whale.mode = 'circuit';
      whale.nextVisit = whale.t + WHALE_VISIT_EVERY;
    }
  } else {
    whale.target = whaleCircuitTarget();
  }
  whaleSteer(dt);

  // Tauchzyklus: er bleibt immer unter Wasser, kommt aber zeitweise so dicht
  // unter die Oberfläche, dass man ihn als Schatten sieht.
  const cycle = (whale.t % 95) / 95;
  const up = Math.pow(Math.max(0, Math.sin(cycle * Math.PI * 2 - 1.2)), 3);
  const shallow = -(whale.top + 1.0), deep = shallow - 5;
  let y = THREE.MathUtils.lerp(deep, shallow, up);
  y = Math.max(y, meshH(whale.pos.x, whale.pos.z) + whale.top + 1.5);   // nicht aufsetzen
  y = Math.min(y, shallow);
  const prevY = whale.obj.position.y;
  whale.obj.position.set(whale.pos.x, y, whale.pos.z);
  whale.obj.rotation.y = whale.yaw;
  whale.obj.rotation.x = THREE.MathUtils.lerp(whale.obj.rotation.x, (y - prevY) * -1.5, Math.min(1, dt * 2));
  whale.mixer.update(dt);
  // dicht unter der Oberfläche kräuselt sich das Wasser über ihm
  if(y > shallow - 1.2 && Math.random() < dt * 1.5) spawnRing(whale.pos.x, whale.pos.z, 1.4, 3.5, 0.12);
  for(let i = whale.spouts.length - 1; i >= 0; i--){
    const s = whale.spouts[i];
    s.t += dt;
    s.m.position.y += s.v * dt;
    s.v -= dt * 2.2;
    s.m.scale.setScalar(s.sp * (1 + s.t * 0.8));
    s.m.material.opacity = 0.6 * Math.max(0, 1 - s.t / 2.5);
    if(s.t > 2.5){ scene.remove(s.m); s.m.material.dispose(); whale.spouts.splice(i, 1); }
  }
}

// ---------- Vögel ----------
// Schlanke Möwen, selbst gebaut: das Taubenmodell aus dem Monster-Pack ist zu
// pummelig. Kreisen über der Bucht, legen sich in die Kurven, schlagen die Flügel.
const birds = [];
const gullBody = new THREE.MeshLambertMaterial({color: 0xf2efe8});
const gullDark = new THREE.MeshLambertMaterial({color: 0x9aa2ab});
function makeGull(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), gullBody);
  body.scale.set(0.3, 0.3, 1.0);             // schmaler Rumpf, klein gegen die Flügel
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 10), gullBody);
  head.scale.set(0.38, 0.38, 0.48);
  head.position.set(0, 0.05, 0.5);
  g.add(head);
  const beak = new THREE.Mesh(smoothNormals(new THREE.ConeGeometry(0.04, 0.18, 8)), gullDark);
  beak.rotation.x = Math.PI / 2;
  beak.position.set(0, 0.04, 0.68);
  g.add(beak);
  const tail = new THREE.Mesh(smoothNormals(new THREE.ConeGeometry(0.13, 0.42, 6)), gullBody);
  tail.rotation.set(-Math.PI / 2, Math.PI / 4, 0);
  tail.position.set(0, 0.02, -0.6);
  tail.scale.set(1, 1, 0.3);
  g.add(tail);
  // Flügel in zwei Teilen: der Außenflügel sitzt auf einem Gelenk und schlägt
  // leicht verzögert nach, dadurch biegt sich die Fläche weich durch.
  const wingPart = (pts, depth) => {
    const sh = new THREE.Shape();
    sh.moveTo(pts[0][0], pts[0][1]);
    for(let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
    sh.closePath();
    // weiche Schattierung wie beim Wal
    return smoothNormals(new THREE.ExtrudeGeometry(sh, {depth, bevelEnabled: false, curveSegments: 8}).rotateX(-Math.PI / 2));
  };
  const innerGeo = wingPart([[0, 0.24], [0.72, 0.12], [0.72, -0.2], [0.16, -0.3]], 0.03);
  const outerGeo = wingPart([[0, 0.12], [0.62, 0.0], [0.66, -0.05], [0, -0.2]], 0.025);
  const wings = [-1, 1].map(side => {
    const shoulder = new THREE.Group();
    const inner = new THREE.Mesh(innerGeo, gullBody);
    inner.scale.x = side;
    shoulder.add(inner);
    const elbow = new THREE.Group();
    elbow.position.x = side * 0.72;
    const outer = new THREE.Mesh(outerGeo, gullBody);
    outer.scale.x = side;
    const tip = new THREE.Mesh(smoothNormals(new THREE.BoxGeometry(0.26, 0.028, 0.12)), gullDark);
    tip.position.set(side * 0.52, 0.005, -0.03);
    elbow.add(outer, tip);
    shoulder.add(elbow);
    shoulder.userData.elbow = elbow;
    g.add(shoulder);
    return shoulder;
  });
  return {g, wings};
}

function buildBirds(){
  for(let i = 0; i < 7; i++){
    const {g, wings} = makeGull();
    g.scale.setScalar(0.7 + rnd() * 0.4);     // aus 45 m Höhe sonst kaum zu sehen
    scene.add(g);
    birds.push({obj: g, wings, flap: 2.2 + rnd() * 1.4, phFlap: rnd() * 6.28,
      cx: (rnd() - 0.5) * 260, cz: (rnd() - 0.5) * 260 + 60,
      // Die Kamera kommt auf höchstens rund 38 m (40 m Abstand, Neigung 1,2 rad),
      // die Möwen ziehen darüber ihre Kreise.
      r: 18 + rnd() * 45, y: 44 + rnd() * 20,
      sp: 0.12 + rnd() * 0.12, ph: rnd() * 6.28, drift: rnd() * 6.28});
  }
}
function updateBirds(dt, t){
  const tmp = new THREE.Vector3();
  for(const b of birds){
    b.ph += dt * b.sp;
    b.drift += dt * 0.03;
    // der Kreismittelpunkt wandert langsam, damit es nicht nach Karussell aussieht
    const cx = b.cx + Math.sin(b.drift) * 40, cz = b.cz + Math.cos(b.drift * 0.7) * 40;
    const x = cx + Math.cos(b.ph) * b.r, z = cz + Math.sin(b.ph) * b.r;
    const y = b.y + Math.sin(b.ph * 1.7) * 1.2;
    tmp.set(x, y, z);
    const prev = b.obj.position;
    if(prev.lengthSq() > 0){
      const yaw = Math.atan2(x - prev.x, z - prev.z);
      let d = yaw - b.obj.rotation.y;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      b.obj.rotation.y += d * Math.min(1, dt * 4);
      b.obj.rotation.z = THREE.MathUtils.lerp(b.obj.rotation.z, -0.3, Math.min(1, dt * 2));
    }
    b.obj.position.copy(tmp);
    // Flügelschlag mit Gleitpausen
    b.phFlap += dt * b.flap;
    const glide = Math.max(0, Math.sin(b.phFlap * 0.12));
    const amp = 0.15 + 0.6 * (1 - glide);
    const swing = Math.sin(b.phFlap) * amp;
    const lag = Math.sin(b.phFlap - 0.7) * amp * 0.85;   // Außenflügel folgt verzögert
    b.wings[0].rotation.z = -swing;
    b.wings[1].rotation.z = swing;
    b.wings[0].userData.elbow.rotation.z = -lag;
    b.wings[1].userData.elbow.rotation.z = lag;
  }
}

const state = {
  mode: 'row',            // row | fish
  phase: 'idle',          // idle | casting | flying | waiting | bite | fight | catch
  speed: 0, heading: 0, turn: 0, rowPhase: 0, stroke: 0,
  castFrom: new THREE.Vector3(), castTo: new THREE.Vector3(), t: 0,
  biteAt: 0, school: null, fish: null, tension: 0, progress: 0, surge: 0,
  bucket: [],
};
const keys = {};
let pointerDown = false, holdReel = false;
const hintEl = document.getElementById('hint');
const setHint = (s) => { hintEl.innerHTML = s; hintEl.style.opacity = s ? 1 : 0; };
const isTouch = matchMedia('(pointer:coarse)').matches;
let usingPad = false;
const pick = (touch, mouse, pad) => usingPad ? pad : isTouch ? touch : mouse;

function toast(big, small, ms = 2600){
  const t = document.getElementById('toast');
  t.innerHTML = big + (small ? `<small>${small}</small>` : '');
  t.classList.add('show');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('show'), ms);
}

function enterFishing(){
  if(state.mode === 'fish') return;
  if(Math.abs(state.speed) > 0.6){ toast('Erst anhalten', 'Das Boot treibt noch zu schnell.', 1600); return; }
  state.mode = 'fish'; state.phase = 'idle';
  rod.visible = true;
  seat.position.set(0, 0.02, -0.35);   // zum Angeln steht die Figur vor der Bank
  oars.forEach(o => o.visible = false);
  play('Fishing_Idle', {fade: 0.6});
  document.getElementById('modeBtn').textContent = 'Rudern (F)';
  setHint(pick('Tippe aufs Wasser, um auszuwerfen', 'Klicke aufs Wasser, um auszuwerfen · F zurück zum Rudern', 'Linker Stick zielen · Ⓐ auswerfen · Ⓨ zurück zum Rudern'));
}
function leaveFishing(){
  if(state.mode !== 'fish') return;
  if(state.fish) releaseFish();
  state.mode = 'row'; state.phase = 'idle';
  rod.visible = false; bobber.visible = false; line.visible = false; aimRing.visible = false;
  oars.forEach(o => o.visible = true);
  seat.position.set(0, seatRowY, 0.1);
  seat.rotation.y = 0;
  document.getElementById('fight').style.display = 'none';
  play('Sit_Chair_Idle', {fade: 0.6});
  document.getElementById('modeBtn').textContent = 'Angeln (F)';
  setHint(pick('Joystick zum Rudern · Angeln, wenn du Fische siehst', 'W A S D rudern · F angeln · Ziehen dreht die Kamera', 'Linker Stick rudern · Ⓨ angeln · Rechter Stick dreht die Kamera'));
}

function cast(target){
  const bp = boat.position;
  const d = new THREE.Vector3(target.x - bp.x, 0, target.z - bp.z);
  const len = THREE.MathUtils.clamp(d.length(), 3, 22);
  d.setLength(len);
  state.castTo.set(bp.x + d.x, 0, bp.z + d.z);
  // Figur dreht sich zum Ziel (lokal im Boot); Figur schaut lokal nach +Z
  const local = boat.worldToLocal(state.castTo.clone());
  seat.userData.targetYaw = Math.atan2(local.x, local.z - seat.position.z);
  state.phase = 'casting'; state.t = 0;
  bobber.visible = false; line.visible = false;
  play('Fishing_Cast', {once: true, fade: 0.2});
  setHint('');
  sfx('whoosh');
}
function reelIn(){
  state.phase = 'retrieve'; state.t = 0;
  state.castFrom.copy(bobber.position);
  play('Fishing_Reeling', {fade: 0.2, speed: 1.6});
}
function hookFish(){
  state.phase = 'fight';
  state.tension = 0.25; state.progress = 0.05; state.surge = 0;
  document.getElementById('fight').style.display = 'block';
  play('Fishing_Struggling', {fade: 0.15});
  setHint(pick('Halten zum Einholen – nicht zu fest!', 'Maustaste oder Leertaste halten zum Einholen – Spannung beachten!', 'Ⓐ oder RT halten zum Einholen – Spannung beachten!'));
  sfx('splash');
}
function releaseFish(){
  const f = state.fish;
  if(!f) return;
  f.mode = 'flee'; f.fleeT = 0;
  fishClip(f, 'Swimming_Fast');
  state.fish = null;
}
function missed(msg, sub){
  toast(msg, sub, 2000);
  releaseFish();
  document.getElementById('fight').style.display = 'none';
  state.phase = 'idle'; bobber.visible = false; line.visible = false;
  play('Fishing_Idle', {fade: 0.4});
  setHint(pick('Tippe aufs Wasser, um erneut auszuwerfen', 'Klicke aufs Wasser, um erneut auszuwerfen', 'Linker Stick zielen · Ⓐ erneut auswerfen'));
}
function landFish(){
  const f = state.fish;
  const sp = SPECIES[f.school.species];
  const kg = sp.kg[0] + Math.pow(Math.random(), 2) * (sp.kg[1] - sp.kg[0]);
  state.phase = 'catch'; state.t = 0;
  document.getElementById('fight').style.display = 'none';
  play('Fishing_Catch', {once: true, fade: 0.2});
  fishClip(f, 'Out_Of_Water');
  f.mode = 'landed';
  setHint('');
  f.landFrom = f.obj.position.clone();
  sfx('splash');
  if(state.bucket.length < 10){
    state.bucket.push({name: sp.de, kg});
    toast(sp.de + '!', kg.toFixed(1).replace('.', ',') + ' kg – ab in den Eimer', 2800);
  } else {
    toast(sp.de + '!', 'Der Eimer ist voll – du lässt ihn wieder frei.', 2800);
    f.releaseAfter = true;
  }
  renderBucket();
}
