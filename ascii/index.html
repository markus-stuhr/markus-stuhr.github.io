<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Rotator</title>
<script defer src="/analytics.js"></script>
<style>
:root{--bg:#18181b;--fg:#d5f92c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#ddd;font-family:ui-monospace,Menlo,monospace;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#out{display:block}
#panel{position:fixed;top:12px;left:12px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:12px 14px;border-radius:10px;font-size:12px;display:grid;grid-template-columns:auto auto;gap:8px 10px;align-items:center;max-width:calc(100vw - 24px)}
#panel h1{grid-column:1/3;margin:0 0 2px;font-size:13px;letter-spacing:.1em}
#panel select,#panel input[type=text]{background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:3px 5px;font:inherit}
#panel input[type=color]{width:42px;height:24px;border:none;background:none;padding:0}
#panel button{grid-column:1/3;background:#333;color:#ddd;border:1px solid #555;border-radius:4px;padding:5px;font:inherit;cursor:pointer}
#toggle{position:fixed;top:12px;right:12px;background:rgba(0,0,0,.55);color:#ddd;border:none;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
#credit{position:fixed;bottom:6px;right:10px;font-size:10px;opacity:.45}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="stage"><canvas id="out"></canvas></div>
<div id="panel">
  <h1>ASCII ROTATOR</h1>
  <label>Motiv</label>
  <select id="model">
    <option value="helmet">F1-Helm</option>
    <option value="car" selected>F1-Auto</option>
    <option value="track">Rennstrecke</option>
    <option value="trophy">Pokal</option>
  </select>
  <label id="circL" class="hidden">Strecke</label><select id="circuit" class="hidden"></select>
  <label>Hintergrund</label><input type="color" id="bg" value="#18181b">
  <label>Motivfarbe</label><input type="color" id="fg" value="#d5f92c">
  <label>Zeichen</label>
  <select id="chars">
    <option value=">">&gt;</option>
    <option value="#">#</option>
    <option value="/">/</option>
    <option value="*">*</option>
    <option value="+">+</option>
    <option value="@">@</option>
    <option value="0 1">0 1</option>
    <option value=" .:-=+*#%@">flexibel (nach Helligkeit)</option>
    <option value="custom">eigene…</option>
  </select>
  <label id="customL" class="hidden">Eigene</label><input id="custom" type="text" class="hidden" value="F1" maxlength="20">
  <label>Auflösung</label><input type="range" id="res" min="30" max="260" value="140">
  <label>Glättung</label>
  <select id="ss"><option value="1">aus</option><option value="2">2×</option><option value="4" selected>4×</option></select>
  <label>Schattierung</label><input type="range" id="shade" min="0" max="100" value="50">
  <label>Tempo</label><input type="range" id="speed" min="0" max="100" value="30">
  <label>Kippung</label><input type="range" id="tilt" min="-60" max="60" value="15">
  <label>Video-Länge</label>
  <span id="vlen"></span>
  <button id="png">PNG speichern</button>
  <button id="vid">Video speichern (1 Umdrehung, loopt)</button>
</div>
<button id="toggle">☰</button>
<div id="credit">Modelle: Helm „Low-poly racing helmet“ von flavio (CC-BY-SA 4.0, opengameart.org), Racing car von scaranto (CC0, poly.pizza), Trophy von Casey Tumbers (CC-BY 3.0, poly.pizza) · Strecken: bacinger/f1-circuits (MIT)</div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.167.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.167.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d');

// --- Offscreen 3D-Renderer (klein, wird ausgelesen) ---
const renderer = new THREE.WebGLRenderer({antialias:false, alpha:true, premultipliedAlpha:false, preserveDrawingBuffer:true});
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 9);
scene.add(new THREE.AmbientLight(0xffffff, 0.15));
const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(3, 3, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.35); rim.position.set(-4, -1, -3); scene.add(rim);

const mat = (g=1) => new THREE.MeshStandardMaterial({color:new THREE.Color(g,g,g), roughness:.6, metalness:0});
const pivot = new THREE.Group(); scene.add(pivot);

// Modell zentrieren und auf Radius ~2 skalieren
function fit(obj, r = 2.1){
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3());
  const k = r / box.getBoundingSphere(new THREE.Sphere()).radius;
  const g = new THREE.Group(); obj.position.sub(c); g.add(obj); g.scale.setScalar(k); return g;
}
// Originalfarben als Graustufen behalten, damit Details (Reifen, Visier) als dunklere Zeichen erscheinen
function greyify(obj){
  obj.traverse(o => {
    if (!o.isMesh) return;
    const src = Array.isArray(o.material) ? o.material[0] : o.material;
    const c = src.color || new THREE.Color(1,1,1);
    const l = 0.45 + 0.55 * Math.pow(0.2126*c.r + 0.7152*c.g + 0.0722*c.b, 0.6);
    o.material = mat(l);
    if (src.map) { o.material.map = src.map; o.material.color.setScalar(1); }
  });
  return obj;
}
const loader = new GLTFLoader(), cache = {};
const files = {helmet:'models/helmet.glb', car:'models/car.glb', trophy:'models/trophy.glb'};
async function loadModel(n){
  if (!cache[n]) {
    const gltf = await loader.loadAsync(files[n]);
    let g = fit(greyify(gltf.scene));
    if (n === 'car') g.rotation.y = 0;
    cache[n] = g;
  }
  return cache[n];
}

let circuits = [];
function track(i){
  const c = circuits[i], p = c.p, pts = [];
  for (let k = 0; k < p.length; k += 2) pts.push(new THREE.Vector3(p[k] * 2, 0, p[k+1] * 2));
  // Band aus Streckenpunkten: flache Fahrbahn mit kleiner Kante
  const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.min(1500, pts.length * 3), 0.09, 6, true), mat(1));
  tube.scale.y = 0.35;
  const g = new THREE.Group(); g.add(tube);
  const start = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.12, 0.3), mat(0.25));
  start.position.copy(pts[0]);
  const t = curve.getTangentAt(0); start.rotation.y = Math.atan2(t.x, t.z) + Math.PI/2;
  g.add(start);
  return g;
}

let current, token = 0;
async function setModel(n){
  const my = ++token;
  $('circuit').classList.toggle('hidden', n !== 'track'); $('circL').classList.toggle('hidden', n !== 'track');
  const obj = n === 'track' ? track(+$('circuit').value) : await loadModel(n);
  if (my !== token) return;
  if (current) pivot.remove(current);
  current = obj; pivot.add(current);
}

// --- ASCII-Ausgabe ---
let cols, rows, cw, ch, buf, SS = 4;
const AR = 0.62; // Zeichenbreite/-höhe
function resize(){
  cols = +$('res').value;
  const W = innerWidth, H = innerHeight;
  cw = W / cols; ch = cw / AR;
  rows = Math.floor(H / ch);
  const dpr = devicePixelRatio || 1;
  out.width = W * dpr; out.height = rows * ch * dpr;
  out.style.width = W + 'px'; out.style.height = rows * ch + 'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  renderer.setPixelRatio(1);
  SS = +$('ss').value;
  renderer.setSize(cols * SS, rows * SS, false);
  camera.aspect = (cols * cw) / (rows * ch); camera.updateProjectionMatrix();
  buf = new Uint8Array(cols * rows * SS * SS * 4);
}

function charset(){
  const v = $('chars').value;
  return (v === 'custom' ? $('custom').value || '>' : v);
}

const gl = renderer.getContext();
let angle = 0, last = performance.now();
window.__ascii = { setAngle: a => angle = a, frame: () => frame(performance.now()) };
let recording = false, bbox = null;  // bbox: belegte Zellen [x0,y0,x1,y1] während Vorlauf
function frame(t){
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (!recording) { angle += dt * (+$('speed').value / 100) * 2.5; draw(); }
  requestAnimationFrame(frame);
}
function draw(){
  pivot.rotation.set(+$('tilt').value * Math.PI/180, angle, 0);
  renderer.render(scene, camera);
  gl.readPixels(0, 0, cols * SS, rows * SS, gl.RGBA, gl.UNSIGNED_BYTE, buf);

  const bg = $('bg').value, fg = $('fg').value;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, out.width, out.height);
  ctx.fillStyle = fg;
  ctx.font = `bold ${Math.round(ch * 0.85)}px ui-monospace,Menlo,monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cs = charset(), ramp = cs.length > 2 && cs.startsWith(' ');
  for (let y = 0; y < rows; y++) {
    const ry = rows - 1 - y;
    for (let x = 0; x < cols; x++) {
      // Zelle = Mittel aus SS×SS Pixeln: Abdeckung (Alpha) × Helligkeit → weiche Ränder
      let lum = 0, cov = 0;
      const W = cols * SS;
      for (let sy = 0; sy < SS; sy++) for (let sx = 0; sx < SS; sx++) {
        const i = ((ry * SS + sy) * W + x * SS + sx) * 4;
        const a = buf[i+3] / 255; cov += a; lum += (0.2126*buf[i] + 0.7152*buf[i+1] + 0.0722*buf[i+2]) / 255 * a;
      }
      const n = SS * SS; cov /= n;
      if (cov < 0.08) continue;
      const l = (lum / n) / cov;
      let c;
      const sh = +$('shade').value / 100, ls = Math.pow(Math.min(1, l), 0.5 + 1.8 * sh);
      if (ramp) { c = cs[Math.min(cs.length-1, Math.floor(ls * cs.length))]; ctx.globalAlpha = Math.min(1, cov * 1.3); }
      else {
        const parts = cs.split(' ').filter(Boolean);
        c = parts.length > 1 ? parts[(x*7 + y*13 + Math.floor(((angle % (2*Math.PI) + 2*Math.PI) % (2*Math.PI)) / (2*Math.PI) * 18)) % parts.length] : cs[(x + y) % cs.length];
        ctx.globalAlpha = (l < 0.06 ? 0.04 : 0.1 + 0.9 * ls) * Math.min(1, cov * 1.3);
      }
      if (c !== ' ') ctx.fillText(c, (x + 0.5) * cw, (y + 0.5) * ch);
      if (bbox) { if (x < bbox[0]) bbox[0] = x; if (y < bbox[1]) bbox[1] = y; if (x > bbox[2]) bbox[2] = x; if (y > bbox[3]) bbox[3] = y; }
    }
  }
  ctx.globalAlpha = 1;
}

function applyColors(){ document.documentElement.style.setProperty('--bg', $('bg').value); }
$('model').onchange = e => { $('tilt').value = e.target.value === 'track' ? 55 : 15; setModel(e.target.value); };
$('circuit').onchange = () => setModel('track');
$('ss').onchange = resize;
$('bg').oninput = applyColors;
$('res').oninput = resize;
$('chars').onchange = e => { const c = e.target.value === 'custom'; $('custom').classList.toggle('hidden', !c); $('customL').classList.toggle('hidden', !c); };
$('toggle').onclick = () => $('panel').classList.toggle('hidden');
$('png').onclick = () => { const a = document.createElement('a'); a.download = 'ascii.png'; a.href = out.toDataURL('image/png'); a.click(); };
addEventListener('resize', resize);

// Video: genau eine Umdrehung, Bild für Bild mit festem Winkelschritt.
// Letztes Bild = Winkel kurz vor 2π, damit Ende → Anfang nahtlos übergeht.
// Länge = Dauer einer vollen Umdrehung beim eingestellten Tempo (wie in frame(): speed/100·2.5 rad/s)
const loopSeconds = () => { const w = +$('speed').value / 100 * 2.5; return w > 0 ? Math.min(60, 2 * Math.PI / w) : 5; };
const showLen = () => $('vlen').textContent = loopSeconds().toFixed(1).replace('.', ',') + ' s' + (+$('speed').value ? '' : ' (Tempo 0)');
$('speed').addEventListener('input', showLen); showLen();
const sleep = ms => new Promise(r => setTimeout(r, ms));
$('vid').onclick = async () => {
  if (recording) return;
  const FPS = 30, N = Math.round(loopSeconds() * FPS);
  const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find(t => MediaRecorder.isTypeSupported(t));
  recording = true;
  // Vorlauf: eine Umdrehung zeichnen und belegte Zellen sammeln → Ausschnitt + 1 Zeichen Rand
  bbox = [1e9, 1e9, -1, -1];
  for (let i = 0; i < N; i++) { angle = (i / N) * 2 * Math.PI; draw(); }
  const [bx0, by0, bx1, by1] = bbox; bbox = null;
  if (bx1 < 0) { recording = false; return; }
  const dpr = out.width / innerWidth;
  const sx = Math.max(0, (bx0 - 1) * cw * dpr), sy = Math.max(0, (by0 - 1) * ch * dpr);
  const sw = Math.min(out.width - sx, (bx1 - bx0 + 3) * cw * dpr), sh = Math.min(out.height - sy, (by1 - by0 + 3) * ch * dpr);
  // eigene Aufnahme-Leinwand: Encoder schaffen keine 4K+-Retina-Größen, Maße müssen gerade sein
  const k = Math.min(1, 1920 / sw, 1920 / sh);
  const vc = document.createElement('canvas'), vx = vc.getContext('2d');
  vc.width = Math.round(sw * k / 2) * 2; vc.height = Math.round(sh * k / 2) * 2;
  const stream = vc.captureStream(0), track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, {mimeType: type, videoBitsPerSecond: 16e6});
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  const btn = $('vid'), label = btn.textContent;
  const a0 = 0;
  rec.start();
  const t0 = performance.now();
  for (let i = 0; i < N; i++) {
    angle = a0 + (i / N) * 2 * Math.PI;
    draw(); vx.drawImage(out, sx, sy, sw, sh, 0, 0, vc.width, vc.height); track.requestFrame();
    btn.textContent = `Aufnahme … ${Math.round(i / N * 100)} %`;
    await sleep(Math.max(0, t0 + (i + 1) * 1000 / FPS - performance.now()));
  }
  rec.stop(); await done;
  recording = false; btn.textContent = label;
  const ext = type.includes('mp4') ? 'mp4' : 'webm';
  const a = document.createElement('a');
  a.download = `ascii-${$('model').value}.${ext}`;
  a.href = URL.createObjectURL(new Blob(chunks, {type}));
  a.click();
};

fetch('circuits.json').then(r => r.json()).then(c => {
  circuits = c;
  $('circuit').innerHTML = c.map((x, i) => `<option value="${i}">${x.name}</option>`).join('');
  $('circuit').value = c.findIndex(x => x.name.includes('Monza'));
});
setModel('car'); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
