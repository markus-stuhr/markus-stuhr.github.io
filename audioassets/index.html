<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Audio">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio-Asset-Katalog · freie Spiel-Sounds</title>
<script defer src="/analytics.js"></script>
<style>
:root{
  --bg:#14161c; --panel:#1c1f28; --panel2:#232733; --line:#2f3444;
  --ink:#e9ecf3; --dim:#98a0b4; --acc:#7fd4a8; --acc2:#f0b45c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(20,22,28,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 20px}
.htop{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:.3px}
.count{color:var(--dim);font-size:13px}
.lic{margin-left:auto;color:var(--dim);font-size:12px}
.lic a{color:var(--acc)}
.tools{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
input,select,.tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:8px 11px;font:inherit;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
#q{flex:1;min-width:180px}
.tbtn{cursor:pointer;white-space:nowrap}
.tbtn[aria-pressed="true"]{border-color:var(--acc2);color:var(--acc2)}
.grid{display:grid;gap:10px;padding:18px 20px 60px;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.sec{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;
  margin:14px 0 -2px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.sec h2{margin:0;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--acc)}
.sec span{color:var(--dim);font-size:12px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 10px 8px;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--acc)}
.card.playing{border-color:var(--acc)}
canvas{display:block;width:100%;height:44px}
.nm{font-size:13px;font-weight:600;margin-top:6px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;padding-right:52px}
.pk{font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{position:absolute;right:8px;bottom:8px;display:flex;gap:2px}
.acts a,.acts button{width:24px;height:24px;border:0;border-radius:6px;background:none;
  color:#6b7488;font-size:14px;line-height:24px;text-align:center;cursor:pointer;
  text-decoration:none;padding:0}
.acts a:hover{color:var(--acc)}
.fav.on,.fav:hover{color:var(--acc2)}
.empty{grid-column:1/-1;color:var(--dim);text-align:center;padding:40px}
@media (max-width:600px){header{padding:12px 16px}.grid{padding:14px 16px 50px}
  .lic{margin-left:0;width:100%}}
</style>
</head>
<body>
<header>
  <div class="htop">
    <h1>Audio-Assets</h1>
    <span class="count" id="count"></span>
    <span class="lic">Alles <b>CC0</b> · Quellen: <a href="https://kenney.nl/assets/category:Audio" target="_blank" rel="noopener">Kenney</a>,
      <a href="https://opengameart.org/content/512-sound-effects-8-bit-style" target="_blank" rel="noopener">Juhani Junkala</a></span>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Suchen … (z. B. coin, footstep, laser)" autocomplete="off">
    <select id="cat"><option value="">Alle Kategorien</option></select>
    <select id="pack"><option value="">Alle Packs</option></select>
    <button class="tbtn" id="favBtn" aria-pressed="false">★ Favoriten</button>
  </div>
</header>
<main class="grid" id="grid"></main>
<script>
const $ = s => document.querySelector(s);
const grid = $('#grid'), q = $('#q'), catSel = $('#cat'), packSel = $('#pack'), favBtn = $('#favBtn');
const useOgg = !!new Audio().canPlayType('audio/ogg; codecs="vorbis"');
let sounds = [], favs = new Set(), onlyFav = false;
try { favs = new Set(JSON.parse(localStorage.getItem('audioFavs') || '[]')); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem('audioFavs', JSON.stringify([...favs])); } catch (e) {} };

const audio = new Audio();
let current = null;

function draw(cv, s, prog) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const n = s.peaks.length, bw = w / n;
  s.peaks.forEach((p, i) => {
    const bh = Math.max(2, p / 99 * (h - 4));
    g.fillStyle = (i + .5) / n <= prog ? '#7fd4a8' : '#4a5168';
    g.fillRect(i * bw + 1, (h - bh) / 2, Math.max(1, bw - 2), bh);
  });
}

function tick() {
  if (!current) return;
  const p = audio.duration ? audio.currentTime / audio.duration : 0;
  draw(current.cv, current.s, p);
  if (!audio.paused) requestAnimationFrame(tick);
}
audio.addEventListener('ended', () => { if (current) { draw(current.cv, current.s, 0); current.card.classList.remove('playing'); current = null; } });

function play(s, card, cv) {
  if (current) { current.card.classList.remove('playing'); draw(current.cv, current.s, 0); }
  if (current && current.s === s && !audio.paused) { audio.pause(); current = null; return; }
  current = { s, card, cv };
  card.classList.add('playing');
  audio.src = useOgg ? s.ogg : s.mp3;
  audio.currentTime = 0;
  audio.play().then(tick).catch(() => {});
}

function card(s) {
  const el = document.createElement('div');
  el.className = 'card';
  el.title = s.name + ' · ' + s.dur.toFixed(2) + ' s · ' + s.kb + ' KB';
  const cv = document.createElement('canvas');
  el.append(cv);
  el.insertAdjacentHTML('beforeend',
    `<div class="nm"></div><div class="pk"></div><div class="acts">
      <button class="fav" title="Favorit">★</button>
      <a href="${s.ogg}" download title="OGG laden">⤓</a></div>`);
  el.querySelector('.nm').textContent = s.name;
  el.querySelector('.pk').textContent = `${s.dur.toFixed(1)} s · ${s.group || s.packLabel}`;
  const fav = el.querySelector('.fav');
  fav.classList.toggle('on', favs.has(s.id));
  fav.onclick = e => { e.stopPropagation();
    favs.has(s.id) ? favs.delete(s.id) : favs.add(s.id); fav.classList.toggle('on'); saveFavs();
    if (onlyFav) render(); };
  el.querySelector('a').onclick = e => e.stopPropagation();
  el.onclick = () => play(s, el, cv);
  requestAnimationFrame(() => draw(cv, s, 0));
  return el;
}

function render() {
  const t = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = sounds.filter(s =>
    (!catSel.value || s.cat === catSel.value) &&
    (!packSel.value || s.pack === packSel.value) &&
    (!onlyFav || favs.has(s.id)) &&
    t.every(w => (s.name + ' ' + s.group + ' ' + s.packLabel + ' ' + s.cat).toLowerCase().includes(w)));
  $('#count').textContent = `${list.length} von ${sounds.length} Sounds`;
  grid.replaceChildren();
  if (!list.length) { grid.innerHTML = '<div class="empty">Nichts gefunden.</div>'; return; }
  const by = new Map();
  list.forEach(s => { const k = s.cat; if (!by.has(k)) by.set(k, []); by.get(k).push(s); });
  const frag = document.createDocumentFragment();
  for (const [k, arr] of by) {
    const h = document.createElement('div'); h.className = 'sec';
    h.innerHTML = '<h2></h2><span></span>';
    h.firstChild.textContent = k; h.lastChild.textContent = arr.length;
    frag.append(h);
    arr.forEach(s => frag.append(card(s)));
  }
  grid.append(frag);
}

fetch('manifest.json').then(r => r.json()).then(d => {
  sounds = d.sounds;
  [...new Set(sounds.map(s => s.cat))].sort().forEach(c => catSel.add(new Option(c, c)));
  [...new Map(sounds.map(s => [s.pack, s.packLabel]))].forEach(([v, l]) => packSel.add(new Option(l, v)));
  render();
});
let to; q.oninput = () => { clearTimeout(to); to = setTimeout(render, 120); };
catSel.onchange = packSel.onchange = render;
favBtn.onclick = () => { onlyFav = !onlyFav; favBtn.setAttribute('aria-pressed', onlyFav); render(); };
addEventListener('resize', () => { clearTimeout(to); to = setTimeout(render, 200); });
</script>
</body>
</html>
