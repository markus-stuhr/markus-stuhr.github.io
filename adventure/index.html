<style>
  :root{ --ink:#f2f5f8; --dim:#aab3c0; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fd0e8;
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
  canvas{display:block}
  #stage{position:fixed;inset:0}

  .panel{position:fixed;background:rgba(24,30,42,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:11px 13px}

  #help{left:14px;top:14px;max-width:250px}
  #help h1{margin:0 0 7px;font-size:14px;letter-spacing:.02em}
  #help table{border-collapse:collapse;font-size:12px;color:var(--dim)}
  #help td{padding:1px 0}
  #help td:first-child{padding-right:10px;color:var(--ink);white-space:nowrap}

  #hud{right:14px;top:14px;text-align:right;font-size:13px}
  #hud b{font-size:19px;font-variant-numeric:tabular-nums}
  #hud small{display:block;color:var(--dim);font-size:11px;letter-spacing:.05em;
    text-transform:uppercase}

  /* Aufforderung ueber dem Kopf der Figur, nur in Reichweite */
  #prompt{left:50%;bottom:88px;transform:translateX(-50%);display:none;
    padding:8px 14px;font-size:13px;white-space:nowrap}
  #prompt kbd{background:rgba(255,255,255,.14);border-radius:5px;padding:1px 6px;
    font:inherit;font-weight:600;margin-right:5px}

  /* Kurze Einblendung nach einem Ereignis */
  #toast{left:50%;top:64px;transform:translateX(-50%);opacity:0;
    transition:opacity .35s;pointer-events:none;font-size:14px}
  #toast.on{opacity:1}

  #edit{left:14px;top:14px;max-width:290px}
  #edit h1{margin:0 0 8px;font-size:14px;letter-spacing:.02em}
  #edit table{border-collapse:collapse;font-size:12px;color:var(--dim);margin-top:9px}
  #edit td{padding:1px 0}
  #edit td:first-child{padding-right:10px;color:var(--ink);white-space:nowrap}
  #tools,#mats,#acts{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  #acts{margin:9px 0 0}
  #acts button{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
    color:var(--dim);border-radius:7px;padding:4px 8px;font:12px system-ui;cursor:pointer}
  #acts button:hover{color:var(--ink)}
  #tools button,#mats button{border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07);color:var(--ink);border-radius:7px;
    padding:4px 8px;font:12px system-ui;cursor:pointer}
  #tools button.on,#mats button.on{background:#e8c15a;color:#1b2130;
    border-color:#e8c15a;font-weight:600}
  #mats button i{display:inline-block;width:9px;height:9px;border-radius:2px;
    margin-right:5px;vertical-align:-1px}

  #boot{position:fixed;inset:0;display:grid;place-items:center;
    background:#1b2130;color:var(--dim);letter-spacing:.08em;font-size:12px;
    text-transform:uppercase;transition:opacity .5s}
  #boot.gone{opacity:0;pointer-events:none}

  /* Touch: linker Daumen laeuft, rechter Knopf handelt */
  #touch{position:fixed;inset:0;display:none;pointer-events:none}
  #stick{position:absolute;left:26px;bottom:26px;width:116px;height:116px;
    border-radius:50%;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);pointer-events:auto}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(255,255,255,.34)}
  #act{position:absolute;right:26px;bottom:34px;width:78px;height:78px;border-radius:50%;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);
    color:#fff;font:600 13px/78px system-ui;text-align:center;pointer-events:auto}

/* ===================================================================

   Bewusst KEIN Editor: /blocks baut Welten, das hier laeuft in einer.
   Gemeinsam ist beiden nur der Look. Die Welt steht als ASCII-Karte
   weiter unten — drei Ebenen (Hoehe, Boden, Deko), ein Zeichen je
   Zelle. Das ist von Hand editierbar und braucht kein Datenformat.

   Modelle: KayKit von Kay Lousberg (CC0) — die Deko liegt schon unter
   /blocks/assets, die Figur unter /assets/models. Beides wird von hier
   aus nur referenziert, nicht kopiert.
=================================================================== */

const CELL = 1.0;        // Kantenlaenge einer Zelle in Weltmetern
const LIFT = 1.0;        /* Hoehe EINER Stufe — so hoch wie die Zelle breit
                            ist, also ein echter Wuerfel. Bewusst so hoch,
                            dass schon ein einzelner Absatz gesprungen werden
                            muss; Rampen und Treppen als bequemer Weg nach
                            oben kommen spaeter als eigene Bauteile. */
const BASE = -1.2;       // Unterkante aller Saeulen (Diorama-Sockel)
const STEP_UP = 0.34;    /* was die Figur im Gehen ueberwindet. Deutlich
                            unter LIFT: eine Stufe ist damit KEIN Schritt

/* Wasser als BECKEN, uebernommen aus /blocks.

   Kein globaler Spiegel mehr: zusammenhaengende Wasserzellen bilden einen
   Koerper mit eigenem Pegel, und der Pegel folgt dem Gelaende. Steigt das
   Ufer, staut das Becken; oeffnet sich eine Scharte, laeuft es in den
   Nachbar. Ein Bergsee und ein Strandsaum koennen so nebeneinander
   bestehen — mit einem gemeinsamen Spiegel ginge das nicht.

   Der Pegel liegt INNERHALB der obersten gefluteten Stufe (WATER_FILL),
   nicht auf ihrer Oberkante. Dadurch bleibt flaches Wasser durchwatbar,

const WATER_FILL = 0.45;    // Anteil der Stufe, bis zu dem der Pegel steht
const WATER_SINK = 0.40;    // wie tief die Seitenflaechen ins Gestein tauchen

  'rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr',
];
const DECO = [

];

/* Die drei Konstanten oben sind nur der AUSLIEFERUNGSZUSTAND. Gearbeitet
   wird auf veraenderlichen Kopien: der Editor schreibt hinein, und was
   im localStorage liegt, ueberschreibt sie beim Start. */
const MW = HEIGHT[0].length, MH = HEIGHT.length;
let hmap = HEIGHT.map(r => r.split('').map(Number));
let gmap = GROUND.map(r => r.split(''));
let dmap = DECO.map(r => r.split(''));

const inMap = (x, z) => x >= 0 && z >= 0 && x < MW && z < MH;
// Hoehe einer Zelle in Stufen. Ausserhalb der Karte: Wand.
const cellH = (x, z) => inMap(x, z) ? hmap[z][x] : 99;
const cellG = (x, z) => inMap(x, z) ? gmap[z][x] : 'r';
const cellD = (x, z) => inMap(x, z) ? dmap[z][x] : ' ';
// Oberkante in Weltmetern — bei Wasser ist das der Grund, auf dem die
// Figur watet.
const topY = (x, z) => cellH(x, z) * LIFT;
const isWater = (x, z) => cellG(x, z) === 'w';
// Wassertiefe in Stufen; 0 bei allem, was kein Wasser ist.
const ci = (x, z) => x + z * MW;

/* Becken: aufgeloest aus den Wasserzellen der Karte. `cellOwner` sagt je
   Zelle, zu welchem Koerper sie gehoert (-1 = trocken). */
let bodies = [];
let cellOwner = new Int16Array(MW * MH).fill(-1);

// Wasserspiegel eines Beckens in Metern. `level` ist die oberste geflutete
// Stufe; der Spiegel steht ein Stueck darin, nicht auf ihrer Oberkante.
const bodyY = (b) => (b.level - 1 + WATER_FILL) * LIFT;

function waterYAt(x, z){
  const id = inMap(x, z) ? cellOwner[ci(x, z)] : -1;
  return id === -1 ? -Infinity : bodyY(bodies[id]);
}
// Wassertiefe ueber dem Grund einer Zelle, in Metern
const depthAt = (x, z) => Math.max(0, waterYAt(x, z) - topY(x, z));
const wadable = (x, z) => depthAt(x, z) <= WADE_DEPTH;

/* Auflösen wie in /blocks: jede Wasserzelle ist eine Saat, das hoechste
   Becken zuerst. Von der Saat aus flutet ein Fill alles, was tiefer liegt
   als sein Pegel — und schluckt dabei tiefer stehende Nachbarbecken. */
function resolvePools(){
  cellOwner.fill(-1);
  bodies = [];

  const seeds = [];
  for(let z = 0; z < MH; z++){
    for(let x = 0; x < MW; x++){
      // Eine gemalte Wasserzelle traegt ihren Pegel eine Stufe ueber
      // ihrem eigenen Grund — sie soll ja unter Wasser stehen.
      if(cellG(x, z) === 'w') seeds.push({x, z, level: cellH(x, z) + 1});
    }
  }
  seeds.sort((a, b) => b.level - a.level);

  for(const p of seeds){
    const start = ci(p.x, p.z);
    if(cellOwner[start] !== -1) continue;        // schon von hoeherem Becken
    if(cellH(p.x, p.z) >= p.level) continue;     // Pegel unter dem Grund

    const id = bodies.length;
    const cells = [start];
    cellOwner[start] = id;
    for(let head = 0; head < cells.length; head++){
      const c = cells[head], sx = c % MW, sz = (c / MW) | 0;
      for(const [dx, dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = sx + dx, nz = sz + dz;
        if(!inMap(nx, nz)) continue;
        const nc = ci(nx, nz);
        if(cellOwner[nc] !== -1 || cellH(nx, nz) >= p.level) continue;
        cellOwner[nc] = id;
        cells.push(nc);
      }
    }
    bodies.push({level: p.level, cells});
  }
}

// Kartenzelle -> Weltmitte. Die Karte wird um den Ursprung zentriert,
// damit Kamera und Nebel nicht mit einer Ecke rechnen muessen.
const wx = x => (x - (MW - 1) / 2) * CELL;
const wz = z => (z - (MH - 1) / 2) * CELL;
const cx = x => Math.round(x / CELL + (MW - 1) / 2);
const cz = z => Math.round(z / CELL + (MH - 1) / 2);

/* Palette. Dieselben Werte wie in /blocks, damit beide Seiten denselben
   Farbklang haben — oben die Sonnenseite, an den Flanken die Erde. */
const PAL = {

  p: {top:'#c9a875', side:'#a9764a'},   // Trampelpfad
  r: {top:'#8e9aa6', side:'#79838f'},   // Fels

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
