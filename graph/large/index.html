<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script defer src="/analytics.js"></script>
<title>Nordlicht Knowledge Graph at Scale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: header, toolbar with search and questions, canvas left with breadcrumb, detail column right; stacked on phones */
:root{
  --bg:#f4f6f8;--panel:#ffffff;--fg:#17202a;--muted:#5b6673;--line:#dde2e8;--accent:#1f6f8b;--accent-bg:#e3f0f5;--warn:#b5571c;--warn-bg:#fbeee3;
  --c-u:#3d5a80;--c-i:#a35d86;--c-p:#4766d1;--c-t:#7d8794;--c-j:#16906c;--c-s:#d07a22;--c-k:#c0436f;--c-d:#8a7650;--c-m:#9aa4b0;--edge:#b9c2cc;
  --display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c;--panel:#18202a;--fg:#e6ebf0;--muted:#98a4b1;--line:#2a3440;--accent:#5fb3cf;--accent-bg:#17303a;--warn:#f0a06a;--warn-bg:#3a2518;
  --c-u:#7ea3d4;--c-i:#d692bb;--c-p:#7d95ec;--c-t:#9aa4b0;--c-j:#3fc496;--c-s:#eda05a;--c-k:#e47aa0;--c-d:#c2ad84;--c-m:#56616d;--edge:#3b4754;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c;--panel:#18202a;--fg:#e6ebf0;--muted:#98a4b1;--line:#2a3440;--accent:#5fb3cf;--accent-bg:#17303a;--warn:#f0a06a;--warn-bg:#3a2518;
  --c-u:#7ea3d4;--c-i:#d692bb;--c-p:#7d95ec;--c-t:#9aa4b0;--c-j:#3fc496;--c-s:#eda05a;--c-k:#e47aa0;--c-d:#c2ad84;--c-m:#56616d;--edge:#3b4754;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
.app{position:fixed;inset:0}
#cy,#g3{position:absolute;inset:0}
#g3{overflow:hidden}
.hide{visibility:hidden;pointer-events:none}
.lbl3{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl3 span{position:absolute;left:0;top:0;white-space:pre;text-align:center;line-height:1.25;color:var(--fg);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 2px var(--bg);will-change:transform}
.lbl3 span.agg{font-weight:600}
.lbl3 i{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;border-radius:50%;pointer-events:auto;cursor:pointer;will-change:transform}
.lbl3 i svg{width:62%;height:62%;display:block;pointer-events:none}
.lbl3 i.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.lbl3 i.gone{opacity:.55;outline:1.5px dashed var(--warn);outline-offset:1px}
.scene-tooltip{font-family:var(--body)!important;font-size:12px!important;background:var(--panel)!important;color:var(--fg)!important;border:1px solid var(--line);border-radius:6px;padding:3px 8px!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:calc(404px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;padding:12px 14px;pointer-events:auto}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
h1{font-family:var(--display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;font-size:13px}
.sub a{color:var(--accent)}
.badge{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-weight:500;white-space:nowrap}
.spacer{flex:1}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
input[type=search],input[type=text]{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:190px;max-width:100%}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary,.btn[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.grp-in{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
label.tg{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
input[type=range]{width:96px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;padding-top:8px;border-top:1px solid var(--line)}
.crumbs span.c{color:var(--accent);cursor:pointer}
.crumbs span.c:last-child{color:var(--fg);cursor:default;font-weight:500}
.crumbs .sep{color:var(--muted)}
.foot{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(404px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 0 3px var(--bg)}
.foot .warn{color:var(--warn);font-weight:500}
aside{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:380px;padding:16px;overflow:auto}
aside.collapsed{bottom:auto;height:auto;overflow:hidden}
aside.collapsed #panel{display:none}
.ptog{position:sticky;top:-16px;float:right;margin:-6px -6px 0 8px;font-size:12px}
@media (max-width:900px){
  .top{right:max(12px,env(safe-area-inset-right,0px));padding:10px 12px}
  .sub{display:none}
  aside{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:42dvh}
  .foot{display:none}
  .bar.filters,.adv{display:none!important}
  .top.open .bar.filters,.top.open .adv{display:flex!important}
  h1{font-size:16px}
  aside.collapsed{top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:auto;padding:8px}
  aside.collapsed .ptog{margin:0;position:static}
  .badge{display:none}
}
@media (min-width:901px){#ftog{display:none}}
aside h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 2px;text-wrap:balance}
.type{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meta{color:var(--muted);margin:4px 0 10px}
.g{margin:14px 0 0}
.g h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 4px;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--bg)}
.row .n{display:flex;gap:8px;align-items:center;min-width:0}
.row .n i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.low{color:var(--warn)}
.more{font:inherit;font-size:12px;background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 8px}
.answer{background:var(--accent-bg);border-radius:10px;padding:12px;margin:0 0 12px}
.answer p{margin:0 0 6px}
.answer .row:hover{background:var(--panel)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.left{display:inline-block;font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-family:var(--body);font-weight:500}
.tips{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.tips li{margin:3px 0}
.err{color:var(--warn);font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="cy" class="hide"></div>
  <div id="g3"></div>

  <div class="top card" id="top">
    <div class="head">
      <h1>Nordlicht Knowledge Graph at Scale</h1>
      <span class="badge">Generated sample data</span>
      <p class="sub">420 people, 380 projects. <a href="../">Small demo</a></p>
      <span class="spacer"></span>
      <button class="btn" id="ftog" aria-expanded="false">More</button>
      <button class="btn" id="view" aria-pressed="false">2D view</button>
    </div>
    <div class="bar">
      <div class="grp-in"><input type="search" id="search" list="all" placeholder="Search people, projects …" aria-label="Search the graph"><button class="btn" id="go">Open</button></div>
      <div class="grp-in adv"><span class="lab">Experts for</span><input type="text" id="sys" list="systems" placeholder="Kafka" aria-label="System or skill"><button class="btn" id="goSys">Rank</button></div>
      <div class="grp-in adv"><span class="lab">Path</span><input type="text" id="pa" list="all" placeholder="From" aria-label="Path start"><input type="text" id="pb" list="all" placeholder="To" aria-label="Path end"><button class="btn" id="goPath">Find</button></div>
      <button class="btn adv" id="silos">Knowledge silos</button>
      <span class="err" id="err" aria-live="polite"></span>
    </div>
    <div class="bar filters">
      <label class="tg"><input type="checkbox" id="recent"> Only the last 12 months</label>
      <label class="tg" for="conf">Min. AI confidence <input type="range" id="conf" min="0" max="90" step="10" value="50"> <b id="confOut">50%</b></label>
      <label class="tg" for="k">Neighbors per expand <input type="range" id="k" min="3" max="20" step="1" value="8"> <b id="kOut">8</b></label>
    </div>
    <div class="crumbs" id="crumbs"></div>
  </div>
  <datalist id="all"></datalist><datalist id="systems"></datalist>

  <aside class="card" id="side"><button class="btn ptog" id="ptog" aria-expanded="true">Hide</button><div id="panel" aria-live="polite"></div></aside>
  <div class="foot"><span id="count"></span><span id="hint"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
<script>
/* ---------- seeded data generator ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261117),pick=a=>a[Math.floor(R()*a.length)],int=(a,b)=>a+Math.floor(R()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NOW=new Date(2026,10,17),YEAR_AGO=new Date(2025,10,17);
const fmt=d=>d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});

const TYPES={u:['Department','Departments'],t:['Team','Teams'],p:['Person','People'],j:['Project','Projects'],k:['Customer','Customers'],s:['System','Systems'],d:['Document','Documents'],i:['Industry','Industries'],m:['More','More']};
const REL={in:['works in','Members','HR system'],part:['part of','Teams','HR system'],on:['works on','Contributors','Jira'],lead:['leads','Led by','Jira'],for:['for customer','Projects','CRM'],acct:['manages account','Account manager','CRM'],use:['uses','Used in','Git repos'],exp:['expert in','Experts','AI extraction'],by:['wrote','Author','Confluence'],about:['describes','Documented in','AI extraction']};

const AREAS={
  cloud:['Kubernetes','AWS','Azure','GCP','Terraform','Docker','Helm','ArgoCD'],
  data:['Python','Spark','Kafka','Airflow','dbt','Snowflake','Databricks','Power BI','Tableau','PostgreSQL','MongoDB','Elasticsearch'],
  ai:['LLM Platform','PyTorch','MLflow','LangChain','Vector DB','Neo4j'],
  web:['React','Vue','Angular','TypeScript','Node.js','Next.js','GraphQL'],
  mobile:['Flutter','Swift','Kotlin','React Native'],
  sap:['SAP S/4HANA','SAP BTP','ABAP','SAP Fiori'],
  crm:['Salesforce','HubSpot','Dynamics 365'],
  sec:['Keycloak','Okta','HashiCorp Vault','SIEM'],
  java:['Java','Spring Boot','.NET','Go'],
  qa:['Selenium','Playwright','Cypress','JMeter'],
  design:['Figma','Design Tokens'],
  legacy:['COBOL','IBM MQ','Oracle Forms','Delphi','SAP PI/PO']};
const DEPTS=[
  ['plat','Platform Engineering',52,['cloud','java']],['data','Data & AI',58,['data','ai']],['web','Web & Mobile',60,['web','mobile','java']],
  ['sapc','SAP Consulting',38,['sap']],['mgmt','Management Consulting',34,['crm','data']],['sec','Security',22,['sec','cloud']],
  ['ux','UX & Design',26,['design','web']],['qa','Quality Assurance',28,['qa','web']],['sales','Sales',30,['crm']],
  ['cs','Customer Success',24,['crm']],['fin','Finance & Admin',14,[]],['ppl','People & Compliance',14,[]]];
const OFFICES=['Hamburg','Berlin','Munich','Cologne','Leipzig'];
const FIRST=['Anna','Ben','Clara','Deniz','Elif','Felix','Greta','Hannes','Ines','Jonas','Kim','Lars','Mara','Nils','Olga','Paul','Rosa','Sven','Tara','Uwe','Vera','Yusuf','Zoe','Max','Lea','Tim','Mia','Jan','Lina','Tom','Sara','Erik','Nora','Finn','Emma','Luca','Ida','Noah','Pia','Ole','Jana','Moritz','Hanna','Leon','Marie','David','Laura','Malte','Sophie','Aylin','Mehmet','Katarina','Piotr','Ana','Ravi','Mei','Omar','Lucia','Tobias','Frieda'];
const LAST=['Keller','Schulz','Wendt','Aydın','Şahin','Brandt','Hoffmann','Vogel','Lorenz','Peters','Nguyen','Becker','Fischer','Hartmann','Petrova','Richter','Klein','Möller','Jansen','Krause','Engel','Demir','Wagner','Neumann','Schmidt','Meyer','Weber','Wolf','Schröder','Koch','Bauer','Lange','Schmitt','Werner','Krüger','Lehmann','Köhler','Kaiser','Fuchs','Scholz','Berger','Kowalski','Novak','Rossi','Garcia','Kumar','Chen','Haddad','Svensson','Jensen'];
const IND=[['Logistics','Logistics'],['Bank','Finance'],['Energy','Energy'],['Insurance','Insurance'],['Health','Healthcare'],['Retail','Retail'],['Motors','Automotive'],['Aerospace','Aerospace'],['Telecom','Telecom'],['Foods','Food'],['Pharma','Healthcare'],['Utilities','Energy'],['Freight','Logistics'],['Capital','Finance']];
const PREF=['Hafen','Nord','Alpen','Rhein','Elb','Spree','Isar','Main','Weser','Ostsee','Hanse','Berg','Sonnen','Stern','Falken','Linden','Eichen','Kristall','Blau','Grün','Wald','Fels','Mühlen','Ufer','Brücken','Turm','Kranich','Möwen','Leucht','Anker'];
const KINDS=[['Cloud Migration','cloud'],['Data Platform','data'],['AI Assistant','ai'],['Customer Portal','web'],['Mobile App','mobile'],['S/4HANA Rollout','sap'],['CRM Rollout','crm'],['IAM Modernization','sec'],['Test Automation','qa'],['Design System','design'],['Analytics Dashboard','data'],['API Platform','java'],['Predictive Maintenance','ai'],['E-Commerce Relaunch','web'],['Data Mesh','data'],['Platform Rebuild','cloud'],['Self-Service Portal','web'],['Document AI','ai'],['Legacy Maintenance','legacy']];
const DOCKINDS=['Architecture','Lessons Learned','Runbook','Proposal','Concept','Test Plan','Handover'];

const NODES=new Map(),EDGES=[],ADJ=new Map(),BYLABEL=new Map();
function N(id,t,label,x={}){const n=Object.assign({id,t,label},x);NODES.set(id,n);ADJ.set(id,[]);BYLABEL.set(label.toLowerCase(),id);return n}
function E(s,t,r,x={}){const i=EDGES.length;EDGES.push(Object.assign({i,s,t,r,conf:1},x));ADJ.get(s).push(i);ADJ.get(t).push(i)}

const systemsByArea={};Object.entries(AREAS).forEach(([a,l])=>{systemsByArea[a]=l.map(name=>{const id='s:'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-');N(id,'s',name,{area:a});return id})});
const teamsByDept={},peopleByDept={},peopleByArea={};
DEPTS.forEach(([did,name,size,areas])=>{
  N('u:'+did,'u',name,{areas});peopleByDept[did]=[];
  const nT=Math.max(2,Math.round(size/13));teamsByDept[did]=shuffle(OFFICES).slice(0,nT).map(o=>{const id=`t:${did}-${o.toLowerCase()}`;N(id,'t',`${name} · ${o}`,{dept:did});E(id,'u:'+did,'part');return id});
});
const usedNames=new Set();
DEPTS.forEach(([did,name,size,areas])=>{for(let i=0;i<size;i++){let nm;do{nm=pick(FIRST)+' '+pick(LAST)}while(usedNames.has(nm));usedNames.add(nm);
  const id='p:'+usedNames.size,team=pick(teamsByDept[did]);
  const left=R()<.06?new Date(2025,int(0,20),int(1,28)):null;
  const senior=R();const role=did==='sales'||did==='cs'?(senior>.8?'Head of '+name:'Account Manager'):senior>.85?'Principal':senior>.6?'Senior':senior>.25?'Consultant':'Junior';
  N(id,'p',nm,{dept:did,team,role,left});E(id,team,'in',{date:new Date(2020+int(0,6),int(0,11),1)});peopleByDept[did].push(id);
  areas.forEach(a=>(peopleByArea[a]=peopleByArea[a]||[]).push(id))}});
peopleByArea.legacy=shuffle(peopleByDept.plat.concat(peopleByDept.sapc)).slice(0,8);
const custs=[];const usedC=new Set();
while(custs.length<70){const [suf,ind]=pick(IND);const nm=pick(PREF)+(R()<.5?'':pick(['werk','haus','feld','tal','land']))+' '+suf;if(usedC.has(nm))continue;usedC.add(nm);const id='k:'+custs.length;N(id,'k',nm,{ind});custs.push(id)}
const IND_LIST=[...new Set(custs.map(c=>NODES.get(c).ind))];
const am=peopleByDept.sales.concat(peopleByDept.cs);custs.forEach(c=>E(pick(am),c,'acct'));
const usedP=new Set();const projects=[];
for(let i=0;i<380;i++){
  const internal=R()<.1,cust=internal?null:pick(custs),[kind,area]=pick(KINDS);
  let label=(internal?'Internal':NODES.get(cust).label.split(' ')[0])+' '+kind;let n=2;while(usedP.has(label))label=label.replace(/ \d+$/,'')+' '+n++;usedP.add(label);
  const start=new Date(2021+int(0,5),int(0,11),1),end=new Date(start.getTime()+int(3,24)*30*864e5);
  const id='j:'+i;N(id,'j',label,{area,start,end,active:end>NOW,internal});projects.push(id);
  if(cust)E(id,cust,'for',{date:start});
  const legacy=area==='legacy';
  const sys=[],want=legacy?1:Math.min(int(2,4),AREAS[area].length);
  while(sys.length<want){const s=systemsByArea[area][Math.floor(AREAS[area].length*R()**2.4)];if(!sys.includes(s))sys.push(s)}
  const extra=pick(['cloud','java','data','web','qa','sec']);if(!legacy&&extra!==area)sys.push(pick(systemsByArea[extra]));
  sys.forEach(s=>E(id,s,'use',{date:start}));
  const pool=(peopleByArea[area]||[]).filter(p=>{const L=NODES.get(p).left;return !L||L>start});
  const team=shuffle(pool).slice(0,legacy?int(1,2):int(3,8));
  if(!legacy&&R()<.5&&peopleByArea.qa)team.push(pick(peopleByArea.qa));if(!legacy&&R()<.35)team.push(pick(peopleByDept.ux));if(!legacy&&R()<.3)team.push(pick(peopleByArea[extra]||pool));
  const uniq=[...new Set(team)];if(!uniq.length)continue;
  uniq.forEach((p,k)=>E(p,id,k===0?'lead':'on',{date:end>NOW?NOW:end}));
  NODES.get(id).members=uniq;NODES.get(id).systems=sys;
  if(R()<.65){const nd=int(1,2);for(let d=0;d<nd;d++){const dk=pick(DOCKINDS);const did='d:'+i+'-'+d;const dl=label+' – '+dk;if(BYLABEL.has(dl.toLowerCase()))continue;
    N(did,'d',dl);E(pick(uniq),did,'by',{date:end>NOW?NOW:end});E(did,id,'about',{conf:+(.7+R()*.29).toFixed(2),date:end>NOW?NOW:end});if(R()<.4)E(did,pick(sys),'about',{conf:+(.45+R()*.5).toFixed(2),date:end>NOW?NOW:end})}}
}
/* expertise derived from project history, as an LLM would extract it from Jira, Confluence and Git */
const pSys=new Map();projects.forEach(j=>{const P=NODES.get(j);(P.members||[]).forEach(p=>{const m=pSys.get(p)||new Map();P.systems.forEach(s=>{const o=m.get(s)||{n:0,last:new Date(0)};o.n++;if(P.end>o.last)o.last=P.end>NOW?NOW:P.end;m.set(s,o)});pSys.set(p,m)})});
pSys.forEach((m,p)=>m.forEach((o,s)=>{const conf=Math.min(.97,.38+.16*o.n+R()*.12);if(conf<.5&&R()>.35)return;E(p,s,'exp',{conf:+conf.toFixed(2),date:o.last,n:o.n})}));
EDGES.forEach(e=>{if(!e.date)e.date=new Date(2024,0,1)});
const deg=id=>ADJ.get(id).length;
const TOTAL_N=[...NODES.values()].length,TOTAL_E=EDGES.length;

/* ---------- filters ---------- */
const F={recent:false,minConf:.5,k:8};
const nodeOk=n=>!(F.recent&&n.t==='j'&&n.end<YEAR_AGO);
function edgeOk(e){if(REL[e.r][2]==='AI extraction'&&e.conf<F.minConf)return false;
  if(F.recent){if(e.date<YEAR_AGO&&(e.r==='on'||e.r==='lead'||e.r==='exp'))return false;if(!nodeOk(NODES.get(e.s))||!nodeOk(NODES.get(e.t)))return false}return true}
const other=(e,id)=>e.s===id?e.t:e.s;
function score(e,id){const o=NODES.get(other(e,id));let s=e.conf;if(o.t==='j')s*=o.active?2:Math.max(.2,1-(NOW-o.end)/(4*365*864e5));if(e.r==='lead')s+=.6;if(e.n)s+=e.n*.15;if(o.left)s*=.4;return s+deg(o.id)*.001}
function groups(id){const g=new Map();ADJ.get(id).forEach(i=>{const e=EDGES[i];if(!edgeOk(e))return;const out=e.s===id;const key=e.r+(out?'>':'<');
  if(!g.has(key))g.set(key,{key,label:REL[e.r][out?0:1],items:[]});g.get(key).items.push(e)});
  g.forEach(v=>v.items.sort((a,b)=>score(b,id)-score(a,id)));return [...g.values()].sort((a,b)=>a.items.length-b.items.length)}

crumbsEl.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(!c)return;const i=+c.dataset.c;if(i<crumbs.length-1)crumbs[i].fn()});
function updateCount(){const v=cy.nodes().filter(n=>n.data('t')!=='m'&&!n.data('agg')).length;

/* ---------- level 1: company overview ---------- */
const projDepts=new Map(projects.map(j=>[j,new Set((NODES.get(j).members||[]).map(p=>NODES.get(p).dept))]));
const projInd=j=>{const e=ADJ.get(j).map(i=>EDGES[i]).find(e=>e.r==='for');return e?NODES.get(e.t).ind:null};
const activeProjects=()=>projects.filter(j=>nodeOk(NODES.get(j)));
function addAgg(id,t,label,size,fn){cy.add({data:{id,t,label,agg:1,size}});ACT[id]=fn}
function addAggEdge(a,b,w,label,dash){cy.add({data:{id:a+'~'+b,source:a,target:b,agg:1,w:Math.min(1+Math.sqrt(w)*.9,9),label,dash:dash?1:0}})}
function showOverview(){
  mode='overview';cy.elements().remove();setCrumbs([{label:'Nordlicht Software',fn:showOverview}]);hintEl.textContent='Click a bubble to drill down';
  const di=new Map(),dd=new Map();
  activeProjects().forEach(j=>{const ind=projInd(j)||'Internal';const ds=[...projDepts.get(j)];ds.forEach(d=>{const k=d+'|'+ind;di.set(k,(di.get(k)||0)+1)});
    ds.forEach(a=>ds.forEach(b=>{if(a<b){const k=a+'|'+b;dd.set(k,(dd.get(k)||0)+1)}}))});
  DEPTS.forEach(([d,name])=>{const n=peopleByDept[d].filter(p=>!NODES.get(p).left).length;addAgg('ov:u:'+d,'u',`${name}\n${n} people`,34+Math.sqrt(n)*7,()=>drillDept(d))});
  [...IND_LIST,'Internal'].forEach(ind=>{const c=ind==='Internal'?0:custs.filter(k=>NODES.get(k).ind===ind).length;const pj=activeProjects().filter(j=>(projInd(j)||'Internal')===ind).length;
    addAgg('ov:i:'+ind,'i',`${ind}\n${pj} projects`,30+Math.sqrt(pj)*5,()=>drillIndustry(ind))});
  DEPTS.forEach(([d])=>{[...di].filter(([k])=>k.startsWith(d+'|')).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([k,w])=>addAggEdge('ov:u:'+d,'ov:i:'+k.split('|')[1],w,w+' projects'));
    [...dd].filter(([k])=>k.split('|').includes(d)).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([k,w])=>{const [a,b]=k.split('|');if(!cy.$id('ov:u:'+a+'~ov:u:'+b).length)addAggEdge('ov:u:'+a,'ov:u:'+b,w,w+' shared',true)})});
  runLayout(false);home();
}
/* ---------- level 2: department or industry ---------- */
function drillDept(d){
  mode='drill';cy.elements().remove();const dn=NODES.get('u:'+d);setCrumbs([{label:'Nordlicht Software',fn:showOverview},{label:dn.label,fn:()=>drillDept(d)}]);hintEl.textContent='Click a team, system or industry to open it';
  const sysCount=new Map(),teamSys=new Map(),teamInd=new Map();
  peopleByDept[d].forEach(p=>{const P=NODES.get(p);if(P.left)return;ADJ.get(p).forEach(i=>{const e=EDGES[i];if(!edgeOk(e))return;
    if(e.r==='exp'&&e.conf>=.7){sysCount.set(e.t,(sysCount.get(e.t)||0)+1);const k=P.team+'|'+e.t;teamSys.set(k,(teamSys.get(k)||0)+1)}
    if((e.r==='on'||e.r==='lead')&&nodeOk(NODES.get(e.t))){const ind=projInd(e.t)||'Internal';const k=P.team+'|'+ind;teamInd.set(k,(teamInd.get(k)||0)+1)}})});
  teamsByDept[d].forEach(t=>{const n=ADJ.get(t).filter(i=>EDGES[i].r==='in'&&!NODES.get(EDGES[i].s).left).length;addAgg('dr:'+t,'t',`${NODES.get(t).label.split(' · ')[1]}\n${n} people`,30+Math.sqrt(n)*7,()=>startExplore(t))});
  const topSys=[...sysCount].sort((a,b)=>b[1]-a[1]).slice(0,8);
  topSys.forEach(([s,n])=>{cy.add({data:{id:'dr:'+s,t:'s',label:`${NODES.get(s).label} · ${n}`}});ACT['dr:'+s]=()=>startExplore(s)});
  teamsByDept[d].forEach(t=>{topSys.forEach(([s])=>{const w=teamSys.get(t+'|'+s);if(w)addAggEdge('dr:'+t,'dr:'+s,w,w+' experts')});
    [...teamInd].filter(([k])=>k.startsWith(t+'|')).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([k,w])=>{const ind=k.split('|')[1];const id='dr:i:'+ind;
      if(!cy.$id(id).length)addAgg(id,'i',ind,40,()=>drillIndustry(ind));addAggEdge('dr:'+t,id,w,w+' assignments',true)})});
  runLayout(false);
  panel.innerHTML=`<div class="type">Department</div><h2>${esc(dn.label)}</h2><p class="meta">${peopleByDept[d].filter(p=>!NODES.get(p).left).length} people in ${teamsByDept[d].length} offices</p>
  <div class="g"><h3>Strongest skills <span>experts ≥ 70%</span></h3>${topSys.map(([s,n])=>row(s,n+' experts')).join('')}</div>
  <div class="actions"><button class="btn" data-open="u:${d}">Open as node</button></div>`;
}
function drillIndustry(ind){
  mode='drill';cy.elements().remove();setCrumbs([{label:'Nordlicht Software',fn:showOverview},{label:ind,fn:()=>drillIndustry(ind)}]);hintEl.textContent='Click a customer to open it';
  const cs=ind==='Internal'?[]:custs.filter(k=>NODES.get(k).ind===ind);const dw=new Map();
  if(ind==='Internal'){const ip=activeProjects().filter(j=>NODES.get(j).internal);setCrumbs([{label:'Nordlicht Software',fn:showOverview},{label:'Internal projects',fn:()=>drillIndustry(ind)}]);return showSet(ip,null,'Internal projects')}
  cs.forEach(k=>{const pj=ADJ.get(k).map(i=>EDGES[i]).filter(e=>e.r==='for'&&nodeOk(NODES.get(e.s))).map(e=>e.s);
    addAgg('dr:'+k,'k',`${NODES.get(k).label}\n${pj.length} projects`,26+Math.sqrt(pj.length)*8,()=>startExplore(k));
    pj.forEach(j=>projDepts.get(j).forEach(d=>{const key=k+'|'+d;dw.set(key,(dw.get(key)||0)+1)}))});
  cs.forEach(k=>[...dw].filter(([x])=>x.startsWith(k+'|')).sort((a,b)=>b[1]-a[1]).slice(0,2).forEach(([x,w])=>{const d=x.split('|')[1];const id='dr:u:'+d;
    if(!cy.$id(id).length)addAgg(id,'u',NODES.get('u:'+d).label,44,()=>drillDept(d));addAggEdge('dr:'+k,id,w,w+' projects')}));

/* ---------- level 3: explore (ego network with expand) ---------- */
const shown=new Map();
function addNode(id,near){if(cy.$id(id).length)return false;const n=NODES.get(id);
  const p=near&&cy.$id(near).length?cy.$id(near).position():{x:0,y:0};
  cy.add({data:{id,t:n.t,label:n.label,left:n.left?1:0},position:{x:p.x+(R()-.5)*160,y:p.y+(R()-.5)*160}});return true}
function addEdge(e){if(cy.$id('e'+e.i).length||!cy.$id(e.s).length||!cy.$id(e.t).length)return;cy.add({data:{id:'e'+e.i,source:e.s,target:e.t,label:REL[e.r][0],conf:e.conf}})}
function connectAll(){cy.nodes().forEach(n=>{if(!NODES.has(n.id()))return;ADJ.get(n.id()).forEach(i=>{const e=EDGES[i];if(edgeOk(e))addEdge(e)})})}
function expand(id,key){
  const gs=groups(id).filter(g=>!key||g.key===key);cy.nodes('.new').removeClass('new');
  gs.forEach(g=>{const sk=id+'|'+g.key;let start=shown.get(sk)||0;const slice=g.items.slice(start,start+F.k);
    slice.forEach(e=>{const o=other(e,id);if(addNode(o,id))cy.$id(o).addClass('new');addEdge(e)});start+=slice.length;shown.set(sk,start);
    const mid='m:'+sk;cy.$id(mid).remove();const rest=g.items.length-start;
    if(rest>0){cy.add({data:{id:mid,t:'m',label:`+${rest} · ${g.label.toLowerCase()}`,owner:id,key:g.key},position:cy.$id(id).position()});cy.add({data:{id:mid+'~',source:id,target:mid}})}});
  connectAll();runLayout(true);
}
function startExplore(id){
  mode='explore';cy.elements().remove();shown.clear();const n=NODES.get(id);
  setCrumbs([{label:'Nordlicht Software',fn:showOverview},...(n.dept&&n.t!=='u'?[{label:NODES.get('u:'+n.dept).label,fn:()=>drillDept(n.dept)}]:[]),{label:n.label,fn:()=>startExplore(id)}]);
  hintEl.textContent='Click selects · double-click or “+” bubble expands';
  addNode(id);expand(id);select(id);
}
function showSet(ids,focus,title,edgeFilter){
  mode='set';cy.elements().remove();shown.clear();ids.forEach(i=>addNode(i));
  cy.nodes().forEach(n=>ADJ.get(n.id()).forEach(i=>{const e=EDGES[i];if(edgeOk(e)&&(!edgeFilter||edgeFilter(e)))addEdge(e)}));
  if(crumbs.length<2||title)setCrumbs([{label:'Nordlicht Software',fn:showOverview},{label:title||'Result',fn:()=>showSet(ids,focus,title,edgeFilter)}]);
  hintEl.textContent='Click selects · double-click expands';runLayout(false);if(focus)cy.$id(focus).addClass('sel');
}
function select(id){cy.nodes().removeClass('sel');cy.edges().removeClass('hl');const n=cy.$id(id);if(n.length){n.addClass('sel');n.connectedEdges().addClass('hl')}panel.innerHTML=detail(id)}
function reveal(id,from){
  if(mode!=='explore'){startExplore(id);return}
  if(!cy.$id(id).length){addNode(id,from&&cy.$id(from).length?from:null);cy.$id(id).addClass('new');connectAll();runLayout(true)}
  select(id);cy.animate({center:{eles:cy.$id(id)},duration:300});
}

/* ---------- detail panel ---------- */
function row(id,m,cls){const n=NODES.get(id);return `<div class="row" data-open="${id}"><span class="n"><i ${dot(n.t)}></i><span>${esc(n.label)}</span>${n.left?'<span class="left">left</span>':''}</span><span class="m ${cls||''}">${m||''}</span></div>`}
function edgeMeta(e,id){const o=NODES.get(other(e,id));const bits=[];if(REL[e.r][2]==='AI extraction')bits.push(`<span class="${e.conf<.7?'low':''}">${pct(e.conf)}</span>`);
  if(o.t==='j')bits.push(o.active?'active':'ended '+fmt(o.end));else if(e.r==='exp')bits.push(e.n+' proj.');return bits.join(' · ')}
const openGroups=new Set();
function detail(id){const n=NODES.get(id);
  const meta=[];if(n.role)meta.push(n.role);if(n.team)meta.push(NODES.get(n.team).label);if(n.ind)meta.push(n.ind);
  if(n.t==='j'){meta.push((n.internal?'Internal':'Customer')+' project');meta.push(fmt(n.start)+' – '+(n.active?'today':fmt(n.end)))}
  meta.push(deg(id)+' connections in total');
  let h=`<div class="type">${TYPES[n.t][0]}</div><h2>${esc(n.label)}${n.left?`<span class="left">left ${fmt(n.left)}</span>`:''}</h2><p class="meta">${meta.map(esc).join(' · ')}</p>`;
  groups(id).forEach(g=>{const open=openGroups.has(id+g.key);const list=open?g.items.slice(0,200):g.items.slice(0,6);
    h+=`<div class="g"><h3>${esc(g.label)} <span>${g.items.length}</span></h3>${list.map(e=>row(other(e,id),edgeMeta(e,id))).join('')}
    ${g.items.length>6?`<button class="more" data-tog="${id}|${g.key}">${open?'Show fewer':'Show all '+g.items.length}</button>`:''}</div>`});
  h+=`<div class="actions">${mode==='explore'&&cy.$id(id).length?`<button class="btn primary" data-exp="${id}">Expand neighbors</button><button class="btn" data-hide="${id}">Hide</button>`:''}<button class="btn" data-start="${id}">Start here</button></div>
  <p class="meta" style="margin-top:12px">Lists show everything. The canvas only gets what you expand, sorted by relevance: active projects, leads and confident AI matches first.</p>`;
  return h}
function home(){
  panel.innerHTML=`<div class="type">Start</div><h2>Where do you want to begin?</h2>
  <p class="meta">${TOTAL_N.toLocaleString('en')} nodes and ${TOTAL_E.toLocaleString('en')} connections would be an unreadable hairball. This page never draws them all at once.</p>
  <div class="answer"><p><b>Try this</b></p>
  <div class="row" data-q="sys">Who are our Kafka experts?</div><div class="row" data-q="silo">Which knowledge sits with one person only?</div>
  <div class="row" data-q="cust">Who knows our biggest customer?</div><div class="row" data-q="path">How does a junior reach the SAP experts?</div></div>
  <ul class="tips"><li><b>Overview:</b> departments and industries as bubbles. Line width shows how many active projects connect them.</li>
  <li><b>Drill down:</b> click a department to see its offices, top skills and industries.</li>

  <li><b>Filter:</b> “last 12 months” and AI confidence shrink the graph before it gets drawn.</li></ul>`;

/* ---------- questions ---------- */
function experts(sid){
  const s=NODES.get(sid);const ex=ADJ.get(sid).map(i=>EDGES[i]).filter(e=>e.r==='exp'&&edgeOk(e)).sort((a,b)=>score(b,sid)-score(a,sid));
  const active=ex.filter(e=>!NODES.get(e.s).left),gone=ex.filter(e=>NODES.get(e.s).left&&e.conf>=.7);
  const top=active.slice(0,12);
  showSet([sid,...top.map(e=>e.s),...new Set(top.map(e=>NODES.get(e.s).team))],sid,'Experts: '+s.label,e=>e.r==='exp'||e.r==='in');
  panel.innerHTML=`<div class="answer"><p><b>${active.length} people know ${esc(s.label)}</b>, ranked by confidence, number of projects and recency.</p>
  ${top.map((e,i)=>row(e.s,`${pct(e.conf)} · ${e.n} proj.`)).join('')}
  ${gone.length?`<p style="margin-top:8px" class="low">${gone.length} confident expert${gone.length>1?'s have':' has'} left the company.</p>`:''}</div>`+detail(sid);
}
function silos(){
  const res=[];NODES.forEach(n=>{if(n.t!=='s')return;const ex=ADJ.get(n.id).map(i=>EDGES[i]).filter(e=>e.r==='exp'&&e.conf>=.7&&edgeOk(e));
    const act=ex.filter(e=>!NODES.get(e.s).left),gone=ex.filter(e=>NODES.get(e.s).left);if(act.length<=2)res.push({s:n.id,act,gone})});
  res.sort((a,b)=>a.act.length-b.act.length||b.gone.length-a.gone.length);
  showSet([...res.map(r=>r.s),...res.flatMap(r=>r.act.map(e=>e.s)),...res.flatMap(r=>r.gone.map(e=>e.s))],null,'Knowledge silos',e=>e.r==='exp'&&e.conf>=.7);
  panel.innerHTML=`<div class="type">Answer</div><h2>Knowledge silos</h2><p class="meta">Systems with at most two confident experts (70% or more) still at the company.</p>
  <div class="answer">${res.map(r=>`${row(r.s,r.act.length?r.act.length+' left in house':'nobody','low')}<p class="meta" style="margin:0 0 6px 24px">${r.act.map(e=>esc(NODES.get(e.s).label)).join(', ')||'–'}${r.gone.length?` · <span class="low">gone: ${r.gone.map(e=>esc(NODES.get(e.s).label)).join(', ')}</span>`:''}</p>`).join('')||'<p>No silos with the current filters.</p>'}</div>`;
}
function customer(kid){
  const k=NODES.get(kid);const pj=ADJ.get(kid).map(i=>EDGES[i]).filter(e=>e.r==='for'&&edgeOk(e)).map(e=>e.s).sort((a,b)=>NODES.get(b).end-NODES.get(a).end);
  const ppl=new Map();pj.forEach(j=>ADJ.get(j).map(i=>EDGES[i]).filter(e=>(e.r==='on'||e.r==='lead')&&edgeOk(e)).forEach(e=>{ppl.set(e.s,(ppl.get(e.s)||0)+(e.r==='lead'?2:1))}));
  const top=[...ppl].filter(([p])=>!NODES.get(p).left).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const accm=ADJ.get(kid).map(i=>EDGES[i]).filter(e=>e.r==='acct').map(e=>e.s);
  showSet([kid,...pj.slice(0,8),...top.map(t=>t[0]),...accm],kid,k.label,e=>['for','on','lead','acct'].includes(e.r));
  panel.innerHTML=`<div class="answer"><p><b>${top.length} people know ${esc(k.label)} best</b> (leads count double).</p>${top.map(([p,s])=>row(p,s+' pts')).join('')}</div>`+detail(kid);
}
function bfs(a,b){const prev=new Map([[a,null]]);const q=[a];while(q.length){const x=q.shift();if(x===b)break;
  for(const i of ADJ.get(x)){const e=EDGES[i];if(!edgeOk(e))continue;const o=other(e,x);if(prev.has(o)||!nodeOk(NODES.get(o))||NODES.get(o).left)continue;prev.set(o,{x,e});q.push(o)}}
  if(!prev.has(b))return null;const path=[];let c=b;while(prev.get(c)){path.unshift(prev.get(c).e);c=prev.get(c).x}return path}
function path(a,b){const p=bfs(a,b);if(!p){panel.innerHTML='<div class="answer">No path with the current filters.</div>';return}
  const nodes=new Set([a]);let cur=a;p.forEach(e=>{cur=other(e,cur);nodes.add(cur)});
  showSet([...nodes],a,`${NODES.get(a).label} → ${NODES.get(b).label}`,e=>p.includes(e));
  cur=a;const steps=p.map(e=>{const from=cur;cur=other(e,cur);return `<p style="margin:0 0 4px">${esc(NODES.get(from).label)} <i>${e.s===from?REL[e.r][0]:'← '+REL[e.r][0]}</i> ${esc(NODES.get(cur).label)}</p>`}).join('');
  panel.innerHTML=`<div class="answer"><p><b>${p.length} steps</b> via the shortest chain of current connections (people who left are skipped).</p>${steps}</div>`+detail(b);
}

/* ---------- wiring ---------- */
const err=document.getElementById('err');const findId=v=>{v=(v||'').trim().toLowerCase();if(!v)return null;if(BYLABEL.has(v))return BYLABEL.get(v);for(const [l,id] of BYLABEL)if(l.includes(v))return id;return null};
const fail=m=>{err.textContent=m;setTimeout(()=>err.textContent='',4000)};
document.getElementById('all').innerHTML=[...NODES.values()].map(n=>`<option value="${esc(n.label)}">`).join('');
document.getElementById('systems').innerHTML=[...NODES.values()].filter(n=>n.t==='s').map(n=>`<option value="${esc(n.label)}">`).join('');
const sIn=document.getElementById('search');
const openSearch=()=>{const id=findId(sIn.value);id?startExplore(id):fail('Nothing found. Try a name, project or customer.')};
document.getElementById('go').onclick=openSearch;sIn.addEventListener('keydown',e=>{if(e.key==='Enter')openSearch()});sIn.addEventListener('change',()=>{if(BYLABEL.has(sIn.value.toLowerCase()))openSearch()});
document.getElementById('goSys').onclick=()=>{const id=findId(document.getElementById('sys').value);id&&NODES.get(id).t==='s'?experts(id):fail('Pick a system from the list, like Kafka or React.')};
document.getElementById('sys').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goSys').click()});
document.getElementById('goPath').onclick=()=>{const a=findId(document.getElementById('pa').value),b=findId(document.getElementById('pb').value);a&&b?path(a,b):fail('Enter a start and an end from the list.')};
document.getElementById('silos').onclick=silos;
const conf=document.getElementById('conf'),kIn=document.getElementById('k');
const rerender=()=>{if(mode==='overview')showOverview();else if(crumbs.length)crumbs[crumbs.length-1].fn()};
conf.oninput=()=>{document.getElementById('confOut').textContent=conf.value+'%'};conf.onchange=()=>{F.minConf=conf.value/100;rerender()};
kIn.oninput=()=>{document.getElementById('kOut').textContent=kIn.value;F.k=+kIn.value};
document.getElementById('recent').onchange=e=>{F.recent=e.target.checked;rerender()};

cy.on('tap','node',e=>{const id=e.target.id();
  if(ACT[id]&&(mode==='overview'||mode==='drill'))return ACT[id]();
  if(id.startsWith('m:')){const d=e.target.data();expand(d.owner,d.key);select(d.owner);return}
  if(NODES.has(id))select(id)});
cy.on('dbltap','node',e=>{const id=e.target.id();if(!NODES.has(id))return;if(mode!=='explore'){startExplore(id);return}expand(id);select(id)});
cy.on('tap',e=>{if(e.target===cy){cy.nodes().removeClass('sel');cy.edges().removeClass('hl')}});
panel.addEventListener('click',e=>{const t=e.target.closest('[data-open],[data-tog],[data-exp],[data-hide],[data-start],[data-q]');if(!t)return;
  if(t.dataset.q){const q=t.dataset.q;
    if(q==='sys')experts(BYLABEL.get('kafka'));
    if(q==='silo')silos();
    if(q==='cust'){const big=custs.slice().sort((a,b)=>deg(b)-deg(a))[0];customer(big)}
    if(q==='path'){const jr=[...NODES.values()].find(n=>n.t==='p'&&n.role==='Junior'&&n.dept==='web'&&!n.left);const sap=[...NODES.values()].find(n=>n.t==='p'&&n.dept==='sapc'&&n.role==='Principal'&&!n.left)||NODES.get(peopleByDept.sapc[0]);
      document.getElementById('pa').value=jr.label;document.getElementById('pb').value=sap.label;path(jr.id,sap.id)}
    return}
  if(t.dataset.tog){const [id,key]=t.dataset.tog.split('|');openGroups.has(id+key)?openGroups.delete(id+key):openGroups.add(id+key);panel.innerHTML=detail(id);return}
  if(t.dataset.exp){expand(t.dataset.exp);select(t.dataset.exp);return}
  if(t.dataset.hide){cy.$id(t.dataset.hide).remove();cy.nodes().filter(n=>n.id().startsWith('m:'+t.dataset.hide+'|')).remove();updateCount();home();return}
  if(t.dataset.start){startExplore(t.dataset.start);return}
  if(t.dataset.open){const id=t.dataset.open;const n=NODES.get(id);
    if(n.t==='k'&&mode!=='explore'&&!cy.$id(id).length)return customer(id);
    const sel=cy.$('node.sel');reveal(id,sel.length?sel.id():null)}
});
/* ---------- 3D view: mirrors the cytoscape state ---------- */
function clickNode(id){const e=st(id);if(!e.length)return;const now=Date.now();
  if(last.id===id&&now-last.t<450){last={};e.emit('dbltap')}else{last={id,t:now};e.emit('tap')}}
const nr=n=>(n.size||SIZE[n.t])/(n.agg?3.6:5);
const box3=document.getElementById('g3'),cyBox=document.getElementById('cy'),btnV=document.getElementById('view');
let is3d=true,fitPending=true,last={},syncQ=false,refQ=false;
const layer=document.createElement('div');layer.className='lbl3';
const st=id=>cy.$id(id);
const g3=ForceGraph3D()(box3).width(innerWidth).height(innerHeight).backgroundColor(css('--bg')).showNavInfo(false).cooldownTime(2500)
  .nodeRelSize(1).nodeOpacity(0).linkOpacity(.55).nodeLabel(()=>'')
  .nodeVal(.05)
  .nodeColor(n=>{const e=st(n.id);return e.hasClass('sel')?css('--accent'):n.t==='m'?css('--c-m'):css('--c-'+n.t)})
  .linkColor(l=>st(l.id).hasClass('hl')?css('--accent'):css('--muted'))
  .linkWidth(0)
  .linkVisibility(l=>!l.anchor).linkLabel(l=>esc(l.label||''))
  .linkDirectionalParticles(l=>st(l.id).hasClass('hl')?2:0).linkDirectionalParticleWidth(2)
  .onNodeClick(n=>clickNode(n.id))
  .onBackgroundClick(()=>cy.emit('tap'))
  .onEngineStop(()=>{if(fitPending){fitPending=false;g3.zoomToFit(600,90)}});
g3.d3Force('charge').strength(n=>n.agg?-260:-90);g3.d3Force('link').distance(l=>l.agg?75:45);
box3.appendChild(layer);
const tags=new Map(),icons=new Map();
function sync3d(){syncQ=false;if(!is3d)return;
  const old=new Map(g3.graphData().nodes.map(n=>[n.id,n]));let kept=0;
  const nodes=cy.nodes().map(c=>{const d=c.data();const o=old.get(d.id);if(o)kept++;
    const n=Object.assign(o||{},{id:d.id,t:d.t,label:d.label,size:d.size,agg:d.agg,left:d.left});
    if(!o){const own=d.owner||cy.$id(d.id).neighborhood('node').filter(x=>old.has(x.id())).map(x=>x.id())[0];const p=own&&old.get(own);if(p&&p.x!=null){n.x=p.x+(Math.random()-.5)*30;n.y=p.y+(Math.random()-.5)*30;n.z=p.z+(Math.random()-.5)*30}}
    return n});
  if(kept<nodes.length*.5)fitPending=true;
  const links=cy.edges().map(e=>({id:e.id(),source:e.data('source'),target:e.data('target'),label:e.data('label'),agg:e.data('agg'),w:e.data('w')||1}));
  const hub=cy.nodes().max(n=>n.degree()).ele;
  if(hub)cy.nodes().filter(n=>n.degree()===0&&n.id()!==hub.id()).forEach(n=>links.push({id:'anc:'+n.id(),source:n.id(),target:hub.id(),anchor:1}));
  g3.graphData({nodes,links});
  const ids=new Set(nodes.map(n=>n.id));
  tags.forEach((d,id)=>{if(!ids.has(id)){d.remove();tags.delete(id);icons.get(id).remove();icons.delete(id)}});
  nodes.forEach(n=>{let d=tags.get(n.id);if(!d){d=document.createElement('span');layer.appendChild(d);tags.set(n.id,d)}d.textContent=n.label;d.className=n.agg?'agg':'';if(!icons.has(n.id)){const ic=document.createElement('i');ic.innerHTML=svgIcon(n.t,'#ffffff');ic.style.background=`var(--c-${n.t})`;ic.title=n.label;ic.classList.toggle('gone',!!n.left);
    const sz=dotSize(n);ic.style.width=ic.style.height=sz+'px';ic.dataset.sz=sz;ic.onclick=ev=>{ev.stopPropagation();clickNode(n.id)};layer.insertBefore(ic,layer.firstChild);icons.set(n.id,ic)}});
}
function refresh3d(){refQ=false;if(!is3d)return;g3.nodeColor(g3.nodeColor()).linkColor(g3.linkColor()).linkWidth(g3.linkWidth()).linkDirectionalParticles(g3.linkDirectionalParticles())}
cy.on('add remove',()=>{if(!syncQ){syncQ=true;setTimeout(sync3d,0)}});
const proto=Object.getPrototypeOf(cy.collection());
['addClass','removeClass','toggleClass'].forEach(fn=>{const o=proto[fn];proto[fn]=function(...a){const r=o.apply(this,a);if(!refQ){refQ=true;setTimeout(refresh3d,0)}return r}});
(function tick(){requestAnimationFrame(tick);if(!is3d)return;
  const cam=g3.camera(),p=cam.position,m=cam.matrixWorldInverse.elements,foc=innerHeight/2/Math.tan(cam.fov*Math.PI/360);
  g3.graphData().nodes.forEach(n=>{const d=tags.get(n.id),ic=icons.get(n.id);if(!d)return;if(n.x==null){d.style.display=ic.style.display='none';return}
    const zc=m[2]*n.x+m[6]*n.y+m[10]*n.z+m[14];if(zc>0){d.style.display=ic.style.display='none';return}
    const s=g3.graph2ScreenCoords(n.x,n.y,n.z),dist=Math.hypot(p.x-n.x,p.y-n.y,p.z-n.z),e=st(n.id);
    const strong=e.hasClass('sel')||n.agg;const is=+ic.dataset.sz;
    ic.style.display='';ic.style.transform=`translate(${s.x-is/2}px,${s.y-is/2}px)`;ic.classList.toggle('sel',e.hasClass('sel'));ic.style.zIndex=Math.round(1e5/(-zc));
    d.style.display='';d.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,${is/2+3}px)`;
    d.style.fontSize=(strong?12:11)+'px';
    d.style.opacity=strong?1:Math.max(.3,Math.min(1.5-dist/700,1));d.style.zIndex=Math.round(1e5/(-zc))+(strong?1e6:0);d.style.fontWeight=e.hasClass('sel')?600:''});
})();
addEventListener('resize',()=>g3.width(innerWidth).height(innerHeight));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{g3.backgroundColor(css('--bg'));refresh3d()});
btnV.onclick=()=>{is3d=!is3d;btnV.textContent=is3d?'2D view':'3D view';btnV.setAttribute('aria-pressed',!is3d);
  box3.classList.toggle('hide',!is3d);cyBox.classList.toggle('hide',is3d);
  if(is3d){fitPending=true;sync3d();refresh3d()}else{cy.resize();cy.fit(undefined,40)}};
const side=document.getElementById('side'),ptog=document.getElementById('ptog');
ptog.onclick=()=>{const c=side.classList.toggle('collapsed');ptog.textContent=c?'Show panel':'Hide';ptog.setAttribute('aria-expanded',!c)};
const topBar=document.getElementById("top"),ftog=document.getElementById('ftog');
ftog.onclick=()=>{const o=topBar.classList.toggle('open');ftog.setAttribute('aria-expanded',o)};
panel.addEventListener('click',()=>{if(side.classList.contains('collapsed'))ptog.click()},true);
if(innerWidth<=900)ptog.click();
showOverview();
</script>
