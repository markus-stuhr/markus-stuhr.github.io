<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script defer src="/analytics.js"></script>
<title>Nordlicht Knowledge Graph at Scale</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: header, toolbar with search and questions, canvas left with breadcrumb, detail column right; stacked on phones */
:root{
  --bg:#f4f6f8;--panel:#ffffff;--fg:#17202a;--muted:#5b6673;--line:#dde2e8;--accent:#1f6f8b;--pill:#1f6f8b;--accent-bg:#e3f0f5;--warn:#b5571c;--warn-bg:#fbeee3;
  --c-u:#3d5a80;--c-i:#a35d86;--c-p:#4766d1;--c-t:#7d8794;--c-j:#16906c;--c-s:#d07a22;--c-k:#c0436f;--c-d:#8a7650;--c-m:#9aa4b0;--edge:#b9c2cc;
  --side:400px;--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c;--panel:#18202a;--fg:#e6ebf0;--muted:#98a4b1;--line:#2a3440;--accent:#5fb3cf;--pill:#226f8a;--accent-bg:#17303a;--warn:#f0a06a;--warn-bg:#3a2518;
  --c-u:#7ea3d4;--c-i:#d692bb;--c-p:#7d95ec;--c-t:#9aa4b0;--c-j:#3fc496;--c-s:#eda05a;--c-k:#e47aa0;--c-d:#c2ad84;--c-m:#56616d;--edge:#3b4754;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c;--panel:#18202a;--fg:#e6ebf0;--muted:#98a4b1;--line:#2a3440;--accent:#5fb3cf;--pill:#226f8a;--accent-bg:#17303a;--warn:#f0a06a;--warn-bg:#3a2518;
  --c-u:#7ea3d4;--c-i:#d692bb;--c-p:#7d95ec;--c-t:#9aa4b0;--c-j:#3fc496;--c-s:#eda05a;--c-k:#e47aa0;--c-d:#c2ad84;--c-m:#56616d;--edge:#3b4754;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
.app{position:fixed;inset:0}
#cy,#g3{position:absolute;top:0;left:0;bottom:0;right:var(--side)}
#g3{overflow:hidden}
.hide{visibility:hidden;pointer-events:none}
.lbl3{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl3 span{transition:opacity .2s ease;position:absolute;left:0;top:0;white-space:pre;text-align:center;line-height:1.25;color:var(--fg);will-change:transform}
.lbl3 span.agg{font-weight:600}
.lbl3 span.pill{background:var(--pill);color:#fff;font-weight:600;border-radius:99px;padding:1px 9px}
.lbl3 i{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;border-radius:50%;pointer-events:auto;cursor:pointer;will-change:transform}
.lbl3 i svg{width:62%;height:62%;display:block;pointer-events:none}
.lbl3 i.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.lbl3 i.gone{opacity:.55;outline:1.5px dashed var(--warn);outline-offset:1px}
.scene-tooltip{font-family:var(--body)!important;font-size:12px!important;background:var(--panel)!important;color:var(--fg)!important;border:1px solid var(--line);border-radius:6px;padding:3px 8px!important}
.scene-tooltip:empty{display:none!important}
[hidden]{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.hd{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:calc(var(--side) + 16px);display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;gap:10px 16px;align-items:start;pointer-events:none}
.hd>*{pointer-events:auto}
.hd{z-index:6}
#cy,#g3{transition:filter .25s ease}
.app.searching #cy,.app.searching #g3,.app.searching .foot{filter:blur(10px) brightness(.55)}
#suggest{position:absolute;top:0;left:0;bottom:0;right:var(--side);z-index:5;display:flex;justify-content:center;align-items:flex-start;padding:calc(62px + env(safe-area-inset-top,0px)) 16px 40px;overflow:auto}
#suggest .cloud{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:min(420px,100%)}
#suggest .tag{font-size:13px;justify-content:flex-start;width:100%}
#suggest .tag small{margin-left:auto}
@media (max-width:760px){#suggest{padding-top:calc(108px + env(safe-area-inset-top,0px))}}
#suggest .none{color:var(--muted);font-size:15px}
.tag{display:inline-flex;align-items:center;gap:.45em;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:99px;padding:.3em .8em .3em .35em;cursor:pointer;font:inherit;line-height:1.2;transition:border-color .15s,transform .15s}
.tag:hover,.tag.first{border-color:var(--accent)}
.tag:hover{transform:translateY(-1px)}
.tag i{width:1.45em;height:1.45em;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tag i svg{width:62%;height:62%}
.tag small{color:var(--muted);font-size:.72em}
.tag b{font-weight:600;color:var(--accent)}
@media (prefers-reduced-motion: reduce){#cy,#g3,.tag{transition:none}}
.hl{display:flex;flex-direction:column;gap:4px;min-width:0}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:-.01em;line-height:1.2}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;flex:none}
.icon-btn:hover,.icon-btn[aria-expanded=true]{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--fg)}
.srch{display:flex;flex-direction:column;align-items:center;gap:4px}
.navr{justify-self:end;display:flex;gap:6px}
.srow{display:flex;align-items:center;gap:6px;width:100%}
.srch input[type=search]{width:min(360px,60vw);padding:9px 14px;border-radius:99px;background:var(--panel);font-size:14px}
.go-r{justify-self:end}
.btn.cta{background:var(--pill);border-color:var(--pill);color:#fff;font-weight:600;border-radius:99px;padding:8px 16px}
.btn.cta:hover{color:#fff;filter:brightness(1.12)}
.btn.cta[aria-expanded=true]{background:var(--panel);color:var(--fg);border-color:var(--line)}
.sub{color:var(--muted);margin:0;font-size:13px}
.sub a{color:var(--accent)}
.badge{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--warn-bg);color:var(--warn);font-weight:500;white-space:nowrap}
#settings{position:absolute;top:calc(60px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(600px,calc(100% - 32px));padding:14px 16px;display:flex;flex-direction:column;gap:12px;z-index:5}
#settings h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
input[type=search],input[type=text]{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:190px;max-width:100%}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary,#view[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.grp-in{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
label.tg{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
input[type=range]{width:96px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.crumbs span.c{color:var(--accent);cursor:pointer}
.crumbs span.c:last-child{color:var(--fg);cursor:default;font-weight:500}
.crumbs .sep{color:var(--muted)}
.foot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));right:calc(var(--side) + 16px);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.foot .warn{color:var(--warn);font-weight:500}
aside{position:absolute;top:0;right:0;bottom:0;width:var(--side);background:var(--panel);border-left:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px;overflow:auto;z-index:4}
aside.closed{display:none}
.pclose{position:sticky;top:-16px;float:right;margin:-8px -8px 0 8px;width:28px;height:28px}
@media (max-width:760px){
  .hd{grid-template-columns:1fr auto}
  .srch{grid-column:1 / -1;grid-row:2}
  .srch input[type=search]{width:100%}
  h1{font-size:16px}
  #settings{top:calc(108px + env(safe-area-inset-top,0px))}
  :root{--side:0px}
  aside{top:auto;left:0;right:0;bottom:0;width:auto;height:42dvh;border-left:none;border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  #cy,#g3,#suggest{bottom:42dvh}
  .foot{display:none}
}
aside h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0 0 2px;text-wrap:balance}
.hh{display:inline-flex;align-items:center;gap:7px}
.hic{width:15px;height:15px;color:inherit;display:inline-flex;align-items:center;justify-content:center;flex:none;vertical-align:-4px;margin-right:7px}
.hh .hic{margin-right:0}
.hic svg{width:100%;height:100%}
.type{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meta{color:var(--muted);margin:4px 0 10px}
.g{margin:14px 0 0}
.g h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 4px;display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:5px 8px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--bg)}
.row .n{display:flex;gap:8px;align-items:center;min-width:0}
.row .n i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.low{color:var(--warn)}
.more{font:inherit;font-size:12px;background:none;border:none;color:var(--accent);cursor:pointer;padding:4px 8px}
.answer{background:var(--accent-bg);border-radius:10px;padding:12px;margin:0 0 12px}
.answer p{margin:0 0 6px}
.answer .row:hover{background:var(--panel)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.left{display:inline-block;font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-family:var(--body);font-weight:500}
.tips{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.tips li{margin:3px 0}
.err{color:var(--warn);font-size:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="cy" class="hide"></div>
  <div id="g3"></div>

  <div id="suggest" hidden></div>
  <header class="hd">
    <div class="hl">
      <div class="hrow"><h1 id="home" title="Back to the overview" style="cursor:pointer">Nordlicht Knowledge Graph</h1>
        <button class="icon-btn" id="gear" aria-expanded="false" aria-controls="settings" aria-label="Settings and questions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 3 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 0 0-2.6-1c-1.5.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1-2.6c-1.8-.4-1.8-3 0-3.4a1.7 1.7 0 0 0 1-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="crumbs" id="crumbs" hidden></div>
    </div>
    <div class="srch"><div class="srow"><input type="search" id="search" autocomplete="off" placeholder="Search people, projects, customers …" aria-label="Search the graph"></div><span class="err" id="err" aria-live="polite"></span></div>
    <div class="navr"><button class="icon-btn" id="back" aria-label="Back" title="Back (Alt+←)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><button class="icon-btn" id="fwd" aria-label="Forward" title="Forward (Alt+→)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button></div>
  </header>

  <div class="card" id="settings" hidden>
    <div class="bar"><span class="badge">Generated sample data</span><p class="sub">420 people, 380 projects. <a href="../">Small demo</a></p><span style="flex:1"></span><button class="btn" id="view" aria-pressed="false">2D view</button></div>
    <div><h3>Questions</h3><div class="bar">
      <div class="grp-in"><span class="lab">Experts for</span><input type="text" id="sys" list="systems" placeholder="Kafka" aria-label="System or skill"><button class="btn" id="goSys">Rank</button></div>
      <div class="grp-in"><span class="lab">Path</span><input type="text" id="pa" list="all" placeholder="From" aria-label="Path start"><input type="text" id="pb" list="all" placeholder="To" aria-label="Path end"><button class="btn" id="goPath">Find</button></div>
      <button class="btn" id="silos">Knowledge silos</button>
    </div></div>
    <div><h3>Filters</h3><div class="bar">
      <label class="tg"><input type="checkbox" id="recent"> Only the last 12 months</label>
      <label class="tg" for="conf">Min. AI confidence <input type="range" id="conf" min="0" max="90" step="10" value="50"> <b id="confOut">50%</b></label>
      <label class="tg" for="k" title="How many neighbors of each kind appear when a node becomes the center. The rest wait in its “+N more” pill.">Start neighbors <input type="range" id="k" min="3" max="20" step="1" value="8"> <b id="kOut">8</b></label>
    </div></div>
  </div>
  <datalist id="all"></datalist><datalist id="systems"></datalist>

  <aside id="side"><div id="panel" aria-live="polite"></div></aside>
  <div class="foot"><span id="count"></span><span id="hint"></span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
<script>
/* ---------- seeded data generator ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261117),pick=a=>a[Math.floor(R()*a.length)],int=(a,b)=>a+Math.floor(R()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NOW=new Date(2026,10,17),YEAR_AGO=new Date(2025,10,17);
const fmt=d=>d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});

const TYPES={u:['Department','Departments'],t:['Team','Teams'],p:['Person','People'],j:['Project','Projects'],k:['Customer','Customers'],s:['System','Systems'],d:['Document','Documents'],i:['Industry','Industries'],m:['More','More']};
const REL={in:['works in','Members','HR system'],part:['part of','Teams','HR system'],on:['works on','Contributors','Jira'],lead:['leads','Led by','Jira'],for:['for customer','Projects','CRM'],acct:['manages account','Account manager','CRM'],use:['uses','Used in','Git repos'],exp:['expert in','Experts','AI extraction'],by:['wrote','Author','Confluence'],about:['describes','Documented in','AI extraction']};

const AREAS={
  cloud:['Kubernetes','AWS','Azure','GCP','Terraform','Docker','Helm','ArgoCD'],
  data:['Python','Spark','Kafka','Airflow','dbt','Snowflake','Databricks','Power BI','Tableau','PostgreSQL','MongoDB','Elasticsearch'],
  ai:['LLM Platform','PyTorch','MLflow','LangChain','Vector DB','Neo4j'],
  web:['React','Vue','Angular','TypeScript','Node.js','Next.js','GraphQL'],
  mobile:['Flutter','Swift','Kotlin','React Native'],
  sap:['SAP S/4HANA','SAP BTP','ABAP','SAP Fiori'],
  crm:['Salesforce','HubSpot','Dynamics 365'],
  sec:['Keycloak','Okta','HashiCorp Vault','SIEM'],
  java:['Java','Spring Boot','.NET','Go'],
  qa:['Selenium','Playwright','Cypress','JMeter'],
  design:['Figma','Design Tokens'],
  legacy:['COBOL','IBM MQ','Oracle Forms','Delphi','SAP PI/PO']};
const DEPTS=[
  ['plat','Platform Engineering',52,['cloud','java']],['data','Data & AI',58,['data','ai']],['web','Web & Mobile',60,['web','mobile','java']],
  ['sapc','SAP Consulting',38,['sap']],['mgmt','Management Consulting',34,['crm','data']],['sec','Security',22,['sec','cloud']],
  ['ux','UX & Design',26,['design','web']],['qa','Quality Assurance',28,['qa','web']],['sales','Sales',30,['crm']],
  ['cs','Customer Success',24,['crm']],['fin','Finance & Admin',14,[]],['ppl','People & Compliance',14,[]]];
const OFFICES=['Hamburg','Berlin','Munich','Cologne','Leipzig'];
const FIRST=['Anna','Ben','Clara','Deniz','Elif','Felix','Greta','Hannes','Ines','Jonas','Kim','Lars','Mara','Nils','Olga','Paul','Rosa','Sven','Tara','Uwe','Vera','Yusuf','Zoe','Max','Lea','Tim','Mia','Jan','Lina','Tom','Sara','Erik','Nora','Finn','Emma','Luca','Ida','Noah','Pia','Ole','Jana','Moritz','Hanna','Leon','Marie','David','Laura','Malte','Sophie','Aylin','Mehmet','Katarina','Piotr','Ana','Ravi','Mei','Omar','Lucia','Tobias','Frieda'];
const LAST=['Keller','Schulz','Wendt','Aydın','Şahin','Brandt','Hoffmann','Vogel','Lorenz','Peters','Nguyen','Becker','Fischer','Hartmann','Petrova','Richter','Klein','Möller','Jansen','Krause','Engel','Demir','Wagner','Neumann','Schmidt','Meyer','Weber','Wolf','Schröder','Koch','Bauer','Lange','Schmitt','Werner','Krüger','Lehmann','Köhler','Kaiser','Fuchs','Scholz','Berger','Kowalski','Novak','Rossi','Garcia','Kumar','Chen','Haddad','Svensson','Jensen'];
const IND=[['Logistics','Logistics'],['Bank','Finance'],['Energy','Energy'],['Insurance','Insurance'],['Health','Healthcare'],['Retail','Retail'],['Motors','Automotive'],['Aerospace','Aerospace'],['Telecom','Telecom'],['Foods','Food'],['Pharma','Healthcare'],['Utilities','Energy'],['Freight','Logistics'],['Capital','Finance']];
const PREF=['Hafen','Nord','Alpen','Rhein','Elb','Spree','Isar','Main','Weser','Ostsee','Hanse','Berg','Sonnen','Stern','Falken','Linden','Eichen','Kristall','Blau','Grün','Wald','Fels','Mühlen','Ufer','Brücken','Turm','Kranich','Möwen','Leucht','Anker'];
const KINDS=[['Cloud Migration','cloud'],['Data Platform','data'],['AI Assistant','ai'],['Customer Portal','web'],['Mobile App','mobile'],['S/4HANA Rollout','sap'],['CRM Rollout','crm'],['IAM Modernization','sec'],['Test Automation','qa'],['Design System','design'],['Analytics Dashboard','data'],['API Platform','java'],['Predictive Maintenance','ai'],['E-Commerce Relaunch','web'],['Data Mesh','data'],['Platform Rebuild','cloud'],['Self-Service Portal','web'],['Document AI','ai'],['Legacy Maintenance','legacy']];
const DOCKINDS=['Architecture','Lessons Learned','Runbook','Proposal','Concept','Test Plan','Handover'];

const NODES=new Map(),EDGES=[],ADJ=new Map(),BYLABEL=new Map();
function N(id,t,label,x={}){const n=Object.assign({id,t,label},x);NODES.set(id,n);ADJ.set(id,[]);BYLABEL.set(label.toLowerCase(),id);return n}
function E(s,t,r,x={}){const i=EDGES.length;EDGES.push(Object.assign({i,s,t,r,conf:1},x));ADJ.get(s).push(i);ADJ.get(t).push(i)}

const systemsByArea={};Object.entries(AREAS).forEach(([a,l])=>{systemsByArea[a]=l.map(name=>{const id='s:'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-');N(id,'s',name,{area:a});return id})});
const teamsByDept={},peopleByDept={},peopleByArea={};

function hiddenNeighbors(id){const seen=new Set(),out=[];
  ADJ.get(id).forEach(i=>{const e=EDGES[i];if(!edgeOk(e))return;const o=other(e,id);if(cy.$id(o).length||seen.has(o)||!nodeOk(NODES.get(o)))return;seen.add(o);out.push(e)});
  return out.sort((a,b)=>score(b,id)-score(a,id))}
function moreFor(id){cy.nodes('[t="m"]').remove();if(!cy.$id(id).length)return;const rest=hiddenNeighbors(id).length;if(!rest)return;

function bfs(a,b){const prev=new Map([[a,null]]);const q=[a];while(q.length){const x=q.shift();if(x===b)break;

const tags=new Map(),icons=new Map();
function sync3d(){syncQ=false;if(!is3d)return;
  const old=new Map(g3.graphData().nodes.map(n=>[n.id,n]));let kept=0;
  const nodes=cy.nodes().map(c=>{const d=c.data();const o=old.get(d.id);if(o)kept++;
    const n=Object.assign(o||{},{id:d.id,t:d.t,label:d.label,size:d.size,agg:d.agg,left:d.left});
    if(!o){const own=d.owner||cy.$id(d.id).neighborhood('node').filter(x=>old.has(x.id())).map(x=>x.id())[0];const p=own&&old.get(own);if(p&&p.x!=null){const a=Math.random()*6.283,b=Math.random()*3.1416;n.x=p.x+40*Math.sin(b)*Math.cos(a);n.y=p.y+40*Math.sin(b)*Math.sin(a);n.z=p.z+40*Math.cos(b)}}
    return n});
  if(kept<nodes.length*.5)fitPending=true;
  const links=cy.edges().map(e=>({id:e.id(),source:e.data('source'),target:e.data('target'),label:e.data('label'),agg:e.data('agg'),w:e.data('w')||1,q:edgeQ(e.data())}));
  g3.graphData({nodes,links});
  const ids=new Set(nodes.map(n=>n.id));
  tags.forEach((d,id)=>{if(!ids.has(id)){d.remove();tags.delete(id);icons.get(id).remove();icons.delete(id)}});
  nodes.forEach(n=>{let d=tags.get(n.id);if(!d){d=document.createElement('span');layer.appendChild(d);tags.set(n.id,d)}d.textContent=n.label;d.className=n.agg?'agg':'';if(!icons.has(n.id)){const ic=document.createElement('i');if(n.agg){ic.innerHTML=svgIcon(n.t,'currentColor');ic.style.background='var(--bg)';ic.style.border=`2px solid var(--c-${n.t})`;ic.style.color=`var(--c-${n.t})`;ic.style.boxSizing='border-box'}else{ic.innerHTML=svgIcon(n.t,'#ffffff');ic.style.background=`var(--c-${n.t})`}ic.title=n.label;ic.classList.toggle('gone',!!n.left);
    ic.onclick=ev=>{ev.stopPropagation();clickNode(n.id)};layer.insertBefore(ic,layer.firstChild);icons.set(n.id,ic)}
    const ic=icons.get(n.id),sz=dotSize(n);ic.style.width=ic.style.height=sz+'px';ic.dataset.sz=sz});
}
function refresh3d(){refQ=false;if(!is3d)return;g3.nodeColor(g3.nodeColor()).linkColor(g3.linkColor()).linkWidth(g3.linkWidth())}
cy.on('add remove',()=>{if(!syncQ){syncQ=true;setTimeout(sync3d,0)}});
const proto=Object.getPrototypeOf(cy.collection());
['addClass','removeClass','toggleClass'].forEach(fn=>{const o=proto[fn];proto[fn]=function(...a){const r=o.apply(this,a);if(!refQ){refQ=true;setTimeout(refresh3d,0)}return r}});
const hex=c=>{c=c.replace('#','');if(c.length===3)c=[...c].map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(c.substr(i,2),16))};
function mixCol(c,alpha){const bg=hex(css('--bg'));return 'rgb('+c.map((v,i)=>Math.round(bg[i]+(v-bg[i])*alpha)).join(',')+')'}
/* highlighted links: solid accent, kept at 2 screen pixels by rescaling the cylinder's thickness to the camera distance */
function pulseLinks(){const cam=g3.camera(),m=cam.matrixWorldInverse.elements,foc=box3.clientHeight/2/Math.tan(cam.fov*Math.PI/360);
  g3.graphData().links.forEach(l=>{const o=l.__lineObj;if(!o||o.type!=='Mesh'||typeof l.source!=='object')return;
    const x=(l.source.x+l.target.x)/2,y=(l.source.y+l.target.y)/2,z=(l.source.z+l.target.z)/2,zc=-(m[2]*x+m[6]*y+m[10]*z+m[14]);
    const f=Math.max(.01,2*zc/foc);o.scale.x=o.scale.y=f;
    if(o.material.emissive)o.material.emissive.set(css('--accent'))})}
(function tick(){requestAnimationFrame(tick);if(!is3d)return;pulseLinks();
  const cam=g3.camera(),m=cam.matrixWorldInverse.elements,items=[];
  g3.graphData().nodes.forEach(n=>{const d=tags.get(n.id),ic=icons.get(n.id);if(!d)return;
    const zc=n.x==null?1:m[2]*n.x+m[6]*n.y+m[10]*n.z+m[14];if(zc>0){d.style.display=ic.style.display='none';return}
    const s=g3.graph2ScreenCoords(n.x,n.y,n.z),e=st(n.id),sel=e.hasClass('sel'),strong=sel||n.agg,is=+ic.dataset.sz;
    ic.style.display='';ic.style.transform=`translate(${s.x-is/2}px,${s.y-is/2}px)`;ic.classList.toggle('sel',sel);ic.style.zIndex=Math.round(1e5/(-zc));
    d.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,${is/2+3}px)`;d.style.fontSize=(strong?12:11)+'px';d.style.fontWeight=sel?600:'';
    d.classList.toggle('pill',sel);d.style.zIndex=sel?2e9:Math.round(1e5/(-zc))+(strong?1e6:0);if(sel)ic.style.zIndex=2e9-1;
    const mm=measure(n.label,strong?12:11,strong);
    items.push({id:n.id,x:s.x,y:s.y,w:mm.w,h:mm.h,dot:is,force:sel,pri:(sel?1e12:0)+1e6/(-zc)+e.degree()*1e-3})});
  const show=placeLabels(items);
  items.forEach(it=>{const d=tags.get(it.id);d.style.display='';d.style.opacity=show.has(it.id)?1:.25});
})();
addEventListener('resize',()=>g3.width(box3.clientWidth).height(box3.clientHeight));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{g3.backgroundColor(css('--bg'));refresh3d()});
btnV.onclick=()=>{is3d=!is3d;btnV.textContent=is3d?'2D view':'3D view';btnV.setAttribute('aria-pressed',!is3d);
  box3.classList.toggle('hide',!is3d);cyBox.classList.toggle('hide',is3d);
  if(is3d){fitPending=true;sync3d();refresh3d()}else{cy.resize();cy.fit(undefined,40)}};
const gear=document.getElementById('gear'),settings=document.getElementById('settings');
gear.onclick=ev=>{ev.stopPropagation();const o=settings.hidden;settings.hidden=!o;gear.setAttribute('aria-expanded',o)};
document.addEventListener('pointerdown',ev=>{if(!settings.hidden&&!settings.contains(ev.target)&&!gear.contains(ev.target)){settings.hidden=true;gear.setAttribute('aria-expanded',false)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){settings.hidden=true;gear.setAttribute('aria-expanded',false)}});
/* history: every expand, recenter, drill or question is a step you can go back and forward through */
const hist=[];let hi=-1,restoring=false,recQ=false;
const backB=document.getElementById('back'),fwdB=document.getElementById('fwd');
function navButtons(){backB.disabled=hi<=0;fwdB.disabled=hi>=hist.length-1}
function snapshot(){return {mode,crumbs:crumbs.slice(),els:cy.elements().jsons().map(j=>({group:j.group,data:j.data,position:j.position})),sel:cy.$('node.sel').id()||null,panel:panel.innerHTML,hint:hintEl.textContent}}
function recordSoon(){if(restoring||recQ)return;recQ=true;setTimeout(()=>{recQ=false;hist.splice(hi+1);hist.push(snapshot());if(hist.length>60)hist.shift();hi=hist.length-1;navButtons()},0)}
function restore(k){if(k<0||k>=hist.length)return;hi=k;const st=hist[k];restoring=true;
  cy.elements().remove();cy.add(st.els);mode=st.mode;setCrumbs(st.crumbs);hintEl.textContent=st.hint;runLayout(false);
  if(st.sel&&cy.$id(st.sel).length)select(st.sel);else{cy.nodes().removeClass('sel');panel.innerHTML=st.panel}
  restoring=false;navButtons()}
backB.onclick=()=>restore(hi-1);fwdB.onclick=()=>restore(hi+1);
document.addEventListener('keydown',ev=>{if(ev.altKey&&ev.key==='ArrowLeft'){ev.preventDefault();restore(hi-1)}if(ev.altKey&&ev.key==='ArrowRight'){ev.preventDefault();restore(hi+1)}});
['showOverview','drillDept','drillIndustry','startExplore','showSet','expandAll'].forEach(fn=>{const o=window[fn];window[fn]=function(...a){const r=o.apply(this,a);recordSoon();return r}});
computeRel();showOverview();
</script>
