<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modell · 3D-Asset-Katalog</title>
<script defer src="/analytics.js"></script>
<style>
:root{--bg:#14161c;--panel:#1c1f28;--panel2:#232733;--line:#2f3444;
  --ink:#e9ecf3;--dim:#98a0b4;--acc:#7fd4a8;--acc2:#f0b45c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.back{border:1px solid var(--line);background:var(--panel2);border-radius:8px;
  padding:6px 12px;font-size:14px;text-decoration:none;white-space:nowrap}
.back:hover{border-color:var(--acc)}
.tt{min-width:0}
h1{font-size:17px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;position:relative;min-height:0}
canvas{display:block}
.hud{position:absolute;left:14px;bottom:14px;background:rgba(28,31,40,.86);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;
  color:var(--dim);line-height:1.7;backdrop-filter:blur(6px);max-width:min(320px,60vw)}
.hud b{color:var(--ink);font-weight:600}
.ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px}
button{background:rgba(28,31,40,.86);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;
  backdrop-filter:blur(6px)}
button:hover{border-color:var(--acc)}
select{background:rgba(28,31,40,.86);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;max-width:170px}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
#fav[aria-pressed="true"]{border-color:var(--acc2);color:var(--acc2)}
.dl{text-decoration:none;text-align:center}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← Katalog</a>
  <div class="tt"><h1 id="title">…</h1><div class="sub" id="sub"></div></div>
</header>
<main id="stage">
  <div class="msg" id="msg">Lade …</div>
  <div class="ctrl">
    <button id="rot" aria-pressed="true">Rotation</button>
    <button id="wire" aria-pressed="false">Wireframe</button>
    <button id="grid" aria-pressed="true">Boden</button>
    <button id="reset">Ansicht</button>
    <button id="fav" aria-pressed="false">☆ Favorit</button>
    <select id="clips" hidden></select>
    <a class="back dl" id="dl" download>Download</a>
  </div>
  <div class="hud" id="hud"></div>
</main>

<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const file = new URLSearchParams(location.search).get('m');
if(!file){ location.replace('index.html'); }
const url = 'models/' + file.split('/').map(encodeURIComponent).join('/');
const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
document.getElementById('dl').href = url;

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181b23);
scene.add(new THREE.HemisphereLight(0xffffff,0x39405a,1.9));
const key = new THREE.DirectionalLight(0xffffff,1.8);
key.position.set(4,7,5); key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd2ff,.55);
fill.position.set(-5,3,-4); scene.add(fill);

const cam = new THREE.PerspectiveCamera(38,1,.01,2000);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .07;

const pivot = new THREE.Group(); scene.add(pivot);
const helper = new THREE.Group(); scene.add(helper);
let mixer = null, home = null, radius = 1, root3d = null, action = null;
const clips = [];                       // {clip|lazy, name, groupLabel}
const sel = document.getElementById('clips');
const libCache = new Map();

function addClip(clip, group, name){
  clips.push({clip, name: name || clip.name, group});
  refreshClipList();
}
function refreshClipList(){
  sel.hidden = clips.length === 0;
  const cur = sel.value;
  sel.innerHTML = '';
  let g = null, og = null;
  clips.forEach((c,i)=>{
    if(c.group !== g){
      g = c.group;
      og = document.createElement('optgroup'); og.label = g; sel.append(og);
    }
    const o = document.createElement('option');
    o.value = i; o.textContent = c.name;
    (og || sel).append(o);
  });
  if(cur) sel.value = cur;
}
function play(i){
  const c = clips[i]; if(!c || !mixer) return;
  if(action) action.fadeOut(.25);
  action = mixer.clipAction(c.clip, root3d);
  action.reset().fadeIn(.25).play();
  sel.value = i;
}

const clock = new THREE.Clock();

function fit(obj){
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(center);
  obj.position.y += size.y/2;                   // auf den Boden stellen
  radius = Math.max(size.x,size.y,size.z) || 1;
  const dist = (radius*.5)/Math.tan(THREE.MathUtils.degToRad(cam.fov*.5)) * 2.2;
  // Blickrichtung als feste Richtung um die Mitte herum — frueher stand die
  // Kamera bei hohen Modellen fast senkrecht darueber, weil die volle
  // Modellhoehe auf die Kamerahoehe addiert wurde.
  const tgt = new THREE.Vector3(0, size.y/2, 0);
  const dir = new THREE.Vector3(.62,.42,.66).normalize().multiplyScalar(dist);
  home = {pos: tgt.clone().add(dir), tgt};
  cam.near = radius/200; cam.far = radius*60; cam.updateProjectionMatrix();
  controls.minDistance = radius*.2; controls.maxDistance = radius*12;
  resetView();

  const g = new THREE.GridHelper(radius*6, 24, 0x3a4256, 0x2a2f3d);
  helper.add(g);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(radius*8,radius*8),
    new THREE.ShadowMaterial({opacity:.28}));
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; helper.add(floor);
  key.shadow.camera.left = -radius*2; key.shadow.camera.right = radius*2;
  key.shadow.camera.top = radius*2; key.shadow.camera.bottom = -radius*2;
  key.shadow.camera.far = radius*20; key.shadow.camera.updateProjectionMatrix();
  key.position.set(radius*2,radius*3.5,radius*2.5);
}
function resetView(){
  if(!home) return;
  cam.position.copy(home.pos);
  controls.target.copy(home.tgt);
  controls.update();
}

new GLTFLoader().load(url, g=>{
  msg.remove();
  pivot.add(g.scene);
  let tris = 0, meshes = 0, mats = new Set();
  g.scene.traverse(o=>{
    if(o.isMesh){
      o.castShadow = true; o.receiveShadow = true; meshes++;
      const p = o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count;
      tris += p/3;
      for(const m of [].concat(o.material)) mats.add(m.name || m.uuid);
    }
  });
  fit(g.scene);

  // Eigene Clips zuerst; passende Fremdbibliotheken kommen asynchron dazu.
  mixer = new THREE.AnimationMixer(g.scene);
  root3d = g.scene;
  for(const c of g.animations) addClip(c, 'Eigene Animationen');
  if(g.animations.length) play(0);
  loadLibs();

  const name = file.split('/').pop().replace(/\.(gltf|glb)$/,'').replace(/\.gltf$/,'');
  document.title = name + ' · 3D-Asset-Katalog';
  document.getElementById('title').textContent = name.replace(/[_-]/g,' ');
  document.getElementById('sub').textContent = file.split('/')[0].replace(/_/g,' ');
  document.getElementById('hud').innerHTML =
    '<b>' + Math.round(tris).toLocaleString('de-DE') + '</b> Dreiecke · <b>' + meshes +
    '</b> Mesh(es) · <b>' + mats.size + '</b> Material(ien)' +
    (g.animations.length ? '<br><b>' + g.animations.length + '</b> Animation(en)' : '') +
    '<br>Ziehen = drehen · Scrollen = zoomen · Rechts ziehen = schieben';
}, undefined, e=>{ msg.textContent = 'Konnte das Modell nicht laden.'; });

// Fremdanimationen: Bibliotheken mit derselben Rig-Signatur. Die Clips
// werden erst beim Auswaehlen geladen, sonst waeren es 12 Dateien a ~1 MB.
async function loadLibs(){
  let data;
  try{ data = await (await fetch('rigs.json')).json(); }catch(e){ return; }
  const rig = data.rigs[file];
  if(!rig) return;
  const myPack = file.split('/')[0];
  const libs = data.libs
    .filter(l => l.rig === rig && l.file !== file)
    .sort((a,b)=> (b.file.startsWith(myPack) - a.file.startsWith(myPack))
                  || a.label.localeCompare(b.label));
  const seen = new Set(clips.map(c=>c.name));
  for(const lib of libs){
    const fresh = lib.clips.filter(n => !seen.has(n));
    if(!fresh.length) continue;
    for(const n of fresh){
      seen.add(n);
      clips.push({clip: null, lib, name: n, group: lib.label});
    }
  }
  refreshClipList();
  if(clips.length && !action) sel.value = '';
  const extra = clips.filter(c=>c.lib).length;
  const hud = document.getElementById('hud');
  if(extra && hud) hud.insertAdjacentHTML('afterbegin',
    '<b>' + extra + '</b> Clips aus der passenden Rig-Bibliothek<br>');
}

// Beim Uebertragen auf eine andere Figur nur die Rotationen nehmen (plus die
// Position von root/hips fuer die Fortbewegung). Die Scale-Tracks gehoeren
// zu den Proportionen des Mannequins — auf einer Figur blasen sie z.B. den
// Helm auf, weil KayKit Kopfgroessen ueber die Knochenskalierung loest.
function retarget(clip){
  const keep = clip.tracks.filter(t=>{
    if(t.name.endsWith('.scale')) return false;
    if(t.name.endsWith('.position')) return /^(root|hips)\./.test(t.name);
    return true;
  });
  const out = new THREE.AnimationClip(clip.name, clip.duration, keep);
  out.blendMode = clip.blendMode;
  return out;
}

async function ensureClip(i){
  const c = clips[i];
  if(c.clip) return c.clip;
  const url = 'models/' + c.lib.file.split('/').map(encodeURIComponent).join('/');
  if(!libCache.has(c.lib.file)){
    libCache.set(c.lib.file, new Promise((res,rej)=>
      new GLTFLoader().load(url, g=>res(g.animations), undefined, rej)));
  }
  const anims = await libCache.get(c.lib.file);
  const src = anims.find(a => a.name === c.name);
  c.clip = src ? retarget(src) : null;
  return c.clip;
}

sel.addEventListener('change', async ()=>{
  const i = +sel.value;
  sel.disabled = true;
  try{ if(await ensureClip(i)) play(i); }
  finally{ sel.disabled = false; }
});

// UI
let spin = true, wire = false;
const rotBtn = document.getElementById('rot');
const wireBtn = document.getElementById('wire');
const gridBtn = document.getElementById('grid');
rotBtn.onclick = ()=>{ spin = !spin; rotBtn.ariaPressed = spin; };
wireBtn.onclick = ()=>{
  wire = !wire; wireBtn.ariaPressed = wire;
  pivot.traverse(o=>{ if(o.isMesh) for(const m of [].concat(o.material)) m.wireframe = wire; });
};
gridBtn.onclick = ()=>{ helper.visible = !helper.visible; gridBtn.ariaPressed = helper.visible; };
document.getElementById('reset').onclick = resetView;

// Favorit — gleicher localStorage-Key wie im Katalog
const FAV_KEY = 'kaykit.favs';
const favBtn = document.getElementById('fav');
let favs = new Set();
try{ favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }catch(e){}
function paintFav(){
  const on = favs.has(file);
  favBtn.ariaPressed = on;
  favBtn.textContent = (on ? '★' : '☆') + ' Favorit';
}
favBtn.onclick = ()=>{
  if(favs.has(file)) favs.delete(file); else favs.add(file);
  try{ localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); }catch(e){}
  paintFav();
};
paintFav();
addEventListener('keydown', e=>{ if(e.key === 'Escape') location.href = 'index.html'; });

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w,h);
  cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta();
  if(mixer) mixer.update(dt);
  if(spin) pivot.rotation.y += dt*.5;
  controls.update();
  renderer.render(scene,cam);
});
</script>
</body>
</html>
