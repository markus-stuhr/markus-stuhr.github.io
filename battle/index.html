<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Burgenkrieg</title>
<script defer src="/analytics.js"></script>
<style>
:root{
  --panel:#1d1a16ee; --line:#5a4a33; --text:#f1e6cf; --muted:#b7a78a;
  --gold:#e8c14a; --wood:#b98a52; --ok:#7fd36b; --bad:#e2574c; --btn:#2d271f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1712;color:var(--text);
  font:14px/1.3 "Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas#gl{display:block;position:fixed;inset:0}
canvas#ov{position:fixed;inset:0;pointer-events:none}
#top{position:fixed;top:0;left:0;right:0;height:38px;display:flex;gap:22px;align-items:center;
  padding:0 16px;background:linear-gradient(#000a,#0000);font-weight:bold;text-shadow:0 1px 2px #000}
#top .res{display:flex;gap:6px;align-items:center}
#top .dot{width:12px;height:12px;border-radius:50%}
.ico{display:inline-block;width:20px;height:20px;vertical-align:-5px}
.ico svg{width:100%;height:100%;display:block}
#cmds .ico{width:13px;height:13px;vertical-align:-2px}
#info .ico{width:15px;height:15px;vertical-align:-3px}
#top .wave{margin-left:auto;color:var(--muted);font-weight:normal}
#msg{position:fixed;top:46px;left:50%;transform:translateX(-50%);text-align:center;
  text-shadow:0 1px 3px #000;font-weight:bold;pointer-events:none}
#msg div{animation:fade 3.5s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
#bottom{position:fixed;left:0;right:0;bottom:0;height:150px;display:flex;gap:10px;padding:10px;
  background:var(--panel);border-top:2px solid var(--line)}
#mini{width:130px;height:130px;flex:none;border:1px solid var(--line);background:#2d4020;cursor:pointer}
#info{flex:1;min-width:0;overflow:hidden}
#info h3{margin:0 0 4px;font-size:16px}
#info .sub{color:var(--muted);font-size:13px}
#info .icons{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
#info .icons span{padding:1px 5px;background:#0005;border-radius:3px;font-size:12px}
#queue{display:flex;gap:4px;margin-top:6px;align-items:center}
#queue span{padding:2px 6px;background:#0006;border-radius:3px;font-size:12px}
#queue .bar{width:120px;height:6px;background:#0008;border-radius:3px;overflow:hidden}
#queue .bar i{display:block;height:100%;background:var(--ok)}
#cmds{display:grid;grid-template-columns:repeat(4,86px);grid-auto-rows:62px;gap:5px;flex:none;align-content:start}
#cmds button{background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:4px;
  font:inherit;font-size:12px;cursor:pointer;padding:3px;line-height:1.15}
#cmds button:hover{background:#40372b}
#cmds button:disabled{opacity:.4;cursor:default}
#cmds button small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#cmds button kbd{float:right;font-size:10px;color:var(--muted)}
#tip{position:fixed;pointer-events:none;padding:2px 7px;border-radius:4px;background:#000b;color:#fff;
  font-size:12px;font-weight:bold;white-space:nowrap;display:none;z-index:5}
#box{position:fixed;border:1px solid #9f9;background:#9f92;display:none;pointer-events:none}
#load,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#1a1712;gap:12px;z-index:10;text-align:center;padding:16px}
#load h1,#end h1{margin:0;font-size:40px;letter-spacing:2px;color:var(--gold)}
#load .bar{width:min(320px,80vw);height:8px;background:#000;border-radius:4px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#load p,#end p{color:var(--muted);max-width:520px;margin:0}
#end{display:none;background:#000c}
button.big{background:var(--gold);color:#221;border:0;border-radius:6px;padding:10px 22px;font:bold 16px inherit;cursor:pointer}
#help{position:fixed;top:44px;right:12px;color:var(--muted);font-size:12px;text-align:right;
  text-shadow:0 1px 2px #000;line-height:1.5;pointer-events:none}
@media (max-width:760px){
  #bottom{height:auto;flex-wrap:wrap}
  #mini{width:90px;height:90px}
  #cmds{grid-template-columns:repeat(4,1fr);width:100%}
  #help{display:none}
}
</style>

function load(p){

    toLoad++;

      loaded++;

}

// Gebäude: Modell, Grundfläche (Weltbreite), Werte
const BUILD = {

  archery:{name:'Schießstand', m:[RTS+'Archery_FirstAge_Level1.glb', RTS+'Archery_SecondAge_Level1.glb'],

    size:5, hp:600, cost:{wood:100, gold:50}, time:20, shoot:{range:15, dmg:9, cd:1.4}, key:'G'},

const BUILD_MENU = ['house','storage','barracks','archery','temple','tower'];

// Einheiten: Modell, Waffen (Handslot r/l), Werte, Animationen
const UNIT = {
  worker:{name:'Arbeiter', m:ADV+'Characters/gltf/Rogue.glb', r:[ADV+'Assets/gltf/axe_1handed.gltf'],
    hp:45, speed:4.2, dmg:3, range:1.3, cd:1.2, cost:{gold:50}, time:10, pop:1},
  knight:{name:'Ritter', m:ADV+'Characters/gltf/Knight.glb', r:[ADV+'Assets/gltf/sword_1handed.gltf'],
    l:[ADV+'Assets/gltf/shield_round_color.gltf'], hp:140, speed:3.8, dmg:13, range:1.5, cd:1.1, armor:2,
    cost:{gold:60, wood:20}, time:14, pop:1},
  ranger:{name:'Bogenschütze', m:ADV+'Characters/gltf/Ranger.glb', l:[ADV+'Assets/gltf/bow_withString.gltf'],
    hp:60, speed:4, dmg:8, range:13, cd:1.6, shot:'arrow', atk:'Ranged_Bow_Release',
    cost:{gold:30, wood:50}, time:12, pop:1},
  mage:{name:'Magier', m:ADV+'Characters/gltf/Mage.glb', r:[ADV+'Assets/gltf/staff.gltf'],
    hp:55, speed:3.6, dmg:22, range:11, cd:2.4, shot:'magic', splash:2.2, atk:'Ranged_Magic_Shoot',
    cost:{gold:90, wood:30}, time:18, pop:1},
  // Gegner
  s_minion:{name:'Skelett', m:SKL+'characters/gltf/Skeleton_Minion.glb', r:[SKL+'assets/gltf/Skeleton_Axe.gltf'],
    hp:55, speed:3.6, dmg:7, range:1.3, cd:1.2},
  s_warrior:{name:'Skelettkrieger', m:SKL+'characters/gltf/Skeleton_Warrior.glb', r:[SKL+'assets/gltf/Skeleton_Blade.gltf'],
    l:[SKL+'assets/gltf/Skeleton_Shield_Small_A.gltf'], hp:120, speed:3.5, dmg:12, range:1.5, cd:1.2, armor:2},
  s_rogue:{name:'Skelettschütze', m:SKL+'characters/gltf/Skeleton_Rogue.glb', r:[SKL+'assets/gltf/Skeleton_Crossbow.gltf'],
    hp:50, speed:3.8, dmg:8, range:12, cd:1.9, shot:'arrow', atk:'Ranged_1H_Shoot'},
  s_mage:{name:'Skelettmagier', m:SKL+'characters/gltf/Skeleton_Mage.glb', r:[SKL+'assets/gltf/Skeleton_Staff.gltf'],
    hp:50, speed:3.4, dmg:18, range:10, cd:2.6, shot:'magic', splash:2, atk:'Ranged_Magic_Shoot'},
};

const RES = {
  tree:{m:[RTS+'Resource_Tree_Group.glb', RTS+'Resource_PineTree_Group.glb'],
        cut:[RTS+'Resource_Tree_Group_Cut.glb', RTS+'Resource_PineTree_Group_Cut.glb'], size:4.5, amount:350, kind:'wood'},
  gold:{m:[RTS+'Resource_Gold_2.glb', RTS+'Resource_Gold_3.glb'], size:3.6, amount:900, kind:'gold'},
};
const DECOR = [RTS+'Mountain_Group_1.glb', RTS+'Mountain_Group_2.glb', RTS+'MountainLarge_Single.glb',
               RTS+'Rock_Group.glb', RTS+'Rock.glb', RTS+'Resource_Tree1.glb', RTS+'Resource_PineTree.glb'];
const ANIMS = ['General','MovementBasic','CombatMelee','CombatRanged','Tools'].map(n=>ANI+'Rig_Medium_'+n+'.glb');
const ARROW = ADV+'Assets/gltf/arrow_bow.gltf';

// ---------------------------------------------------------------- Szene
const MAP = 90;                                    // halbe Kantenlänge
const cv = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fb8d8);
scene.fog = new THREE.Fog(0x8fb8d8, 110, 220);
const camera = new THREE.PerspectiveCamera(38, 1, 1, 500);
scene.add(new THREE.HemisphereLight(0xdfeeff, 0x4a5a2a, 1.1));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-55, right:55, top:55, bottom:-55, near:1, far:200});
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// ---------------------------------------------------------------- Gelände
// Zwei Basisplateaus mit Steilklippen und je zwei Rampen, ein Fluss mit drei Furten
// quer über die Karte, sanfte Hügel und ein paar unpassierbare Felsspitzen.
const WATER = -0.9;
const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
const PLATEAUS = [
  {x:-55, z:55, ramps:[-Math.PI/4, -Math.PI/4 - 1.25]},
  {x:55, z:-55, ramps:[Math.PI*3/4, Math.PI*3/4 - 1.25]},
];
const HILLS = [[-38,2,3,10],[38,-2,3,10],[-8,-44,2.6,9],[8,44,2.6,9],[-70,-30,3.5,12],[70,30,3.5,12],
               [30,70,2.5,10],[-30,-70,2.5,10]];
const CRAGS = [[-22,-8,6,3.6],[22,8,6,3.6],[-58,4,6,3.2],[58,-4,6,3.2],[6,-68,6,3.4],[-6,68,6,3.4]];
const FORDS = [-52, 0, 52];
function plateauK(x, z){
  let k = 0;
  for(const p of PLATEAUS){
    const dx = x-p.x, dz = z-p.z, d = Math.hypot(dx, dz), a = Math.atan2(dz, dx);
    let ramp = 0;
    for(const r of p.ramps){
      const da = Math.abs(Math.atan2(Math.sin(a-r), Math.cos(a-r)));
      ramp = Math.max(ramp, 1 - sstep(0.14, 0.28, da));
    }
    k = Math.max(k, 1 - sstep(29.5, 33.5 + 15*ramp, d));
  }
  return k;
}
function H(x, z){
  const pk = plateauK(x, z);
  let h = (0.35*Math.sin(x*0.13)*Math.cos(z*0.11) + 0.25*Math.sin((x+z)*0.07)) * (1 - pk);
  for(const [hx,hz,hh,hr] of HILLS) h += hh*Math.exp(-((x-hx)**2 + (z-hz)**2)/(hr*hr));
  for(const [hx,hz,hh,hr] of CRAGS) h += hh*Math.exp(-((x-hx)**2 + (z-hz)**2)/(hr*hr));
  h = Math.max(h, 4*pk);
  // Fluss entlang der Diagonale x = z
  const sv = (x - z)/Math.SQRT2 + 5*Math.sin((x + z)*0.045), uv = (x + z)/Math.SQRT2;
  const rk = 1 - sstep(3.5, 7, Math.abs(sv));
  if(rk > 0){
    let ford = 0; for(const f of FORDS) ford = Math.max(ford, 1 - sstep(3, 6, Math.abs(uv - f)));
    const bed = -2.2 + 1.8*ford;
    h = h + (bed - h)*rk;
  }
  return h;
}
function slope(x, z){
  const e = 0.5;
  return Math.hypot(H(x+e,z) - H(x-e,z), H(x,z+e) - H(x,z-e)) / (2*e);
}
// Laufraster: eine Zelle pro Welteinheit
const GN = MAP*2, terrainOK = new Uint8Array(GN*GN), blocked = new Uint8Array(GN*GN);
const cellX = v => Math.min(GN-1, Math.max(0, Math.floor(v + MAP)));
for(let j=0;j<GN;j++) for(let i=0;i<GN;i++){
  const x = i - MAP + 0.5, z = j - MAP + 0.5;
  terrainOK[j*GN+i] = H(x, z) > WATER + 0.2 && slope(x, z) < 0.75 ? 1 : 0;
}
// Nur Zellen behalten, die von der Spielerbasis aus erreichbar sind (Felsspitzen sind oben flach)
{
  const seen = new Uint8Array(GN*GN), q = [cellX(55)*GN + cellX(-55)];
  seen[q[0]] = 1;
  while(q.length){
    const k = q.pop(), x = k % GN, z = (k/GN)|0;
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, nz = z+dz; if(nx<0||nz<0||nx>=GN||nz>=GN) continue;
      const nk = nz*GN+nx; if(seen[nk] || !terrainOK[nk]) continue;
      seen[nk] = 1; q.push(nk);
    }
  }
  for(let k=0;k<terrainOK.length;k++) if(!seen[k]) terrainOK[k] = 0;
}
let gridDirty = true;
function rebuildGrid(){
  for(let k=0;k<blocked.length;k++) blocked[k] = terrainOK[k] ? 0 : 1;
  for(const e of ents){
    if(!e.alive || e.kind === 'unit') continue;
    const r = e.r + 0.3, i0 = cellX(e.pos.x - r), i1 = cellX(e.pos.x + r), j0 = cellX(e.pos.z - r), j1 = cellX(e.pos.z + r);
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++)
      if(Math.hypot(i - MAP + 0.5 - e.pos.x, j - MAP + 0.5 - e.pos.z) < r) blocked[j*GN+i] = 1;
  }
  gridDirty = false;
}
const walkTerrain = (x, z) => terrainOK[cellX(z)*GN + cellX(x)] === 1;
const free = (x, z) => { if(gridDirty) rebuildGrid(); return blocked[cellX(z)*GN + cellX(x)] === 0; };
// Nächste freie Stelle (für Ziele in Gebäuden, Wasser oder Felsen)
function freeNear(x, z, maxR = 14){
  if(free(x, z)) return {x, z};
  for(let r=1;r<=maxR;r++){
    let best = null, bd = 1e9;
    for(let a=0;a<16;a++){
      const px = x + Math.cos(a/16*Math.PI*2)*r, pz = z + Math.sin(a/16*Math.PI*2)*r;
      if(Math.abs(px) < MAP && Math.abs(pz) < MAP && free(px, pz)){
        const d = Math.hypot(px-x, pz-z); if(d < bd){ bd = d; best = {x:px, z:pz}; } }
    }
    if(best) return best;
  }
  return {x, z};
}
function los(ax, az, bx, bz, skipStart, skipEnd = 0){
  // Anfang nur überspringen, wenn die Einheit selbst in einer gesperrten Zelle steht
  if(skipStart === undefined || free(ax, az)) skipStart = free(ax, az) ? 0 : 0.6;
  const d = Math.hypot(bx-ax, bz-az), n = Math.ceil(d/0.3);
  for(let k=1;k<n;k++){
    const t = k/n, dd = t*d;
    if(dd < skipStart || dd > d - skipEnd) continue;
    if(!free(ax + (bx-ax)*t, az + (bz-az)*t)) return false;
  }
  return true;
}
// A* auf dem Raster, 8 Nachbarn, keine abgeschnittenen Ecken
const gCost = new Float32Array(GN*GN), parent = new Int32Array(GN*GN), stamp = new Uint32Array(GN*GN);
let searchId = 0;
function findPath(sx, sz, gx, gz){
  if(gridDirty) rebuildGrid();
  const g = freeNear(gx, gz);
  const s0 = cellX(sz)*GN + cellX(sx), goal = cellX(g.z)*GN + cellX(g.x);
  if(s0 === goal) return [];
  searchId++;
  const heap = [], push = (k, f)=>{ heap.push([f,k]); let i = heap.length-1;
    while(i > 0){ const p = (i-1)>>1; if(heap[p][0] <= heap[i][0]) break; [heap[p],heap[i]] = [heap[i],heap[p]]; i = p; } };
  const pop = ()=>{ const top = heap[0], last = heap.pop();
    if(heap.length){ heap[0] = last; let i = 0; for(;;){ const l = 2*i+1, r = l+1; let m = i;
      if(l < heap.length && heap[l][0] < heap[m][0]) m = l; if(r < heap.length && heap[r][0] < heap[m][0]) m = r;
      if(m === i) break; [heap[m],heap[i]] = [heap[i],heap[m]]; i = m; } } return top; };
  const gxC = goal % GN, gzC = (goal/GN)|0;
  const hEst = k => { const dx = Math.abs(k%GN - gxC), dz = Math.abs(((k/GN)|0) - gzC); return Math.max(dx,dz) + 0.414*Math.min(dx,dz); };
  stamp[s0] = searchId; gCost[s0] = 0; parent[s0] = -1; push(s0, hEst(s0));
  let it = 0, found = false;
  while(heap.length && it++ < 40000){
    const [, k] = pop();
    if(k === goal){ found = true; break; }
    const cx = k % GN, cz = (k/GN)|0;
    for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){
      if(!dx && !dz) continue;
      const nx = cx+dx, nz = cz+dz; if(nx<0||nz<0||nx>=GN||nz>=GN) continue;
      const nk = nz*GN+nx; if(blocked[nk]) continue;
      if(dx && dz && (blocked[cz*GN+nx] || blocked[nz*GN+cx])) continue;
      const ng = gCost[k] + (dx && dz ? 1.414 : 1);
      if(stamp[nk] === searchId && gCost[nk] <= ng) continue;
      stamp[nk] = searchId; gCost[nk] = ng; parent[nk] = k; push(nk, ng + hEst(nk));
    }
  }
  if(!found) return null;
  const pts = [];
  for(let k=goal; k!==-1 && k!==s0; k=parent[k]) pts.push({x:k%GN - MAP + 0.5, z:((k/GN)|0) - MAP + 0.5});
  pts.reverse();
  // glätten: jeweils den am weitesten sichtbaren Wegpunkt nehmen
  const out = []; let cur = {x:sx, z:sz}, i = 0;
  while(i < pts.length){
    let j = pts.length-1;
    while(j > i && !los(cur.x, cur.z, pts[j].x, pts[j].z, 0.6)) j--;
    out.push(pts[j]); cur = pts[j]; i = j+1;
  }
  return out;
}

function fit(obj, size, byHeight){
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj), s = b.getSize(new THREE.Vector3());
  const k = size / (byHeight ? s.y : Math.max(s.x, s.z));
  obj.scale.multiplyScalar(k);
  obj.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(obj), c = b2.getCenter(new THREE.Vector3());
  if(!byHeight){ obj.position.x -= c.x; obj.position.z -= c.z; }
  obj.position.y -= b2.min.y;
  return b2.max.y - b2.min.y;
}
function darken(o){
  o.traverse(m=>{ if(m.isMesh){ m.material = m.material.clone(); m.material.color.multiply(new THREE.Color(0.55, 0.5, 0.62)); } });
}
function shadows(o){ o.traverse(m=>{ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } }); }
function prop(gltf, size, byHeight){
  const g = new THREE.Group(), o = gltf.scene.clone(true);
  shadows(o); g.add(o); g.userData.h = fit(o, size, byHeight);
  return g;
}
function retarget(clip){
  const keep = clip.tracks.filter(t => !t.name.endsWith('.scale') &&
    (!t.name.endsWith('.position') || /^(root|hips)\./.test(t.name)));
  return new THREE.AnimationClip(clip.name, clip.duration, keep);
}

const ONCE = /Attack|Shoot|Release|Death|Hit_/;
function play(e, name, fade=0.2, speed=1){
  if(e.anim === name && !ONCE.test(name)) return;
  let a = e.actions[name];
  if(!a){
    if(!clips[name]) return;
    a = e.actions[name] = e.mixer.clipAction(clips[name]);
    if(ONCE.test(name)){ a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
  }
  const prev = e.actions[e.anim];
  a.reset(); a.timeScale = speed; a.play();
  if(prev && prev !== a) a.crossFadeFrom(prev, fade, false);
  e.anim = name;
}

const camTarget = new THREE.Vector3();
let zoom = 42;
const keys = {};
let mouse = {x:innerWidth/2, y:innerHeight/2, in:false};
function updateCamera(dt){
  const sp = zoom * 1.1 * dt;
  let dx = 0, dz = 0;
  if(keys.KeyW || keys.ArrowUp) dz -= 1;
  if(keys.KeyS && !selected.length || keys.ArrowDown) dz += 1;
  if(keys.KeyA && !aMode && !selected.length || keys.ArrowLeft) dx -= 1;
  if(keys.KeyD || keys.ArrowRight) dx += 1;
  if(mouse.in && !dragging){
    // 50 px Randzone: ganz sanft am inneren Rand, volle Geschwindigkeit direkt an der Kante
    const m = 50, ramp = d => d >= m ? 0 : Math.pow(1 - Math.max(d, 0)/m, 2);
    dx += ramp(innerWidth-1 - mouse.x) - ramp(mouse.x);
    dz += ramp(innerHeight-1 - mouse.y) - ramp(mouse.y);
  }
  dx = THREE.MathUtils.clamp(dx, -1, 1); dz = THREE.MathUtils.clamp(dz, -1, 1);
  camTarget.x = THREE.MathUtils.clamp(camTarget.x + dx*sp, -MAP, MAP);
  camTarget.z = THREE.MathUtils.clamp(camTarget.z + dz*sp, -MAP, MAP);
  camTarget.y += (Math.max(0, H(camTarget.x, camTarget.z)) - camTarget.y) * Math.min(1, dt*4);
  camera.position.set(camTarget.x, camTarget.y + zoom, camTarget.z + zoom*0.72);
  camera.lookAt(camTarget);
  sun.position.set(camTarget.x + 30, 70, camTarget.z + 20);
  sun.target.position.copy(camTarget);
}

const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
function groundAt(x, y){
  ray.setFromCamera(new THREE.Vector2(x/innerWidth*2-1, -(y/innerHeight)*2+1), camera);
  const o = ray.ray.origin, d = ray.ray.direction;
  if(d.y >= 0) return null;
  const at = t => [o.x + d.x*t, o.y + d.y*t, o.z + d.z*t];
  const under = t => { const [px,py,pz] = at(t); return py <= Math.max(H(px,pz), WATER); };
  let t = Math.max(0, (9 - o.y)/d.y);
  for(let n=0; n<1200; n++, t+=0.5){
    if(under(t)){
      let a = t - 0.5, b = t;
      for(let k=0;k<10;k++){ const m = (a+b)/2; if(under(m)) b = m; else a = m; }
      const [px,,pz] = at(b);
      return new THREE.Vector3(px, 0, pz);
    }
  }
  return null;
}
const tmpV = new THREE.Vector3();
function screenOf(p, h=0.9){
  tmpV.set(p.x, h + H(p.x, p.z), p.z).project(camera);
  return {x:(tmpV.x+1)/2*innerWidth, y:(1-tmpV.y)/2*innerHeight, ok:tmpV.z < 1};
}
function pick(x, y){
  let best = null, bd = 28;
  for(const e of ents){
    if(!e.alive || e.kind !== 'unit') continue;
    const s = screenOf(e.pos); const d = Math.hypot(s.x-x, s.y-y);
    if(d < bd){ bd = d; best = e; }
  }
  if(best) return best;
  const g = groundAt(x, y); if(!g) return null;
  for(const e of ents) if(e.alive && e.kind !== 'unit' && d2(e.pos, g) < e.r + 0.5) return e;
  return null;
}

cv.addEventListener('touchend', e=>{
  if(touchCam){ if(!e.touches.length) touchCam = null; return; }
  const t = e.changedTouches[0]; const hit = pick(t.clientX, t.clientY);
  if(placing){ mouse.x = t.clientX; mouse.y = t.clientY; updateGhost(); tryPlace(); return; }
  // eigene Einheit/Gebäude antippen = auswählen, sonst Befehl an die Auswahl
  if(hit && hit.team === 0 || !selected.some(s=>s.kind==='unit')) select(hit ? [hit] : []);
  else order(hit, groundAt(t.clientX, t.clientY));
});

addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(gameOver) return;
  if(e.code === 'Escape'){ cancelPlace(); aMode = false; cv.style.cursor = ''; select([]); }
  if(e.code === 'KeyH'){ const tc = ents.find(b=>b.alive && b.team===0 && b.type==='towncenter'); if(tc) camTarget.copy(tc.pos); }
  if(e.code === 'KeyA' && selected.some(s=>s.kind==='unit' && s.team===0)){ aMode = true; cv.style.cursor = 'crosshair'; }
  if(e.code === 'KeyS' && selected.length){
    for(const u of selected) if(u.kind==='unit') stop(u);
  }
  const btn = [...document.querySelectorAll('#cmds button')].find(b=>b.dataset.key === e.key.toUpperCase());
  if(btn && !btn.disabled && e.code !== 'KeyA' && e.code !== 'KeyS') btn.click();
});
addEventListener('keyup', e=> keys[e.code] = false);

function select(list){
  for(const s of selected) s.ring.visible = false;
  selected = list.filter(e=>e.alive);
  // gemischte Auswahl: nur Einheiten behalten
  if(selected.length > 1) selected = selected.filter(e=>e.kind==='unit' && e.team===0);
  for(const s of selected) s.ring.visible = true;
  uiDirty = true;
}

// ---------------------------------------------------------------- Befehle
function stop(u){ u.state = 'idle'; u.target = u.goal = u.amove = u.gatherNode = u.buildTarget = null; }
function formation(center, n, i){
  const cols = Math.ceil(Math.sqrt(n)), sp = 1.4;
  const cx = (i % cols) - (cols-1)/2, cz = Math.floor(i/cols) - (Math.ceil(n/cols)-1)/2;
  const f = freeNear(center.x + cx*sp, center.z + cz*sp);
  return new THREE.Vector3(f.x, 0, f.z);
}
function order(t, g){
  const units = selected.filter(s=>s.kind==='unit' && s.team===0);
  if(!units.length){
    // Gebäude ausgewählt: Sammelpunkt setzen
    const b = selected[0];
    if(b && b.kind==='building' && b.team===0 && g){ b.rally = g.clone(); flag(g, 0x7fff6b); }
    return;
  }
  if(t && t.team === 1){ for(const u of units){ stop(u); u.state = 'attack'; u.target = t; } flag(t.pos, 0xff5a4a); return; }
  if(t && t.kind === 'resource'){
    units.forEach((u,i)=>{ stop(u);
      if(u.type === 'worker'){ u.state = 'gather'; u.gatherNode = t; }
      else { u.state = 'move'; u.goal = formation(t.pos, units.length, i); } });
    flag(t.pos, 0xe8c14a); return;
  }
  if(t && t.kind === 'building' && t.team === 0){
    units.forEach((u,i)=>{ stop(u);
      if(u.type === 'worker' && !t.done){ u.state = 'build'; u.buildTarget = t; }
      else if(u.type === 'worker' && u.carry && BUILD[t.type].drop){ u.state = 'return'; u.dropAt = t; }
      else { u.state = 'move'; u.goal = formation(t.pos, units.length, i); } });
    flag(t.pos, 0x7fff6b); return;
  }
  if(!g) return;
  units.forEach((u,i)=>{ stop(u); u.state = 'move'; u.goal = formation(g, units.length, i); });
  flag(g, 0x7fff6b);
}
function attackMove(g){
  const units = selected.filter(s=>s.kind==='unit' && s.team===0);
  units.forEach((u,i)=>{ stop(u); u.state = 'amove'; u.amove = formation(g, units.length, i); });
  flag(g, 0xff5a4a);
}
const flags = [];
function flag(p, col){
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color:col, transparent:true, depthWrite:false}));
  m.position.set(p.x, Math.max(H(p.x, p.z), WATER) + 0.08, p.z); scene.add(m); flags.push({m, t:0});
}

// ---------------------------------------------------------------- Hover
// Zeigt vor dem Klick, was passieren wird: Cursor, Ring um das Ziel, kurzer Text
const cursorOf = (emoji) => `url("data:image/svg+xml,${encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><text x='4' y='24' font-size='22'>${emoji}</text></svg>`)}") 6 6, pointer`;
const HOVER = {
  attack:{cur:cursorOf('⚔️'), col:0xff4a3a},
  wood:{cur:cursorOf('🪓'), col:0xe8c14a},
  gold:{cur:cursorOf('⛏️'), col:0xe8c14a},
  build:{cur:cursorOf('🔨'), col:0x7fd8ff},
  select:{cur:'pointer', col:0xffffff},
  move:{cur:'crosshair', col:null},
};
const hoverRing = new THREE.Mesh(new THREE.RingGeometry(0.8, 1, 48).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({transparent:true, depthWrite:false}));
hoverRing.position.y = 0.09; hoverRing.visible = false; scene.add(hoverRing);
const tipEl = document.getElementById('tip');
function hoverAction(t){
  const units = selected.filter(s=>s.kind==='unit' && s.team===0);
  const workers = units.some(u=>u.type==='worker');
  if(aMode) return t && t.team === 1 ? ['attack', 'Angreifen: '+nameOf(t)] : ['attack', 'Angriffsmarsch'];
  if(!units.length) return t ? ['select', nameOf(t) + (t.kind==='resource' ? ` (${t.amount})` : '')] : null;
  if(!t) return ['move', null];
  if(t.team === 1) return ['attack', 'Angreifen: '+nameOf(t)];
  if(t.kind === 'resource'){
    if(!workers) return ['move', 'Hinlaufen'];
    return t.type === 'tree' ? ['wood', `Holz fällen (${t.amount})`] : ['gold', `Gold abbauen (${t.amount})`];
  }
  if(t.kind === 'building' && !t.done && workers) return ['build', `Weiterbauen (${Math.floor(t.progress*100)} %)`];
  return ['select', nameOf(t)];
}
function nameOf(t){
  return t.kind === 'unit' ? UNIT[t.type].name : t.kind === 'building' ? BUILD[t.type].name
    : t.type === 'tree' ? 'Wald' : 'Goldader';
}
function updateHover(){
  let act = null, t = null;
  if(mouse.in && mouse.onMap && !dragging && !placing && !gameOver){
    t = pick(mouse.x, mouse.y);
    act = hoverAction(t);
  }
  const h = act && HOVER[act[0]];
  cv.style.cursor = h ? h.cur : '';
  if(t && h && h.col !== null){
    hoverRing.visible = true;
    hoverRing.position.set(t.pos.x, t.obj.position.y + 0.1, t.pos.z);
    hoverRing.scale.setScalar((t.r + 0.35) * (1 + Math.sin(performance.now()/150)*0.06));
    hoverRing.material.color.setHex(h.col);
  } else hoverRing.visible = false;
  if(act && act[1]){
    tipEl.textContent = act[1]; tipEl.style.display = 'block';
    tipEl.style.left = (mouse.x + 18) + 'px'; tipEl.style.top = (mouse.y + 14) + 'px';
    tipEl.style.color = h.col ? '#' + h.col.toString(16).padStart(6,'0') : '#fff';
  } else tipEl.style.display = 'none';
}

// ---------------------------------------------------------------- Bauen
async function startPlace(type){
  if(!canPay(BUILD[type].cost)){ msg('Nicht genug Rohstoffe', '#e2574c'); return; }
  cancelPlace();
  placing = type;
  ghost = prop(await load(BUILD[type].m[1]), BUILD[type].size);
  ghost.traverse(m=>{ if(m.isMesh){ m.material = m.material.clone(); m.material.transparent = true; m.material.opacity = .55; m.castShadow = false; } });
  scene.add(ghost); updateGhost();
}
function cancelPlace(){ if(ghost) scene.remove(ghost); ghost = null; placing = null; }
function placeOk(p){
  const r = BUILD[placing].size*0.46;
  if(Math.abs(p.x) > MAP-r || Math.abs(p.z) > MAP-r) return false;
  let lo = 1e9, hi = -1e9;
  for(let a=0;a<12;a++) for(const k of [0.4, 0.95]){
    const x = p.x + Math.cos(a*0.5236)*r*k, z = p.z + Math.sin(a*0.5236)*r*k;
    if(!walkTerrain(x, z)) return false;
    const h = H(x, z); lo = Math.min(lo, h); hi = Math.max(hi, h);
  }
  if(hi - lo > 1.1) return false;
  return !ents.some(e=> e.alive && (e.kind !== 'unit' || e.team === 1) && d2(e.pos, p) < e.r + r + 0.6);
}
function updateGhost(){
  if(!ghost) return;
  const g = groundAt(mouse.x, mouse.y); if(!g) return;
  ghost.position.set(Math.round(g.x), 0, Math.round(g.z));
  ghost.position.y = footY(ghost.position.x, ghost.position.z, BUILD[placing].size*0.46);
  const ok = placeOk(ghost.position);
  ghost.traverse(m=>{ if(m.isMesh) m.material.color.setHex(ok ? 0xaaffaa : 0xff7777); });
}
async function tryPlace(){
  if(!ghost) return;
  const p = ghost.position.clone().setY(0), type = placing, cost = BUILD[type].cost;
  if(!placeOk(p)){ msg('Hier kann nicht gebaut werden – zu steil, Wasser oder belegt', '#e2574c'); return; }
  if(!canPay(cost)){ msg('Nicht genug Rohstoffe', '#e2574c'); cancelPlace(); return; }
  pay(cost);
  const builders = selected.filter(s=>s.type==='worker');
  cancelPlace();
  const b = await spawnBuilding(type, 0, p.x, p.z, false);
  b.rally = new THREE.Vector3(p.x + b.r + 2, 0, p.z - b.r - 2);
  for(const u of builders){ stop(u); u.state = 'build'; u.buildTarget = b; }
  uiDirty = true;
}

function produce(b, type){
  const d = UNIT[type];
  if(b.queue.length >= 5) return;
  if(!canPay(d.cost)){ msg('Nicht genug Rohstoffe', '#e2574c'); return; }
  pay(d.cost); b.queue.push(type); uiDirty = true;
}
function popInfo(team){
  let used = 0, cap = 0;
  for(const e of ents){
    if(!e.alive || e.team !== team) continue;
    if(e.kind === 'unit') used++;
    if(e.kind === 'building'){ if(e.done) cap += BUILD[e.type].pop || 0; used += e.queue.length ? 1 : 0; }
  }
  return {used, cap:Math.min(cap, 80)};
}

// ---------------------------------------------------------------- Kampf
const shots = [], pops = [];
function damage(t, dmg, from){
  if(!t.alive) return;
  const armor = t.kind === 'unit' ? (UNIT[t.type].armor || 0) : 0;
  const lost = Math.max(1, dmg - armor);
  t.hp -= lost;
  pops.push({x:t.pos.x + rnd(-.3,.3), z:t.pos.z, h:t.kind === 'unit' ? 2.4 : t.obj.userData.h + 0.8,
             v:Math.round(lost), t0:time, foe:t.team === 1});
  t.hitT = time;
  if(t.kind === 'unit' && from && from.alive){
    // Angegriffene wehren sich, wenn sie gerade nichts Wichtigeres tun
    if(t.state === 'idle' || (t.state === 'gather' && t.type !== 'worker'))
      { t.state = 'attack'; t.target = from; }
    if(t.team === 0 && t.type === 'worker' && t.state !== 'attack' && from.kind === 'unit' && UNIT[from.type].range < 2){
      // Arbeiter fliehen nicht, sie schlagen zurück
      t.prevState = t.state; t.prevNode = t.gatherNode; t.state = 'attack'; t.target = from;
    }
  }
  // Nachbarn eilen zu Hilfe
  if(from && from.alive && t.team !== -1){
    for(const a of ents)
      if(a.alive && a.kind === 'unit' && a.team === t.team && a.type !== 'worker' && a.state === 'idle' && d2(a.pos, t.pos) < 14)
        { a.state = 'attack'; a.target = from; }
  }
  if(t.hp <= 0) kill(t);
}
function kill(e){
  e.alive = false; e.ring.visible = false;
  selected = selected.filter(s=>s!==e); uiDirty = true;
  if(e.kind === 'unit'){
    play(e, 'Death_A', 0.1);
    e.deadT = time;
  } else if(e.kind === 'building'){
    e.deadT = time; e.sink = true;
    if(e.team === 0) msg(BUILD[e.type].name + ' zerstört!', '#e2574c');
  }
  checkEnd();
}
function fire(u, t){
  const d = UNIT[u.type];
  const from = u.pos.clone().setY(u.obj.position.y + 1.3), to = t.pos.clone().setY(t.obj.position.y + (t.kind === 'unit' ? 1 : 2));
  let m;
  if(d.shot === 'arrow'){
    m = new THREE.Group(); const a = arrowProto.clone(true); a.scale.setScalar(1.4); m.add(a);
    a.rotation.x = Math.PI/2;
  } else {
    m = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8),
      new THREE.MeshBasicMaterial({color: u.team ? 0x9dff5a : 0x7fd8ff}));
    m.add(new THREE.PointLight(u.team ? 0x9dff5a : 0x7fd8ff, 4, 6));
  }
  scene.add(m);
  const dist = from.distanceTo(to);
  // Höhenvorteil: wer von oben schießt, trifft härter
  const dmg = d.dmg * (u.obj.position.y > t.obj.position.y + 1.2 ? 1.3 : 1);
  shots.push({m, from, to, t:0, dur:dist/(d.shot==='arrow'?26:14), target:t, dmg, splash:d.splash, src:u, arc:d.shot==='arrow'?dist*0.12:0.4});
}
function towerFire(b, t){
  const s = BUILD[b.type].shoot;
  const from = b.pos.clone().setY(b.obj.position.y + b.obj.userData.h*0.8), to = t.pos.clone().setY(t.obj.position.y + 1);
  const m = new THREE.Group(); const a = arrowProto.clone(true); a.scale.setScalar(1.4); a.rotation.x = Math.PI/2; m.add(a);
  scene.add(m);
  shots.push({m, from, to, t:0, dur:from.distanceTo(to)/28, target:t, dmg:s.dmg, src:b, arc:1});
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s = shots[i]; s.t += dt/s.dur;
    if(s.target.alive) s.to.set(s.target.pos.x, s.target.obj.position.y + 1, s.target.pos.z);
    const k = Math.min(s.t, 1);
    const p = s.from.clone().lerp(s.to, k); p.y += Math.sin(k*Math.PI)*s.arc;
    const prev = s.m.position.clone();
    s.m.position.copy(p);
    if(k > 0.01) s.m.lookAt(p.clone().add(p.clone().sub(prev)));
    if(s.t >= 1){
      scene.remove(s.m); shots.splice(i,1);
      if(s.splash){
        for(const e of ents) if(e.alive && e.team !== s.src.team && e.team !== -1 && d2(e.pos, s.to) < s.splash + e.r)
          damage(e, e === s.target ? s.dmg : s.dmg*0.5, s.src);
      } else damage(s.target, s.dmg, s.src);
    }
  }
}
function nearestEnemy(u, radius){
  let best = null, bd = radius;
  for(const e of ents){
    if(!e.alive || e.team === u.team || e.team === -1) continue;
    const d = d2(u.pos, e.pos) - e.r - (e.kind === 'building' ? 4 : 0);   // Einheiten zuerst
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function dropSite(u){
  let best = null, bd = 1e9;
  for(const b of ents) if(b.alive && b.team === u.team && b.kind === 'building' && b.done && BUILD[b.type].drop){
    const d = d2(u.pos, b.pos); if(d < bd){ bd = d; best = b; }
  }
  return best;
}
function nearestNode(p, type, max=30){
  let best = null, bd = max;
  for(const e of ents) if(e.alive && e.kind === 'resource' && e.type === type && e.amount > 0){
    const d = d2(p, e.pos); if(d < bd){ bd = d; best = e; }
  }
  return best;
}

// ---------------------------------------------------------------- Einheiten-KI
function moveTo(u, target, stopDist, dt){
  let dx = target.x - u.pos.x, dz = target.z - u.pos.z, d = Math.hypot(dx, dz);
  if(d <= stopDist){ u.path = null; return true; }
  // Weg planen: direkt, wenn frei; sonst A* – neu, wenn das Ziel wandert
  u.pathT = (u.pathT || 0) - dt;
  const moved = !u.pathGoal || Math.hypot(u.pathGoal.x - target.x, u.pathGoal.z - target.z) > 1.5;
  if(moved) u.unreach = false;
  else if(u.unreach) return true;
  // Notbremse: kommt die Einheit nicht voran, erst A* erzwingen, dann aufgeben
  if(moved || u.bestD === undefined){ u.bestD = d; u.stuckT = 0; u.forced = false; }
  else if(d < u.bestD - 0.3){ u.bestD = d; u.stuckT = 0; }
  else if(!u.working && (u.stuckT += dt) > 1.5){
    if(!u.forced){ u.forced = true; u.stuckT = 0; u.path = findPath(u.pos.x, u.pos.z, target.x, target.z) || null; u.pathT = 3; }
    else { u.stuckT = 0; u.bestD = undefined; u.unreach = true; u.pathGoal = {x:target.x, z:target.z}; return true; }
  }
  if(moved || u.pathT <= 0){
    u.pathT = 0.5 + Math.random()*0.2;
    if(los(u.pos.x, u.pos.z, target.x, target.z, 0.6, stopDist + 1.2)) u.path = null;
    else if(moved || !u.path){
      u.path = findPath(u.pos.x, u.pos.z, target.x, target.z);
      if(u.path === null){ u.pathGoal = {x:target.x, z:target.z}; u.unreach = true; return true; }   // unerreichbar: stehen bleiben
    }
    u.pathGoal = {x:target.x, z:target.z};
  }
  let aim = target, lim = d - stopDist;
  if(u.path && u.path.length){
    while(u.path.length > 1 && Math.hypot(u.path[0].x - u.pos.x, u.path[0].z - u.pos.z) < 0.6) u.path.shift();
    const w = u.path[0];
    if(Math.hypot(w.x - u.pos.x, w.z - u.pos.z) < 0.6) u.path.shift();
    else { aim = w; lim = 1e9; }
  }
  dx = aim.x - u.pos.x; dz = aim.z - u.pos.z; d = Math.hypot(dx, dz) || 1;
  const sp = UNIT[u.type].speed * dt, k = Math.min(sp, lim) / d;
  u.pos.x += dx*k; u.pos.z += dz*k; u.moving = true;
  u.facing = Math.atan2(dx, dz);
  play(u, u.carry ? 'Walking_A' : 'Running_A', 0.2, u.carry ? 1.1 : 0.9);
  return false;
}
function slotCount(n){ return Math.max(4, Math.floor(2*Math.PI*(n.r + 0.55) / 1.0)); }
function slotPos(n, i){
  const a = i / slotCount(n) * Math.PI*2 + n.id;          // je Rohstoff etwas gedreht
  return {x:n.pos.x + Math.cos(a)*(n.r + 0.55), z:n.pos.z + Math.sin(a)*(n.r + 0.55)};
}
function slotTaken(n, i, me){
  const p = slotPos(n, i);
  if(!walkTerrain(p.x, p.z)) return true;
  return ents.some(o=> o !== me && o.alive && o.kind === 'unit' && o.state === 'gather'
    && o.slotNode === n && o.slot === i);
}
function freeSlot(n, u){
  let best = -1, bd = 1e9;
  for(let i=0;i<slotCount(n);i++){
    if(slotTaken(n, i, u)) continue;
    const d = d2(u.pos, slotPos(n, i)); if(d < bd){ bd = d; best = i; }
  }
  return best;
}
function nearestFreeNode(u, not){
  let best = null, bd = 25;
  for(const e of ents) if(e !== not && e.alive && e.kind === 'resource' && e.type === not.type && e.amount > 0){
    const d = d2(u.pos, e.pos); if(d < bd && freeSlot(e, u) >= 0){ bd = d; best = e; }
  }
  return best;
}
function face(u, p){ u.facing = Math.atan2(p.x - u.pos.x, p.z - u.pos.z); }

function updateUnit(u, dt){
  const d = UNIT[u.type];
  u.cd -= dt;
  const busy = u.anim && ONCE.test(u.anim) && u.actions[u.anim]?.isRunning();
  u.working = false; u.moving = false;
  u.prevX = u.pos.x; u.prevZ = u.pos.z;

  // Automatisch angreifen, was in der Nähe ist
  if(u.state === 'idle' || u.state === 'amove'){
    const aggro = u.type === 'worker' ? 0 : Math.max(9, d.range + 2);
    const t = aggro ? nearestEnemy(u, aggro) : null;
    if(t){ u.target = t; u.state = u.state === 'amove' ? 'amove-attack' : 'attack'; }
  }

  switch(u.state){
    case 'idle': if(!busy) play(u, 'Idle_A', 0.3); break;
    case 'move':
      if(moveTo(u, u.goal, 0.2, dt)){ u.state = 'idle'; u.goal = null; }
      break;
    case 'amove':
      if(moveTo(u, u.amove, 0.3, dt)){ u.state = 'idle'; u.amove = null; }
      break;
    case 'attack': case 'amove-attack': {
      const t = u.target;
      if(!t || !t.alive){
        u.target = null;
        if(u.state === 'amove-attack') u.state = 'amove';
        else if(u.prevState === 'gather' && u.prevNode?.alive){ u.state = 'gather'; u.gatherNode = u.prevNode; u.prevState = null; }
        else u.state = 'idle';
        break;
      }
      const reach = d.range + t.r;
      if(d2(u.pos, t.pos) > reach){ if(!busy) moveTo(u, t.pos, reach - 0.1, dt); }
      else {
        face(u, t.pos);
        if(u.cd <= 0){
          u.cd = d.cd;
          play(u, d.atk || 'Melee_1H_Attack_Chop', 0.1, 1.2);
          if(d.shot) setTimeout(()=>{ if(u.alive && t.alive) fire(u, t); }, 280);
          else setTimeout(()=>{ if(u.alive && t.alive && d2(u.pos,t.pos) <= reach + 0.6) damage(t, d.dmg, u); }, 300);
        } else if(!busy) play(u, 'Idle_A', 0.3);
      }
      break;
    }
    case 'gather': {
      let n = u.gatherNode;
      if(u.carry >= 10){ u.state = 'return'; break; }
      if(!n || !n.alive || n.amount <= 0){
        n = u.gatherNode = nearestNode(u.pos, u.carryKind === 'gold' ? 'gold' : (n ? n.type : 'tree'));
        if(!n){ u.state = u.carry ? 'return' : 'idle'; break; }
      }
      // Jeder Arbeiter bekommt einen eigenen Arbeitsplatz rund um den Rohstoff
      if(u.slotNode !== n || slotTaken(n, u.slot, u)){
        const alt = freeSlot(n, u);
        if(alt < 0){
          const other = nearestFreeNode(u, n);
          if(other){ n = u.gatherNode = other; }
        }
        u.slotNode = n; u.slot = Math.max(0, freeSlot(n, u)); u.atSlot = false;
      }
      const sp = slotPos(n, u.slot);
      // Wer angekommen ist, bleibt, auch wenn ihn jemand ein Stück wegschubst
      if(u.atSlot && d2(u.pos, sp) < 0.7 || moveTo(u, sp, 0.3, dt)) u.atSlot = true;
      else { u.atSlot = false; u.gt = 0; }
      if(u.atSlot){
        u.working = true;
        face(u, n.pos);
        const kind = RES[n.type].kind;
        if(u.carryKind !== kind){ u.carry = 0; u.carryKind = kind; }
        play(u, kind === 'wood' ? 'Chopping' : 'Pickaxing', 0.25);
        u.gt = (u.gt || 0) + dt;
        if(u.gt >= 0.9){
          u.gt = 0; u.carry++; n.amount--;
          if(n.amount <= 0) depleteNode(n);
        }
      }
      break;
    }
    case 'return': {
      u.atSlot = false;
      const b = (u.dropAt && u.dropAt.alive) ? u.dropAt : dropSite(u);
      if(!b){ u.state = 'idle'; break; }
      if(moveTo(u, b.pos, b.r + 0.7, dt) && d2(u.pos, b.pos) < b.r + 2.5){
        if(u.team === 0){
          res[u.carryKind] += u.carry; uiDirty = true;
          pops.push({x:b.pos.x + rnd(-1,1), z:b.pos.z, h:b.obj.userData.h + 0.6, v:u.carry, t0:time, icon:u.carryKind});
        }
        u.carry = 0; u.dropAt = null;
        u.state = 'gather';
      }
      break;
    }
    case 'build': {
      const b = u.buildTarget;
      if(!b || !b.alive || b.done){ u.state = 'idle';
        // danach gleich weiter sammeln, wenn ein Rohstoff in der Nähe ist
        const n = nearestNode(u.pos, 'tree', 14) || nearestNode(u.pos, 'gold', 14);
        if(n){ u.state = 'gather'; u.gatherNode = n; }
        break; }
      if(d2(u.pos, b.pos) > b.r + 0.9){ moveTo(u, b.pos, b.r + 0.7, dt); }
      else {
        u.working = true;
        face(u, b.pos); play(u, 'Hammering', 0.25);
        const bd = BUILD[b.type];
        const step = dt / bd.time;
        b.progress = Math.min(1, b.progress + step);
        b.hp = Math.min(b.maxHp, b.hp + bd.hp*step);
        b.obj.children[0].scale.y = b.fullY * (0.05 + 0.95*b.progress);
        if(b.progress >= 1){ b.done = true; msg(bd.name + ' fertig'); uiDirty = true; }
      }
      break;
    }
  }
  u.obj.position.copy(u.pos);
  u.obj.position.y = H(u.pos.x, u.pos.z);
  // weich drehen
  const cur = u.obj.rotation.y, diff = Math.atan2(Math.sin(u.facing-cur), Math.cos(u.facing-cur));
  u.obj.rotation.y = cur + diff*Math.min(1, dt*12);
  u.mixer.update(dt);
}

async function depleteNode(n){
  n.alive = false;
  selected = selected.filter(s=>s!==n);
  scene.remove(n.obj);
  if(n.type === 'tree'){
    const g = prop(await load(RES.tree.cut[n.v]), RES.tree.size);
    g.position.copy(n.pos); g.rotation.y = n.obj.rotation.y; scene.add(g);
  }
}

// Kollision: Einheiten stoßen sich voneinander und von festen Objekten ab
function separate(){
  const us = ents.filter(e=>e.alive && e.kind === 'unit');
  for(let i=0;i<us.length;i++){
    const a = us[i];
    for(let j=i+1;j<us.length;j++){
      const b = us[j], dx = b.pos.x-a.pos.x, dz = b.pos.z-a.pos.z, d = Math.hypot(dx,dz), m = a.r+b.r;
      if(d < m && d > 1e-4){
        // Arbeitende stehen fest, Laufende weichen aus – sonst schubsen sie sich im Kreis
        if(a.working && b.working) continue;
        const wa = a.working ? 0 : b.working ? 1 : 0.5, wb = 1 - wa;
        const k = (m-d)/d;
        a.pos.x -= dx*k*wa; a.pos.z -= dz*k*wa; b.pos.x += dx*k*wb; b.pos.z += dz*k*wb;
      } else if(d <= 1e-4){ a.pos.x += 0.05; }
    }
    for(const s of ents){
      if(!s.alive || s.kind === 'unit') continue;
      const dx = a.pos.x-s.pos.x, dz = a.pos.z-s.pos.z, d = Math.hypot(dx,dz), m = s.r + a.r;
      if(d < m){
        // radial herausschieben, mit etwas Seitwärtsdrall, damit niemand frontal hängen bleibt
        const nx = dx/(d||1), nz = dz/(d||1);
        const side = a.moving ? 0.03 : 0;     // Drall nur beim Laufen, sonst kreisen Stehende
        a.pos.x = s.pos.x + nx*m - nz*side; a.pos.z = s.pos.z + nz*m + nx*side;
      }
    }
    a.pos.x = THREE.MathUtils.clamp(a.pos.x, -MAP+0.5, MAP-0.5);
    a.pos.z = THREE.MathUtils.clamp(a.pos.z, -MAP+0.5, MAP-0.5);
    if(!walkTerrain(a.pos.x, a.pos.z) && a.prevX !== undefined && walkTerrain(a.prevX, a.prevZ)){
      // an der Kante entlanggleiten statt stehenzubleiben
      if(walkTerrain(a.pos.x, a.prevZ)) a.pos.z = a.prevZ;
      else if(walkTerrain(a.prevX, a.pos.z)) a.pos.x = a.prevX;
      else { a.pos.x = a.prevX; a.pos.z = a.prevZ; }
    }
  }
}

// ---------------------------------------------------------------- Gebäude
function updateBuilding(b, dt){
  if(!b.done) return;
  const d = BUILD[b.type];
  if(b.queue.length){
    const type = b.queue[0], ud = UNIT[type];
    const pop = popInfo(b.team);
    if(b.team === 1 || pop.used - 1 < pop.cap){
      b.qt += dt;
      if(b.qt >= (ud.time || 16)){
        b.qt = 0; b.queue.shift(); uiDirty = true;
        const a = Math.atan2(-b.pos.z, -b.pos.x);
        const o = freeNear(b.pos.x + Math.cos(a)*(b.r+1.2), b.pos.z + Math.sin(a)*(b.r+1.2));
        const out = new THREE.Vector3(o.x, 0, o.z);
        spawnUnit(type, b.team, out.x, out.z).then(u=>{
          if(b.team === 1){ u.state = 'amove'; u.amove = foe.gather.clone().add(new THREE.Vector3(rnd(-4,4),0,rnd(-4,4))); return; }
          const rp = b.rally;
          if(type === 'worker' && rp){
            const n = ents.find(r=> r.alive && r.kind==='resource' && d2(r.pos, rp) < r.r + 1.5);
            if(n){ u.state = 'gather'; u.gatherNode = n; return; }
          }
          if(rp){ u.state = 'move'; u.goal = rp.clone().add(new THREE.Vector3(rnd(-1.5,1.5),0,rnd(-1.5,1.5))); }
        });
      }
    }
  }
  if(d.shoot){
    b.cd -= dt;
    if(b.cd <= 0){
      let best = null, bd = d.shoot.range;
      for(const e of ents) if(e.alive && e.kind === 'unit' && e.team !== b.team){
        const dd = d2(e.pos, b.pos); if(dd < bd){ bd = dd; best = e; } }
      if(best){ towerFire(b, best); b.cd = d.shoot.cd; }
    }
  }
}

// ---------------------------------------------------------------- Gegner-KI
const foe = {gather:new THREE.Vector3(FOE.x-26, 0, FOE.z+28), next:150, wave:0};
function updateFoe(dt){
  foe.next -= dt;
  const el = document.getElementById('wave');
  el.textContent = foe.next > 0 ? `Nächster Angriff in ${Math.ceil(foe.next)} s` : 'Angriff!';
  // Kasernen produzieren ständig nach
  const n = ents.filter(e=>e.alive && e.team===1 && e.kind==='unit').length;
  const cap = 10 + foe.wave*3;
  for(const [b, types] of [[foe.barracks, ['s_minion','s_warrior','s_minion']], [foe.barracks2, ['s_rogue','s_mage','s_rogue']]]){
    if(b && b.alive && !b.queue.length && n < cap)
      b.queue.push(types[Math.floor(Math.random()*types.length)]);
  }
  if(foe.next <= 0){
    foe.wave++;
    foe.next = Math.max(55, 110 - foe.wave*8);
    // Alle wartenden Skelette ausser ein paar Wachen losschicken
    const army = ents.filter(e=>e.alive && e.team===1 && e.kind==='unit' && (e.state==='idle' || e.state==='amove'));
    const guards = 3, goal = HOME.clone();
    army.slice(guards).forEach((u,i)=>{ u.state = 'amove'; u.amove = formation(goal, army.length, i); });
    if(army.length > guards) msg(`Welle ${foe.wave}: ${army.length-guards} Skelette greifen an!`, '#e2574c');
  }
}

function checkEnd(){
  if(gameOver) return;
  const mine = ents.some(e=>e.alive && e.team===0 && e.type==='towncenter');
  const theirs = ents.some(e=>e.alive && e.team===1 && (e.type==='towncenter' || e.type==='barracks' || e.type==='archery'));
  if(!mine || !theirs){
    gameOver = true;
    document.getElementById('endT').textContent = mine ? 'SIEG!' : 'NIEDERLAGE';
    document.getElementById('endP').textContent = mine
      ? `Die Skelettfestung ist gefallen – nach ${Math.floor(time/60)} min ${Math.floor(time%60)} s.`
      : 'Deine Burg wurde zerstört.';
    setTimeout(()=> document.getElementById('end').style.display = 'flex', 1500);
  }
}

// ---------------------------------------------------------------- UI
let uiDirty = true;
const infoEl = document.getElementById('info'), cmdEl = document.getElementById('cmds');
function button(label, sub, key, fn, enabled=true){
  const b = document.createElement('button');
  b.innerHTML = `${key ? `<kbd>${key}</kbd>` : ''}${label}${sub ? `<small>${sub}</small>` : ''}`;
  b.dataset.key = key || ''; b.disabled = !enabled;
  b.onclick = fn; cmdEl.appendChild(b);
}
function renderUI(){
  const pop = popInfo(0);
  document.getElementById('rWood').textContent = Math.floor(res.wood);
  document.getElementById('rGold').textContent = Math.floor(res.gold);
  document.getElementById('rPop').textContent = `${pop.used}/${pop.cap}`;
  if(!uiDirty && !(selected[0]?.queue?.length)) return;
  const q = selected[0];
  if(q && q.kind === 'building' && q.queue.length && !uiDirty){
    const bar = infoEl.querySelector('.bar i');
    if(bar){ bar.style.width = (100*q.qt/UNIT[q.queue[0]].time)+'%'; return; }
  }
  uiDirty = false;
  infoEl.innerHTML = ''; cmdEl.innerHTML = '';
  if(!selected.length){
    infoEl.innerHTML = `<h3>Burgenkrieg</h3><div class="sub">Sammle Holz und Gold, baue eine Armee und zerstöre die Skelettfestung im Nordosten (Burg und beide Kasernen).</div>`;
    return;
  }
  if(selected.length > 1){
    const c = {};
    for(const s of selected) c[UNIT[s.type].name] = (c[UNIT[s.type].name]||0)+1;
    infoEl.innerHTML = `<h3>${selected.length} Einheiten</h3><div class="icons">${Object.entries(c).map(([k,v])=>`<span>${v}× ${k}</span>`).join('')}</div>`;
  } else if(q.kind === 'unit'){
    const d = UNIT[q.type];
    infoEl.innerHTML = `<h3>${d.name}</h3><div class="sub">❤ ${Math.ceil(q.hp)}/${q.maxHp} · ⚔ ${d.dmg} · Reichweite ${d.range}${q.carry ? ` · trägt ${q.carry} ${icoHtml(q.carryKind)}` : ''}</div>`;
  } else if(q.kind === 'building'){
    const d = BUILD[q.type];
    infoEl.innerHTML = `<h3>${d.name}${q.team===1?' (Feind)':''}</h3><div class="sub">❤ ${Math.ceil(q.hp)}/${q.maxHp}${!q.done ? ` · im Bau ${Math.floor(q.progress*100)} %` : ''}${d.pop ? ` · +${d.pop} Bevölkerung` : ''}${d.drop ? ' · Rohstofflager' : ''}</div>`;
    if(q.queue.length){
      infoEl.innerHTML += `<div id="queue"><div class="bar"><i style="width:${100*q.qt/UNIT[q.queue[0]].time}%"></i></div>${q.queue.map(t=>`<span>${UNIT[t].name}</span>`).join('')}</div>`;
    }
  } else {
    infoEl.innerHTML = `<h3>${q.type === 'tree' ? 'Wald' : 'Goldader'}</h3><div class="sub">Noch ${q.amount} ${icoHtml(q.type==='tree'?'wood':'gold')}</div>`;
  }
  // Befehle
  if(selected.some(s=>s.type==='worker' && s.team===0)){
    for(const t of BUILD_MENU){ const d = BUILD[t];
      button(d.name, costTxt(d.cost), d.key, ()=>startPlace(t), canPay(d.cost)); }
  }
  if(selected.length === 1 && q.kind === 'building' && q.team === 0 && q.done){
    const keys = ['Q','W','E'];
    (BUILD[q.type].make || []).forEach((t,i)=>{ const d = UNIT[t];
      button(d.name, costTxt(d.cost), keys[i], ()=>produce(q, t), canPay(d.cost) && q.queue.length < 5); });
  }
  if(selected.some(s=>s.kind==='unit' && s.team===0)){
    button('Angriffs­marsch', 'dann Ziel klicken', 'A', ()=>{ aMode = true; cv.style.cursor = 'crosshair'; });
    button('Stopp', '', 'S', ()=>{ for(const u of selected) if(u.kind==='unit') stop(u); });
  }
}
setInterval(()=>{ if(selected.length === 1) uiDirty = true; }, 500);

// Lebensbalken + Minikarte
function drawOverlay(){
  const k = devicePixelRatio;
  octx.setTransform(k,0,0,k,0,0);
  octx.clearRect(0,0,innerWidth,innerHeight);
  for(const e of ents){
    if(!e.alive || e.kind === 'resource') continue;
    // jeder, der verletzt ist, zeigt seinen Balken – Freund wie Feind
    const show = e.ring.visible || e.hp < e.maxHp;
    if(!show) continue;
    const h = e.kind === 'unit' ? 2.3 : e.obj.userData.h + 0.5;
    const s = screenOf(e.pos, h); if(!s.ok) continue;
    const w = e.kind === 'unit' ? 30 : 60, f = Math.max(0, e.hp/e.maxHp);
    octx.fillStyle = '#000a'; octx.fillRect(s.x-w/2-1, s.y-1, w+2, 6);
    octx.fillStyle = e.team === 1 ? '#e2574c' : f > .5 ? '#7fd36b' : f > .25 ? '#e8c14a' : '#e2574c';
    octx.fillRect(s.x-w/2, s.y, w*f, 4);
  }
  // Schadenszahlen steigen auf und verblassen
  octx.font = 'bold 13px Trebuchet MS, sans-serif'; octx.textAlign = 'center';
  for(let i=pops.length-1;i>=0;i--){
    const p = pops[i], a = time - p.t0;
    if(p.icon){
      // Abgeliefertes: Icon + Menge steigen über dem Lager auf
      if(a > 1.8){ pops.splice(i,1); continue; }
      const s = screenOf(p, p.h + a*1.6); if(!s.ok) continue;
      octx.globalAlpha = Math.min(1, (1.8 - a)/0.8);
      octx.font = 'bold 15px Trebuchet MS, sans-serif'; octx.textAlign = 'left';
      const txt = '+' + p.v, w = octx.measureText(txt).width + 22;
      octx.drawImage(ICON_IMG[p.icon], s.x - w/2, s.y - 14, 19, 19);
      octx.fillStyle = '#000'; octx.fillText(txt, s.x - w/2 + 23, s.y + 1);
      octx.fillStyle = p.icon === 'gold' ? '#ffd84a' : '#f0d2a0'; octx.fillText(txt, s.x - w/2 + 22, s.y);
      octx.font = 'bold 13px Trebuchet MS, sans-serif'; octx.textAlign = 'center';
      continue;
    }
    if(a > 1.2){ pops.splice(i,1); continue; }
    const s = screenOf(p, p.h + a*1.2); if(!s.ok) continue;
    octx.globalAlpha = 1 - a/1.2;
    octx.fillStyle = '#000'; octx.fillText('-'+p.v, s.x+1, s.y+1);
    octx.fillStyle = p.foe ? '#ffd24a' : '#ff6a5a'; octx.fillText('-'+p.v, s.x, s.y);
  }
  octx.globalAlpha = 1;
}
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const miniBg = document.createElement('canvas'); miniBg.width = miniBg.height = GN;
{
  const g = miniBg.getContext('2d'), img = g.createImageData(GN, GN);
  for(let j=0;j<GN;j++) for(let i=0;i<GN;i++){
    const x = i - MAP + 0.5, z = j - MAP + 0.5, h = H(x, z), k = (j*GN+i)*4;
    let c = h < WATER ? [63,134,184] : !terrainOK[j*GN+i] ? [120,112,100]
      : [70 + h*14, 105 + h*14, 45 + h*8];
    img.data.set([...c.map(v=>Math.max(0, Math.min(255, v))), 255], k);
  }
  g.putImageData(img, 0, 0);
}
function drawMini(){
  const S = mini.width, k = S/(MAP*2), P = p => [(p.x+MAP)*k, (p.z+MAP)*k];
  mctx.drawImage(miniBg, 0, 0, S, S);
  for(const e of ents){
    if(!e.alive) continue;
    const [x,y] = P(e.pos);
    mctx.fillStyle = e.kind === 'resource' ? (e.type === 'tree' ? '#1f3d17' : '#e8c14a')
      : e.team === 0 ? '#5aa9ff' : '#ff4a3a';
    const s = e.kind === 'unit' ? 3 : Math.max(4, e.r*k*1.6);
    mctx.fillRect(x-s/2, y-s/2, s, s);
  }
  // Sichtbereich
  const c = [[0,0],[innerWidth,0],[innerWidth,innerHeight-150],[0,innerHeight-150]].map(([x,y])=>groundAt(x,y));
  if(c.every(Boolean)){
    mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5; mctx.beginPath();
    c.forEach((p,i)=>{ const [x,y] = P(p); i ? mctx.lineTo(x,y) : mctx.moveTo(x,y); });
    mctx.closePath(); mctx.stroke();
  }
}
function miniJump(e){
  const r = mini.getBoundingClientRect();
  camTarget.x = ((e.clientX-r.left)/r.width)*MAP*2 - MAP;
  camTarget.z = ((e.clientY-r.top)/r.height)*MAP*2 - MAP - zoom*0.1;
}
mini.addEventListener('mousedown', e=>{
  if(e.button === 2 && selected.length){
    const r = mini.getBoundingClientRect();
    order(null, new THREE.Vector3(((e.clientX-r.left)/r.width)*MAP*2-MAP, 0, ((e.clientY-r.top)/r.height)*MAP*2-MAP));
  } else { miniJump(e); mini.onmousemove = ev=> ev.buttons & 1 && miniJump(ev); }
});
mini.addEventListener('contextmenu', e=>e.preventDefault());

// ---------------------------------------------------------------- Loop
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateCamera(dt);
  updateGhost();
  updateHover();
  step(dt);
  renderer.render(scene, camera);
  drawOverlay();
  drawMini();
  renderUI();
}
function step(dt){
  if(!gameOver) time += dt;
  if(!gameOver){
    for(const e of ents){
      if(!e.alive) continue;
      if(e.kind === 'unit') updateUnit(e, dt);
      else if(e.kind === 'building') updateBuilding(e, dt);
    }
    separate();
    updateShots(dt);
    updateFoe(dt);
  }
  // Tote ausblenden und aufräumen
  for(let i=ents.length-1;i>=0;i--){
    const e = ents[i];
    if(e.alive || e.deadT === undefined){ if(!e.alive && e.kind === 'resource') ents.splice(i,1); continue; }
    const t = time - e.deadT;
    if(e.kind === 'unit'){ e.mixer.update(dt); e.obj.position.y = H(e.pos.x, e.pos.z) - Math.max(0, t-2.5)*0.8; }
    else e.obj.position.y = e.y0 - t*1.2;
    if(e.kind === 'building' && !e.gridFreed){ e.gridFreed = true; gridDirty = true; }
    if(t > 5 || (gameOver && t > 1.5 && e.kind === 'building' && e.obj.position.y < e.y0 - e.obj.userData.h)){ scene.remove(e.obj); ents.splice(i,1); }
  }
  for(let i=flags.length-1;i>=0;i--){
    const f = flags[i]; f.t += dt; f.m.scale.setScalar(0.4 + f.t*1.4); f.m.material.opacity = 1 - f.t/0.6;
    if(f.t > 0.6){ scene.remove(f.m); flags.splice(i,1); }
  }
}

resize();
buildWorld().then(()=>{
  document.getElementById('load').style.display = 'none';
  msg('Wähle deine Arbeiter aus und schicke sie per Rechtsklick zu Wald oder Gold.');
  loop();
}).catch(err=>{
  console.error(err);
  document.getElementById('ltext').textContent = 'Fehler beim Laden: ' + err.message;
});
window.__battle = {setZoom:z=>zoom=z, H, findPath, step, select, order, attackMove, produce, startPlace, tryPlace, ents, res, get selected(){ return selected; }, foe, camTarget};
