<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonnensystem</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #dde; }
  canvas { display: block; }
  #ui { position: fixed; left: 12px; top: 12px; background: rgba(10,12,20,.75); border: 1px solid #334; border-radius: 10px; padding: 10px 12px; font-size: 13px; max-width: calc(100vw - 48px); backdrop-filter: blur(6px); }
  #ui h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  #date { font-variant-numeric: tabular-nums; font-size: 14px; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; align-items: center; }
  button { background: #1c2236; color: #dde; border: 1px solid #3a4466; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  button.on { background: #3b5bd6; border-color: #6d8bff; color: #fff; }
  input[type=range] { width: 160px; }
  #info { position: fixed; right: 12px; bottom: 12px; background: rgba(10,12,20,.75); border: 1px solid #334; border-radius: 10px; padding: 8px 12px; font-size: 12px; max-width: 260px; display: none; }
  #credit { position: fixed; left: 12px; bottom: 8px; font-size: 10px; color: #778; }
  #credit a { color: #99a; }
  .label { position: fixed; left: 0; top: 0; font-size: 12px; color: #cfd6ff; pointer-events: auto; cursor: pointer; white-space: nowrap; text-shadow: 0 0 4px #000; user-select: none; }
  .label.comet { font-size: 10px; color: #9fc3e8; pointer-events: none; }
  .label.moon { font-size: 10px; color: #a8aec8; pointer-events: none; }
  .label.moon::before { width: 4px; height: 4px; transform: translate(-2px, 0); }
  .label.big::before { visibility: hidden; }
  .label::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; border: 1px solid currentColor; margin-right: 4px; vertical-align: 0; transform: translate(-3px, 0); }
</style>
<script defer src="/analytics.js"></script>
</head>
<body>
<div id="ui">
  <h1>☀️ Sonnensystem</h1>
  <div id="date"></div>
  <div class="row" id="speeds"></div>
  <div class="row"><button id="now">Jetzt</button><button id="labels" class="on">Namen</button><button id="orbits" class="on">Bahnen</button></div>
  <div class="row">Maßstab:
    <button id="real">Echt</button><button id="nice" class="on">Anschaulich</button></div>
  <div class="row"><input type="range" id="mix" min="0" max="1" step="0.001" value="1"></div>
  <div class="row" id="focus"></div>
</div>
<div id="info"></div>
<div id="credit">Texturen: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0), Monde: <a href="https://stevealbers.net/albers/sos/sos.html" target="_blank" rel="noopener">Steve Albers</a>/NASA, Kallisto: Björn Jónsson</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const AU_KM = 149597870.7;
const D2R = Math.PI / 180;

// JPL Keplerelemente (Standish, gültig 1800–2050): a, e, I, L, ϖ, Ω und Raten pro Jahrhundert
const PLANETS = [
  { name: 'Merkur', tilt: 0.03, tex: 'mercury',  r: 2440,  color: 0x9a9690, el: [0.38709927,0.20563593,7.00497902,252.25032350,77.45779628,48.33076593], rate: [0.00000037,0.00001906,-0.00594749,149472.67411175,0.16047689,-0.12534081] },
  { name: 'Venus', tilt: 177.4, tex: 'venus',   r: 6052,  color: 0xe8cf98, el: [0.72333566,0.00677672,3.39467605,181.97909950,131.60246718,76.67984255], rate: [0.00000390,-0.00004107,-0.00078890,58517.81538729,0.00268329,-0.27769418] },
  { name: 'Erde', tilt: 23.44, tex: 'earth',    r: 6371,  color: 0x3d7be0, el: [1.00000261,0.01671123,-0.00001531,100.46457166,102.93768193,0], rate: [0.00000562,-0.00004392,-0.01294668,35999.37244981,0.32327364,0] },
  { name: 'Mars', tilt: 25.19, tex: 'mars',    r: 3390,  color: 0xc4532c, el: [1.52371034,0.09339410,1.84969142,-4.55343205,-23.94362959,49.55953891], rate: [0.00001847,0.00007882,-0.00813131,19140.30268499,0.44441088,-0.29257343] },
  { name: 'Jupiter', tilt: 3.13, tex: 'jupiter', r: 69911, color: 0xd2b48c, el: [5.20288700,0.04838624,1.30439695,34.39644051,14.72847983,100.47390909], rate: [-0.00011607,-0.00013253,-0.00183714,3034.74612775,0.21252668,0.20469106] },
  { name: 'Saturn', tilt: 26.73, tex: 'saturn',  r: 58232, color: 0xe3cf9a, el: [9.53667594,0.05386179,2.48599187,49.95424423,92.59887831,113.66242448], rate: [-0.00125060,-0.00050991,0.00193609,1222.49362201,-0.41897216,-0.28867794], ring: true },
  { name: 'Uranus', tilt: 97.77, tex: 'uranus',  r: 25362, color: 0x9fdde6, el: [19.18916464,0.04725744,0.77263783,313.23810451,170.95427630,74.01692503], rate: [-0.00196176,-0.00004397,-0.00242939,428.48202785,0.40805281,0.04240589] },
  { name: 'Neptun', tilt: 28.32, tex: 'neptune',  r: 24622, color: 0x4566e0, el: [30.06992276,0.00859048,1.77004347,-55.12002969,44.96476227,131.78422574], rate: [0.00026291,0.00005105,0.00035372,218.45945325,-0.32241464,-0.01262724] },
];
const SUN_R = 696000;

function kepler(M, e) {
  // bei fast parabolischen Kometenbahnen mit π starten und länger iterieren
  M = Math.atan2(Math.sin(M), Math.cos(M));
  let E = e < 0.8 ? M + e * Math.sin(M) : (M < 0 ? -Math.PI : Math.PI);
  for (let i = 0; i < 40; i++) { const d = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E)); E -= d; if (Math.abs(d) < 1e-12) break; }
  return E;
}
function elementsAt(p, T) {
  const v = p.el.map((x, i) => x + p.rate[i] * T);
  return { a: v[0], e: v[1], I: v[2] * D2R, L: v[3] * D2R, w: v[4] * D2R, O: v[5] * D2R };
}
// heliozentrisch-ekliptikal in AE; Szene: x=x, y=z(ekl. Norden), z=-y
function posFromE(k, E, out) {
  const xp = k.a * (Math.cos(E) - k.e), yp = k.a * Math.sqrt(1 - k.e * k.e) * Math.sin(E);
  const om = k.w - k.O, cO = Math.cos(k.O), sO = Math.sin(k.O), cw = Math.cos(om), sw = Math.sin(om), cI = Math.cos(k.I), sI = Math.sin(k.I);
  const x = (cw * cO - sw * sO * cI) * xp + (-sw * cO - cw * sO * cI) * yp;
  const y = (cw * sO + sw * cO * cI) * xp + (-sw * sO + cw * cO * cI) * yp;
  const z = (sw * sI) * xp + (cw * sI) * yp;
  return out.set(x, z, -y);
}
function planetPos(p, jd, out) {
  const k = elementsAt(p, (jd - 2451545) / 36525);
  let M = (k.L - k.w) % (2 * Math.PI);
  return posFromE(k, kepler(M, k.e), out);
}

// Maßstab: mix=0 echt, mix=1 anschaulich (logarithmisch interpoliert)
let mix = 1, mixTarget = 1;
const lerpLog = (a, b, t) => Math.exp(Math.log(a) + (Math.log(b) - Math.log(a)) * t);
const distMap = r => r < 1e-9 ? 0 : lerpLog(r, 4 * Math.sqrt(r), mix);
const radiusMap = km => lerpLog(km / AU_KM, 0.045 * Math.sqrt(km / 1000), mix);
const sunRadius = () => lerpLog(SUN_R / AU_KM, 0.5, mix);
const mapPos = (v, out) => { const r = v.length(); return out.copy(v).multiplyScalar(r ? distMap(r) / r : 0); };

// Szene
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1e-8, 1e5);
camera.position.set(0, 18, 28);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1e-6;
controls.maxDistance = 2000;

scene.add(new THREE.AmbientLight(0xffffff, 0.12));
scene.add(new THREE.PointLight(0xffffff, 3, 0, 0));

// Himmel: Sterne + Milchstraße an ihrer echten Lage (galaktischer Pol/Zentrum in ekliptikalen Koordinaten)
const eclDir = (lonDeg, latDeg) => { const l = lonDeg * D2R, b = latDeg * D2R; return new THREE.Vector3(Math.cos(b) * Math.cos(l), Math.sin(b), -Math.cos(b) * Math.sin(l)); };
const GAL_POLE = eclDir(180.02, 29.81), GAL_CENTER = eclDir(266.84, -5.54);
const sky = new THREE.Group(); scene.add(sky);
{
  const n = 9000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), v = new THREE.Vector3();
  const gx = GAL_CENTER, gz = new THREE.Vector3().crossVectors(gx, GAL_POLE).normalize();
  for (let i = 0; i < n; i++) {
    if (i < 3500) {
      // Häufung in der galaktischen Ebene, zum Zentrum hin dichter
      const l = (Math.random() - 0.5) * 2 * Math.PI * (Math.random() < 0.5 ? 1 : 0.4);
      const b = (Math.random() + Math.random() + Math.random() - 1.5) * 0.12;
      v.copy(gx).multiplyScalar(Math.cos(b) * Math.cos(l)).addScaledVector(gz, Math.cos(b) * Math.sin(l)).addScaledVector(GAL_POLE, Math.sin(b));
    } else v.randomDirection();
    v.multiplyScalar(3000); pos.set([v.x, v.y, v.z], i * 3);
    const br = (i < 3500 ? 0.25 : 0.4) + Math.random() * 0.6, t = Math.random();
    col.set([br * (t < .2 ? 1 : .85), br * .9, br * (t > .8 ? 1 : .85)], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  sky.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 1.4, sizeAttenuation: false, vertexColors: true, depthWrite: false })));
  const mw = new THREE.Mesh(new THREE.SphereGeometry(3500, 64, 32), new THREE.ShaderMaterial({
    uniforms: { pole: { value: GAL_POLE }, center: { value: GAL_CENTER } },
    side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec3 vD;
      #include <common>
      #include <logdepthbuf_pars_vertex>
      void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `uniform vec3 pole, center; varying vec3 vD;
      #include <logdepthbuf_pars_fragment>
      float h(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
      float n(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
      float fbm(vec3 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * n(p); p *= 2.03; a *= 0.5; } return v; }
      void main() {
        #include <logdepthbuf_fragment>
        vec3 d = normalize(vD);
        float b = asin(clamp(dot(d, pole), -1.0, 1.0));
        float toC = dot(d, center) * 0.5 + 0.5;
        float width = 0.10 + 0.08 * toC;
        float band = exp(-pow(b / width, 2.0));
        float cloud = fbm(d * 7.0) * 0.7 + fbm(d * 23.0) * 0.3;
        float dust = 1.0 - 0.75 * exp(-pow((b + 0.01) / 0.025, 2.0)) * smoothstep(0.35, 0.65, fbm(d * 14.0 + 3.0));
        float bulge = exp(-pow(acos(clamp(dot(d, center), -1.0, 1.0)) / 0.25, 2.0));
        float I = (band * (0.35 + 0.65 * toC) * cloud + bulge * 0.5) * dust;
        vec3 c = mix(vec3(0.62, 0.68, 0.85), vec3(1.0, 0.88, 0.7), bulge + toC * 0.3);
        gl_FragColor = vec4(c * I * 0.28, 1.0);
      }`
  }));
  mw.renderOrder = -1;
  sky.add(mw);
}

// Sonne mit Glow
// Sonnenoberfläche: animiertes Rauschen (Granulation) + heller Rand
const sunMat = new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 } },
  vertexShader: `varying vec3 vP; varying vec3 vN; varying vec3 vV;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main() { vP = position; vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: `uniform float time; varying vec3 vP; varying vec3 vN; varying vec3 vV;
    #include <logdepthbuf_pars_fragment>
    float h(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
    float n(vec3 p) { vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z); }
    float fbm(vec3 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * n(p); p *= 2.1; a *= 0.5; } return v; }
    void main() {
      #include <logdepthbuf_fragment>
      vec3 p = vP * 4.0;
      float f = fbm(p + vec3(time * 0.05, time * 0.03, -time * 0.04) + fbm(p * 1.5 - time * 0.06));
      float spots = smoothstep(0.62, 0.75, fbm(vP * 2.0 + time * 0.03));
      vec3 c = mix(vec3(1.0, 0.7, 0.3), vec3(1.0, 0.9, 0.6), f);
      c *= 1.0 - spots * 0.15;
      float rim = pow(1.0 - max(dot(vN, vV), 0.0), 2.0);
      c += vec3(1.0, 0.7, 0.3) * rim * 0.3;
      gl_FragColor = vec4(c * 1.15, 1.0);
    }`
});
const sun = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), sunMat);
scene.add(sun);
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,220,140,1)'); gr.addColorStop(0.25, 'rgba(255,180,80,.5)'); gr.addColorStop(1, 'rgba(255,150,50,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(glow);
// Strahlenkranz: echte 3D-Strahlen von der Oberfläche nach außen, jeweils als Band, das zur Kamera zeigt
const RAY_N = 40, rayDir = [], raySide = [], rayAlong = [], rayLen = [], rayIdx = [];
for (let i = 0; i < RAY_N; i++) {
  const d = new THREE.Vector3().randomDirection(), len = 2.2 + Math.random() * 3.2;
  for (const [along, side] of [[0, -1], [0, 1], [1, -1], [1, 1]]) { rayDir.push(d.x, d.y, d.z); raySide.push(side); rayAlong.push(along); rayLen.push(len); }
  const o = i * 4; rayIdx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2);
}
const rayGeo = new THREE.BufferGeometry();
rayGeo.setAttribute('position', new THREE.Float32BufferAttribute(rayDir, 3));
rayGeo.setAttribute('side', new THREE.Float32BufferAttribute(raySide, 1));
rayGeo.setAttribute('along', new THREE.Float32BufferAttribute(rayAlong, 1));
rayGeo.setAttribute('len', new THREE.Float32BufferAttribute(rayLen, 1));
rayGeo.setIndex(rayIdx);
const rayMat = new THREE.ShaderMaterial({
  uniforms: { opacity: { value: 0.13 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `attribute float side, along, len; varying float vA, vF;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main() {
      vec4 mv = modelViewMatrix * vec4(position * mix(0.95, len, along), 1.0);
      vec3 dv = normalize((modelViewMatrix * vec4(position, 0.0)).xyz);
      vec3 w = normalize(cross(dv, normalize(mv.xyz)));
      float scale = length((modelMatrix * vec4(1.0, 0.0, 0.0, 0.0)).xyz);
      mv.xyz += w * side * mix(0.09, 0.015, along) * scale;
      vF = 1.0 - abs(dot(dv, normalize(mv.xyz)));
      vA = along;
      gl_Position = projectionMatrix * mv;
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: `uniform float opacity; varying float vA, vF;
    #include <logdepthbuf_pars_fragment>
    void main() {
      #include <logdepthbuf_fragment>
      gl_FragColor = vec4(1.0, 0.78, 0.45, opacity * pow(1.0 - vA, 2.0) * vF);
    }`
});
const rays = new THREE.Mesh(rayGeo, rayMat);
rays.frustumCulled = false;
sun.add(rays);

// Protuberanzen: Plasmabögen zwischen zwei Fußpunkten, wachsen auf, flackern, verblassen
const promMat = () => new THREE.ShaderMaterial({
  uniforms: { time: { value: 0 }, grow: { value: 0 }, alpha: { value: 0 }, seed: { value: Math.random() * 100 } },
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: `varying vec2 vUv;
    #include <common>
    #include <logdepthbuf_pars_vertex>
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      #include <logdepthbuf_vertex>
    }`,
  fragmentShader: `uniform float time, grow, alpha, seed; varying vec2 vUv;
    #include <logdepthbuf_pars_fragment>
    float h(float x) { return fract(sin(x * 91.3 + seed) * 43758.5); }
    float n(float x) { float i = floor(x), f = fract(x); return mix(h(i), h(i + 1.0), f * f * (3.0 - 2.0 * f)); }
    void main() {
      #include <logdepthbuf_fragment>
      float d = abs(vUv.x - 0.5) * 2.0;
      if (d > grow) discard;
      float flow = n(vUv.x * 18.0 - time * 1.5) * 0.6 + n(vUv.x * 45.0 + vUv.y * 6.0 + time * 2.0) * 0.4;
      float edge = smoothstep(grow, grow - 0.15, d);
      float core = 0.5 + 0.5 * sin(vUv.y * 6.2832);
      vec3 c = mix(vec3(0.9, 0.15, 0.03), vec3(1.0, 0.6, 0.25), flow * flow);
      float fil = smoothstep(0.35, 0.8, flow);
      gl_FragColor = vec4(c, alpha * edge * core * (0.15 + 0.55 * fil));
    }`
});
const proms = [];
function spawnProm() {
  const n = new THREE.Vector3().randomDirection();
  const t = new THREE.Vector3().crossVectors(n, new THREE.Vector3(0, 1, 0.3).normalize()).normalize();
  const span = 0.1 + Math.random() * 0.2, h = 0.3 + Math.random() * 0.5;
  const p1 = n.clone().addScaledVector(t, span).normalize(), p2 = n.clone().addScaledVector(t, -span).normalize();
  const skew = new THREE.Vector3().randomDirection().multiplyScalar(span * 0.6);
  const curve = new THREE.CubicBezierCurve3(p1.clone().multiplyScalar(0.98),
    p1.clone().multiplyScalar(1 + h * 1.4).add(skew), p2.clone().multiplyScalar(1 + h * 1.4).add(skew), p2.clone().multiplyScalar(0.98));
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.015 + Math.random() * 0.015, 8), promMat());
  sun.add(m);
  proms.push({ m, age: 0, life: 10 + Math.random() * 12, rise: 0.3 + Math.random() * 0.5 });
}
for (let i = 0; i < 4; i++) { spawnProm(); proms[i].age = Math.random() * 8; }

// Eruptionen (koronale Massenauswürfe): Partikelwolke, die aus einem Fleck herausschießt
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const g = c.getContext('2d'), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32); return new THREE.CanvasTexture(c);
})();
const ERUPT_N = 300, eruptions = [];
function spawnEruption() {
  const n = new THREE.Vector3().randomDirection(), pos = new Float32Array(ERUPT_N * 3), vel = [];
  for (let i = 0; i < ERUPT_N; i++) {
    const spread = new THREE.Vector3().randomDirection().multiplyScalar(0.35 * Math.random());
    const v = n.clone().add(spread).normalize().multiplyScalar(0.15 + Math.random() * 0.45);
    vel.push(v); pos.set([n.x, n.y, n.z], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

let nextEruption = 3;

function updateSunActivity(t, dt) {
  // Aktivität nur aus der Nähe: unter ~8 Sonnenradien Abstand einblenden, ab 4 voll
  const dr = camera.position.length() / sun.scale.x;
  const near = THREE.MathUtils.clamp((8 - dr) / 4, 0, 1);
  for (let i = proms.length - 1; i >= 0; i--) {
    const p = proms[i], u = p.m.material.uniforms; p.age += dt;
    const k = p.age / p.life;
    u.time.value = t; u.grow.value = Math.min(1, p.age / 2.5);
    u.alpha.value = Math.min(1, p.age / 1.5) * Math.min(1, (p.life - p.age) / 2.5) * near * 0.5;
    p.m.scale.setScalar(1 + k * 0.08 * p.rise);
    if (p.age > p.life) { sun.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); proms.splice(i, 1); }
  }
  while (proms.length < 5) spawnProm();
  if ((nextEruption -= dt) < 0 && near > 0) { spawnEruption(); nextEruption = 12 + Math.random() * 15; }
  for (let i = eruptions.length - 1; i >= 0; i--) {
    const e = eruptions[i]; e.age += dt;
    const a = e.pts.geometry.attributes.position, k = e.age / e.life;
    for (let j = 0; j < ERUPT_N; j++) {
      const v = e.vel[j];
      // leicht abbremsen, langsame Teilchen fallen in Bögen zurück
      const r = Math.hypot(a.getX(j), a.getY(j), a.getZ(j));
      const gpull = 0.12 / (r * r);
      v.addScaledVector(new THREE.Vector3(a.getX(j), a.getY(j), a.getZ(j)).divideScalar(r), -gpull * dt);
      a.setXYZ(j, a.getX(j) + v.x * dt, a.getY(j) + v.y * dt, a.getZ(j) + v.z * dt);
      if (r < 1) { const f = 1.001 / r; a.setXYZ(j, a.getX(j) * f, a.getY(j) * f, a.getZ(j) * f); v.multiplyScalar(0); }
    }
    a.needsUpdate = true;
    e.pts.material.opacity = Math.min(1, e.age * 4) * Math.max(0, 1 - k) * 0.35 * near;
    e.pts.material.size = 0.025 + k * 0.03;
    e.pts.material.color.setRGB(1, 0.7 - k * 0.4, 0.3 - k * 0.25);
    const fl = Math.max(0, 1 - e.age / 1.5);
    e.flare.material.opacity = fl * 0.5 * near; e.flare.scale.setScalar(0.25 + 0.5 * (1 - fl));
    if (e.age > e.life) { sun.remove(e.pts, e.flare); e.pts.geometry.dispose(); e.pts.material.dispose(); e.flare.material.dispose(); eruptions.splice(i, 1); }
  }
}

  const t = now / 1000, pulse = 1 + 0.025 * Math.sin(t * 0.9);
  sunMat.uniforms.time.value = t;
  sun.scale.setScalar(s); glow.scale.setScalar(s * 6 * pulse);
  rays.scale.setScalar(pulse); rays.rotation.y = t * 0.02;
  updateSunActivity(t, dt);

  const prevFocus = focus ? focus.spos.clone() : null;
  for (const p of PLANETS) {
    planetPos(p, jd, p.pos); mapPos(p.pos, p.spos);
    p.mesh.position.copy(p.spos); p.mesh.scale.setScalar(radiusMap(p.r));
    p.mesh.rotation.y = jd * 2 * Math.PI * (p.name === 'Erde' ? 1 : 0.4);
    p.orbit.visible = showOrbits;
    if (p.clouds) p.clouds.rotation.y = jd * 0.15;
  }
  updateMoons();
  astMat.uniforms.days.value = jd - 2451545; astMat.uniforms.mixv.value = mix; astMat.uniforms.px.value = 1.6 * renderer.getPixelRatio();
  updateComets(mix !== lastMix || lastMix < 0);
  if (flight) {
    // Kamerafahrt: Kamera und Blickziel fahren auf gerader Linie zur Endposition
    flight.k = Math.min(1, flight.k + dt / 2.2);
    const e = flight.k < 0.5 ? 4 * flight.k ** 3 : 1 - (-2 * flight.k + 2) ** 3 / 2;
    const destT = focus ? focus.spos : new THREE.Vector3();
    const destC = destT.clone().addScaledVector(flight.dir, focusDist(focus));
    controls.target.lerpVectors(flight.fromT, destT, e);
    camera.position.lerpVectors(flight.fromC, destC, e);
    if (flight.k >= 1) flight = null;
  } else if (focus) {
    // Kamera wandert mit dem fokussierten Planeten
    const d = focus.spos.clone().sub(prevFocus);
    controls.target.add(d); camera.position.add(d);
  }
  // beim Maßstabswechsel Abstand mitskalieren
  if (!flight && lastMix >= 0 && mix !== lastMix) {
    const ref = focus ? radiusMap(focus.r) : distMap(1.6);
    const old = (() => { const m = mix; mix = lastMix; const r = focus ? radiusMap(focus.r) : distMap(1.6); mix = m; return r; })();
    const off = camera.position.clone().sub(controls.target).multiplyScalar(ref / old);
    camera.position.copy(controls.target).add(off);
  }
  if (Math.abs(jd - orbitJd) > 30 || mix !== lastMix) { PLANETS.forEach(p => updateOrbit(p, jd)); orbitJd = jd; }
  lastMix = mix;

  controls.update();
  sky.position.copy(camera.position);
  renderer.render(scene, camera);

  for (const p of PLANETS) {
    tmp.copy(p.spos).project(camera);
    const vis = showLabels && tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    p.label.style.display = vis ? 'block' : 'none';
    if (vis) {
      // Bildschirmradius des Planeten: ist er sichtbar, Punkt ausblenden und Namen neben den Rand setzen
      const px = radiusMap(p.r) / (camera.position.distanceTo(p.spos) * Math.tan(camera.fov * D2R / 2)) * innerHeight / 2;
      const big = px > 3;
      p.label.classList.toggle('big', big);
      p.label.style.transform = `translate(${(tmp.x + 1) / 2 * innerWidth + (big ? px - 6 : 0)}px, ${(1 - tmp.y) / 2 * innerHeight - 7}px)`;
    }
  }
  for (const m of MOONS) {
    tmp.copy(m.spos).project(camera);
    const sep = m.spos.distanceTo(m.parent.spos) / (camera.position.distanceTo(m.spos) * Math.tan(camera.fov * D2R / 2)) * innerHeight / 2;
    const vis = showLabels && focus === m.parent && sep > 25 && tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    m.label.style.display = vis ? 'block' : 'none';
    if (vis) {
      // wie bei den Planeten: sichtbare Monde ohne Kreis, Name neben dem Rand
      const px = moonRadius(m.r) / (camera.position.distanceTo(m.spos) * Math.tan(camera.fov * D2R / 2)) * innerHeight / 2;
      const big = px > 2;
      m.label.classList.toggle('big', big);
      m.label.style.transform = `translate(${(tmp.x + 1) / 2 * innerWidth + (big ? px - 4 : 0)}px, ${(1 - tmp.y) / 2 * innerHeight - 7}px)`;
    }
  }
  for (const c of COMETS) {
    tmp.copy(c.spos).project(camera);
    const vis = showLabels && tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    c.label.style.display = vis ? 'block' : 'none';
    if (vis) c.label.style.transform = `translate(${(tmp.x + 1) / 2 * innerWidth}px, ${(1 - tmp.y) / 2 * innerHeight - 7}px)`;
  }
  dateEl.textContent = fmt.format(new Date((jd - 2440587.5) * 86400000));
  if (focus) {
    planetPos(PLANETS[2], jd, earthPos);
    const r = focus.pos.length(), de = focus.pos.distanceTo(earthPos);
    infoEl.innerHTML = `<b>${focus.name}</b><br>Radius: ${focus.r.toLocaleString('de-DE')} km<br>Abstand Sonne: ${r.toFixed(3)} AE (${(r * AU_KM / 1e6).toFixed(0)} Mio. km)` +
      (focus.name !== 'Erde' ? `<br>Abstand Erde: ${de.toFixed(3)} AE<br>Licht braucht ${(de * 499 / 60).toFixed(1)} min` : '');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__solar = { camera, controls, setJd: v => { jd = v; }, setFocus };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
