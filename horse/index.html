<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Horse — Reitsimulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#a9d3ee" />
<script defer src="/analytics.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #a9d3ee;
    font-family: ui-rounded, -apple-system, system-ui, sans-serif; color: #2b2116;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: 16px; top: 16px; pointer-events: none; }
  .panel {
    background: rgba(255, 248, 234, 0.82); border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 4px 18px rgba(60, 40, 10, 0.15); backdrop-filter: blur(6px);
  }
  #gait { font-size: 22px; font-weight: 700; }
  #speed { font-size: 13px; opacity: 0.7; margin-top: 2px; }
  #gears { display: flex; gap: 4px; margin-top: 8px; }
  #gears span { width: 22px; height: 6px; border-radius: 3px; background: rgba(80, 50, 20, 0.18); }
  #gears span.on { background: #b5651d; }
  #help { position: fixed; right: 16px; top: 16px; font-size: 12px; line-height: 1.6; pointer-events: none; }
  #help b { display: inline-block; min-width: 54px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 16px; pointer-events: none; }
  #touch .grp { display: flex; gap: 10px; pointer-events: auto; }
  #touch button {
    width: 64px; height: 64px; border-radius: 50%; border: 0; font-size: 24px;
    background: rgba(255, 248, 234, 0.75); color: #2b2116; touch-action: none;
  }
  @media (pointer: coarse) { #touch { display: flex; } #help { display: none; } }
</style>
</head>
<body>
<div id="loading">Pferd wird gesattelt …</div>
<div id="hud" class="panel">
  <div id="gait">Stehen</div>
  <div id="speed">0.0 km/h</div>
  <div id="gears"><span></span><span></span><span></span><span></span><span></span></div>
</div>
<div id="help" class="panel">
  <div><b>W / ↑</b> schneller</div>
  <div><b>S / ↓</b> langsamer</div>
  <div><b>A D ← →</b> lenken</div>
  <div><b>Leertaste</b> springen</div>
  <div><b>Maus</b> Kamera drehen</div>
  <div><b>Rad</b> Zoom</div>
</div>
<div id="touch">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="down">▼</button><button data-k="jump">⤒</button><button data-k="up">▲</button></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// Gangarten: Clip, Zielgeschwindigkeit in m/s, Geschwindigkeit bei timeScale 1
const GAITS = [
  { name: 'Stehen', clip: 'Idle',   speed: 0,    ref: 1 },
  { name: 'Schritt', clip: 'Walk',  speed: 1.7,  ref: 2.3 },
  { name: 'Trab',    clip: 'Trot',  speed: 3.8,  ref: 5.0 },
  { name: 'Galopp',  clip: 'Gallop', speed: 6.5, ref: 12 },
  { name: 'Renngalopp', clip: 'Gallop', speed: 12, ref: 14 },
];
const HORSE_SCALE = 0.5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9d3ee);
scene.fog = new THREE.Fog(0xa9d3ee, 60, 260);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 600);

scene.add(new THREE.HemisphereLight(0xdff1ff, 0x6b8a3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// Bias gegen Shadow Acne: ohne ihn zeichnet sich das geglättete Pferd selbst in Streifen
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 120 });
scene.add(sun, sun.target);

// Gelände: sanfte Hügel aus Perlin-Rauschen
const noise = new ImprovedNoise();
function heightAt(x, z) {
  return noise.noise(x * 0.012, 0, z * 0.012) * 9 + noise.noise(x * 0.05, 3, z * 0.05) * 1.2;
}
const SIZE = 600, SEG = 200;
const groundGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG).rotateX(-Math.PI / 2);
const pos = groundGeo.attributes.position, colors = [];
const cA = new THREE.Color(0x7fae4a), cB = new THREE.Color(0xa7c25a), c = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i), h = heightAt(x, z);
  pos.setY(i, h);
  c.lerpColors(cA, cB, THREE.MathUtils.clamp(0.5 + noise.noise(x * 0.03, 7, z * 0.03), 0, 1));
  colors.push(c.r, c.g, c.b);
}
groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// Bäume und Felsen als Instanzen
function scatter(parts, count, minDist, yOff, scaleRange) {
  const meshes = parts.map(([geo, mat]) => {
    const mesh = new THREE.InstancedMesh(geo, mat, count);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  });
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    let x, z;
    do { x = (Math.random() - 0.5) * SIZE * 0.9; z = (Math.random() - 0.5) * SIZE * 0.9; } while (Math.hypot(x, z) < minDist);
    const k = scaleRange[0] + Math.random() * (scaleRange[1] - scaleRange[0]);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28);
    m.compose(p.set(x, heightAt(x, z) + yOff * k, z), q, s.set(k, k, k));
    for (const mesh of meshes) mesh.setMatrixAt(i, m);
  }
}
const trunk = new THREE.CylinderGeometry(0.25, 0.35, 3, 6).translate(0, 0, 0);
const crown = new THREE.IcosahedronGeometry(1.8, 0).translate(0, 2.6, 0);
scatter([
  [trunk, new THREE.MeshStandardMaterial({ color: 0x6b4a2b, flatShading: true })],
  [crown, new THREE.MeshStandardMaterial({ color: 0x4f8a3a, flatShading: true })],
], 260, 15, 1.4, [0.8, 1.6]);
scatter([[new THREE.DodecahedronGeometry(0.8, 0), new THREE.MeshStandardMaterial({ color: 0x9a9488, flatShading: true })]], 120, 8, 0.2, [0.4, 1.4]);

// Pferd
const horse = new THREE.Group();
scene.add(horse);
let mixer, actions = {}, current = null;
const state = { gait: 0, speed: 0, heading: 0, jumping: false, camYaw: 0, zoom: 1 };

const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader().setDRACOLoader(draco);
const load = (url) => new Promise((ok, fail) => loader.load(url, ok, undefined, fail));

// Sitz: Lage des Sattels im Modellraum des Pferdes (Einheiten vor HORSE_SCALE)
const SEAT = { pos: new THREE.Vector3(0, 3.05, -0.15) };
const SADDLE_Y = 0.6;
const rider = { pose: {}, root: null };

Promise.all([load('horse.glb'), load('jockey.glb')]).then(([gltf, riderGltf]) => {
  const model = gltf.scene;
  model.scale.setScalar(HORSE_SCALE);
  model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; smooth(o); } });
  horse.add(model);
  mixer = new THREE.AnimationMixer(model);
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  const jump = actions.Gallop_Jump;
  jump.setLoop(THREE.LoopOnce, 1);
  jump.clampWhenFinished = true;
  mixer.addEventListener('finished', (e) => {
    if (e.action === jump) { state.jumping = false; playGait(true); }
  });
  playGait(true);
  mixer.update(0);
  model.updateMatrixWorld(true);
  mountRider(model, riderGltf);
  document.getElementById('loading').remove();
  window.__horse = { state, actions, horse, rider, SEAT };
});

// Sattel und Reiter hängen am Rückenknochen und schwingen dadurch mit
function mountRider(model, gltf) {
  const torso = model.getObjectByName('Torso');
  const seat = new THREE.Group();
  seat.position.copy(SEAT.pos);
  model.add(seat);
  model.updateMatrixWorld(true);
  torso.attach(seat);

  seat.add(buildSaddle());

  const man = gltf.scene;
  man.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    // MPFB exportiert alles mit Alpha-Blending; ohne Tiefenschreiben scheint das Pferd durch den Jockey
    const m = o.material;
    m.transparent = false;
    m.depthWrite = true;
    m.alphaTest = /eyebrow/i.test(o.name + m.name) ? 0.5 : 0;
    m.needsUpdate = true;
  });
  // Sitz liegt im skalierten Pferderaum, der Jockey soll in Metern bleiben
  man.scale.setScalar(1 / HORSE_SCALE);
  const holder = new THREE.Group();
  holder.add(man);
  seat.add(holder);
  const bones = {};
  man.traverse((o) => { if (o.isBone) bones[o.name.replace('mixamorig', '')] = o; });
  rider.root = holder;
  rider.bones = bones;
  rider.rest = Object.fromEntries(Object.entries(bones).map(([k, b]) => [k, b.quaternion.clone()]));
  poseJockey(0);
  // Gesäß knapp über die Sitzfläche bringen
  holder.updateMatrixWorld(true);
  const hip = holder.worldToLocal(bones.Hips.getWorldPosition(new THREE.Vector3()));
  holder.position.set(0, -hip.y + JOCKEY.hipLift, -hip.z + JOCKEY.hipBack);
}

// Jockeyhaltung: kurze Bügel, Knie hoch, Oberkörper flach nach vorn, Hände am Mähnenkamm.
// Winkel um Achsen im Jockey-Raum (x = links, y = oben, z = vorn), angewendet von der Hüfte nach außen.
const JOCKEY = {
  hipLift: 0.85, hipBack: 0,
  pose: [
    ['Hips', 'x', 0.5], ['Spine', 'x', 0.3], ['Spine1', 'x', 0.25], ['Spine2', 'x', 0.15],
    ['Neck', 'x', -0.45], ['Head', 'x', -0.45],
    ['LeftUpLeg', 'x', -0.85], ['RightUpLeg', 'x', -0.85],
    ['LeftUpLeg', 'z', 0.5], ['RightUpLeg', 'z', -0.5],
    ['LeftLeg', 'x', 1.9], ['RightLeg', 'x', 1.9],
    ['LeftLeg', 'z', -0.45], ['RightLeg', 'z', 0.45],
    ['LeftFoot', 'x', -1.0], ['RightFoot', 'x', -1.0],
    ['LeftArm', 'z', -0.9], ['RightArm', 'z', 0.9],
    ['LeftArm', 'x', -0.9], ['RightArm', 'x', -0.9],
    ['LeftForeArm', 'x', -0.9], ['RightForeArm', 'x', -0.9],
    ['LeftForeArm', 'y', -0.6], ['RightForeArm', 'y', 0.6],
  ],
};
const AXES = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
const _q = new THREE.Quaternion(), _p = new THREE.Quaternion(), _r = new THREE.Quaternion();
function rotateInRiderSpace(bone, axis, angle) {
  // Achse aus dem Jockey-Raum in den Elternraum des Knochens bringen
  rider.root.updateMatrixWorld(true);
  rider.root.getWorldQuaternion(_r);
  bone.parent.getWorldQuaternion(_p);
  const a = AXES[axis].clone().applyQuaternion(_r).applyQuaternion(_p.invert());
  bone.quaternion.premultiply(_q.setFromAxisAngle(a, angle));
}
// lean: zusätzliches Vorbeugen bei Tempo (0..1)
function poseJockey(lean) {
  const b = rider.bones;
  for (const [k, q] of Object.entries(rider.rest)) b[k].quaternion.copy(q);
  for (const [name, axis, angle] of JOCKEY.pose) if (b[name]) rotateInRiderSpace(b[name], axis, angle);
  if (lean) { rotateInRiderSpace(b.Spine1, 'x', 0.25 * lean); rotateInRiderSpace(b.Head, 'x', -0.25 * lean); }
}

// Rennsattel: flache Lederschale auf weißer Schabracke mit Startnummer,
// die Bügel folgen jedes Bild den Füßen des Jockeys
const tack = { stirrups: [], leathers: [] };
// Abwicklung der Schabracke: u läuft einmal über den Rücken, die Flanken liegen bei u≈0.2 und u≈0.8
const CLOTH = { start: Math.PI * 0.35, len: Math.PI * 1.3, r: 0.62 };
function numberCloth(n) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, 1024, 256);
  g.fillStyle = '#0d5c33'; g.fillRect(0, 0, 18, 256); g.fillRect(1006, 0, 18, 256);
  g.fillStyle = '#111'; g.font = 'bold 120px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const u of [0.2, 0.8]) {
    g.save(); g.translate(u * 1024, 128); g.rotate(Math.PI / 2); g.fillText(String(n), 0, 6); g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function buildSaddle() {
  const g = new THREE.Group();
  const leather = new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: 0.55 });
  const metal = new THREE.MeshStandardMaterial({ color: 0xc9c4b8, metalness: 0.85, roughness: 0.3 });
  const clothMat = new THREE.MeshStandardMaterial({ map: numberCloth(7), roughness: 0.9, side: THREE.DoubleSide });
  // Schabracke: Zylinderausschnitt, Achse längs zum Pferd, hängt über beide Flanken
  const cloth = new THREE.Mesh(new THREE.CylinderGeometry(CLOTH.r, CLOTH.r, 1.2, 40, 1, true, CLOTH.start, CLOTH.len), clothMat);
  cloth.rotation.x = Math.PI / 2;
  cloth.position.set(0, -CLOTH.r + 0.02, 0.05);
  g.add(cloth);
  // Sattelschale: flach, kurz
  const shell = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.32), leather);
  shell.scale.set(1.0, 0.5, 1.35);
  shell.position.set(0, -0.08, -0.05);
  g.add(shell);
  for (const side of [-1, 1]) {
    const stirrup = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.025, 6, 14), metal);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.08), leather);
    g.add(stirrup, strap);
    tack.stirrups.push(stirrup);
    tack.leathers.push({ mesh: strap, top: new THREE.Vector3(side * 0.4, -0.05, 0.15) });
  }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  // Rückenoberfläche liegt etwa 0.6 Modelleinheiten über dem Sitzpunkt (am Bild abgeglichen)
  g.position.y = SADDLE_Y;
  tack.group = g;
  return g;
}
const _foot = new THREE.Vector3(), _dir = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function updateTack() {
  if (!rider.bones) return;
  ['LeftToeBase', 'RightToeBase'].forEach((name, i) => {
    // Bügel sitzt unter dem Fußballen
    tack.group.worldToLocal(rider.bones[name].getWorldPosition(_foot));
    _foot.y -= 0.12;
    const st = tack.stirrups[i];
    st.position.copy(_foot);
    st.rotation.set(0, Math.PI / 2, 0);
    const l = tack.leathers[i];
    _dir.subVectors(_foot, l.top);
    l.mesh.position.copy(l.top).addScaledVector(_dir, 0.5);
    l.mesh.scale.y = _dir.length();
    l.mesh.quaternion.setFromUnitVectors(_up, _dir.normalize());
  });
}

// Low-Poly-Facetten weich zeichnen: doppelte Eckpunkte verschmelzen, Normalen neu mitteln
function smooth(mesh) {
  let g = mesh.geometry;
  g.deleteAttribute('normal');
  if (!mesh.material.map) g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-4);
  g.computeVertexNormals();
  mesh.geometry = g;
  mesh.material.flatShading = false;
  mesh.material.needsUpdate = true;
}

function playGait(force) {
  const g = GAITS[state.gait];
  const next = actions[g.clip];
  if (!next || (next === current && !force)) return;
  next.reset().play();
  if (current && current !== next) next.crossFadeFrom(current, 0.35, true);
  current = next;
}

// Eingabe
const keys = {};
function press(k) {
  if (k === 'up' && state.gait < GAITS.length - 1) { state.gait++; if (!state.jumping) playGait(); }
  if (k === 'down' && state.gait > 0) { state.gait--; if (!state.jumping) playGait(); }
  if (k === 'jump' && !state.jumping && state.gait >= 2 && actions.Gallop_Jump) {
    state.jumping = true;
    const j = actions.Gallop_Jump;
    j.reset().play();
    j.crossFadeFrom(current, 0.15, true);
    current = j;
  }
}
const MAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'jump' };
addEventListener('keydown', (e) => {
  const k = MAP[e.code]; if (!k) return;
  e.preventDefault();
  if (!e.repeat && (k === 'up' || k === 'down' || k === 'jump')) press(k);
  keys[k] = true;
});
addEventListener('keyup', (e) => { const k = MAP[e.code]; if (k) keys[k] = false; });
for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; if (k !== 'left' && k !== 'right') press(k); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { keys[k] = false; });
}
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = e.clientX; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (drag === null) return;
  state.camYaw -= (e.clientX - drag) * 0.006; drag = e.clientX;
});

addEventListener('wheel', (e) => {
  state.zoom = THREE.MathUtils.clamp(state.zoom * Math.exp(e.deltaY * 0.001), 0.35, 2.5);
}, { passive: true });

// HUD
const elGait = document.getElementById('gait'), elSpeed = document.getElementById('speed');
const gears = [...document.querySelectorAll('#gears span')];

const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 6, -10), look = new THREE.Vector3();
const fwd = new THREE.Vector3();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const g = GAITS[state.gait];
  const target = state.jumping ? Math.max(state.speed, 6) : g.speed;
  state.speed += (target - state.speed) * Math.min(1, dt * 1.6);

  const steer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
  const turnRate = state.speed < 0.2 ? 0.9 : 1.6 / (1 + state.speed * 0.12);
  state.heading += steer * turnRate * dt;

  fwd.set(Math.sin(state.heading), 0, Math.cos(state.heading));
  horse.position.addScaledVector(fwd, state.speed * dt);
  const lim = SIZE * 0.45;
  horse.position.x = THREE.MathUtils.clamp(horse.position.x, -lim, lim);
  horse.position.z = THREE.MathUtils.clamp(horse.position.z, -lim, lim);

  // Höhe und Neigung aus dem Gelände
  const x = horse.position.x, z = horse.position.z;
  horse.position.y = heightAt(x, z);
  const pitch = Math.atan2(heightAt(x + fwd.x, z + fwd.z) - heightAt(x - fwd.x, z - fwd.z), 2);
  horse.rotation.set(0, 0, 0);
  horse.rotateY(state.heading);
  horse.rotateX(-pitch);

  // Animation an die Bodengeschwindigkeit koppeln, damit die Hufe nicht rutschen
  if (mixer) {
    if (!state.jumping && current) current.timeScale = state.gait === 0 ? 1 : Math.max(0.4, state.speed / g.ref);
    mixer.update(dt);
    if (rider.bones) poseJockey(Math.min(1, state.speed / 12));
    updateTack();
  }

  // Verfolgerkamera
  if (drag === null && state.speed > 0.5) state.camYaw *= 1 - Math.min(1, dt * 0.8);
  const yaw = state.heading + Math.PI + state.camYaw;
  const dist = (10 + state.speed * 0.25) * state.zoom;
  const want = new THREE.Vector3(x + Math.sin(yaw) * dist, 0, z + Math.cos(yaw) * dist);
  want.y = Math.max(heightAt(want.x, want.z) + 1.5, horse.position.y + 1.6 + 2.4 * state.zoom);
  camPos.lerp(want, Math.min(1, dt * 4));
  camera.position.copy(camPos);
  look.set(x, horse.position.y + 2.0, z);
  camera.lookAt(look);

  sun.position.set(x + 30, horse.position.y + 50, z + 20);
  sun.target.position.copy(horse.position);

  elGait.textContent = state.jumping ? 'Sprung!' : g.name;
  elSpeed.textContent = (state.speed * 3.6).toFixed(1) + ' km/h';
  gears.forEach((s, i) => s.classList.toggle('on', i < state.gait));

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
