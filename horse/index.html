<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Horse — Reitsimulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#a9d3ee" />
<script defer src="/analytics.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #a9d3ee;
    font-family: ui-rounded, -apple-system, system-ui, sans-serif; color: #2b2116;
    user-select: none; -webkit-user-select: none; overscroll-behavior: none;
  }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: 16px; top: 16px; pointer-events: none; }
  .panel {
    background: rgba(255, 248, 234, 0.82); border-radius: 12px; padding: 10px 14px;
    box-shadow: 0 4px 18px rgba(60, 40, 10, 0.15); backdrop-filter: blur(6px);
  }
  #gait { font-size: 22px; font-weight: 700; }
  #speed { font-size: 13px; opacity: 0.7; margin-top: 2px; }
  #gears { display: flex; gap: 4px; margin-top: 8px; }
  #gears span { width: 22px; height: 6px; border-radius: 3px; background: rgba(80, 50, 20, 0.18); }
  #gears span.on { background: #b5651d; }
  #help { position: fixed; right: 16px; top: 16px; font-size: 12px; line-height: 1.6; pointer-events: none; }
  #help b { display: inline-block; min-width: 54px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; }
  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; padding: 16px; pointer-events: none; }
  #touch .grp { display: flex; gap: 10px; pointer-events: auto; }
  #touch button {
    width: 64px; height: 64px; border-radius: 50%; border: 0; font-size: 24px;
    background: rgba(255, 248, 234, 0.75); color: #2b2116; touch-action: none;
  }
  @media (pointer: coarse) { #touch { display: flex; } #help { display: none; } }
  #mode { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); }
  #mode a { color: inherit; text-decoration: none; font-weight: 700; }
  #racehud { position: fixed; left: 16px; top: 112px; display: none; min-width: 190px; pointer-events: none; }
  #racehud .big { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #racehud .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  #stamina { height: 6px; border-radius: 3px; background: rgba(80, 50, 20, 0.18); margin-top: 6px; overflow: hidden; }
  #stamina div { height: 100%; width: 100%; background: #3a8a4a; }
  #minimap { position: fixed; right: 16px; bottom: 16px; display: none; border-radius: 12px; background: rgba(255, 248, 234, 0.82); box-shadow: 0 4px 18px rgba(60, 40, 10, 0.15); }
  @media (pointer: coarse) { #minimap { bottom: 100px; } }
  #banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: 26px; font-weight: 700; display: none; text-align: center; }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; min-width: 300px; pointer-events: auto; }
  #results table { border-collapse: collapse; width: 100%; font-size: 14px; }
  #results td { padding: 3px 6px; font-variant-numeric: tabular-nums; }
  #results tr.me td { font-weight: 700; color: #b5651d; }
  #results button { margin-top: 10px; border: 0; border-radius: 8px; padding: 7px 12px; background: #2b2116; color: #fff8ea; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="loading">Pferd wird gesattelt …</div>
<div id="hud" class="panel">
  <div id="gait">Stehen</div>
  <div id="speed">0.0 km/h</div>
  <div id="gears"><span></span><span></span><span></span></div>
</div>
<div id="help" class="panel">
  <div><b>W / ↑</b> schneller</div>
  <div><b>S / ↓</b> langsamer</div>
  <div><b>A D ← →</b> lenken</div>
  <div><b>Leertaste</b> springen</div>
  <div><b>Maus</b> Kamera drehen</div>
  <div><b>Rad</b> Zoom</div>
  <div class="raceonly"><b>Enter</b> Start</div>
  <div class="raceonly"><b>C</b> Kamera wechseln</div>
</div>
<div id="mode" class="panel"></div>
<div id="racehud" class="panel">
  <div class="big" id="rtime">0:00.0</div>
  <div class="row"><span>Platz</span><span id="rplace">–</span></div>
  <div class="row"><span>Noch</span><span id="rleft">2414 m</span></div>
  <div class="row"><span>Ausdauer</span><span></span></div>
  <div id="stamina"><div></div></div>
</div>
<canvas id="minimap" width="440" height="260"></canvas>
<div id="banner" class="panel"></div>
<div id="results" class="panel"></div>
<div id="touch">
  <div class="grp"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp"><button data-k="down">▼</button><button data-k="jump">⤒</button><button data-k="up">▲</button></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { ImprovedNoise } from 'three/addons/math/ImprovedNoise.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';
import { clone as cloneSkinned } from 'three/addons/utils/SkeletonUtils.js';
import { buildBelmont, leaderModel, behindModel, RACE_M } from './race.js';

// ?rennen öffnet die Rennbahn Belmont Park statt der Wiese
const RACE = new URLSearchParams(location.search).has('rennen');

// Gangarten: Clip, Zielgeschwindigkeit in m/s, Geschwindigkeit bei timeScale 1
const GAITS = [
  { name: 'Stehen', clip: 'Idle',   speed: 0,    ref: 1 },
  { name: 'Schritt', clip: 'Walk',  speed: 1.7,  ref: 2.3 },
  { name: 'Galopp',  clip: 'Gallop', speed: 6.5, ref: 12 },
  { name: 'Renngalopp', clip: 'Gallop', speed: 12, ref: 14 },
];
// Auf der Rennbahn: Vollblut-Tempo. Secretariat lief 1973 im Schnitt 16,8 m/s
if (RACE) Object.assign(GAITS[2], { speed: 13, ref: 14 }), Object.assign(GAITS[3], { speed: 17.5, ref: 15 });
const HORSE_SCALE = 0.5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9d3ee);
scene.fog = RACE ? new THREE.Fog(0xa9d3ee, 400, 2600) : new THREE.Fog(0xa9d3ee, 60, 260);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, RACE ? 4000 : 600);

scene.add(new THREE.HemisphereLight(0xdff1ff, 0x6b8a3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
// Bias gegen Shadow Acne: ohne ihn zeichnet sich das geglättete Pferd selbst in Streifen
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 120 });
scene.add(sun, sun.target);

// Gelände: sanfte Hügel aus Perlin-Rauschen, auf der Rennbahn flach
const noise = new ImprovedNoise();
function heightAt(x, z) {
  if (RACE) return 0;
  return noise.noise(x * 0.012, 0, z * 0.012) * 9 + noise.noise(x * 0.05, 3, z * 0.05) * 1.2;
}
const SIZE = RACE ? 2600 : 600, SEG = RACE ? 60 : 200;
// Bereich ohne Bäume: um den Startpunkt auf der Wiese, auf der Rennbahn das ganze Gelände samt Tribüne
const keepOut = (x, z, minDist) => RACE ? Math.abs(x) < 620 && Math.abs(z) < 360 : Math.hypot(x, z) < minDist;
const groundGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG).rotateX(-Math.PI / 2);
const pos = groundGeo.attributes.position, colors = [];
const cA = new THREE.Color(0x7fae4a), cB = new THREE.Color(0xa7c25a), c = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i), h = heightAt(x, z);
  pos.setY(i, h);
  c.lerpColors(cA, cB, THREE.MathUtils.clamp(0.5 + noise.noise(x * 0.03, 7, z * 0.03), 0, 1));
  colors.push(c.r, c.g, c.b);
}
groundGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// Bäume und Felsen als Instanzen
function scatter(parts, count, minDist, yOff, scaleRange) {
  const meshes = parts.map(([geo, mat]) => {
    const mesh = new THREE.InstancedMesh(geo, mat, count);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    return mesh;
  });
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    let x, z;
    do { x = (Math.random() - 0.5) * SIZE * 0.9; z = (Math.random() - 0.5) * SIZE * 0.9; } while (keepOut(x, z, minDist));
    const k = scaleRange[0] + Math.random() * (scaleRange[1] - scaleRange[0]);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6.28);
    m.compose(p.set(x, heightAt(x, z) + yOff * k, z), q, s.set(k, k, k));
    for (const mesh of meshes) mesh.setMatrixAt(i, m);
  }
}
const trunk = new THREE.CylinderGeometry(0.25, 0.35, 3, 6).translate(0, 0, 0);
const crown = new THREE.IcosahedronGeometry(1.8, 0).translate(0, 2.6, 0);
scatter([
  [trunk, new THREE.MeshStandardMaterial({ color: 0x6b4a2b, flatShading: true })],
  [crown, new THREE.MeshStandardMaterial({ color: 0x4f8a3a, flatShading: true })],
], RACE ? 900 : 260, 15, 1.4, [0.8, 1.6]);
scatter([[new THREE.DodecahedronGeometry(0.8, 0), new THREE.MeshStandardMaterial({ color: 0x9a9488, flatShading: true })]], 120, 8, 0.2, [0.4, 1.4]);

// Pferd
let mixer, actions = {}, current = null, horse = null, rider = null;
const state = { gait: 0, speed: 0, heading: 0, jumping: false, camYaw: 0, zoom: 1 };

const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader().setDRACOLoader(draco);
const load = (url) => new Promise((ok, fail) => loader.load(url, ok, undefined, fail));

// Sitz: Lage des Sattels im Modellraum des Pferdes (Einheiten vor HORSE_SCALE)
const SEAT = { pos: new THREE.Vector3(0, 3.05, -0.15) };
const SADDLE_Y = 0.6;
const ASSETS = {};
const racers = [];

Promise.all([load('horse.glb'), load('jockey.glb')]).then(([gltf, riderGltf]) => {
  // Glätten einmal an der Vorlage, die Klone teilen sich die Geometrie
  gltf.scene.traverse((o) => { if (o.isMesh) smooth(o); });
  Object.assign(ASSETS, { horse: gltf, jockey: riderGltf });
  const me = makeRacer({ number: 7, silks: ['#0d5c33', '#f2c200'] });
  scene.add(me.group);
  ({ group: horse, mixer, actions, rider } = me);
  const jump = actions.Gallop_Jump;
  jump.setLoop(THREE.LoopOnce, 1);
  jump.clampWhenFinished = true;
  mixer.addEventListener('finished', (e) => {
    if (e.action === jump) { state.jumping = false; playGait(true); }
  });
  playGait(true);
  document.getElementById('loading').remove();
  window.__horse = { state, actions, horse, rider, SEAT, camera, JOCKEY, racers, makeRacer, scene, race };
  onAssetsReady();
});

// Wird nach dem Laden der Modelle aufgerufen; hier hängt sich die Rennbahn ein
function onAssetsReady() {
  if (RACE) setupRace();
}

// Ein komplettes Gespann: Pferd, Jockey in eigenen Farben, Sattel mit Nummer, Zaumzeug und Zügel
function makeRacer({ number, silks }) {
  const group = new THREE.Group();
  const model = cloneSkinned(ASSETS.horse.scene);
  model.userData.isHorseModel = true;
  model.scale.setScalar(HORSE_SCALE);
  model.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  group.add(model);
  const r = { group, model, number, rider: { root: null }, tack: { stirrups: [], leathers: [] } };
  r.mixer = new THREE.AnimationMixer(model);
  r.actions = {};
  for (const clip of ASSETS.horse.animations) r.actions[clip.name] = r.mixer.clipAction(clip);
  r.actions.Idle.play();
  r.mixer.update(0);
  group.updateMatrixWorld(true);
  mountRider(r, cloneSkinned(ASSETS.jockey.scene), silks);
  buildBridle(r, model.getObjectByName('Head'));
  racers.push(r);
  return r;
}

// Sattel und Reiter hängen am Rückenknochen und schwingen dadurch mit
function mountRider(r, man, silks) {
  const model = r.model;
  const torso = model.getObjectByName('Torso');
  const seat = new THREE.Group();
  seat.position.copy(SEAT.pos);
  model.add(seat);
  model.updateMatrixWorld(true);
  torso.attach(seat);

  seat.add(buildSaddle(r));

  man.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    // MPFB exportiert alles mit Alpha-Blending; ohne Tiefenschreiben scheint das Pferd durch den Jockey
    const m = o.material = o.material.clone();
    m.transparent = false;
    m.depthWrite = true;
    m.alphaTest = /eyebrow/i.test(o.name + m.name) ? 0.5 : 0;
    if (/casualsuit/i.test(o.name)) recolorSilks(m, silks);
    if (/Helmet|Peak/.test(o.name)) m.color.set(silks[0]);
    m.needsUpdate = true;
  });
  // Sitz liegt im skalierten Pferderaum, der Jockey soll in Metern bleiben
  man.scale.setScalar(1 / HORSE_SCALE);
  const holder = new THREE.Group();
  holder.add(man);
  seat.add(holder);
  const bones = {};
  man.traverse((o) => { if (o.isBone) bones[o.name.replace('mixamorig', '')] = o; });
  Object.assign(r.rider, { root: holder, bones, rest: Object.fromEntries(Object.entries(bones).map(([k, b]) => [k, b.quaternion.clone()])) });
  poseJockey(r.rider, 0);
  // Gesäß knapp über die Sitzfläche bringen
  holder.updateMatrixWorld(true);
  const hip = holder.worldToLocal(bones.Hips.getWorldPosition(new THREE.Vector3()));
  holder.position.set(0, -hip.y + JOCKEY.hipLift, -hip.z + JOCKEY.hipBack);
}

// Rennfarben: die Jockeytextur ist grün-gelb (silks.py); Grün wird zur ersten, Gold zur zweiten Farbe,
// die weiße Hose bleibt. Helligkeit des Originals bleibt erhalten, damit die Falten sichtbar sind.
function recolorSilks(m, [a, b]) {
  const c1 = new THREE.Color(a), c2 = new THREE.Color(b);
  m.onBeforeCompile = (sh) => {
    sh.uniforms.silkA = { value: c1 };
    sh.uniforms.silkB = { value: c2 };
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', 'uniform vec3 silkA;\nuniform vec3 silkB;\n#include <common>')
      .replace('#include <map_fragment>', `#include <map_fragment>
{
  vec3 t = diffuseColor.rgb;
  float lum = dot(t, vec3(0.299, 0.587, 0.114));
  float green = smoothstep(0.02, 0.12, t.g - t.r);
  float gold = smoothstep(0.1, 0.3, t.r - t.b) * (1.0 - green);
  float shade = clamp(lum / 0.35, 0.4, 1.4);
  vec3 col = mix(t, silkA * shade * 0.9, green);
  diffuseColor.rgb = mix(col, silkB * clamp(lum / 0.6, 0.4, 1.2), gold);
}`);
  };
}

// Jockeyhaltung: kurze Bügel, Knie hoch, Oberkörper flach nach vorn, Hände am Mähnenkamm.
// Winkel um Achsen im Jockey-Raum (x = links, y = oben, z = vorn), angewendet von der Hüfte nach außen.
const JOCKEY = {
  hipLift: 0.85, hipBack: 0,
  fingerCurl: -1.3, thumbCurl: -0.5,
  pose: [
    ['Hips', 'x', 0.5], ['Spine', 'x', 0.3], ['Spine1', 'x', 0.25], ['Spine2', 'x', 0.15],
    ['Neck', 'x', -0.45], ['Head', 'x', -0.45],
    ['LeftUpLeg', 'x', -0.85], ['RightUpLeg', 'x', -0.85],
    ['LeftUpLeg', 'z', 0.5], ['RightUpLeg', 'z', -0.5],
    ['LeftLeg', 'x', 1.9], ['RightLeg', 'x', 1.9],
    ['LeftLeg', 'z', -0.45], ['RightLeg', 'z', 0.45],
    ['LeftFoot', 'x', -1.0], ['RightFoot', 'x', -1.0],
    ['LeftArm', 'z', -0.9], ['RightArm', 'z', 0.9],
    ['LeftArm', 'x', -0.9], ['RightArm', 'x', -0.9],
    ['LeftForeArm', 'x', -0.9], ['RightForeArm', 'x', -0.9],
    ['LeftForeArm', 'y', -0.2], ['RightForeArm', 'y', 0.2],
  ],
};
const AXES = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
const _q = new THREE.Quaternion(), _p = new THREE.Quaternion(), _r = new THREE.Quaternion();
function rotateInRiderSpace(rd, bone, axis, angle) {
  // Achse aus dem Jockey-Raum in den Elternraum des Knochens bringen
  rd.root.updateMatrixWorld(true);
  rd.root.getWorldQuaternion(_r);
  bone.parent.getWorldQuaternion(_p);
  const a = AXES[axis].clone().applyQuaternion(_r).applyQuaternion(_p.invert());
  bone.quaternion.premultiply(_q.setFromAxisAngle(a, angle));
}
// lean: zusätzliches Vorbeugen bei Tempo (0..1)
function poseJockey(rd, lean) {
  const b = rd.bones;
  for (const [k, q] of Object.entries(rd.rest)) b[k].quaternion.copy(q);
  for (const [name, axis, angle] of JOCKEY.pose) if (b[name]) rotateInRiderSpace(rd, b[name], axis, angle);
  if (lean) { rotateInRiderSpace(rd, b.Spine1, 'x', 0.25 * lean); rotateInRiderSpace(rd, b.Head, 'x', -0.25 * lean); }
  // Fäuste: Fingerglieder um ihre lokale x-Achse beugen; negativ = zur Handfläche (bei beiden Händen gleich), Daumen weniger
  for (const side of ['Left', 'Right']) {
    for (const f of ['Index', 'Middle', 'Ring', 'Pinky', 'Thumb']) {
      for (let k = 1; k <= 3; k++) {
        const bone = b[side + 'Hand' + f + k];
        if (!bone) continue;
        const c = f === 'Thumb' ? JOCKEY.thumbCurl : JOCKEY.fingerCurl;
        bone.rotateOnAxis(AXES.x, c);
      }
    }
  }
}

// Rennsattel: flache Lederschale auf weißer Schabracke mit Startnummer,
// die Bügel folgen jedes Bild den Füßen des Jockeys
// Abwicklung der Schabracke: u läuft einmal über den Rücken, die Flanken liegen bei u≈0.2 und u≈0.8
const CLOTH = { start: Math.PI * 0.35, len: Math.PI * 1.3, r: 0.62 };
function numberCloth(n) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, 1024, 256);
  g.fillStyle = '#0d5c33'; g.fillRect(0, 0, 18, 256); g.fillRect(1006, 0, 18, 256);
  g.fillStyle = '#111'; g.font = 'bold 120px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (const u of [0.2, 0.8]) {
    g.save(); g.translate(u * 1024, 128); g.rotate(Math.PI / 2); g.fillText(String(n), 0, 6); g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function buildSaddle(r) {
  const tack = r.tack;
  const g = new THREE.Group();
  const leather = new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: 0.55 });
  const metal = new THREE.MeshStandardMaterial({ color: 0xc9c4b8, metalness: 0.85, roughness: 0.3 });
  const clothMat = new THREE.MeshStandardMaterial({ map: numberCloth(r.number), roughness: 0.9, side: THREE.DoubleSide });
  // Schabracke: Zylinderausschnitt, Achse längs zum Pferd, hängt über beide Flanken
  const cloth = new THREE.Mesh(new THREE.CylinderGeometry(CLOTH.r, CLOTH.r, 1.2, 40, 1, true, CLOTH.start, CLOTH.len), clothMat);
  cloth.rotation.x = Math.PI / 2;
  cloth.position.set(0, -CLOTH.r + 0.02, 0.05);
  g.add(cloth);
  g.add(buildSaddleLeather(leather));
  // Reihenfolge wie in updateTack: zuerst links (+x, Blickrichtung +z), dann rechts
  for (const side of [1, -1]) {
    const stirrup = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.025, 6, 14), metal);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1, 0.08), leather);
    g.add(stirrup, strap);
    tack.stirrups.push(stirrup);
    tack.leathers.push({ mesh: strap, top: new THREE.Vector3(side * 0.4, -0.05, 0.15) });
  }
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  // Rückenoberfläche liegt etwa 0.6 Modelleinheiten über dem Sitzpunkt (am Bild abgeglichen)
  g.position.y = SADDLE_Y;
  tack.group = g;
  return g;
}
// Sattelleder folgt der Rückenrundung (Zylinder um die Längsachse wie die Schabracke).
// u läuft von hinten nach vorn, v quer über den Rücken; Winkel 0 = Rückenmitte.
function saddlePoint(angle, z, lift, target) {
  const r = CLOTH.r + 0.015 + lift;
  return target.set(Math.sin(angle) * r, Math.cos(angle) * r - CLOTH.r + 0.02, z);
}
function buildSaddleLeather(leather) {
  const g = new THREE.Group();
  const LEN = 0.78, Z0 = -0.05;
  // Sitz: vertieft in der Mitte, Vorderzwiesel höher als Hinterzwiesel, Ränder abgerundet
  const seat = new ParametricGeometry((u, v, t) => {
    const z = Z0 + (u - 0.5) * LEN * (1 - 0.25 * Math.abs(v - 0.5) * 2);
    const width = 0.55 - 0.18 * Math.pow(Math.abs(u - 0.5) * 2, 2);
    const angle = (v - 0.5) * 2 * width;
    const front = Math.max(0, u - 0.62) / 0.38, back = Math.max(0, 0.32 - u) / 0.32;
    const centre = Math.cos(Math.min(1, Math.abs(angle) / width) * Math.PI / 2);
    const lift = 0.02 + centre * (0.11 * front * front + 0.07 * back * back);
    saddlePoint(angle, z, lift, t);
  }, 24, 16);
  g.add(new THREE.Mesh(seat, leather));
  // Sattelblätter: hängen seitlich herab, vorn nach vorn ausgestellt wie beim Rennsattel
  for (const side of [1, -1]) {
    const flap = new ParametricGeometry((u, v, t) => {
      const angle = side * (0.45 + v * 0.75);
      const reach = 0.42 + v * 0.12;
      const z = Z0 + 0.06 + (u - 0.5) * reach + v * 0.12;
      saddlePoint(angle, z, 0.012, t);
    }, 10, 10);
    g.add(new THREE.Mesh(flap, leather));
  }
  // Naht als heller Rand um den Sitz
  const stitch = new THREE.MeshStandardMaterial({ color: 0xd8c39a, roughness: 0.6 });
  const pts = [];
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * Math.PI * 2;
    const u = 0.5 + 0.5 * Math.cos(a), v = 0.5 + 0.5 * Math.sin(a);
    const p = new THREE.Vector3();
    seat.parameters.func(u, v, p);
    pts.push(p.multiplyScalar(1.004));
  }
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 96, 0.008, 5, true), stitch));
  leather.side = THREE.DoubleSide;
  return g;
}

// Zaumzeug am Kopfknochen. Kopfraum: +y zum Maul, +z nach oben, x quer (gegenüber dem Pferd gespiegelt).
// Die Riemen werden auf die echte Kopfoberfläche gelegt: Punkte werden als (y, Winkel um die Kopfachse)
// beschrieben, Winkel 0 = oben, ±π/2 = Seiten, π = unten; der Radius kommt aus den Kopf-Vertices.
function headSurface(head) {
  const pts = [];
  const v = new THREE.Vector3();
  head.parent.updateMatrixWorld(true);
  let root = head;
  while (!root.userData.isHorseModel) root = root.parent;
  root.traverse((m) => {
    if (!m.isSkinnedMesh) return;
    const pos = m.geometry.attributes.position, si = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight;
    const hi = m.skeleton.bones.indexOf(head);
    for (let i = 0; i < pos.count; i++) {
      let w = 0;
      for (let k = 0; k < 4; k++) if (si.getComponent(i, k) === hi) w += sw.getComponent(i, k);
      if (w < 0.6) continue;
      v.fromBufferAttribute(pos, i);
      m.applyBoneTransform(i, v);
      m.localToWorld(v);
      head.worldToLocal(v);
      pts.push(v.clone());
    }
  });
  // Radiustabelle über (y, Winkel): je Zelle der äußerste Vertex, danach geglättet,
  // damit einzelne Kanten des Low-Poly-Kopfes keine Dellen in die Riemen machen
  const Y0 = 0.1, Y1 = 1.15, NY = 22, NA = 32;
  const cz = new Float32Array(NY), R = Array.from({ length: NY }, () => new Float32Array(NA));
  const cell = (y) => Math.max(0, Math.min(NY - 1, Math.round((y - Y0) / (Y1 - Y0) * (NY - 1))));
  for (let k = 0; k < NY; k++) {
    let lo = 9, hi = -9;
    const y = Y0 + (Y1 - Y0) * k / (NY - 1);
    for (const p of pts) if (Math.abs(p.y - y) < 0.07) { lo = Math.min(lo, p.z); hi = Math.max(hi, p.z); }
    cz[k] = lo < hi ? (lo + hi) / 2 : 0;
  }
  for (const p of pts) {
    const k = cell(p.y);
    const a = (Math.atan2(p.x, p.z - cz[k]) + Math.PI) / (Math.PI * 2) * NA;
    const ai = Math.floor(a) % NA;
    R[k][ai] = Math.max(R[k][ai], Math.hypot(p.x, p.z - cz[k]));
  }
  // Lücken füllen und zweimal weichzeichnen (Winkel zyklisch, y begrenzt)
  for (let pass = 0; pass < 3; pass++) {
    const S = R.map((row) => row.slice());
    for (let k = 0; k < NY; k++) for (let a = 0; a < NA; a++) {
      let sum = 0, n = 0;
      for (let dk = -1; dk <= 1; dk++) for (let da = -1; da <= 1; da++) {
        const kk = k + dk; if (kk < 0 || kk >= NY) continue;
        const v = R[kk][(a + da + NA) % NA]; if (v > 0) { sum += v; n++; }
      }
      S[k][a] = n ? (pass === 0 && R[k][a] > 0 ? Math.max(R[k][a], sum / n) : sum / n) : 0;
    }
    S.forEach((row, k) => R[k].set(row));
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  return (y, angle, gap = 0.02) => {
    const fy = Math.max(0, Math.min(NY - 1.001, (y - Y0) / (Y1 - Y0) * (NY - 1)));
    const k = Math.floor(fy), ty = fy - k;
    const fa = ((angle + Math.PI) / (Math.PI * 2) * NA + NA) % NA;
    const a = Math.floor(fa), ta = fa - a, a2 = (a + 1) % NA;
    const r = lerp(lerp(R[k][a], R[k][a2], ta), lerp(R[k + 1][a], R[k + 1][a2], ta), ty);
    const c = lerp(cz[k], cz[k + 1], ty);
    return new THREE.Vector3(Math.sin(angle) * (r + gap), y, c + Math.cos(angle) * (r + gap));
  };
}
// Kopfgeschirr als Bemalung: jeder Vertex trägt seine Ruheposition im Kopfknochen-Raum
// (Attribut headPos, w = Kopfgewicht), der Fragment-Shader zeichnet daraus Riemenbänder. So folgen sie der Haut
// und können nicht durch den Kopf stechen. Maße wie in headSurface: +y zum Maul, +z nach oben.
function paintHeadstall(head) {
  let root = head;
  while (!root.userData.isHorseModel) root = root.parent;
  const v = new THREE.Vector3();
  root.traverse((m) => {
    if (!m.isSkinnedMesh) return;
    const pos = m.geometry.attributes.position, si = m.geometry.attributes.skinIndex, sw = m.geometry.attributes.skinWeight;
    const hi = m.skeleton.bones.indexOf(head);
    // alle Vertices bekommen ihre Kopfraum-Position, w = Kopfgewicht: so bleibt der Wert über
    // Dreiecke am Übergang zum Hals stetig, und die Bemalung blendet über das Gewicht aus
    const hp = new Float32Array(pos.count * 4);
    let any = false;
    for (let i = 0; i < pos.count; i++) {
      let w = 0;
      for (let k = 0; k < 4; k++) if (si.getComponent(i, k) === hi) w += sw.getComponent(i, k);
      v.fromBufferAttribute(pos, i);
      m.applyBoneTransform(i, v);
      m.localToWorld(v);
      head.worldToLocal(v);
      hp.set([v.x, v.y, v.z, w], i * 4);
      if (w > 0.3) any = true;
    }
    if (!any) return;
    m.geometry.setAttribute('headPos', new THREE.BufferAttribute(hp, 4));
    m.material = m.material.clone();
    m.material.onBeforeCompile = (sh) => {
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', 'attribute vec4 headPos;\nvarying vec4 vHead;\n#include <common>')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvHead = headPos;');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', `varying vec4 vHead;
float band(float d, float w) { return 1.0 - smoothstep(w * 0.75, w, abs(d)); }
#include <common>`)
        .replace('#include <color_fragment>', `#include <color_fragment>
{
  float y = vHead.y;
  float a = atan(vHead.x, vHead.z);
  float aa = abs(a);
  float s = band(y - 0.78, 0.035);                                  // Nasenriemen
  s = max(s, band(y - 0.33, 0.03) * step(aa, 1.5));                 // Stirnriemen
  s = max(s, band(y - 0.2, 0.035) * step(aa, 1.7));                 // Genickstück
  s *= smoothstep(0.25, 0.55, vHead.w);
  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.07, 0.045, 0.03), s);
}`);
    };
  });
}

function buildBridle(r, head) {
  const tack = r.tack;
  const g = new THREE.Group();
  const leather = new THREE.MeshStandardMaterial({ color: 0x1c120b, roughness: 0.5 });
  const metal = new THREE.MeshStandardMaterial({ color: 0xd9d6cf, metalness: 0.9, roughness: 0.25 });
  const surf = headSurface(head);
  const PI = Math.PI;
  paintHeadstall(head);
  const bits = [];
  for (const sx of [1, -1]) {
    const bit = surf(1.0, sx * 2.05, 0.03);
    bits.push(bit);
    const bitRing = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 6, 16), metal);
    bitRing.position.copy(bit);
    bitRing.rotation.y = PI / 2;
    g.add(bitRing);
  }
  // Gebissstange quer durchs Maul
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(bits[0], bits[1]), 2, 0.012, 6), metal));
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  head.add(g);
  // bits[0] liegt bei Kopf-x > 0, also auf der rechten Pferdeseite (Kopfraum gespiegelt)
  tack.bitAnchors = bits.map((p) => { const o = new THREE.Object3D(); o.position.copy(p); head.add(o); return o; });
  // Zügel werden jedes Bild zwischen Gebiss und Händen neu aufgebaut
  tack.reinMat = leather;
  tack.reins = [null, null, null];
  addNeckGuides(r, head.parent);
}

// Stützpunkte, damit die Zügel außen am Hals entlanglaufen statt hindurch.
// Gemessen im Pferderaum (Meter): halbe Halsbreite und Kammhöhe über dem Halsknochen.
const NECK = [['Neck2', 0.18, 0.37]];
function addNeckGuides(r, anyBone) {
  const root = r.model, tack = r.tack, horse = r.group;
  tack.guides = [[], []];
  const p = new THREE.Vector3();
  for (const [name, half, crest] of NECK) {
    const bone = root.getObjectByName(name);
    [1, -1].forEach((side, i) => {
      // seitlich knapp außerhalb, nahe am Mähnenkamm
      horse.updateMatrixWorld(true);
      bone.getWorldPosition(p);
      horse.worldToLocal(p);
      p.x += side * (half + 0.04);
      p.y += crest * 0.8;
      horse.localToWorld(p);
      const o = new THREE.Object3D();
      bone.add(o);
      o.position.copy(bone.worldToLocal(p.clone()));
      tack.guides[i].push(o);
    });
  }
}
const _a = new THREE.Vector3(), _b = new THREE.Vector3();
function updateReins(r) {
  const tack = r.tack;
  if (!tack.bitAnchors || !r.rider.bones) return;
  const fists = ['Left', 'Right'].map((side) => fistPoint(r.rider, side));
  ['Left', 'Right'].forEach((side, i) => {
    // linke Hand (+x) gehört zum Gebissring auf der linken Seite des Pferdes; im Kopfraum ist x gespiegelt
    tack.bitAnchors[1 - i].getWorldPosition(_a);
    _b.copy(fists[i]);
    // Gebiss, außen am Hals hoch, dann zur Hand
    const pts = [_a.clone(), ...tack.guides[i].map((o) => o.getWorldPosition(new THREE.Vector3())), _b.clone()];
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    const geo = new THREE.TubeGeometry(curve, 32, 0.008, 5, false);
    setRein(tack, i, geo);
  });
  // Zügelbrücke: das Zügelende läuft durch beide Fäuste und hängt dazwischen leicht durch
  const mid = fists[0].clone().add(fists[1]).multiplyScalar(0.5);
  mid.y -= 0.07;
  setRein(tack, 2, new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(fists[0], mid, fists[1]), 12, 0.008, 5, false));
}
function setRein(tack, i, geo) {
  if (!tack.reins[i]) {
    tack.reins[i] = new THREE.Mesh(geo, tack.reinMat);
    tack.reins[i].castShadow = true;
    scene.add(tack.reins[i]);
  } else {
    tack.reins[i].geometry.dispose();
    tack.reins[i].geometry = geo;
  }
}
// Mitte der Faust: zwischen Handwurzel und Mittelfinger-Grundgelenk, etwas Richtung Fingerspitzen
function fistPoint(rd, side) {
  const b = rd.bones;
  const p = b[side + 'Hand'].getWorldPosition(new THREE.Vector3());
  const k = b[side + 'HandMiddle1'].getWorldPosition(new THREE.Vector3());
  return p.lerp(k, 1.25);
}

const _foot = new THREE.Vector3(), _dir = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function updateTack(r) {
  const tack = r.tack;
  if (!r.rider.bones) return;
  ['LeftToeBase', 'RightToeBase'].forEach((name, i) => {
    // Bügel sitzt unter dem Fußballen
    tack.group.worldToLocal(r.rider.bones[name].getWorldPosition(_foot));
    _foot.y -= 0.12;
    const st = tack.stirrups[i];
    st.position.copy(_foot);
    st.rotation.set(0, Math.PI / 2, 0);
    const l = tack.leathers[i];
    _dir.subVectors(_foot, l.top);
    l.mesh.position.copy(l.top).addScaledVector(_dir, 0.5);
    l.mesh.scale.y = _dir.length();
    l.mesh.quaternion.setFromUnitVectors(_up, _dir.normalize());
  });
}

// Low-Poly-Facetten weich zeichnen: doppelte Eckpunkte verschmelzen, Normalen neu mitteln
function smooth(mesh) {
  let g = mesh.geometry;
  g.deleteAttribute('normal');
  if (!mesh.material.map) g.deleteAttribute('uv');
  g = mergeVertices(g, 1e-4);
  g.computeVertexNormals();
  mesh.geometry = g;
  mesh.material.flatShading = false;
  mesh.material.needsUpdate = true;
}

function playGait(force) {
  const g = GAITS[state.gait];
  const next = actions[g.clip];
  if (!next || (next === current && !force)) return;
  next.reset().play();
  if (current && current !== next) next.crossFadeFrom(current, 0.35, true);
  current = next;
}

// ------------------------------------------------------------- Rennen ----
// Geister laufen nach den Zwischenzeiten von 1973, der Spieler startet aus Box 6 mit Nummer 7.
const race = { phase: 'off', t: 0, track: null, ghosts: [], cam: 0, player: { s: 0, lane: 0, stamina: 1, d: 0, finish: null } };
// Reisespur (Abstand zur Innenkante) nach dem Start, aus dem Rennbericht: Twice a Prince an der Innenkante,
// Sham außen neben Secretariat im frühen Duell
const CRUISE = { 'Secretariat': 1.6, 'Sham': 3.4, 'Twice a Prince': 1.2, 'My Gallant': 4.6, 'Pvt. Smiles': 2.8 };
const CLIP_REF = { Idle: 1, Walk: 2.3, Gallop: 14 };

async function setupRace() {
  const [track, data] = await Promise.all([buildBelmont(scene), fetch('belmont1973.json').then((r) => r.json())]);
  Object.assign(race, { track, data, k: track.L / RACE_M, lead: leaderModel(data.fractions) });
  for (const h of data.field) {
    const r = makeRacer({ number: h.post, silks: h.silks });
    scene.add(r.group);
    Object.assign(r, { info: h, behind: behindModel(data.fractions, h.behind), lane0: track.gate.laneOf(h.post), cruise: CRUISE[h.name] });
    race.ghosts.push(r);
  }
  document.getElementById('racehud').style.display = 'block';
  setupMinimap();
  toGate();
}

function toGate() {
  const { track } = race;
  Object.assign(race, { phase: 'gate', t: 0 });
  Object.assign(race.player, { s: track.finishS, lane: track.gate.laneOf(6), stamina: 1, d: 0, finish: null });
  state.gait = 0; state.speed = 0; playGait(true);
  for (const r of race.ghosts) Object.assign(r, { d: 0, v: 0, finish: null, clip: null });
  track.gate.open(0);
  document.getElementById('results').style.display = 'none';
  banner('Startbox – <b>Enter</b> oder <b>▲</b> zum Start');
}

function banner(html, ms) {
  const el = document.getElementById('banner');
  el.innerHTML = html;
  el.style.display = html ? 'block' : 'none';
  clearTimeout(banner.t);
  if (ms) banner.t = setTimeout(() => { el.style.display = 'none'; }, ms);
}

function startRace() {
  if (race.phase !== 'gate') return;
  race.phase = 'countdown';
  race.t = -3;
}

function setClip(r, name) {
  if (r.clip === name) return;
  const next = r.actions[name];
  next.reset().play();
  if (r.clip) next.crossFadeFrom(r.actions[r.clip], 0.3, true);
  r.clip = name;
}

// kein Trab: vom Schritt direkt in den Galopp
function clipFor(v) { return v < 0.3 ? 'Idle' : v < 2.6 ? 'Walk' : 'Gallop'; }

function fmt(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${m}:${s.toFixed(1).padStart(4, '0')}`;
}

// Strecke in Bahnmetern: s = Start + Rennmeter × k (die Innenkante ist etwas kürzer als die offiziellen 1,5 Meilen)
function raceStep(dt) {
  const { track, player: p } = race;
  if (race.phase === 'countdown') {
    race.t += dt;
    banner(race.t < 0 ? `<span style="font-size:48px">${Math.ceil(-race.t)}</span>` : 'Los!', race.t < 0 ? 0 : 900);
    if (race.t >= 0) { race.phase = 'run'; }
  } else if (race.phase === 'run' || race.phase === 'done') {
    race.t += dt;
  }
  const running = race.phase === 'run' || race.phase === 'done';
  track.gate.open(running ? race.t * 2 : 0);
  track.gate.clear(running ? race.t : 0);

  // Geister
  for (const r of race.ghosts) {
    let v = 0;
    if (running) {
      if (r.finish === null) {
        const L = race.lead(race.t);
        r.d = Math.max(0, L.d - r.behind(L.d));
        v = L.v;
        if (r.d >= RACE_M) r.finish = race.t;
      } else {
        // nach dem Ziel bis in den Schritt auslaufen
        r.v = Math.max(1.8, r.v - 1.4 * dt);
        r.d += r.v * dt;
        v = r.v;
      }
    }
    r.v = v;
    const lane = r.lane0 + (r.cruise - r.lane0) * THREE.MathUtils.smoothstep(r.d, 0, 300);
    placeOnTrack(r.group, track.finishS + r.d * race.k, lane);
    setClip(r, clipFor(v));
    r.actions[r.clip].timeScale = v < 0.3 ? 1 : Math.max(0.5, v / CLIP_REF[r.clip]);
    r.mixer.update(dt);
  }

  // Spieler: folgt der Bahn, A/D wechseln die Spur, Ausdauer begrenzt den Renngalopp
  if (running) {
    const g = GAITS[state.gait];
    if (state.gait === 3) p.stamina = Math.max(0, p.stamina - dt / 110);
    else if (state.gait === 2) p.stamina = Math.max(0, p.stamina - dt / 420);
    else p.stamina = Math.min(1, p.stamina + dt / 40);
    // erschöpft: Höchsttempo sinkt bis auf 78 %
    const tired = 0.78 + 0.22 * Math.min(1, p.stamina / 0.25);
    const target = g.speed * (state.gait >= 2 ? tired : 1);
    state.speed += (target - state.speed) * Math.min(1, dt * 0.9);
  } else {
    state.speed = 0;
  }
  const steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (running) p.lane = THREE.MathUtils.clamp(p.lane + steer * 2.2 * dt, 0.7, track.width - 0.7);
  p.s += state.speed * dt;
  p.d = (p.s - track.finishS) / race.k;
  if (running && p.finish === null && p.d >= RACE_M) {
    p.finish = race.t;
    race.phase = 'done';
    // nach dem Ziel im Schritt auslaufen lassen
    state.gait = 1;
    playGait();
    setTimeout(showResults, 2500);
  }
  const heading = placeOnTrack(horse, p.s, p.lane);
  state.heading = heading;

  // Anzeige
  const all = [...race.ghosts.map((r) => r.d), p.d];
  const place = 1 + all.filter((d) => d > p.d + 0.01).length;
  document.getElementById('rtime').textContent = fmt(Math.max(0, race.t));
  document.getElementById('rplace').textContent = `${place} / ${all.length}`;
  document.getElementById('rleft').textContent = `${Math.max(0, Math.round(RACE_M - p.d))} m`;
  const bar = document.querySelector('#stamina div');
  bar.style.width = `${p.stamina * 100}%`;
  bar.style.background = p.stamina > 0.25 ? '#3a8a4a' : '#c8502a';
  drawBoard();
  drawMinimap();
}

function placeOnTrack(obj, s, lane) {
  const { pos, dir } = race.track.pointAt(s, lane);
  obj.position.copy(pos);
  const h = Math.atan2(dir.x, dir.z);
  obj.rotation.set(0, h, 0);
  return h;
}

// Minikarte rechts unten: Draufsicht, Norden oben (Weltkoordinaten x = Osten, z = Süden passen direkt
// zur Bildschirmrichtung). Bahnflächen einmal vorzeichnen, Punkte für jedes Pferd jedes Bild.
const minimap = { el: null, bg: null, map: null };
function setupMinimap() {
  const el = document.getElementById('minimap');
  const W = el.width, H = el.height, pad = 22;
  const { track } = race;
  const outer = track.outerPath ? track.outerPath.pts : track.path.pts;
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const q of outer) { x0 = Math.min(x0, q.p.x); x1 = Math.max(x1, q.p.x); z0 = Math.min(z0, q.p.z); z1 = Math.max(z1, q.p.z); }
  const sc = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad) / (z1 - z0));
  const ox = (W - (x1 - x0) * sc) / 2 - x0 * sc, oz = (H - (z1 - z0) * sc) / 2 - z0 * sc;
  minimap.map = (x, z) => [ox + x * sc, oz + z * sc];
  // Hintergrund: Sandring zwischen Außen- und Innenkante, Grasbahn innen, Ziellinie und Tribüne
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  const g = bg.getContext('2d');
  const ring = (pts, off = 0) => {
    g.beginPath();
    pts.forEach((q, i) => {
      const [u, v] = minimap.map(q.p.x + q.nrm.x * off, q.p.z + q.nrm.z * off);
      i ? g.lineTo(u, v) : g.moveTo(u, v);
    });
    g.closePath();
  };
  ring(outer); g.fillStyle = '#b98a55'; g.fill();
  ring(track.path.pts); g.fillStyle = '#6fa452'; g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke();
  const f = track.pointAt(track.finishS, 0), f2 = track.pointAt(track.finishS, track.width);
  const [a, b] = minimap.map(f.pos.x, f.pos.z), [c, d] = minimap.map(f2.pos.x, f2.pos.z);
  g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.stroke();
  const s1 = track.pointAt(track.finishS - 220, track.width + 22), s2 = track.pointAt(track.finishS + 140, track.width + 22);
  const [e, h] = minimap.map(s1.pos.x, s1.pos.z), [k, l] = minimap.map(s2.pos.x, s2.pos.z);
  g.strokeStyle = '#2f5d45'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(e, h); g.lineTo(k, l); g.stroke();
  g.fillStyle = '#2b2116'; g.font = 'bold 13px ui-rounded, system-ui, sans-serif';
  g.fillText('Belmont Park', 10, 18);
  minimap.bg = bg;
  minimap.el = el;
  el.style.display = 'block';
}
function drawMinimap() {
  if (!minimap.el) return;
  const g = minimap.el.getContext('2d');
  g.clearRect(0, 0, minimap.el.width, minimap.el.height);
  g.drawImage(minimap.bg, 0, 0);
  const dot = (obj, fill, ring, r, label) => {
    const [u, v] = minimap.map(obj.position.x, obj.position.z);
    g.beginPath(); g.arc(u, v, r, 0, Math.PI * 2);
    g.fillStyle = fill; g.fill();
    g.lineWidth = 2; g.strokeStyle = ring; g.stroke();
    if (label) { g.fillStyle = '#2b2116'; g.font = 'bold 10px ui-rounded, system-ui, sans-serif'; g.fillText(label, u + r + 2, v + 3); }
  };
  for (const r of race.ghosts) dot(r.group, r.info.silks[0], r.info.silks[1], 5, String(r.info.post));
  dot(horse, '#f2c200', '#ffffff', 7.5, '7');
}

// Anzeigetafel: Rennzeit und die offiziellen Zwischenzeiten, sobald der Führende sie passiert
function drawBoard() {
  const now = Math.floor(race.t * 10);
  if (drawBoard.last === now) return;
  drawBoard.last = now;
  const lead = race.phase === 'run' || race.phase === 'done' ? race.lead(race.t).d : 0;
  const names = ['1/4', '1/2', '3/4', '1', '1 1/4', 'Ziel'];
  const passed = race.data.fractions.slice(1).map((f, i) => (lead >= f.m ? `${names[i]} ${fmt(f.t).replace(/^0:/, '')}` : null)).filter(Boolean);
  race.track.board.draw([`ZEIT  ${fmt(Math.max(0, race.t))}`, passed.slice(0, 3).join('  '), passed.slice(3).join('  ')]);
}

function showResults() {
  const rows = [...race.ghosts.map((r) => ({ name: r.info.name, jockey: r.info.jockey, t: r.finish })), { name: 'Du (Nr. 7)', jockey: '', t: race.player.finish, me: true }]
    .sort((a, b) => (a.t ?? 1e9) - (b.t ?? 1e9));
  const best = rows[0].t;
  const el = document.getElementById('results');
  el.innerHTML = `<b>Belmont Stakes 1973</b><table>${rows.map((r, i) =>
    `<tr class="${r.me ? 'me' : ''}"><td>${i + 1}.</td><td>${r.name}</td><td>${r.t ? fmt(r.t) : '–'}</td><td>${i && r.t ? '+' + (r.t - best).toFixed(1) + ' s' : ''}</td></tr>`).join('')}</table>
    <div style="font-size:12px;opacity:.7;margin-top:6px">Secretariats 2:24 ist bis heute Bahnrekord über 1,5 Meilen auf Sand.</div>
    <button id="again">Nochmal</button>`;
  el.style.display = 'block';
  document.getElementById('again').onclick = toGate;
}

// Eingabe
const keys = {};
function press(k) {
  if (RACE && race.phase === 'gate' && k === 'up') { startRace(); return; }
  if (RACE && k === 'jump') return;
  if (k === 'up' && state.gait < GAITS.length - 1) { state.gait++; if (!state.jumping) playGait(); }
  if (k === 'down' && state.gait > 0) { state.gait--; if (!state.jumping) playGait(); }
  if (k === 'jump' && !state.jumping && state.gait >= 2 && actions.Gallop_Jump) {
    state.jumping = true;
    const j = actions.Gallop_Jump;
    j.reset().play();
    j.crossFadeFrom(current, 0.15, true);
    current = j;
  }
}
const MAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right', Space: 'jump' };
addEventListener('keydown', (e) => {
  const k = MAP[e.code]; if (!k) return;
  e.preventDefault();
  if (!e.repeat && (k === 'up' || k === 'down' || k === 'jump')) press(k);
  keys[k] = true;
});
addEventListener('keyup', (e) => { const k = MAP[e.code]; if (k) keys[k] = false; });
addEventListener('keydown', (e) => {
  if (!RACE || !race.track) return;
  if (e.code === 'Enter') startRace();
  if (e.code === 'KeyC') race.cam = (race.cam + 1) % (race.ghosts.length + 1);
});
for (const b of document.querySelectorAll('#touch button')) {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); keys[k] = true; if (k !== 'left' && k !== 'right') press(k); });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { keys[k] = false; });
}
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = e.clientX; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (drag === null) return;
  state.camYaw -= (e.clientX - drag) * 0.006; drag = e.clientX;
});

addEventListener('wheel', (e) => {
  state.zoom = THREE.MathUtils.clamp(state.zoom * Math.exp(e.deltaY * 0.001), 0.35, 2.5);
}, { passive: true });

// HUD
const elGait = document.getElementById('gait'), elSpeed = document.getElementById('speed');
const gears = [...document.querySelectorAll('#gears span')];

const clock = new THREE.Clock();
const camPos = new THREE.Vector3(0, 6, -10), look = new THREE.Vector3();
const fwd = new THREE.Vector3();

function tick() {
  // state.warp: Zeitraffer zum Testen (Debug)
  const dt = Math.min(clock.getDelta(), 0.05) * (state.warp || 1);
  if (!horse) { requestAnimationFrame(tick); return; }
  const g = GAITS[state.gait];
  if (RACE && race.track) {
    raceStep(dt);
    fwd.set(Math.sin(state.heading), 0, Math.cos(state.heading));
  } else if (!RACE) {
    const target = state.jumping ? Math.max(state.speed, 6) : g.speed;
    state.speed += (target - state.speed) * Math.min(1, dt * 1.6);

    const steer = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
    const turnRate = state.speed < 0.2 ? 0.9 : 1.6 / (1 + state.speed * 0.12);
    state.heading += steer * turnRate * dt;

    fwd.set(Math.sin(state.heading), 0, Math.cos(state.heading));
    horse.position.addScaledVector(fwd, state.speed * dt);
    const lim = SIZE * 0.45;
    horse.position.x = THREE.MathUtils.clamp(horse.position.x, -lim, lim);
    horse.position.z = THREE.MathUtils.clamp(horse.position.z, -lim, lim);
  }

  // Höhe und Neigung aus dem Gelände
  const x = horse.position.x, z = horse.position.z;
  horse.position.y = heightAt(x, z);
  const pitch = Math.atan2(heightAt(x + fwd.x, z + fwd.z) - heightAt(x - fwd.x, z - fwd.z), 2);
  horse.rotation.set(0, 0, 0);
  horse.rotateY(state.heading);
  horse.rotateX(-pitch);

  // Animation an die Bodengeschwindigkeit koppeln, damit die Hufe nicht rutschen
  if (mixer) {
    if (!state.jumping && current) current.timeScale = state.gait === 0 ? 1 : Math.max(0.4, state.speed / g.ref);
    mixer.update(dt);
  }
  for (const r of racers) {
    const v = r.group === horse ? state.speed : r.v || 0;
    poseJockey(r.rider, Math.min(1, v / 12));
    updateTack(r);
    updateReins(r);
  }

  // Verfolgerkamera (state.freeCam: Debug, Kamera wird von außen gesetzt)
  if (!state.freeCam) {
    if (drag === null && state.speed > 0.5) state.camYaw *= 1 - Math.min(1, dt * 0.8);
    // im Rennen schaltet C die Kamera auf eines der anderen Pferde
    const tgt = RACE && race.cam ? race.ghosts[race.cam - 1].group : horse;
    const tv = RACE && race.cam ? race.ghosts[race.cam - 1].v : state.speed;
    const tx = tgt.position.x, tz = tgt.position.z;
    const yaw = tgt.rotation.y + Math.PI + state.camYaw;
    const dist = (10 + tv * 0.25) * state.zoom;
    const want = new THREE.Vector3(tx + Math.sin(yaw) * dist, 0, tz + Math.cos(yaw) * dist);
    want.y = Math.max(heightAt(want.x, want.z) + 1.5, tgt.position.y + 1.6 + 2.4 * state.zoom);
    camPos.lerp(want, Math.min(1, dt * 4));
    camera.position.copy(camPos);
    look.set(tx, tgt.position.y + 2.0, tz);
    camera.lookAt(look);
  }

  sun.position.set(x + 30, horse.position.y + 50, z + 20);
  sun.target.position.copy(horse.position);

  elGait.textContent = state.jumping ? 'Sprung!' : g.name;
  elSpeed.textContent = (state.speed * 3.6).toFixed(1) + ' km/h';
  gears.forEach((s, i) => s.classList.toggle('on', i < state.gait));

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
document.getElementById('mode').innerHTML = RACE ? '<a href="./">🌳 Zur Wiese</a>' : '<a href="?rennen">🏇 Zur Rennbahn</a>';
for (const el of document.querySelectorAll('.raceonly')) el.style.display = RACE ? 'block' : 'none';
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
