<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minifiguren-Katalog – Markus Stuhr</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    color: #fff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* Sidebar mit Themes */
  #sidebar {
    width: 250px;
    flex-shrink: 0;
    background: rgba(0,0,0,0.3);
    border-right: 1px solid rgba(255,255,255,0.1);
    display: flex;
    flex-direction: column;
  }
  #sidebar h1 { font-size: 17px; padding: 16px 16px 4px; letter-spacing: 0.3px; }
  #sidebar .sub { font-size: 11px; color: rgba(255,255,255,0.4); padding: 0 16px 12px; }
  #themes { overflow-y: auto; flex: 1; padding-bottom: 12px; }

  .theme {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    border-left: 3px solid transparent;
  }
  .theme:hover { background: rgba(255,255,255,0.06); }
  .theme.active {
    background: rgba(255,200,0,0.14);
    border-left-color: #ffd700;
    color: #ffd700;
  }
  .theme .n { color: rgba(255,255,255,0.35); font-size: 11px; font-variant-numeric: tabular-nums; }
  .theme.active .n { color: rgba(255,215,0,0.6); }

  /* Hauptbereich */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #bar {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    flex-wrap: wrap;
  }
  #search {
    flex: 1;
    min-width: 180px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 7px 12px;
    color: #fff;
    font-size: 14px;
  }
  #search:focus { outline: none; border-color: rgba(255,200,0,0.5); }
  #search::placeholder { color: rgba(255,255,255,0.35); }

  .btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    border-radius: 8px;
    padding: 6px 13px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.15); }
  .btn.active { background: rgba(255,200,0,0.22); border-color: rgba(255,200,0,0.55); color: #ffd700; }
  .btn.owned-btn.active { background: rgba(62,196,109,0.22); border-color: rgba(62,196,109,0.6); color: #6fe89b; }
  .btn.wish-btn.active { background: rgba(255,107,157,0.22); border-color: rgba(255,107,157,0.6); color: #ff9dc0; }

  #count { font-size: 12px; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; }

  /* Grid */
  #grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    grid-auto-rows: max-content;
    gap: 12px;
    padding: 16px 18px 60px;
    align-content: start;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: background 0.12s, border-color 0.12s;
  }
  .card:hover { background: rgba(255,255,255,0.09); }
  .card.owned {
    border: 2px solid #3ec46d;
    background: rgba(80,220,120,0.12);
    box-shadow: 0 0 0 1px rgba(62,196,109,0.35), 0 0 14px rgba(62,196,109,0.25);
  }
  .card.wish {
    border: 2px solid #ff6b9d;
    background: rgba(255,107,157,0.12);
    box-shadow: 0 0 0 1px rgba(255,107,157,0.35), 0 0 14px rgba(255,107,157,0.25);
  }
  /* beides markiert: gruener Rahmen gewinnt, Herz bleibt am Badge sichtbar */
  .card.owned.wish { border-color: #3ec46d; }

  /* Randloses Quadrat: die CDN-Bilder sind 800x800 auf Weiss */
  .card .imgbox { background: #fff; line-height: 0; }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
  }

  .card .info { padding: 8px 10px 10px; }
  .card .nm {
    font-size: 11.5px;
    line-height: 1.35;
    color: rgba(255,255,255,0.85);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 3px; }

  .badges {
    position: absolute;
    top: 7px;
    right: 7px;
    display: flex;
    gap: 5px;
  }
  .badge {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    line-height: 1;
    color: transparent;
  }
  .card:hover .badge { color: rgba(255,255,255,0.45); }

  .card.owned .check { background: #3ec46d; border-color: #3ec46d; color: #06240f; }
  .card.owned:hover .check { color: #06240f; }
  .card.wish .heart { background: #ff6b9d; border-color: #ff6b9d; color: #4a0d24; }
  .card.wish:hover .heart { color: #4a0d24; }

  /* Detail-Panel */
  #detail {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 200;
  }
  #detail.open { display: flex; }
  #detail .box {
    background: #23233d;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 22px;
    max-width: 844px;   /* 800px Bild + Padding + Rahmen */
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  #detail .imgwrap {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  #detail img {
    display: block;
    background: #fff;
    border-radius: 10px;
    width: auto;
    max-width: 100%;
    max-height: min(800px, 70vh);
    object-fit: contain;
  }
  #detail .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  #detail .pos { font-size: 12px; color: rgba(255,255,255,0.45); font-variant-numeric: tabular-nums; }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 12px; }
  #detail h2 { font-size: 17px; margin-bottom: 6px; }
  #detail .sub { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 14px; }
  #detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px;
               color: rgba(255,255,255,0.4); margin: 14px 0 6px; }
  #detail ul { list-style: none; font-size: 13px; }
  #detail li { padding: 3px 0; color: rgba(255,255,255,0.8); }
  #detail a { color: #ffd700; text-decoration: none; font-size: 13px; }
  #detail a:hover { text-decoration: underline; }
  #detail .row { display: flex; gap: 8px; margin-top: 18px; }

  #empty { padding: 40px 18px; color: rgba(255,255,255,0.4); font-size: 14px; }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: 150px; border-right: none;
               border-bottom: 1px solid rgba(255,255,255,0.1); }
    #grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  }
</style>
</head>
<body>

<div id="sidebar">
  <h1>Minifiguren</h1>
  <div class="sub" id="stats">lädt …</div>
  <div id="themes"></div>
</div>

<div id="main">
  <div id="bar">
    <input id="search" type="search" placeholder="Suche über alle 17.000 Figuren …" autocomplete="off">
    <button class="btn owned-btn" id="f-owned">Meine</button>
    <button class="btn wish-btn" id="f-wish">♥ Wunschliste</button>
    <button class="btn" id="f-missing">Fehlende</button>
    <span id="count"></span>
    <button class="btn" id="export">Export</button>
    <button class="btn" id="import">Import</button>
  </div>
  <div id="grid"></div>
</div>

<div id="detail"><div class="box" id="detail-box"></div></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
const GRID = document.getElementById('grid');
const CDN = 'https://cdn.rebrickable.com/media/sets/';

let index = null;          // Theme-Liste
let current = [];          // aktuell angezeigte Figuren
let activeTheme = null;
let searchData = null;     // [id, name, slug, jahr]
let filter = null;         // 'owned' | 'missing' | null
let visible = [];          // gefiltertes Ergebnis, Basis für die Pfeiltasten
let detailIdx = -1;        // Position im Detail-Panel, -1 = geschlossen
let cache = {};            // slug -> figuren

/* --- Besitz: localStorage --- */
const KEY = 'mini-owned';
const KEY_WISH = 'mini-wish';
let owned = new Set();
let wish = new Set();
try { owned = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
try { wish = new Set(JSON.parse(localStorage.getItem(KEY_WISH) || '[]')); } catch (e) {}

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify([...owned]));
    localStorage.setItem(KEY_WISH, JSON.stringify([...wish]));
  } catch (e) {}
  renderStats();
}

/* set: 'owned' oder 'wish' */
function setOf(kind) { return kind === 'wish' ? wish : owned; }
function toggle(kind, id) {
  const set = setOf(kind);
  set.has(id) ? set.delete(id) : set.add(id);
  // was man besitzt, muss nicht mehr auf die Wunschliste
  if (kind === 'owned' && owned.has(id)) wish.delete(id);
  save();
}

/* --- Laden --- */
async function boot() {
  index = await (await fetch('data/index.json')).json();
  const box = document.getElementById('themes');
  box.innerHTML = index.themes.map(t =>
    `<div class="theme" data-slug="${t.slug}">
       <span>${esc(t.name)}</span><span class="n">${t.count}</span>
     </div>`).join('');
  box.querySelectorAll('.theme').forEach(el =>
    el.addEventListener('click', () => selectTheme(el.dataset.slug)));
  renderStats();
  selectTheme(index.themes[0].slug);
}

async function loadTheme(slug) {
  if (!cache[slug]) cache[slug] = await (await fetch(`data/figs-${slug}.json`)).json();
  return cache[slug];
}

async function selectTheme(slug) {
  activeTheme = slug;
  document.getElementById('search').value = '';
  document.querySelectorAll('.theme').forEach(el =>
    el.classList.toggle('active', el.dataset.slug === slug));
  current = await loadTheme(slug);
  render();
}

/* --- Suche über alle Themes --- */
async function doSearch(q) {
  if (!searchData) {
    GRID.innerHTML = '<div id="empty">Suchindex lädt …</div>';
    searchData = await (await fetch('data/search.json')).json();
  }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = searchData.filter(r => {
    const hay = (r[1] + ' ' + r[2]).toLowerCase();
    return terms.every(t => hay.includes(t));
  }).slice(0, 600);

  // Volldaten für die getroffenen Themes nachladen
  const slugs = [...new Set(hits.map(h => h[2]))];
  await Promise.all(slugs.map(loadTheme));
  const byId = {};
  slugs.forEach(s => cache[s].forEach(f => byId[f.id] = f));
  current = hits.map(h => byId['fig-' + h[0]]).filter(Boolean);

  document.querySelectorAll('.theme').forEach(el => el.classList.remove('active'));
  activeTheme = null;
  render();
}

/* --- Rendern --- */
function render() {
  let figs = current;
  if (filter === 'owned') figs = figs.filter(f => owned.has(f.id));
  if (filter === 'wish') figs = figs.filter(f => wish.has(f.id));
  if (filter === 'missing') figs = figs.filter(f => !owned.has(f.id));
  visible = figs;

  document.getElementById('count').textContent =
    figs.length + (figs.length === 1 ? ' Figur' : ' Figuren');

  if (!figs.length) {
    GRID.innerHTML = '<div id="empty">Nichts gefunden.</div>';
    return;
  }
  GRID.innerHTML = figs.map(f => `
    <div class="card${owned.has(f.id) ? ' owned' : ''}${wish.has(f.id) ? ' wish' : ''}" data-id="${f.id}">
      <div class="badges">
        <div class="badge heart" data-kind="wish" title="Auf die Wunschliste">♥</div>
        <div class="badge check" data-kind="owned" title="Besitze ich">✓</div>
      </div>
      <div class="imgbox"><img loading="lazy" src="${f.img || CDN + f.id + '.jpg'}" alt=""></div>
      <div class="info">
        <div class="nm">${esc(f.name)}</div>
        <div class="meta">${f.year || '?'}${f.set_count ? ' · ' + f.set_count + ' Set' + (f.set_count > 1 ? 's' : '') : ''}</div>
      </div>
    </div>`).join('');
}

function renderStats() {
  if (!index) return;
  document.getElementById('stats').innerHTML =
    `${owned.size} von ${index.total.toLocaleString('de-DE')} im Besitz` +
    (wish.size ? ` · <span style="color:#ff9dc0">♥ ${wish.size}</span>` : '');
}

/* --- Interaktion --- */
GRID.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const idx = visible.findIndex(f => f.id === card.dataset.id);
  if (idx < 0) return;
  const badge = e.target.closest('.badge');
  if (badge) {
    const id = visible[idx].id;
    toggle(badge.dataset.kind, id);
    card.classList.toggle('owned', owned.has(id));
    card.classList.toggle('wish', wish.has(id));
    if (filter) render();
  } else {
    openDetail(idx);
  }
});

function openDetail(idx) {
  detailIdx = idx;
  const f = visible[idx];
  if (!f) return closeDetail();
  const has = owned.has(f.id);
  const wanted = wish.has(f.id);
  document.getElementById('detail-box').innerHTML = `
    <div class="nav">
      <button class="btn" id="d-prev" ${idx === 0 ? 'disabled' : ''}>← Zurück</button>
      <span class="pos">${idx + 1} / ${visible.length}</span>
      <button class="btn" id="d-next" ${idx === visible.length - 1 ? 'disabled' : ''}>Weiter →</button>
    </div>
    <div class="imgwrap"><img src="${f.img || CDN + f.id + '.jpg'}" alt=""></div>
    <h2>${esc(f.name)}</h2>
    <div class="sub">${f.id} · ${f.theme ? esc(f.theme) : 'kein Theme'} · ${f.year || 'Jahr unbekannt'} · ${f.parts} Teile</div>
    ${f.sets.length ? `<h3>Enthalten in ${f.set_count} Set${f.set_count > 1 ? 's' : ''}</h3>
      <ul>${f.sets.map(s => `<li>${esc(s.name)} <span style="color:rgba(255,255,255,.4)">(${s.num}, ${s.year})</span></li>`).join('')}
      ${f.set_count > f.sets.length ? `<li style="color:rgba(255,255,255,.4)">… und ${f.set_count - f.sets.length} weitere</li>` : ''}</ul>` : ''}
    <h3>Links</h3>
    <a href="https://rebrickable.com/minifigs/${f.id}/" target="_blank" rel="noopener">Auf Rebrickable ansehen ↗</a>
    <div class="row">
      <button class="btn owned-btn${has ? ' active' : ''}" id="d-toggle">${has ? '✓ Im Besitz' : 'Als vorhanden markieren'}</button>
      <button class="btn wish-btn${wanted ? ' active' : ''}" id="d-wish">${wanted ? '♥ Auf der Wunschliste' : '♡ Auf die Wunschliste'}</button>
      <button class="btn" id="d-close">Schließen</button>
    </div>
    <div class="hint">← → blättern · Leertaste = Besitz · W = Wunschliste · Esc schließt</div>`;
  document.getElementById('detail').classList.add('open');
  document.getElementById('detail').scrollTop = 0;
  document.getElementById('d-close').onclick = closeDetail;
  document.getElementById('d-prev').onclick = () => step(-1);
  document.getElementById('d-next').onclick = () => step(1);
  document.getElementById('d-toggle').onclick = () => toggleFromDetail('owned');
  document.getElementById('d-wish').onclick = () => toggleFromDetail('wish');
}

/* Blättern innerhalb der aktuell sichtbaren Liste */
function step(delta) {
  const next = detailIdx + delta;
  if (next < 0 || next >= visible.length) return;
  openDetail(next);
}

/* Markieren, ohne das Panel zu verlassen */
function toggleFromDetail(kind) {
  const f = visible[detailIdx];
  toggle(kind, f.id);
  if (filter) {
    // Figur fällt evtl. aus dem Filter -> Liste neu aufbauen, Position halten
    render();
    const at = Math.min(detailIdx, visible.length - 1);
    if (!visible.length) return closeDetail();
    openDetail(at);
  } else {
    render();
    openDetail(detailIdx);
  }
}

function closeDetail() {
  detailIdx = -1;
  document.getElementById('detail').classList.remove('open');
}
document.getElementById('detail').addEventListener('click', e => {
  if (e.target.id === 'detail') closeDetail();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeDetail();
  const inSearch = document.activeElement === document.getElementById('search');
  if (detailIdx < 0 || inSearch) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  else if (e.key === ' ') { e.preventDefault(); toggleFromDetail('owned'); }
  else if (e.key === 'w' || e.key === 'W') { e.preventDefault(); toggleFromDetail('wish'); }
});

let timer;
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (q.length < 2) { if (activeTheme === null) selectTheme(index.themes[0].slug); return; }
    doSearch(q);
  }, 220);
});

const FILTERS = [['f-owned', 'owned'], ['f-wish', 'wish'], ['f-missing', 'missing']];
for (const [id, mode] of FILTERS) {
  document.getElementById(id).addEventListener('click', () => {
    filter = filter === mode ? null : mode;
    FILTERS.forEach(([bid, m]) =>
      document.getElementById(bid).classList.toggle('active', filter === m));
    render();
  });
}

document.getElementById('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ owned: [...owned], wish: [...wish], exported: new Date().toISOString() }, null, 1)],
                        { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'minifiguren-sammlung.json';
  a.click();
});

document.getElementById('import').addEventListener('click', () => document.getElementById('file').click());
document.getElementById('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    (data.owned || []).forEach(id => owned.add(id));
    (data.wish || []).forEach(id => wish.add(id));
    save();
    render();
  } catch (err) { alert('Datei konnte nicht gelesen werden.'); }
  e.target.value = '';
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

boot();
</script>
</body>
</html>
