<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiele</title>
<meta name="description" content="Alle Spiele auf markusstuhr.de">
<script src="/analytics.js" defer></script>
<style>
  :root { --bg:#1c1a17; --panel:#2a2723; --hover:#34302a; --ink:#f1ebe0; --dim:#a69d8e; --accent:#e0a33a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:34px; margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:16px; }
  a.game { display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding:28px 18px 24px; border-radius:16px; background:var(--panel); color:inherit; text-decoration:none; border:1px solid transparent; transition:background .15s, border-color .15s, transform .15s; }
  a.game:hover { background:var(--hover); border-color:#4a443b; transform:translateY(-2px); }
  .ico { flex:none; width:96px; height:96px; border-radius:22px; display:grid; place-items:center; font-size:54px; background:#3a352f; }
  .t { font-weight:600; font-size:19px; }
  .d { color:var(--dim); font-size:14px; margin-top:4px; }
  .new { color:var(--accent); font-size:11px; font-weight:700; margin-left:6px; text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Spiele</h1>
  <div id="groups"></div>
</div>
<script>
const GAMES = [
  ['chess', '♞', 'Schach', 'Gegen Stockfish mit Live-Zugbewertung'],
  ['dame', '⛀', 'Dame', 'Gegen die KI oder KI gegen KI', true],
  ['muehle', '◎', 'Mühle', 'Setzen, ziehen, springen', true],
  ['halma', '✶', 'Halma', 'Sternhalma für 2–6 Spieler', true],
  ['go', '⚫', 'Go', 'Das alte Brettspiel'],
  ['shithead', '🃏', 'Shithead', 'Gegen 1–3 KI-Gegner'],
  ['fish', '🎣', 'Abendangeln', 'Im Ruderboot auf dem See'],
  ['tower', '🏰', 'Burgwacht', 'Tower Defence auf einer Hex-Insel'],
  ['kitty', '🐱', 'Kitty', 'Deine 3D-Katze'],
  ['cars', '🚗', 'Cars', 'Supercar-Sammelalbum mit 3D-Garage'],
];
document.getElementById('groups').innerHTML = '<div class="grid">' +
  GAMES.map(([path, ico, t, d, isNew]) => `<a class="game" href="/${path}/"><span class="ico">${ico}</span><span><div class="t">${t}${isNew ? '<span class="new">neu</span>' : ''}</div><div class="d">${d}</div></span></a>`).join('') + '</div>';
</script>
</body>
</html>
