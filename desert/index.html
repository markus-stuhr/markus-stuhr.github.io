<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der Rhein – Verlauf | Markus Stuhr</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    width: 100vw; height: 100vh; overflow: hidden; background: #0d1117;
  }
  #map { position: fixed; inset: 0; }

  .panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(20, 22, 26, 0.92); color: #fff;
    border-radius: 12px; padding: 16px 18px;
    width: 270px; max-width: calc(100vw - 32px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  .panel h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .panel .sub { font-size: 12px; color: #9aa4b2; line-height: 1.45; margin-bottom: 12px; }
  .legend { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #d7dbe2; }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .swatch-line { width: 22px; height: 4px; border-radius: 2px; background: #3fa9f5; }
  .swatch-dot { width: 10px; height: 10px; border-radius: 50%; background: #ffd166; border: 2px solid #1c1f26; }
  .swatch-src { width: 10px; height: 10px; border-radius: 50%; background: #7ee787; border: 2px solid #1c1f26; }
  .hint { margin-top: 12px; font-size: 11px; color: #6e7681; line-height: 1.4; }

  .maplibregl-popup-content {
    background: #1c1f26; color: #e6edf3; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  .maplibregl-popup-content b { display: block; font-size: 14px; margin-bottom: 2px; }
  .maplibregl-popup-content .meta { color: #9aa4b2; font-size: 11px; }
  .maplibregl-popup-tip { border-top-color: #1c1f26; border-bottom-color: #1c1f26; }

  @media (max-width: 600px) {
    .panel { top: 10px; left: 10px; right: 10px; width: auto; padding: 12px 14px; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Der Rhein</h1>
  <div class="sub">Von der Quelle am Tomasee (2345 m) bis zur Mündung bei Hoek van Holland – rund 1230 km durch 6 Länder.</div>
  <div class="legend">
    <div><span class="swatch-line"></span> Flussverlauf</div>
    <div><span class="swatch-src"></span> Quelle &amp; Mündung</div>
    <div><span class="swatch-dot"></span> Pegelstationen</div>
  </div>
  <div class="hint">Pegelstationen sind vorbereitet – aktuelle Wasserstände folgen im nächsten Schritt.</div>
</div>

<script>
// Verlauf des Rheins, [lng, lat] von der Quelle bis zur Mündung
const RHEIN = [
  [8.6949,46.6188],[8.7600,46.6420],[8.8500,46.7020],[8.9800,46.7350],[9.0700,46.7480],
  [9.2050,46.7740],[9.3150,46.8000],[9.4100,46.8230],[9.5300,46.8500],[9.5100,46.9400],
  [9.4950,47.0050],[9.4800,47.0900],[9.4830,47.1600],[9.5200,47.2400],[9.5600,47.3300],
  [9.6100,47.4300],[9.6400,47.5000],[9.5200,47.5300],[9.3800,47.5600],[9.2600,47.6300],
  [9.1800,47.6600],[9.0400,47.6800],[8.8600,47.6600],[8.7300,47.6800],[8.6300,47.6900],
  [8.5100,47.6100],[8.3800,47.5900],[8.2100,47.6100],[8.0500,47.5600],[7.9000,47.5500],
  [7.7900,47.5500],[7.6800,47.5450],[7.5900,47.5600],[7.5600,47.6300],[7.5500,47.7200],
  [7.5800,47.8200],[7.5700,47.9200],[7.5800,48.0300],[7.6300,48.1500],[7.6900,48.2700],
  [7.7400,48.3900],[7.7700,48.5000],[7.8000,48.5800],[7.8400,48.6800],[7.9200,48.7800],
  [8.0400,48.8600],[8.1600,48.9400],[8.2600,48.9900],[8.3000,49.0400],[8.3600,49.1200],
  [8.4200,49.2100],[8.4400,49.3200],[8.4600,49.4100],[8.4600,49.5000],[8.4200,49.5700],
  [8.3800,49.6300],[8.4000,49.7100],[8.4400,49.8000],[8.4300,49.8800],[8.3800,49.9500],
  [8.2700,50.0000],[8.1600,50.0100],[8.0400,49.9900],[7.9000,49.9700],[7.8300,50.0200],
  [7.7700,50.0900],[7.7100,50.1500],[7.6400,50.1900],[7.5900,50.2300],[7.6200,50.2900],
  [7.6000,50.3600],[7.5200,50.4000],[7.4000,50.4400],[7.3000,50.5000],[7.2400,50.5800],
  [7.1900,50.6400],[7.1200,50.7400],[7.0600,50.8100],[7.0000,50.8800],[6.9600,50.9400],
  [6.9700,51.0000],[6.9500,51.0600],[6.8600,51.1400],[6.7500,51.2300],[6.7200,51.3200],
  [6.7300,51.4000],[6.7200,51.4500],[6.6600,51.5400],[6.6000,51.6600],[6.4800,51.7200],
  [6.4000,51.7600],[6.2500,51.8300],[6.1000,51.8500],[5.9500,51.8500],[5.8600,51.8500],
  [5.6500,51.8800],[5.4300,51.8900],[5.2000,51.8600],[4.9700,51.8300],[4.8000,51.8200],
  [4.6600,51.8100],[4.5600,51.8700],[4.4800,51.9000],[4.3400,51.9300],[4.2000,51.9700],
  [4.1200,51.9800]
];

const ENDPOINTS = [
  { name: 'Rheinquelle – Tomasee', info: '2345 m ü. NN, Kanton Graubünden (CH)', coord: [8.6949,46.6188] },
  { name: 'Mündung – Hoek van Holland', info: 'Nieuwe Waterweg in die Nordsee (NL)', coord: [4.1200,51.9800] }
];

// Pegelstationen (PEGELONLINE-Namen), Wasserstände folgen im nächsten Schritt
const PEGEL = [
  { name: 'Basel-Rheinhalle', km: 'Rhein-km 166', coord: [7.5900,47.5600] },
  { name: 'Kehl-Kronenhof',   km: 'Rhein-km 293', coord: [7.8000,48.5800] },
  { name: 'Maxau',            km: 'Rhein-km 362', coord: [8.3000,49.0400] },
  { name: 'Speyer',           km: 'Rhein-km 400', coord: [8.4400,49.3200] },
  { name: 'Worms',            km: 'Rhein-km 443', coord: [8.3800,49.6300] },
  { name: 'Mainz',            km: 'Rhein-km 498', coord: [8.2700,50.0000] },
  { name: 'Kaub',             km: 'Rhein-km 546', coord: [7.7700,50.0900] },
  { name: 'Koblenz',          km: 'Rhein-km 592', coord: [7.6000,50.3600] },
  { name: 'Andernach',        km: 'Rhein-km 614', coord: [7.4000,50.4400] },
  { name: 'Bonn',             km: 'Rhein-km 655', coord: [7.1200,50.7400] },
  { name: 'Köln',             km: 'Rhein-km 688', coord: [6.9600,50.9400] },
  { name: 'Düsseldorf',       km: 'Rhein-km 744', coord: [6.7500,51.2300] },
  { name: 'Duisburg-Ruhrort', km: 'Rhein-km 780', coord: [6.7200,51.4500] },
  { name: 'Wesel',            km: 'Rhein-km 814', coord: [6.6000,51.6600] },
  { name: 'Emmerich',         km: 'Rhein-km 852', coord: [6.2500,51.8300] }
];

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://api.maptiler.com/maps/dataviz-dark/style.json?key=lT9jK8r0OXrZinP9JSOT',
  center: [7.6, 49.6],
  zoom: 5.4,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

map.on('load', () => {
  map.addSource('rhein', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: RHEIN } }
  });

  map.addLayer({
    id: 'rhein-glow', type: 'line', source: 'rhein',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#3fa9f5', 'line-width': 10, 'line-blur': 8, 'line-opacity': 0.45 }
  });
  map.addLayer({
    id: 'rhein-line', type: 'line', source: 'rhein',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#5ec8ff',
      'line-width': ['interpolate', ['linear'], ['zoom'], 4, 1.8, 8, 4, 12, 7]
    }
  });

  const popup = (title, meta) =>
    new maplibregl.Popup({ offset: 14, closeButton: false })
      .setHTML(`<b>${title}</b><span class="meta">${meta}</span>`);

  ENDPOINTS.forEach(p => {
    const el = document.createElement('div');
    Object.assign(el.style, {
      width: '14px', height: '14px', borderRadius: '50%',
      background: '#7ee787', border: '2px solid #0d1117',
      boxShadow: '0 0 10px rgba(126,231,135,.8)', cursor: 'pointer'
    });
    new maplibregl.Marker({ element: el }).setLngLat(p.coord)
      .setPopup(popup(p.name, p.info)).addTo(map);
  });

  PEGEL.forEach(p => {
    const el = document.createElement('div');
    Object.assign(el.style, {
      width: '11px', height: '11px', borderRadius: '50%',
      background: '#ffd166', border: '2px solid #0d1117',
      boxShadow: '0 0 8px rgba(255,209,102,.7)', cursor: 'pointer'
    });
    new maplibregl.Marker({ element: el }).setLngLat(p.coord)
      .setPopup(popup(p.name, `${p.km} · Pegel folgt`)).addTo(map);
  });

  const b = RHEIN.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(RHEIN[0], RHEIN[0]));
  const wide = map.getCanvas().clientWidth > 700;
  map.fitBounds(b, {
    padding: wide ? { top: 60, bottom: 60, left: 320, right: 60 }
                  : { top: 200, bottom: 40, left: 30, right: 30 },
    duration: 0
  });
});
</script>
</body>
</html>
