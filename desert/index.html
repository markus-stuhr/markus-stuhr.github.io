<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Der Rhein – Verlauf &amp; Pegelstände | Markus Stuhr</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    width: 100vw; height: 100vh; overflow: hidden; background: #0d1117;
  }
  #map { position: fixed; inset: 0; }

  .panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(20, 22, 26, 0.92); color: #fff;
    border-radius: 12px; padding: 16px 18px;
    width: 290px; max-width: calc(100vw - 32px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
  }
  .panel h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .panel .sub { font-size: 12px; color: #9aa4b2; line-height: 1.45; margin-bottom: 12px; }
  .legend { display: flex; flex-direction: column; gap: 7px; font-size: 12px; color: #d7dbe2; }
  .legend div { display: flex; align-items: center; gap: 8px; }
  .swatch-line { width: 22px; height: 4px; border-radius: 2px; background: #3fa9f5; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #1c1f26; flex: none; }
  .status { margin-top: 12px; font-size: 11px; color: #6e7681; line-height: 1.45; }

  /* Pegel-Marker */
  .pegel { display: flex; align-items: center; gap: 5px; cursor: pointer; transform: translateX(-5px); }
  .pegel .bullet {
    width: 11px; height: 11px; border-radius: 50%; flex: none;
    border: 2px solid #0d1117; background: #58a6ff;
    box-shadow: 0 0 8px rgba(88,166,255,.6);
  }
  .pegel .val {
    font-size: 11px; font-weight: 600; color: #e6edf3; white-space: nowrap;
    background: rgba(13,17,23,.78); border-radius: 4px; padding: 1px 5px;
    text-shadow: 0 1px 2px #000;
  }
  .labels-off .pegel .val { display: none; }
  .pegel.sel .bullet { transform: scale(1.45); box-shadow: 0 0 14px rgba(255,255,255,.9); }
  .endpoint {
    width: 14px; height: 14px; border-radius: 50%; background: #7ee787;
    border: 2px solid #0d1117; box-shadow: 0 0 10px rgba(126,231,135,.8); cursor: pointer;
  }

  /* Detailkarte */
  .detail {
    position: fixed; left: 16px; bottom: 16px; z-index: 10;
    width: 340px; max-width: calc(100vw - 32px);
    background: rgba(20, 22, 26, 0.94); color: #e6edf3;
    border-radius: 12px; padding: 14px 16px 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.45); backdrop-filter: blur(6px);
    display: none;
  }
  .detail.on { display: block; }
  .detail .close {
    position: absolute; top: 8px; right: 10px; cursor: pointer;
    color: #6e7681; font-size: 18px; line-height: 1; background: none; border: none;
  }
  .detail h2 { font-size: 15px; font-weight: 600; margin-bottom: 2px; padding-right: 18px; }
  .detail .meta { font-size: 11px; color: #9aa4b2; margin-bottom: 10px; }
  .now { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .now .big { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .now .unit { font-size: 13px; color: #9aa4b2; }
  .now .trend { font-size: 12px; font-weight: 600; }
  .up { color: #7ee787; } .down { color: #ff7b72; } .flat { color: #9aa4b2; }
  .chart { width: 100%; height: 90px; display: block; }
  .stats { display: flex; gap: 14px; font-size: 11px; color: #9aa4b2; margin-top: 6px; }
  .stats b { color: #e6edf3; font-weight: 600; }
  .loading { font-size: 12px; color: #6e7681; padding: 14px 0; }

  .maplibregl-popup-content {
    background: #1c1f26; color: #e6edf3; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; box-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  .maplibregl-popup-content b { display: block; font-size: 14px; margin-bottom: 2px; }
  .maplibregl-popup-content .m { color: #9aa4b2; font-size: 11px; }
  .maplibregl-popup-tip { border-top-color: #1c1f26; border-bottom-color: #1c1f26; }

  @media (max-width: 700px) {
    .panel { top: 10px; left: 10px; right: 10px; width: auto; padding: 12px 14px; }
    .panel .sub { display: none; }
    .detail { left: 10px; right: 10px; bottom: 10px; width: auto; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="panel">
  <h1>Der Rhein</h1>
  <div class="sub">Von der Quelle am Tomasee (2345 m) bis zur Mündung bei Hoek van Holland – rund 1230 km durch 6 Länder.</div>
  <div class="legend">
    <div><span class="swatch-line"></span> Flussverlauf</div>
    <div><span class="dot" style="background:#7ee787"></span> Quelle &amp; Mündung</div>
    <div><span class="dot" style="background:#ff7b72"></span> niedrig <span class="dot" style="background:#58a6ff"></span> mittel <span class="dot" style="background:#7ee787"></span> hoch <span style="color:#6e7681">(10-Tage-Spanne)</span></div>
  </div>
  <div class="status" id="status">Lade Pegelstände …</div>
</div>

<div class="detail" id="detail">
  <button class="close" id="detailClose" aria-label="Schließen">×</button>
  <h2 id="dName">–</h2>
  <div class="meta" id="dMeta"></div>
  <div id="dBody"></div>
</div>

<script>
const API = 'https://www.pegelonline.wsv.de/webservices/rest-api/v2';

// Verlauf des Rheins, [lng, lat] von der Quelle bis zur Mündung
const RHEIN = [
  [8.6949,46.6188],[8.7600,46.6420],[8.8500,46.7020],[8.9800,46.7350],[9.0700,46.7480],
  [9.2050,46.7740],[9.3150,46.8000],[9.4100,46.8230],[9.5300,46.8500],[9.5100,46.9400],
  [9.4950,47.0050],[9.4800,47.0900],[9.4830,47.1600],[9.5200,47.2400],[9.5600,47.3300],
  [9.6100,47.4300],[9.6400,47.5000],[9.5200,47.5300],[9.3800,47.5600],[9.2600,47.6300],
  [9.1800,47.6600],[9.0400,47.6800],[8.8600,47.6600],[8.7300,47.6800],[8.6300,47.6900],
  [8.5100,47.6100],[8.3800,47.5900],[8.2100,47.6100],[8.0500,47.5600],[7.9000,47.5500],
  [7.7900,47.5500],[7.6800,47.5450],[7.5900,47.5600],[7.5600,47.6300],[7.5500,47.7200],
  [7.5800,47.8200],[7.5700,47.9200],[7.5800,48.0300],[7.6300,48.1500],[7.6900,48.2700],
  [7.7400,48.3900],[7.7700,48.5000],[7.8000,48.5800],[7.8400,48.6800],[7.9200,48.7800],
  [8.0400,48.8600],[8.1600,48.9400],[8.2600,48.9900],[8.3000,49.0400],[8.3600,49.1200],
  [8.4200,49.2100],[8.4400,49.3200],[8.4600,49.4100],[8.4600,49.5000],[8.4200,49.5700],
  [8.3800,49.6300],[8.4000,49.7100],[8.4400,49.8000],[8.4300,49.8800],[8.3800,49.9500],
  [8.2700,50.0000],[8.1600,50.0100],[8.0400,49.9900],[7.9000,49.9700],[7.8300,50.0200],
  [7.7700,50.0900],[7.7100,50.1500],[7.6400,50.1900],[7.5900,50.2300],[7.6200,50.2900],
  [7.6000,50.3600],[7.5200,50.4000],[7.4000,50.4400],[7.3000,50.5000],[7.2400,50.5800],
  [7.1900,50.6400],[7.1200,50.7400],[7.0600,50.8100],[7.0000,50.8800],[6.9600,50.9400],
  [6.9700,51.0000],[6.9500,51.0600],[6.8600,51.1400],[6.7500,51.2300],[6.7200,51.3200],
  [6.7300,51.4000],[6.7200,51.4500],[6.6600,51.5400],[6.6000,51.6600],[6.4800,51.7200],
  [6.4000,51.7600],[6.2500,51.8300],[6.1000,51.8500],[5.9500,51.8500],[5.8600,51.8500],
  [5.6500,51.8800],[5.4300,51.8900],[5.2000,51.8600],[4.9700,51.8300],[4.8000,51.8200],
  [4.6600,51.8100],[4.5600,51.8700],[4.4800,51.9000],[4.3400,51.9300],[4.2000,51.9700],
  [4.1200,51.9800]
];

const ENDPOINTS = [
  { name: 'Rheinquelle – Tomasee', info: '2345 m ü. NN, Kanton Graubünden (CH)', coord: [8.6949,46.6188] },
  { name: 'Mündung – Hoek van Holland', info: 'Nieuwe Waterweg in die Nordsee (NL)', coord: [4.1200,51.9800] }
];

const statusEl = document.getElementById('status');
const detailEl = document.getElementById('detail');
const fmtName = s => s.toLowerCase().replace(/(^|[\s\-\/])(\p{L})/gu, (_, a, b) => a + b.toUpperCase());
const fmtTime = t => new Date(t).toLocaleString('de-DE',
  { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://api.maptiler.com/maps/dataviz-dark/style.json?key=lT9jK8r0OXrZinP9JSOT',
  center: [7.6, 49.6],
  zoom: 5.4,
  attributionControl: { compact: true }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

const stations = [];       // { st, el, marker, series }
const seriesCache = new Map();
let selected = null;

map.on('load', () => {
  map.addSource('rhein', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: RHEIN } }
  });
  map.addLayer({
    id: 'rhein-glow', type: 'line', source: 'rhein',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#3fa9f5', 'line-width': 10, 'line-blur': 8, 'line-opacity': 0.45 }
  });
  map.addLayer({
    id: 'rhein-line', type: 'line', source: 'rhein',
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#5ec8ff',
      'line-width': ['interpolate', ['linear'], ['zoom'], 4, 1.8, 8, 4, 12, 7]
    }
  });

  ENDPOINTS.forEach(p => {
    const el = document.createElement('div');
    el.className = 'endpoint';
    new maplibregl.Marker({ element: el }).setLngLat(p.coord)
      .setPopup(new maplibregl.Popup({ offset: 14, closeButton: false })
        .setHTML(`<b>${p.name}</b><span class="m">${p.info}</span>`))
      .addTo(map);
  });

  const b = RHEIN.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(RHEIN[0], RHEIN[0]));
  const wide = map.getCanvas().clientWidth > 700;
  map.fitBounds(b, {
    padding: wide ? { top: 60, bottom: 60, left: 330, right: 60 }
                  : { top: 170, bottom: 40, left: 30, right: 30 },
    duration: 0
  });

  updateLabelVisibility();
  map.on('zoom', updateLabelVisibility);
  loadStations();
});

function updateLabelVisibility() {
  document.body.classList.toggle('labels-off', map.getZoom() < 6.4);
}

async function loadStations() {
  let data;
  try {
    const r = await fetch(`${API}/stations.json?waters=RHEIN&includeTimeseries=true&includeCurrentMeasurement=true`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    statusEl.textContent = 'Pegelstände konnten nicht geladen werden (' + e.message + '). Quelle: PEGELONLINE (WSV).';
    return;
  }

  let newest = 0;
  data.forEach(st => {
    const ts = (st.timeseries || []).find(t => t.shortname === 'W');
    const cur = ts && ts.currentMeasurement;
    if (!cur || st.longitude == null) return;
    newest = Math.max(newest, new Date(cur.timestamp).getTime());

    const el = document.createElement('div');
    el.className = 'pegel';
    el.innerHTML = `<span class="bullet"></span><span class="val">${Math.round(cur.value)} ${ts.unit}</span>`;
    el.addEventListener('click', () => select(entry));

    const marker = new maplibregl.Marker({ element: el, anchor: 'left' })
      .setLngLat([st.longitude, st.latitude]).addTo(map);

    const entry = { st, ts, cur, el, marker };
    stations.push(entry);
  });

  statusEl.innerHTML = `${stations.length} Pegel · Stand ${fmtTime(newest)} ·
    Quelle <a href="https://www.pegelonline.wsv.de" target="_blank" rel="noopener"
    style="color:#58a6ff">PEGELONLINE (WSV)</a><br>Marker anklicken für den 10-Tage-Verlauf.`;

  // Farbe = Lage im 10-Tage-Bereich; Serien nacheinander laden, um die API zu schonen
  for (const entry of stations) {
    try {
      const s = await fetchSeries(entry.st.uuid);
      entry.series = s;
      colorMarker(entry);
    } catch (_) { /* Marker bleibt neutral */ }
  }

  const kaub = stations.find(e => e.st.shortname === 'KAUB');
  if (kaub) select(kaub);
}

async function fetchSeries(uuid) {
  if (seriesCache.has(uuid)) return seriesCache.get(uuid);
  const p = fetch(`${API}/stations/${uuid}/W/measurements.json?start=P10D`)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(rows => rows.map(m => ({ t: new Date(m.timestamp).getTime(), v: m.value })));
  seriesCache.set(uuid, p);
  return p;
}

function range(series) {
  let min = Infinity, max = -Infinity;
  series.forEach(m => { if (m.v < min) min = m.v; if (m.v > max) max = m.v; });
  return { min, max };
}

// rot (niedrig) → blau (mittel) → grün (hoch), relativ zur eigenen 10-Tage-Spanne
function levelColor(pos) {
  if (pos == null || !isFinite(pos)) return '#58a6ff';
  return pos < 0.33 ? '#ff7b72' : pos > 0.66 ? '#7ee787' : '#58a6ff';
}

function colorMarker(entry) {
  const { min, max } = range(entry.series);
  const pos = max > min ? (entry.cur.value - min) / (max - min) : 0.5;
  const c = levelColor(pos);
  const bullet = entry.el.querySelector('.bullet');
  bullet.style.background = c;
  bullet.style.boxShadow = `0 0 8px ${c}99`;
}

function select(entry) {
  if (selected) selected.el.classList.remove('sel');
  selected = entry;
  entry.el.classList.add('sel');

  detailEl.classList.add('on');
  document.getElementById('dName').textContent = fmtName(entry.st.longname);
  document.getElementById('dMeta').textContent =
    `Rhein-km ${entry.st.km} · ${fmtName(entry.st.agency)}`;
  const body = document.getElementById('dBody');
  body.innerHTML = '<div class="loading">Lade 10-Tage-Verlauf …</div>';

  fetchSeries(entry.st.uuid)
    .then(series => {
      entry.series = series;
      if (selected === entry) body.innerHTML = renderDetail(entry, series);
    })
    .catch(e => {
      if (selected === entry) body.innerHTML =
        `<div class="loading">Verlauf nicht verfügbar (${e.message})</div>`;
    });
}

function renderDetail(entry, series) {
  const unit = entry.ts.unit;
  const last = series[series.length - 1] || { t: new Date(entry.cur.timestamp).getTime(), v: entry.cur.value };
  const dayAgo = last.t - 24 * 3600 * 1000;
  const ref = series.find(m => m.t >= dayAgo);
  const delta = ref ? last.v - ref.v : null;
  const { min, max } = range(series);
  const cls = delta == null ? 'flat' : delta > 1 ? 'up' : delta < -1 ? 'down' : 'flat';
  const arrow = delta == null ? '' : delta > 1 ? '▲' : delta < -1 ? '▼' : '▬';
  const deltaTxt = delta == null ? '' :
    `${arrow} ${delta > 0 ? '+' : ''}${Math.round(delta)} ${unit} / 24 h`;

  return `
    <div class="now">
      <span class="big">${Math.round(last.v)}</span>
      <span class="unit">${unit}</span>
      <span class="trend ${cls}">${deltaTxt}</span>
    </div>
    ${sparkline(series, min, max)}
    <div class="stats">
      <span>Min <b>${Math.round(min)}</b></span>
      <span>Max <b>${Math.round(max)}</b></span>
      <span>Stand <b>${fmtTime(last.t)}</b></span>
    </div>`;
}

function sparkline(series, min, max) {
  const W = 308, H = 90, pad = 6;
  const t0 = series[0].t, t1 = series[series.length - 1].t;
  const span = Math.max(1, max - min);
  const x = t => pad + (t - t0) / Math.max(1, t1 - t0) * (W - 2 * pad);
  const y = v => pad + (1 - (v - min) / span) * (H - 2 * pad);

  // auf ~200 Punkte reduzieren, reicht für 10 Tage à 15 min
  const step = Math.max(1, Math.ceil(series.length / 200));
  const pts = series.filter((_, i) => i % step === 0 || i === series.length - 1);
  const line = pts.map((m, i) => `${i ? 'L' : 'M'}${x(m.t).toFixed(1)},${y(m.v).toFixed(1)}`).join('');
  const area = `${line}L${x(t1).toFixed(1)},${H - pad}L${x(t0).toFixed(1)},${H - pad}Z`;
  const lastPt = pts[pts.length - 1];

  // Tagesraster
  const ticks = [];
  const d = new Date(t0); d.setHours(0, 0, 0, 0);
  for (let tt = d.getTime(); tt <= t1; tt += 86400000) {
    if (tt >= t0) ticks.push(`<line x1="${x(tt).toFixed(1)}" y1="${pad}" x2="${x(tt).toFixed(1)}" y2="${H - pad}"
      stroke="#30363d" stroke-width="1"/>`);
  }

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient></defs>
    ${ticks.join('')}
    <path d="${area}" fill="url(#fill)"/>
    <path d="${line}" fill="none" stroke="#5ec8ff" stroke-width="1.6"
      stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(lastPt.t).toFixed(1)}" cy="${y(lastPt.v).toFixed(1)}" r="2.6" fill="#fff"/>
  </svg>`;
}

document.getElementById('detailClose').addEventListener('click', () => {
  detailEl.classList.remove('on');
  if (selected) selected.el.classList.remove('sel');
  selected = null;
});
</script>
</body>
</html>
