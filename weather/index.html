<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather — Markus Stuhr</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  #map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const MAPTILER_KEY = 'nKyAvBkGUvss9FTqT7f6'; // shared with Globe/Simulator project

const map = new maplibregl.Map({
  container: 'map',
  style: `https://api.maptiler.com/maps/topo-v2/style.json?key=${MAPTILER_KEY}`,
  center: [10, 51], // Deutschland-Mitte
  zoom: 5
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');
</script>
</body>
</html>
